import org.jetbrains.kotlin.gradle.dsl.JvmTarget

// major.minor from gradle.properties; build = git rev-list --count HEAD + projectBuildOffset
// (or -PbuildNumber, which is absolute and ignores the offset).
// Uses ProviderFactory.exec so these git calls stay configuration-cache compatible.
def zjGit = { List<String> args ->
  def exec = providers.exec {
    commandLine(['git'] + args)
    workingDir(rootDir)
    ignoreExitValue = true
  }
  try {
    def result = exec.result.get()
    def out = (exec.standardOutput.asText.get() + exec.standardError.asText.get()).trim()
    return [exit: result.exitValue, out: out]
  } catch (Exception e) {
    return [exit: -1, out: String.valueOf(e.message)]
  }
}
def zjParseNonNegInt = { String key, Object raw, Integer fallback ->
  if (raw == null) {
    if (fallback != null) return fallback
    throw new GradleException("Missing $key")
  }
  def s = raw.toString().trim()
  if (!s.matches(/\d+/)) {
    throw new GradleException("Invalid $key='$s' (expected a non-negative integer)")
  }
  return s.toInteger()
}
def zjMajor = zjParseNonNegInt('projectVersionMajor', findProperty('projectVersionMajor'), 0)
def zjMinor = zjParseNonNegInt('projectVersionMinor', findProperty('projectVersionMinor'), 0)
def zjBuildOffset = zjParseNonNegInt('projectBuildOffset', findProperty('projectBuildOffset'), 0)
def zjBuildOverride = findProperty('buildNumber')
int zjBuild
if (zjBuildOverride != null) {
  zjBuild = zjParseNonNegInt('buildNumber', zjBuildOverride, null)
} else {
  def counted = zjGit(['rev-list', '--count', 'HEAD'])
  if (counted.exit != 0 || !(counted.out as String).matches(/\d+/)) {
    throw new GradleException(
      "Cannot determine build number from git (rev-list --count HEAD failed: ${counted.out}). Pass -PbuildNumber=N.")
  }
  zjBuild = (counted.out as String).toInteger() + zjBuildOffset
}
def zjStatus = zjGit(['status', '--porcelain', '-uno'])
def zjDirty = zjStatus.exit == 0 && !(zjStatus.out as String).isEmpty()
ext.zjVersionMajor = zjMajor
ext.zjVersionMinor = zjMinor
ext.zjVersionBuild = zjBuild
ext.zjVersionDirty = zjDirty
ext.zjVersionName = "${zjMajor}.${zjMinor}.${zjBuild}"
ext.zjVersionCode = zjBuild

buildscript {
  repositories {
    mavenCentral()
    gradlePluginPortal()
    mavenLocal()
    google()
    maven { url = 'https://central.sonatype.com/repository/maven-snapshots/' }
  }
  dependencies {
    // AGP 8.x is incompatible with Gradle 9.6+ (removed InternalProblems API).
    // AGP 9.2+ is required for Android SDK Platform 37 (installed as android-37.0).
    classpath 'com.android.tools.build:gradle:9.5.1'
    classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion"

  }
}

allprojects {
  apply plugin: 'eclipse'
  apply plugin: 'idea'

  // This allows you to "Build and run using IntelliJ IDEA", an option in IDEA's Settings.
  idea {
    module {
      outputDir = file('build/classes/java/main')
      testOutputDir = file('build/classes/java/test')
    }
  }
}

configure(subprojects - project(':android')) {
  apply plugin: 'java-library'
  apply plugin: 'kotlin'
  java.sourceCompatibility = 21
  java.targetCompatibility = 21

  // From https://lyze.dev/2021/04/29/libGDX-Internal-Assets-List/
  // The article can be helpful when using assets.txt in your project.
  tasks.register('generateAssetList') {
    inputs.dir("${project.rootDir}/assets/")
    // projectFolder/assets
    File assetsFolder = new File("${project.rootDir}/assets/")
    // projectFolder/assets/assets.txt
    File assetsFile = new File(assetsFolder, "assets.txt")
    // delete that file in case we've already created it
    assetsFile.delete()

    // iterate through all files inside that folder
    // convert it to a relative path
    // and append it to the file assets.txt
    fileTree(assetsFolder).collect { assetsFolder.relativePath(it) }.sort().each {
      assetsFile.append(it + "\n")
    }
  }
  processResources.dependsOn 'generateAssetList'

  compileJava {
    options.incremental = true
  }
  compileKotlin.compilerOptions.jvmTarget.set(JvmTarget.JVM_21)
  compileTestKotlin.compilerOptions.jvmTarget.set(JvmTarget.JVM_21)

}

subprojects {
  version = rootProject.zjVersionName
  ext.projectVersion = rootProject.zjVersionName
  ext.appName = 'zj-game'
  repositories {
    mavenCentral()
    // You may want to remove the following line if you have errors downloading dependencies.
    mavenLocal()
    maven { url = 'https://central.sonatype.com/repository/maven-snapshots/' }
    maven { url = 'https://jitpack.io' }
  }
}

eclipse.project.name = 'zj-game' + '-parent'
