# Warm daemon: reuse the Gradle JVM across builds (much faster iterative compile/test).
# Stop with `./gradlew --stop` if you need to free RAM or clear a stuck daemon.
org.gradle.daemon=true
# Sets starting memory usage to 512MB, maximum memory usage to 1GB, and tries to set as much to use Unicode as we can.
org.gradle.jvmargs=-Xms512M -Xmx1G -Dfile.encoding=UTF-8 -Dconsole.encoding=UTF-8
# "Configure on-demand" must be false because it breaks projects that have Android modules. The default is also false.
org.gradle.configureondemand=false
# The logging level determines which messages get shown about how Gradle itself is working, such as if build.gradle
# files are fully future-proof (which they never are, because Gradle constantly deprecates working APIs).
# 'lifecycle' is Gradle's default and is required for the test task's testLogging output (per-test
# passed/failed/skipped lines) and the BUILD SUCCESSFUL banner to be visible. 'quiet' swallows both,
# which makes a test run look like a silent success. Change to 'info' only while debugging build files.
# Note that if you want to use Gradle Build Scans, you should set the below logging level to 'lifecycle', otherwise
# the link to the scan won't get shown at all.
# Documented at: https://docs.gradle.org/current/userguide/command_line_interface.html#sec:command_line_logging
org.gradle.logging.level=lifecycle
kotlinVersion=2.4.0
lwjgl3Version=3.4.1
jnaVersion=5.18.1
android.useAndroidX=true
gdxVersion=1.14.2
teavmVersion=1.6.2
# Marketing version (major.minor). The third component is git commit count
# (`git rev-list --count HEAD`) plus projectBuildOffset, baked at configure time
# into AppVersion and Android versionName/versionCode. The offset keeps version
# codes increasing when a fresh history starts; -PbuildNumber=N overrides the
# total when git is unavailable (source zip, shallow clone).
projectVersionMajor=1
projectVersionMinor=1
# Added to the git commit count. Non-zero in a repo whose history was restarted,
# so Android versionCode keeps increasing across the old and new histories.
# 975 puts the codes in this one past the highest the previous history reached.
projectBuildOffset=975
# Public web / server client ID. Wasm GIS and Android Credential Manager both
# use this as the ID-token audience (GetGoogleIdOption.setServerClientId).
# Empty disables Google Sign-In on those platforms. Register an Android OAuth
# client in the same Google Cloud project (package inego.zungjunggame + SHA-1)
# so Credential Manager can issue tokens for this audience.
# Wasm also overridable at runtime via ?googleClientId=... or teavm/webapp/zj-config.js.
googleWebClientId=159709650206-d1040f4life3k9dktfo1j7b0h9vo1ku3.apps.googleusercontent.com
# Desktop OAuth client ID (Google Cloud type "Desktop app"). Distinct from
# googleWebClientId — loopback http://127.0.0.1 is not valid on a Web client.
# Empty disables Google Sign-In on desktop. Add the same value to zj-server
# GOOGLE_CLIENT_IDS so /auth/google/exchange accepts the ID-token audience.
googleDesktopClientId=159709650206-1b19389qgpu54r91qof5due9mrre2ol2.apps.googleusercontent.com
# Desktop client secret, from the same "Desktop app" client (Cloud Console →
# Credentials, or the downloaded client JSON). A Desktop app client is NOT a
# public client: with no secret Google's token endpoint rejects the exchange
# with 400 invalid_request "client_secret is missing", PKCE and the loopback
# redirect_uri notwithstanding. Google does not treat an installed-app secret
# as confidential, but it is still per-build config and is never sent to
# zj-server — the server only verifies the ID token. Empty disables desktop
# Google Sign-In (see googleDesktopClientSecret in lwjgl3/build.gradle).
googleDesktopClientSecret=
# Web/Wasm API base URL injected into zj-config.js.
# Local development on TeaVM Jetty (8081/8082) points to local zj-server (8080).
# In production (play.zungjung.org behind nginx reverse proxy), set empty string
# (e.g. ./gradlew :teavm:buildWasm -PapiBaseUrl="") so the client defaults to
# same-origin (window.location.origin).
# Android ignores this value: pass -PapiBaseUrl=https://play.zungjung.org on the
# command line to bake a server address into the APK (BuildConfig.API_BASE_URL).
# Without the flag, :android:install* writes LAN hosts to dev-api-url.txt instead.
# Desktop ignores it too. Desktop takes an explicit -PapiBaseUrl=... , else
# `desktopApiBaseUrl` from the gitignored local.properties, else this dev default:
#   ./gradlew :lwjgl3:run -PapiBaseUrl=https://play.zungjung.org
# IntelliJ: the same flag goes in the run configuration's "Arguments" field.
apiBaseUrl=http://127.0.0.1:8080
# TeaVM name obfuscation. Default false so local :teavm:runWasm keeps readable stacks.
# Production Wasm: ./gradlew :teavm:buildWasm -PteavmObfuscated=true -PapiBaseUrl=""
teavmObfuscated=false
# TeaVM debug info: Wasm function names in stack traces. The :teavm:debugWasm and
# :teavm:runDebugWasm tasks imply it; set true explicitly to keep names in a normal build.
teavmDebugInformation=false
