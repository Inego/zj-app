# Filled by Gradle from googleDesktopClientId / googleDesktopClientSecret.
# Empty client ID disables desktop Google Sign-In. An empty secret leaves the
# provider unavailable too: Google requires the installed-app secret on the
# token exchange, so an ID without a secret could only produce a misleading
# "Could not reach Google" at the end of a successful browser round trip.
clientId=__GOOGLE_DESKTOP_CLIENT_ID__
clientSecret=__GOOGLE_DESKTOP_CLIENT_SECRET__
