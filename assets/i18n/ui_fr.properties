# Notifications. Le client remplit ces modèles dans la langue du joueur ; le
# courrier les rend depuis ce fichier tant qu'il n'y a pas d'i18n côté serveur.
notice.title=Notifications
notice.empty=Aucune notification pour l'instant
# {0} nom du joueur, {1} son classement, {2} identifiant de tentative, {3} votre
# score, {4} le sien, {5} votre variation de classement, {6} classement avant,
# {7} classement après.
notice.later_play=**{0}** ({1}) a joué [hl]{2}[/]. Vous avez marqué **{3}**, {0} a marqué **{4}**. Classement {5} ({6} → {7}).
# Une ligne d'un lot de parties ultérieures : {0} identifiant de tentative, {1} score.
notice.later_play_row=| {0} | {1} |
# {0} nouvelles comparaisons, {1} nombre de tentatives, {2} variation de
# classement, {3} classement avant, {4} classement après ; {5} le lot de lignes.
notice.digest=**{0}** · **{1}**. Classement {2} ({3} → {4}).\n\n| Classé à l'ombre | Vous | Partie ultérieure | Classement |\n|---|---|---|---|\n{5}
# Une ligne de résumé : {0} identifiant de tentative, {1} votre score, {2} la partie ultérieure, {3} classement.
notice.digest_row=| {0} | {1} | {2} | {3} |
