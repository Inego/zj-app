tutorial.orient.tiles.title=Tuiles
tutorial.orient.tiles.intro=Il y a 34 faces de tuiles différentes au mahjong : 27 faces numérotées et 7 faces d'honneur. En voici quelques-unes de chaque.
tutorial.orient.tiles.tags=Les tuiles peuvent être affichées **avec étiquettes** ou **sans**.
tutorial.orient.tiles.tags_try=Dans cette application, vous pouvez activer ou désactiver les étiquettes dans les [Réglages](settings). Ces treize tuiles suivent ce réglage — cliquez sur le lien et cochez la case pour voir comment cela fonctionne.
tutorial.orient.numbers.title=Numéros
tutorial.orient.numbers.intro=Les tuiles numérotées existent en trois couleurs : Caractères, Cercles et Bambous (de 1 à 9 chacune).
# Séquence guidée par légende : courte ligne du haut facultative ; l'enseignement est dans la bulle.
tutorial.orient.numbers.bamboo1=Une face à remarquer
tutorial.orient.numbers.bamboo1_callout=Le 1 de Bambou est traditionnellement dessiné comme un oiseau.
# Enseignement des suites (fin des Numéros) : définition, puis « pas une suite » pas à pas.
tutorial.orient.numbers.sequence=Une suite est **exactement trois** numéros consécutifs de la même couleur — par exemple {234m}, {567p} ou {123s}.
tutorial.orient.numbers.four=Quatre tuiles consécutives d'une même couleur ne forment **pas** une suite.
tutorial.orient.numbers.four_aside3=Soit mettre de côté le **3**.
tutorial.orient.numbers.four_aside6=Soit mettre de côté le **6**.
tutorial.orient.numbers.prompt=Trouvez une **suite** — sélectionnez ses trois tuiles.
tutorial.orient.honors.title=Honneurs
tutorial.orient.honors.intro=Les vents et les dragons sont des tuiles [hl]d'honneur[/]. Ils ne forment **pas** de suites numérotées.
tutorial.orient.honors.prompt=Sélectionnez toutes les tuiles d'honneur (vents et dragons).
tutorial.orient.wall.title=Construction du mur
tutorial.orient.wall.faces=L'ensemble complet des faces : trois couleurs de 1 à 9, plus quatre vents et trois dragons — 34 en tout.
tutorial.orient.wall.copies=Chaque face a quatre tuiles — 136 au total.
tutorial.orient.wall.drawpile=Le mur est comme une pioche aux cartes : les mains de départ et les pioches en cours de jeu en proviennent.
tutorial.orient.wall.ritual=À une vraie table, construire le mur est un rituel.
tutorial.orient.wall.facedown=Pour construire un mur, retournez d'abord les tuiles face cachée...
tutorial.orient.wall.shuffle=Et mélangez-les soigneusement.
tutorial.orient.wall.formed=Formez ensuite le mur : quatre côtés de 17 piles, sur deux tuiles de hauteur.
tutorial.orient.wall.pushed=Les murs sont rapprochés pour que les extrémités se rejoignent.
tutorial.orient.wall.seats=Dans chaque main, un joueur est Est, le suivant est Sud, puis Ouest, puis Nord.
tutorial.orient.wall.east=Est est le donneur et le premier à jouer dans la main.
tutorial.orient.wall.deal=Est distribue en lançant deux d6.
tutorial.orient.wall.dice=La somme des dés détermine où le mur est ouvert.
tutorial.orient.wall.count={0}+{1}={2}. Depuis l'extrémité droite du mur d'Est, comptez {2} piles.
tutorial.orient.wall.break=Le mur est ouvert après les piles comptées. Les piles à leur gauche se décalent vers la gauche, ouvrant un espace.
tutorial.orient.wall.take7=Comptez 7 piles à droite de l'espace.
tutorial.orient.wall.dead=Mettez-les de côté pour former un mur mort séparé.
tutorial.orient.wall.dead_out=Ces 14 tuiles ne sont jamais piochées, ce qui ajoute de l'incertitude vers la fin de la main.
tutorial.orient.wall.hands=Pour former leur main, les joueurs prennent 2 piles chacun après l'espace, en démontant le mur dans le sens horaire — trois fois.
tutorial.orient.wall.hands_13=Ensuite, chaque joueur a 3x4 = 12 tuiles. Ils prennent 1 tuile de plus chacun pour atteindre 13.
tutorial.orient.wall.east_14=Comme Est commence, il entame son tour en recevant la 14e tuile.
tutorial.orient.wall.look_hands=Chaque joueur regarde sa main...
tutorial.orient.wall.sort_hands=...et la range.
tutorial.orient.wall.east_discard=Maintenant, le joueur Est doit faire son premier coup en défaussant une tuile.
tutorial.orient.wall.app_table=Dans cette application, pour économiser l'espace, le mur vivant est représenté de façon simplifiée et le mur mort n'est pas affiché du tout.
tutorial.orient.wall.live_count=Le **69** au centre est le nombre de tuiles restantes dans le mur vivant.

# Ordre de jeu
tutorial.moves.east_player.title=Joueur Est
tutorial.moves.east_player.four=Il y a [hl]quatre[/] joueurs. Pour chaque main, l'un d'eux est [hl]Est[/] (le donneur). Puis, dans le sens antihoraire : [hl]Sud[/], [hl]Ouest[/] et [hl]Nord[/].
tutorial.moves.east_player.pass=Après chaque main, l'attribution des vents tourne elle-même dans le sens [hl]antihoraire[/]. Le joueur qui était Sud devient le nouvel Est.
tutorial.moves.discarding.title=Défausser
tutorial.moves.discarding.east_14=Au début de chaque main, le joueur [hl]Est[/] (le donneur) a [hl]14[/] tuiles en main (contrairement aux 3 autres joueurs qui en ont [hl]13[/] chacun).
tutorial.moves.discarding.east_hu=Si ces 14 tuiles forment une [hl]main gagnante[/], Est peut déclarer la victoire (« [hl]Hu ![/] ») immédiatement — c'est la [Bénédiction du Ciel](pattern-9.4.1).
tutorial.moves.discarding.east_hu_odds=Statistiquement, la probabilité que cela arrive est cependant de [hl]1 sur 328 909[/]. Vous pouvez jouer au mahjong toute votre vie sans jamais le voir.
tutorial.moves.discarding.must_discard=Si cette main n'est pas gagnante (ce qui est normalement le cas), Est doit choisir une de ses tuiles à [hl]défausser[/] pour ramener le nombre de tuiles à 13.
tutorial.moves.discarding.least_useful=Pour défausser, essayez de vous débarrasser de la tuile la moins utile (celle qui semble trop peu prometteuse pour former de futures combinaisons).
tutorial.moves.discarding.others_claim=Les autres joueurs peuvent [hl]réclamer[/] la tuile défaussée pour améliorer leur main ou même [hl]gagner[/].
tutorial.moves.counterclockwise.title=Ordre de jeu
tutorial.moves.counterclockwise.this_tile=[hl]Cliquez sur cette tuile[/] pour la défausser.
tutorial.moves.counterclockwise.click_callout=Défaussez-la
tutorial.moves.counterclockwise.if_nobody=Personne ne l'a [hl]réclamée[/], elle est donc restée défaussée.
tutorial.moves.counterclockwise.the_river=La [hl]rivière[/] est comme une pile de défausse aux cartes : les tuiles non réclamées restent face visible devant le joueur qui les a défaussées.
tutorial.moves.counterclockwise.to_the_right=Le tour passe toujours au joueur situé à la [hl]droite[/] du défausseur.
tutorial.moves.counterclockwise.right_next=Vous êtes [hl]Est[/] (bas de la table). [hl]Droite[/] joue ensuite — elle a pioché au mur, puis elle va défausser.
tutorial.moves.counterclockwise.right_discards=Droite [hl]défausse[/] une tuile. Personne ne l'a réclamée, le tour passe donc à [hl]En face[/], qui pioche au mur.

# Réclamer
tutorial.claims.click_callout=Sélectionnez ceci
tutorial.claims.pung.title=Pung
tutorial.claims.pung.offer=En face a défaussé une tuile dont vous avez déjà une [hl]paire[/] ({0}). [hl]Cliquez sur Pung[/] pour compléter un brelan.
tutorial.claims.pung.reveal=Réclamer une tuile défaussée par un autre joueur exige de [hl]révéler[/] la combinaison formée — ici, le [hl]brelan[/].
tutorial.claims.pung.must_discard=Vous avez maintenant [hl]14[/] tuiles, et comme cette main n'est pas gagnante, vous devez [hl]défausser[/] une tuile.
tutorial.claims.pung.skips_left=Comme vous l'avez réclamée, [hl]Gauche[/] passe son tour — elle aurait sinon [hl]pioché au mur[/] ensuite.
tutorial.claims.pung.third_for_two=Vous pouvez réclamer un [hl]troisième[/] pour deux copies. Vous ne pouvez pas réclamer un [hl]deuxième[/] pour une seule.
tutorial.claims.last_discard.title=Dernière défausse
tutorial.claims.last_discard.only_fresh=Vous pouvez réclamer une tuile [hl]juste après[/] sa défausse. Vous ne pouvez pas réclamer une tuile déjà dans la [hl]rivière[/].
tutorial.claims.last_discard.callout=Cette tuile a été défaussée en dernier
# Réclamer — Chow
tutorial.claims.chow.title=Chow
tutorial.claims.chow.offer=Gauche a défaussé une tuile ({0}) qui complète une [hl]suite[/] avec deux tuiles que vous avez déjà. [hl]Cliquez sur Chow[/] pour la compléter.
tutorial.claims.chow.reveal=Réclamer une tuile défaussée par un autre joueur exige de [hl]révéler[/] la combinaison formée — ici, la [hl]suite[/].
tutorial.claims.chow.must_discard=Vous avez maintenant [hl]14[/] tuiles, et comme cette main n'est pas gagnante, vous devez [hl]défausser[/] une tuile.
tutorial.claims.chow.only_left=Vous pouvez [hl]seulement[/] chow depuis [hl]Gauche[/] (le joueur juste avant vous). Les défausses d'En face ou de Droite ne peuvent pas être chow.
tutorial.claims.hu.title=Hu
tutorial.claims.hu.offer=Ici, votre main gagnante est presque complète et vous attendez une paire. En face vient de défausser la tuile qu'il vous faut ({0}). [hl]Cliquez sur Hu[/] pour la réclamer.
tutorial.claims.hu.not_a_set=Quand une tuile défaussée complète une [hl]main gagnante[/], vous pouvez la réclamer. Elle n'a [hl]pas[/] besoin de compléter une [hl]combinaison[/] — ici, elle a complété la [hl]paire[/].
tutorial.claims.hu.breakdown=Si le panneau du décompte des points masque la table, vous pouvez le [hl]faire glisser[/] pour le déplacer, ou le [hl]réduire et le développer[/] à l'aide du bouton chevron. Essayez de le déplacer ou de le réduire dès maintenant !

# Réclamer — Priorité des réclamations
tutorial.claims.priority.title=Priorité des réclamations
tutorial.claims.priority.conflict=Gauche vient de défausser {3s}. Vous avez {12s} et pourriez **Chow**, mais Droite a une paire de {3s}. Essayez de réclamer [hl]Chow[/] pour voir ce qui se passe !
tutorial.claims.priority.pung_beats_chow=Même si vous avez réclamé Chow, [hl]Pung bat Chow[/] ! La réclamation de Droite l'emporte sur la vôtre — Droite prend la tuile et votre tour est passé !
tutorial.claims.priority.hierarchy=La hiérarchie universelle des réclamations est : [hl]Victoire (Hu)[/] bat [hl]Pung et Kong[/], qui battent tous deux [hl]Chow[/].
tutorial.claims.priority.multi_win=Si plusieurs joueurs réclament [hl]Hu[/] sur la même défausse, le joueur le plus proche du défausseur dans l'ordre de jeu l'emporte (pas de victoires multiples).

# Kongs — Grand kong exposé
tutorial.kongs.melded.title=Kong exposé
tutorial.kongs.melded.offer=En face a défaussé une tuile ({0}) correspondant à votre brelan caché. Cliquez sur [hl]Kong[/] pour déclarer un kong !
tutorial.kongs.melded.reveal=Réclamer une 4e tuile défaussée expose le kong sur la table en tant que [hl]kong ouvert[/].
tutorial.kongs.melded.one_kong=Former un kong rapporte [hl]5[/] points pour [Un kong](pattern-4.3.1) et augmente avec plusieurs kongs.
tutorial.kongs.melded.compensation=Comme un kong a 4 tuiles, vous piochez une [hl]tuile de remplacement[/] en bout de mur pour conserver une taille de main valide.
tutorial.kongs.melded.must_discard=Après avoir pioché la tuile de remplacement, vous devez [hl]défausser[/] pour terminer votre tour.
tutorial.kongs.melded.already_melded=Vous ne pouvez pas réclamer une 4e tuile défaussée si votre brelan est déjà exposé sur la table en [hl]Pung[/] ouvert.

# Kongs — Kong caché
tutorial.kongs.concealed.title=Kong caché
tutorial.kongs.concealed.offer=Vous venez de prendre une tuile au mur et détenez les quatre copies de {0}. Cliquez sur [hl]Déclarer un kong caché[/] !
tutorial.kongs.concealed.arrangement=Remarquez la combinaison : les deux **tuiles des extrémités sont fermées** (face cachée) pour montrer qu'elle reste cachée, tandis que les tuiles centrales prouvent le kong.
tutorial.kongs.concealed.scoring=En Zung Jung, il reste **caché** pour le score — [Main fermée](pattern-1.2) reste valide !
tutorial.kongs.concealed.compensation=Vous piochez une [hl]tuile de remplacement[/] en bout de mur, puis défaussez normalement pour finir votre tour.

# Kongs — Kong promu
tutorial.kongs.promoted.title=Kong promu
tutorial.kongs.promoted.offer=Vous avez un pung ouvert de {0} et venez de piocher la 4e tuile ! Cliquez sur [hl]Promouvoir en kong[/] pour améliorer votre combinaison.
tutorial.kongs.promoted.upgraded=La quatrième tuile rejoint votre pung ouvert, le transformant en kong ouvert et le qualifiant pour [Un kong](pattern-4.3.1).
tutorial.kongs.promoted.robbing=Attention : c'est le seul moment où les adversaires peuvent [Voler le kong](pattern-9.3) si cette tuile complète leur main gagnante !
tutorial.kongs.promoted.compensation=Si c'est sans danger, vous piochez une [hl]tuile de remplacement[/] en bout de mur et défaussez pour terminer votre tour.

# Mains et score — Gagner une main
tutorial.hands.win.title=Gagner une main
tutorial.hands.win.hand_size=Les joueurs ont normalement [hl]13[/] tuiles. Vous n'en avez [hl]14[/] que temporairement en piochant ou en réclamant. Si vous ne gagnez pas, vous devez défausser pour revenir à 13.
tutorial.hands.win.patterns=Pour gagner une main, les tuiles de votre main doivent former certaines combinaisons précises.
tutorial.hands.win.all_in_groups=Normalement, dans une main gagnante, chaque tuile doit appartenir à l'une des quatre [hl]combinaisons[/] ou à la [hl]paire[/] unique. Cela fait généralement [hl]14[/] tuiles.
tutorial.hands.win.set_kinds=Une combinaison est une [hl]suite[/], un [hl]brelan[/] ou un [hl]kong[/].
tutorial.hands.win.kong_size=Ici, l'une des quatre combinaisons est un [hl]kong[/]. À cause de ce kong, la main compte [hl]15[/] tuiles, et non 14.

# Mains et score — Main sans figure
tutorial.hands.chicken.title=Main sans figure
tutorial.hands.chicken.one=Si aucune combinaison spéciale ne s'applique à cette main, on l'appelle une [hl]main sans figure[/] et elle vaut [hl]1[/] point.
tutorial.hands.chicken.tournament=En tournoi, les mains sans figure peuvent être [hl]interdites[/] — la main doit valoir au moins [hl]5[/] points pour compter comme gagnante.
tutorial.hands.chicken.next=Dans les leçons suivantes, nous verrons les combinaisons de base qui permettent à une main de marquer [hl]5[/] points ou plus.

# Mains et score — Main fermée
tutorial.hands.concealed.title=Main fermée
tutorial.hands.concealed.offer=En face a défaussé une tuile ({0}) qui complète une suite avec deux tuiles que vous avez déjà. Vous ne pouvez pas Chow depuis En face — mais comme elle complète votre main, vous pouvez réclamer [hl]Hu 5[/] ! Cliquez sur [hl]Hu[/] pour gagner.
tutorial.hands.concealed.points=Chaque adversaire paie le score de la main au gagnant. Pour une main de [hl]5[/] points, les trois paient 5 chacun — vous rapportant [hl]3×[/] le score de la main ([hl]+15[/] points) !
tutorial.hands.concealed.concealed_rule=Une main est [hl]fermée[/] si vous n'avez fait aucune réclamation ouverte (comme **Chow** ou **Pung**) avant de déclarer la victoire.
tutorial.hands.concealed.discard_win=Même si vous avez réclamé la défausse d'En face pour compléter cette dernière suite, gagner sur une défausse est [hl]autorisé[/] — seules les combinaisons ouvertes faites *avant* la victoire annulent la Main fermée.
tutorial.hands.concealed.kongs=Réclamer un [hl]Chow[/], un [hl]Pung[/] ou un [hl]Kong[/] plus tôt dans la main expose cette combinaison sur la table, ouvrant votre main et annulant cette combinaison.

# Mains et score — Toutes suites
tutorial.hands.all_sequences.title=Toutes suites
tutorial.hands.all_sequences.offer=En face a défaussé une tuile ({0}) qui complète votre quatrième suite. Même si votre main est ouverte à cause d'un Chow antérieur, le bouton propose [hl]Hu 5[/] ! Cliquez sur [hl]Hu[/] pour gagner.
tutorial.hands.all_sequences.points=Une main où les quatre combinaisons sont des suites (sans brelan ni kong) marque [hl]5[/] points pour [Toutes suites](pattern-1.1).
tutorial.hands.all_sequences.open_allowed=Contrairement à la Main fermée, [Toutes suites](pattern-1.1) autorise les chows ouverts. Même avec une combinaison ouverte sur la table, avoir quatre suites rapporte toujours 5 points.
tutorial.hands.all_sequences.unrestricted=N'importe quelle paire est permise — même des honneurs dragon ou vent — et tout type d'attente est valable.

# Mains et score — Sans extrémités
tutorial.hands.no_terminals.title=Sans extrémités
tutorial.hands.no_terminals.offer=En face a défaussé une tuile ({0}) qui complète votre main gagnante. Chaque tuile de votre main est un simple numéro de 2 à 8. Cliquez sur [hl]Hu[/] pour gagner.
tutorial.hands.no_terminals.terminals_def=Dans les trois couleurs numérotées, les tuiles des extrémités — **1** et **9** ({1m}, {9s}) — sont appelées [hl]extrémités[/]. Les tuiles intérieures de **2** à **8** sont appelées [hl]simples[/]. Les honneurs ne sont ni l'un ni l'autre.
tutorial.hands.no_terminals.points=La combinaison [Sans extrémités](pattern-1.3) vaut [hl]5[/] points. Chaque tuile de la main — les quatre combinaisons et la paire — doit être un [hl]simple[/], sans extrémité ni honneur.
tutorial.hands.no_terminals.flexibility=Remarquez que cette main a un brelan ouvert ({5p}{5p}{5p}), elle n'est donc ni fermée ni toute en suites. Mais comme chaque tuile est un simple, elle se qualifie pour [hl]Sans extrémités (5 pts)[/] !
tutorial.hands.no_terminals.stacking=Sans extrémités peut aussi [hl]s'accumuler[/] avec d'autres combinaisons comme [Toutes suites](pattern-1.1) ou [Main fermée](pattern-1.2) quand elles s'appliquent, totalisant 10 ou 15 points.

# Mains et score — Kongs
tutorial.hands.kongs.title=Kongs
tutorial.hands.kongs.offer=En face a défaussé une tuile ({0}) qui complète votre main gagnante. Vous avez déjà deux kongs ouverts sur la table. Cliquez sur [hl]Hu[/] pour gagner.
tutorial.hands.kongs.two_kongs=Comme nous l'avons vu, [Un kong](pattern-4.3.1) rapporte [hl]5[/] points. Avoir **deux kongs** fait grimper le score à [hl]20[/] points pour [Deux kongs](pattern-4.3.2) !
tutorial.hands.kongs.hand_size=Comme chaque kong prend 4 tuiles au lieu de 3 et pioche une tuile de compensation, cette main gagnante compte [hl]16[/] tuiles au lieu des 14 habituelles.
tutorial.hands.kongs.ladder=Les combinaisons de kong supérieures montent en flèche : [Trois kongs](pattern-4.3.3) marque [hl]120[/] points, et [Quatre kongs](pattern-4.3.4) marque la [hl]limite de 480[/] points !

# Mains et score — Honneur de valeur
tutorial.hands.value_honor.title=Honneur de valeur
tutorial.hands.value_honor.offer=En face a défaussé une tuile ({0}) qui complète votre main. Votre brelan ouvert de Dragons rouges rend cette main digne de [hl]Hu 10[/] ! Cliquez sur [hl]Hu[/] pour gagner.
tutorial.hands.value_honor.dragons=Un brelan ou un kong d'un [hl]honneur de valeur[/] vaut [hl]10[/] points ([Honneur de valeur](pattern-3.1)). N'importe lequel des trois dragons — **Rouge** ({C}), **Vert** ({F}) ou **Blanc** ({P}) — est toujours un honneur de valeur pour chaque joueur.
tutorial.hands.value_honor.seat_winds=Votre propre **vent de place** (comme {E} pour la place Est) est aussi un honneur de valeur. Les vents des trois autres places (« vents invités ») ne marquent pas. En Zung Jung, il n'y a **pas de vent dominant ni de vent de tour**.
tutorial.hands.value_honor.stacking=L'Honneur de valeur compte [hl]cumulativement par combinaison[/] : détenir deux brelans qualifiants marque [hl]20[/] points. Les combinaisons ouvertes sont permises, mais les **paires** ne marquent jamais — seuls les brelans et les kongs comptent.

# Mains et score — Tous brelans
tutorial.hands.all_triplets.title=Tous brelans
tutorial.hands.all_triplets.offer=En face a défaussé une tuile ({0}) qui complète votre main en quatre brelans et une paire. Cliquez sur [hl]Hu[/] pour gagner !
tutorial.hands.all_triplets.pattern=La combinaison [Tous brelans](pattern-4.1) exige quatre brelans (ou kongs) et une paire, sans suite. Les pungs ouverts sont permis, et la combinaison accorde généreusement [hl]30[/] points !
tutorial.hands.all_triplets.settlement_cap=Sur une victoire par défausse au-dessus de 25 points, les non-défausseurs sont [hl]plafonnés à 25 points[/] (Gauche/Droite paient [hl]-25[/]). Le défausseur couvre les deux manques : 30 + 5 + 5 = **40** ([hl]-40[/]) !
tutorial.hands.all_triplets.self_draw=Vous recevez toujours les **90 points** complets (3 \u00d7 30). Sur une **auto-pioche**, il n'y a pas de défausseur, donc les trois adversaires paient les 30 points complets.

# Mains et score — Suite de neuf tuiles
tutorial.hands.nine_tile_straight.title=Suite de neuf tuiles
tutorial.hands.nine_tile_straight.offer=En face a défaussé une tuile ({0}) qui complète votre main en une suite de 1 à 9 en caractères. Cliquez sur [hl]Hu[/] pour gagner !
tutorial.hands.nine_tile_straight.pattern=La combinaison [Suite de neuf tuiles](pattern-7.1) vaut l'énorme [hl]40[/] points ! Elle exige trois suites couvrant **1 à 9 dans une seule couleur** ({1m} à {9m}). Les chows ouverts sont permis.
tutorial.hands.nine_tile_straight.composition=Les 5 tuiles restantes peuvent être toute combinaison et paire valides dans n'importe quelle couleur. Ici, un brelan de {555p} et une paire de {99s} complètent votre main gagnante de 14 tuiles.
tutorial.hands.nine_tile_straight.settlement=Avec une main de 40 points, les non-défausseurs sont plafonnés à [hl]-25[/]. En face couvre leurs 40 plus les deux manques de 15 points ([hl]-70[/]), vous rapportant [hl]+120[/] points (3 \u00d7 40) !

# Mains et score — Sept paires
tutorial.hands.seven_pairs.title=Sept paires
tutorial.hands.seven_pairs.offer=En face a défaussé une tuile ({0}) qui complète votre main en sept paires. Cliquez sur [hl]Hu[/] pour gagner !
tutorial.hands.seven_pairs.pattern=Toutes les mains gagnantes vues jusqu'ici étaient composées de 4 combinaisons et 1 paire. [Sept paires](pattern-10.2) est une [hl]main irrégulière[/] — elle brise cette règle en complétant **sept paires** pour [hl]30[/] points !
tutorial.hands.seven_pairs.concealed_only=Sept paires doit être [hl]entièrement fermée[/]. Vous ne pouvez pas appeler Chow, Pung ou Kong — toutes les paires doivent être piochées au mur. Vous pouvez toutefois réclamer la tuile finale sur la défausse d'un adversaire pour compléter votre 7e paire !
tutorial.hands.seven_pairs.four_of_a_kind=L'attente à Sept paires est toujours une [hl]attente sur une seule tuile[/] pour votre 7e paire. En Zung Jung, détenir les **quatre copies** d'une même tuile (sans déclarer de kong) compte, selon les règles, comme **deux paires**.

# Mains et score — Deux suites identiques
tutorial.hands.two_identical_sequences.title=Deux suites identiques
tutorial.hands.two_identical_sequences.offer=En face a défaussé une tuile ({0}) qui complète votre deuxième suite identique. Cliquez sur [hl]Hu[/] pour gagner !
tutorial.hands.two_identical_sequences.pattern=[Deux suites identiques](pattern-5.1.1) accorde [hl]10[/] points pour deux suites identiques dans une couleur ({234s} et {234s}). En main, elles ressemblent à des paires consécutives ({223344s}). Les chows ouverts sont autorisés !
tutorial.hands.two_identical_sequences.ladder=Les paliers supérieurs de cette série accordent des points énormes : [Trois suites identiques](pattern-5.1.3) marque [hl]120[/] points, et [Quatre suites identiques](pattern-5.1.4) marque la [hl]limite de 480[/] points !

# Mains et score — Deux brelans cachés
tutorial.hands.two_concealed_triplets.title=Deux brelans cachés
tutorial.hands.two_concealed_triplets.offer=En face a défaussé une tuile ({0}) qui complète votre main. Cliquez sur [hl]Hu[/] pour gagner !
tutorial.hands.two_concealed_triplets.pattern=[Deux brelans cachés](pattern-4.2.1) accorde [hl]5[/] points pour deux brelans formés entièrement dans votre main fermée ({333p} et {666s}). Les pungs ouverts ne comptent pas !
tutorial.hands.two_concealed_triplets.ladder=Les brelans cachés grimpent vite : [Trois brelans cachés](pattern-4.2.2) accorde [hl]30[/] points, et [Quatre brelans cachés](pattern-4.2.3) en accorde [hl]125[/] !

# Mains et score — Trois brelans similaires
tutorial.hands.three_similar_triplets.title=Trois brelans similaires
tutorial.hands.three_similar_triplets.offer=En face a défaussé une tuile ({0}) qui complète votre main. Cliquez sur [hl]Hu[/] pour gagner !
tutorial.hands.three_similar_triplets.pattern=[Trois brelans similaires](pattern-6.2.2) accorde l'énorme [hl]120[/] points pour détenir des brelans du **même numéro** dans les trois couleurs ({555m}, {555p}, {555s}). Les pungs ouverts sont autorisés !
tutorial.hands.three_similar_triplets.small_triplets=La forme inférieure, [Petits trois brelans similaires](pattern-6.2.1), accorde [hl]30[/] points pour **deux brelans et une paire** du même numéro ({555m}, {555p} et {55s}). Les débutants l'oublient souvent, mais elle est bien plus réaliste à réaliser !

# Mains et score — Mains d'une seule couleur
tutorial.hands.one_suit.title=Mains d'une seule couleur
tutorial.hands.one_suit.offer=En face a défaussé une tuile ({0}) qui complète votre main en cercles et honneurs. Cliquez sur [hl]Hu[/] pour gagner !
tutorial.hands.one_suit.mixed=Détenir des tuiles d'une **seule couleur numérotée** (en orange) avec des **honneurs** (en bleu) marque [hl]40[/] points pour [Une couleur mixte](pattern-2.1.1). Les chows et pungs ouverts sont permis !
tutorial.hands.one_suit.pure=Si vous éliminez complètement les tuiles d'honneur, [Une couleur pure](pattern-2.1.2) double le score à [hl]80[/] points ! Chaque combinaison et la paire appartiennent alors à cette seule couleur.

# Mains et score — Plus de combinaisons
tutorial.hands.more_patterns.title=Plus de combinaisons
tutorial.hands.more_patterns.rarer=Nous avons couvert les combinaisons essentielles. De nombreuses mains plus rares — comme les séries de dragons, les mains de vents et les mains limites — sont détaillées dans la [Référence](reference).
tutorial.hands.more_patterns.practice=Vous pouvez consulter la [Référence](reference) à tout moment depuis le menu en jeu pour vérifier les règles des combinaisons et les valeurs de score. Bonne partie !

