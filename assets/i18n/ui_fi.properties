tutorial.claims.pung.reveal=Toisen pelaajan heittämän tiilen vaatiminen edellyttää muodostetun sarjan [hl]paljastamista[/] — tässä tapauksessa [hl]kolmosten[/].
tutorial.claims.pung.must_discard=Nyt sinulla on [hl]14[/] tiiltä, ja koska tämä ei ole voittokäsi, sinun täytyy [hl]heittää pois[/] yksi tiili.
tutorial.claims.pung.skips_left=Koska vaadit tiilen, [hl]Vasen[/] menettää vuoronsa — hän olisi [hl]nostanut muurista[/] seuraavaksi.
tutorial.claims.pung.third_for_two=Voit vaatia [hl]kolmannen[/] kahta vastaan. Et voi vaatia [hl]toista[/] yhtä vastaan.
tutorial.claims.last_discard.title=Viimeisin heitto
tutorial.claims.last_discard.only_fresh=Voit vaatia tiilen [hl]heti sen jälkeen[/] kun se heitettiin pois. Et voi vaatia tiiltä, joka on jo [hl]joessa[/].
tutorial.claims.last_discard.callout=Tämä tiili heitettiin viimeksi
tutorial.claims.chow.title=Chow
tutorial.claims.chow.offer=Vasen heitti tiilen ({0}), joka täydentää [hl]suoran[/] kahden kädessäsi jo olevan tiilen kanssa. [hl]Napsauta Chow[/] täydentääksesi sen.
tutorial.claims.chow.reveal=Toisen pelaajan heittämän tiilen vaatiminen edellyttää muodostetun sarjan [hl]paljastamista[/] — tässä tapauksessa [hl]suoran[/].
tutorial.claims.chow.must_discard=Nyt sinulla on [hl]14[/] tiiltä, ja koska tämä ei ole voittokäsi, sinun täytyy [hl]heittää pois[/] yksi tiili.
tutorial.claims.chow.only_left=Voit huutaa Chow'n [hl]vain[/] [hl]Vasemmalta[/] (pelaajalta juuri ennen sinua). Vastapäisen tai Oikean heitoista ei voi ottaa Chow'ta.
tutorial.claims.hu.title=Hu
tutorial.claims.hu.offer=Tässä voittokätesi on lähes valmis ja odotat paria. Vastapäinen on juuri heittänyt tarvitsemasi tiilen ({0}). [hl]Napsauta Hu[/] vaatiaksesi sen.
tutorial.claims.hu.not_a_set=Kun heitetty tiili täydentää [hl]voittokäden[/], voit vaatia sen. Sen [hl]ei[/] tarvitse täydentää [hl]sarjaa[/] — tässä se täydensi [hl]parin[/].
tutorial.claims.hu.breakdown=Jos pistelaskupaneeli peittää näkymän pöytään, voit [hl]vetää[/] sen sivuun tai [hl]kutistaa ja avata[/] sen nuolipainikkeella. Kokeile vetämistä tai kutistamista nyt!

# Claiming — Claim priority
tutorial.claims.priority.title=Vaatimusten etuoikeus
tutorial.claims.priority.conflict=Vasen heitti juuri tiilen {3s}. Sinulla on kädessäsi {12s} ja voisit huutaa **Chow**, mutta Oikealla on pari {3s}. Kokeile vaatia [hl]Chow[/] nähdäksesi mitä tapahtuu!
tutorial.claims.priority.pung_beats_chow=Vaikka vaadit Chow'n, [hl]Pung voittaa Chow'n[/]! Oikean vaatimus kumoaa omasi — Oikea ottaa tiilen ja vuorosi jää väliin!
tutorial.claims.priority.hierarchy=Yleinen vaatimushierarkia on: [hl]Voitto (Hu)[/] voittaa [hl]Pungin ja Kongin[/], jotka molemmat voittavat [hl]Chow'n[/].
tutorial.claims.priority.multi_win=Jos useampi pelaaja vaatii [hl]Hu[/]-voittoa samasta heitosta, vuorojärjestyksessä heittäjää lähimpänä oleva pelaaja voittaa (ei kaksoisvoittoja).

# Kongs — Big exposed kong
tutorial.kongs.melded.title=Avoin kong
tutorial.kongs.melded.offer=Vastapäinen heitti tiilen ({0}), joka sopii suljettuihin kolmosiisi. Napsauta [hl]Kong[/] julistaaksesi neloset!
tutorial.kongs.melded.reveal=Heitetyn neljännen tiilen vaatiminen paljastaa neloset pöydälle [hl]avoimena kongina[/].
tutorial.kongs.melded.one_kong=Kongin muodostamisesta saa [hl]5[/] pistettä kuviosta [Yksi kong](pattern-4.3.1), ja pisteet kasvavat useammalla kongilla.
tutorial.kongs.melded.compensation=Koska kongissa on 4 tiiltä, nostat [hl]lisätiilen[/] muurin hännästä kelvollisen käden koon säilyttämiseksi.
tutorial.kongs.melded.must_discard=Lisätiilen noston jälkeen sinun täytyy [hl]heittää pois[/] tiili päättääksesi vuorosi.
tutorial.kongs.melded.already_melded=Et voi vaatia heitettyä neljättä tiiltä, jos kolmosesi on jo paljastettu pöydälle avoimena [hl]Pungina[/].

# Kongs — Concealed kong
tutorial.kongs.concealed.title=Suljettu kong
tutorial.kongs.concealed.offer=Olet juuri nostanut tiilen muurista ja sinulla on kaikki neljä kappaletta tiiltä {0}. Napsauta [hl]Julista suljettu kong[/]!
tutorial.kongs.concealed.arrangement=Huomaa asettelu: kaksi **reunatiiltä on suljettuina** (kuvapuoli alaspäin) osoittamaan sarjan pysyvän suljettuna, kun taas keskitiilet vahvistavat sarjan.
tutorial.kongs.concealed.scoring=Zung Jungissa se pysyy pisteytyksessä **suljettuna** — kuvio [Suljettu käsi](pattern-1.2) pysyy voimassa!
tutorial.kongs.concealed.compensation=Nostat [hl]lisätiilen[/] muurin hännästä ja heität sitten tiilen normaalisti päättääksesi vuorosi.

# Kongs — Promoted kong
tutorial.kongs.promoted.title=Korotettu kong
tutorial.kongs.promoted.offer=Sinulla on avoin pung tiilistä {0} ja nostit juuri neljännen tiilen! Napsauta [hl]Korota kongiksi[/] päivittääksesi sarjasi.
tutorial.kongs.promoted.upgraded=Neljäs tiili liittyy avoimeen pungiisi tehden siitä avoimen kongin ja oikeuttaen kuvioon [Yksi kong](pattern-4.3.1).
tutorial.kongs.promoted.robbing=Varoitus: Tämä on ainoa hetki, jolloin vastustajat voivat tehdä kuvion [Kongin ryöstö](pattern-9.3), jos tämä tiili täydentää heidän voittokätensä!
tutorial.kongs.promoted.compensation=Jos tilanne on turvallinen, nostat [hl]lisätiilen[/] muurin hännästä ja heität tiilen päättääksesi vuorosi.

# Hands and scoring — Winning a hand
tutorial.hands.win.title=Käden voittaminen
tutorial.hands.win.hand_size=Pelaajilla on tavallisesti [hl]13[/] tiiltä. Sinulla on [hl]14[/] tiiltä vain väliaikaisesti noston tai vaatimuksen aikana. Jos et voita, sinun täytyy heittää tiili palataksesi 13:een.
tutorial.hands.win.patterns=Käden voittamiseksi kätesi tiilien on muodostettava tiettyjä kuvioita.
tutorial.hands.win.all_in_groups=Tavallisesti voittokädessä jokaisen tiilen on kuuluttava yhteen neljästä [hl]sarjasta[/] tai yksittäiseen [hl]pariin[/]. Se tekee yleensä [hl]14[/] tiiltä.
tutorial.hands.win.set_kinds=Sarja on [hl]suora[/], [hl]kolmoset[/] tai [hl]kong[/].
tutorial.hands.win.kong_size=Tässä yksi neljästä sarjasta on [hl]kong[/]. Kongin vuoksi kädessä on [hl]15[/] tiiltä tavallisen 14 sijasta.

# Hands and scoring — Patternless hand
tutorial.hands.chicken.title=Kuvioton käsi
tutorial.hands.chicken.one=Jos tähän käteen ei sovellu mikään erityinen pistekuvio, sitä kutsutaan [hl]kuviottomaksi kädeksi[/] ja sen arvo on [hl]1[/] piste.
tutorial.hands.chicken.tournament=Turnauksissa kuviottomat kädet voivat olla [hl]kiellettyjä[/] — käden on oltava vähintään [hl]5[/] pisteen arvoinen voidakseen voittaa.
tutorial.hands.chicken.next=Seuraavilla oppitunneilla käymme läpi peruspistekuviot, joilla käsi saa vähintään [hl]5[/] pistettä.

# Hands and scoring — Concealed hand
tutorial.hands.concealed.title=Suljettu käsi
tutorial.hands.concealed.offer=Vastapäinen heitti tiilen ({0}), joka täydentää suoran kahden kädessäsi jo olevan tiilen kanssa. Et voi huutaa Chow'ta Vastapäiseltä — mutta koska se täydentää kätesi, voit vaatia [hl]Hu 5[/]! Voita napsauttamalla [hl]Hu[/].
tutorial.hands.concealed.points=Jokainen vastustaja maksaa käden pistearvon voittajalle. [hl]5[/] pisteen kädestä kaikki kolme maksavat 5 kukin — tuottaen sinulle [hl]3×[/] käden pistemäärän ([hl]+15[/] pistettä)!
tutorial.hands.concealed.concealed_rule=Käsi on [hl]suljettu[/], jos et ole tehnyt avoimia vaatimuksia (kuten **Chow** tai **Pung**) ennen voiton julistamista.
tutorial.hands.concealed.discard_win=Vaikka vaadit Vastapäisen heiton täydentämään viimeisen suoran, voitto heitosta on [hl]sallittu[/] — vain *ennen* voittoa tehdyt avoimet sarjat rikkovat Suljetun käden.
tutorial.hands.concealed.kongs=Jonkin [hl]Chow'n[/], [hl]Pungin[/] tai [hl]Kongin[/] ottaminen aiemmin jaossa paljastaa sarjan pöydälle tehden kädestäsi avoimen ja kumoten tämän kuvion.

# Hands and scoring — All sequences
tutorial.hands.all_sequences.title=Pelkät suorat
tutorial.hands.all_sequences.offer=Vastapäinen heitti tiilen ({0}), joka täydentää neljännen suorasi. Vaikka kätesi on avoin aiemman Chow'n vuoksi, painike tarjoaa [hl]Hu 5[/]! Voita napsauttamalla [hl]Hu[/].
tutorial.hands.all_sequences.points=Käsi, jonka kaikki neljä sarjaa ovat suoria (ei kolmosia eikä kongeja), tuottaa [hl]5[/] pistettä kuviosta [Pelkät suorat](pattern-1.1).
tutorial.hands.all_sequences.open_allowed=Toisin kuin Suljettu käsi, [Pelkät suorat](pattern-1.1) sallii avoimet Chow't. Vaikka pöydällä olisi avoin sarja, neljä suoraa antaa silti 5 pistettä.
tutorial.hands.all_sequences.unrestricted=Mikä tahansa pari on sallittu — jopa lohikäärme- tai tuuliarvotiilet — ja mikä tahansa odotustyyppi kelpaa.

# Hands and scoring — No terminals
tutorial.hands.no_terminals.title=Ei reunoja
tutorial.hands.no_terminals.offer=Vastapäinen heitti tiilen ({0}), joka täydentää voittokätesi. Jokainen tiili kädessäsi on tavallinen numerotiili väliltä 2–8. Voita napsauttamalla [hl]Hu[/].
tutorial.hands.no_terminals.terminals_def=Kolmessa numeromaassa päätytiiliä — **1** ja **9** ({1m}, {9s}) — kutsutaan [hl]reunoiksi[/]. Sisätiiliä välillä **2**–**8** kutsutaan [hl]välitiiliksi[/]. Arvotiilet eivät ole kumpaakaan.
tutorial.hands.no_terminals.points=Kuvio [Ei reunoja](pattern-1.3) on [hl]5[/] pisteen arvoinen. Käden jokaisen tiilen — kaikkien neljän sarjan ja parin — on oltava [hl]välitiili[/], ilman reunoja tai arvotiiliä.
tutorial.hands.no_terminals.flexibility=Huomaa, että tässä kädessä on avoimet kolmoset ({5p}{5p}{5p}), joten se ei ole suljettu eikä koostu pelkistä suorista. Mutta koska jokainen tiili on välitiili, se kelpaa kuvioon [hl]Ei reunoja (5 pistettä)[/]!
tutorial.hands.no_terminals.stacking=Ei reunoja voi myös [hl]yhdistyä[/] muihin kuvioihin, kuten [Pelkät suorat](pattern-1.1) tai [Suljettu käsi](pattern-1.2), muodostaen 10 tai 15 pistettä.

# Hands and scoring — Kongs
tutorial.hands.kongs.title=Kongit
tutorial.hands.kongs.offer=Vastapäinen heitti tiilen ({0}), joka täydentää voittokätesi. Pöydälläsi on jo kaksi avointa kongia. Voita napsauttamalla [hl]Hu[/].
tutorial.hands.kongs.two_kongs=Kuten aiemmin näimme, [Yksi kong](pattern-4.3.1) antaa [hl]5[/] pistettä. **Kaksi kongia** korottaa pistemäärän [hl]20[/] pisteeseen kuviolla [Kaksi kongia](pattern-4.3.2)!
tutorial.hands.kongs.hand_size=Koska kukin kongi vaatii 4 tiiltä kolmen sijasta ja ottaa korvaustiilen, tässä voittokädessä on [hl]16[/] tiiltä tavanomaisen 14 sijasta.
tutorial.hands.kongs.ladder=Korkeammat kongikuviot nousevat jyrkästi: [Kolme kongia](pattern-4.3.3) antaa [hl]120[/] pistettä ja [Neljä kongia](pattern-4.3.4) saavuttaa [hl]480[/] pisteen kattorajan!

# Hands and scoring — Value honor
tutorial.hands.value_honor.title=Arvotiili
tutorial.hands.value_honor.offer=Vastapäinen heitti tiilen ({0}), joka täydentää kätesi. Avoin punaisten lohikäärmeiden kolmosesi tekee tästä kädestä arvon [hl]Hu 10[/]! Voita napsauttamalla [hl]Hu[/].
tutorial.hands.value_honor.dragons=[hl]Arvotiilen[/] kolmoset tai kongi antaa [hl]10[/] pistettä ([Arvotiili](pattern-3.1)). Mikä tahansa kolmesta lohikäärmeestä — **Punainen** ({C}), **Vihreä** ({F}) tai **Valkoinen** ({P}) — on aina arvotiili jokaiselle pelaajalle.
tutorial.hands.value_honor.seat_winds=Oma **istuintuulesi** (kuten {E} Itä-istuimelle) on myös arvotiili. Muiden kolmen istuimen tuulet ("vierastuulten") eivät anna pisteitä. Zung Jungissa **ei ole vallitsevaa tai kierrostuulta**.
tutorial.hands.value_honor.stacking=Arvotiili lasketaan [hl]kumulatiivisesti sarjaa kohti[/]: kaksi kelvollista kolmosta tuottaa [hl]20[/] pistettä. Avoimet sarjat ovat sallittuja, mutta **parit** eivät koskaan anna pisteitä — vain kolmoset ja kongit lasketaan.

# Hands and scoring — All triplets
tutorial.hands.all_triplets.title=Pelkät kolmoset
tutorial.hands.all_triplets.offer=Vastapäinen heitti tiilen ({0}), joka täydentää kätesi neljiksi kolmosiksi ja pariksi. Voita napsauttamalla [hl]Hu[/]!
tutorial.hands.all_triplets.pattern=Kuvio [Pelkät kolmoset](pattern-4.1) edellyttää neljää kolmosta (tai kongia) ja paria, ilman suoria. Avoimet pungit ovat sallittuja, ja kuvio palkitsee ruhtinaallisilla [hl]30[/] pisteellä!
tutorial.hands.all_triplets.settlement_cap=Yli 25 pisteen heittovoitossa muille kuin heittäjälle on [hl]25 pisteen maksukatto[/] (Vasen/Oikea maksavat [hl]-25[/]). Heittäjä kattaa molemmat vajaukset: 30 + 5 + 5 = **40** ([hl]-40[/])!
tutorial.hands.all_triplets.self_draw=Saat silti täydet **90 pistettä** (3 × 30). **Itse nostetussa** voitossa ei ole heittäjää, joten kaikki kolme vastustajaa maksavat täydet 30 pistettä.

# Hands and scoring — Nine-tile straight
tutorial.hands.nine_tile_straight.title=Yhdeksän tiilen suora
tutorial.hands.nine_tile_straight.offer=Vastapäinen heitti tiilen ({0}), joka täydentää käteesi merkkien suoran 1–9. Voita napsauttamalla [hl]Hu[/]!
tutorial.hands.nine_tile_straight.pattern=Kuvio [Yhdeksän tiilen suora](pattern-7.1) on peräti [hl]40[/] pisteen arvoinen! Se vaatii kolme suoraa, jotka kattavat **numerot 1–9 yhdessä maassa** ({1m}–{9m}). Avoimet chow't ovat sallittuja.
tutorial.hands.nine_tile_straight.composition=Loput 5 tiiltä voivat olla mikä tahansa kelvollinen sarja ja pari missä tahansa maassa. Tässä kolmoset {555p} ja pari {99s} täydentävät 14 tiilen voittokätesi.
tutorial.hands.nine_tile_straight.settlement=40 pisteen kädessä muiden kuin heittäjän maksu on rajattu arvoon [hl]-25[/]. Vastapäinen maksaa oman 40 pisteensä sekä molemmat 15 pisteen vajaukset ([hl]-70[/]), tuottaen sinulle [hl]+120[/] pistettä (3 × 40)!

# Hands and scoring — Seven pairs
tutorial.hands.seven_pairs.title=Seitsemän paria
tutorial.hands.seven_pairs.offer=Vastapäinen heitti tiilen ({0}), joka täydentää kätesi seitsemäksi pariksi. Voita napsauttamalla [hl]Hu[/]!
tutorial.hands.seven_pairs.pattern=Kaikki tähänastiset voittokädet koostuivat 4 sarjasta ja 1 parista. [Seitsemän paria](pattern-10.2) on [hl]poikkeuksellinen käsi[/] — se rikkoo tätä sääntöä muodostamalla **seitsemän paria** [hl]30[/] pisteellä!
tutorial.hands.seven_pairs.concealed_only=Seitsemän parin on oltava [hl]täysin suljettu[/]. Et voi huutaa Chow'ta, Pungia tai Kongia — kaikki parit on nostettava muurista. Voit kuitenkin ottaa viimeisen tiilen vastustajan heitosta täydentääksesi 7. parisi!
tutorial.hands.seven_pairs.four_of_a_kind=Seitsemän parin odotus on aina [hl]yhden tiilen odotus[/] 7. parillesi. Zung Jungissa kaikkien **neljän kappaleen** hallussapito samasta tiilestä (ilman kongin julistamista) lasketaan sääntöjen mukaan **kahdeksi pariksi**.

# Hands and scoring — Two identical sequences
tutorial.hands.two_identical_sequences.title=Kaksi identtistä suoraa
tutorial.hands.two_identical_sequences.offer=Vastapäinen heitti tiilen ({0}), joka täydentää toisen identtisen suorasi. Voita napsauttamalla [hl]Hu[/]!
tutorial.hands.two_identical_sequences.pattern=[Kaksi identtistä suoraa](pattern-5.1.1) antaa [hl]10[/] pistettä kahdesta samasta suorasta yhdessä maassa ({234s} ja {234s}). Kädessä ne näyttävät peräkkäisiltä pareilta ({223344s}). Avoimet chow't ovat sallittuja!
tutorial.hands.two_identical_sequences.ladder=Tämän sarjan korkeammat tasot antavat suuria pistemääriä: [Kolme identtistä suoraa](pattern-5.1.3) antaa [hl]120[/] pistettä ja [Neljä identtistä suoraa](pattern-5.1.4) saavuttaa [hl]480[/] pisteen kattorajan!

# Hands and scoring — Two concealed triplets
tutorial.hands.two_concealed_triplets.title=Kaksi suljettua kolmosta
tutorial.hands.two_concealed_triplets.offer=Vastapäinen heitti tiilen ({0}), joka täydentää kätesi. Voita napsauttamalla [hl]Hu[/]!
tutorial.hands.two_concealed_triplets.pattern=[Kaksi suljettua kolmosta](pattern-4.2.1) antaa [hl]5[/] pistettä kahdesta täysin suljetussa kädessä muodostetusta kolmosesta ({333p} ja {666s}). Avoimet pungit eivät kelpaa!
tutorial.hands.two_concealed_triplets.ladder=Suljetut kolmoset kasvavat jyrkästi: [Kolme suljettua kolmosta](pattern-4.2.2) antaa [hl]30[/] pistettä ja [Neljä suljettua kolmosta](pattern-4.2.3) antaa [hl]125[/] pistettä!

# Hands and scoring — Three similar triplets
tutorial.hands.three_similar_triplets.title=Kolme samanlaista kolmosta
tutorial.hands.three_similar_triplets.offer=Vastapäinen heitti tiilen ({0}), joka täydentää kätesi. Voita napsauttamalla [hl]Hu[/]!
tutorial.hands.three_similar_triplets.pattern=[Kolme samanlaista kolmosta](pattern-6.2.2) palkitsee huimilla [hl]120[/] pisteellä, kun sinulla on kolmoset **samalla numerolla** kaikissa kolmessa maassa ({555m}, {555p}, {555s}). Avoimet pungit ovat sallittuja!
tutorial.hands.three_similar_triplets.small_triplets=Pienempi muoto, [Pienet kolme samanlaista kolmosta](pattern-6.2.1), antaa [hl]30[/] pistettä **kahdesta kolmosesta ja parista** samalla numerolla ({555m}, {555p} ja {55s}). Aloittelijat usein sivuuttavat sen, mutta sen saavuttaminen on paljon realistisempaa!

# Hands and scoring — One-suit hands
tutorial.hands.one_suit.title=Yhden maan kädet
tutorial.hands.one_suit.offer=Vastapäinen heitti tiilen ({0}), joka täydentää kätesi kiekoilla ja arvotiilillä. Voita napsauttamalla [hl]Hu[/]!
tutorial.hands.one_suit.mixed=Tiilien omistaminen vain **yhdestä numeromaasta** (oranssilla) yhdessä **arvotiilien** (sinisellä) kanssa antaa [hl]40[/] pistettä kuviosta [Sekalainen yhden maan käsi](pattern-2.1.1). Avoimet chow't ja pungit ovat sallittuja!
tutorial.hands.one_suit.pure=Jos poistat arvotiilet kokonaan, [Puhdas yhden maan käsi](pattern-2.1.2) tuplaa pistemäärän [hl]80[/] pisteeseen! Jokainen sarja ja pari kuuluvat silloin tuohon yhteen maahan.

# Hands and scoring — More patterns
tutorial.hands.more_patterns.title=Lisää kuvioita
tutorial.hands.more_patterns.rarer=Olemme käsitelleet ydinkuviot. Monet harvinaisemmat kädet — kuten lohikäärmesarjat, tuulikädet ja kattorajan kädet — on kuvattu yksityiskohtaisesti [Käsikirjassa](reference).
tutorial.hands.more_patterns.practice=Voit tutkia [Käsikirjaa](reference) milloin tahansa pelin aikana pelivalikosta tarkistaaksesi kuvaussäännöt ja pistearvot. Mukavia pelejä!

