tutorial.orient.wall.break=Muuri murretaan laskettujen pinojen jälkeen. Niiden vasemmalla puolella olevat pinot siirtyvät vasemmalle muodostaen aukon.
tutorial.orient.wall.take7=Laske aukon oikealta puolelta 7 pinoa.
tutorial.orient.wall.dead=Aseta ne sivuun erilliseksi kuolleeksi muuriksi.
tutorial.orient.wall.dead_out=Näitä 14 tiiltä ei koskaan nosteta, mikä tuo jaon loppuun yllätyksellisyyttä.
