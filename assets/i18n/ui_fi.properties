tutorial.orient.wall.pushed=Muurit työnnetään yhteen niin, että niiden päät kohtaavat.
tutorial.orient.wall.seats=Kussakin jaossa yksi pelaaja on Itä, seuraava Etelä, sitten Länsi ja sitten Pohjoinen.
