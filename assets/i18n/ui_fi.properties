# Move order
tutorial.moves.east_player.title=Itä-pelaaja
tutorial.moves.east_player.four=Pelaajia on [hl]neljä[/]. Kussakin jaossa yksi heistä on [hl]Itä[/] (jakaja). Sitten vastapäivään edeten: [hl]Etelä[/], [hl]Länsi[/] ja [hl]Pohjoinen[/].
tutorial.moves.east_player.pass=Jokaisen jaon jälkeen tuulijako siirtyy [hl]vastapäivään[/]. Etelänä ollut pelaaja on uusi Itä.
tutorial.moves.discarding.title=Tiilen poisto
tutorial.moves.discarding.east_14=Jaon alussa pelaajalla, joka on [hl]Itä[/] (jakaja), on kädessään [hl]14[/] tiiltä (toisin kuin muilla 3 pelaajalla, joilla on kullakin [hl]13[/] tiiltä).
tutorial.moves.discarding.east_hu=Jos nämä 14 tiiltä muodostavat heti [hl]voittokäden[/], Itä voi julistaa voiton ("[hl]Hu![/]") välittömästi — tämä on [Taivaan siunaus](pattern-9.4.1).
tutorial.moves.discarding.east_hu_odds=Tilastollisesti tämän todennäköisyys on tosin vain [hl]1 suhde 328 909:ään[/]. Voit pelata mahjongia koko elämäsi näkemättä tätä kertaakaan.
tutorial.moves.discarding.must_discard=Jos käsi ei ole voittava (kuten tavallisesti), Idän on valittava yksi tiilistään [hl]poisheitettäväksi[/], jotta tiilien määrä palautuu 13:een.
tutorial.moves.discarding.least_useful=Kun heität tiilen pois, pyri hankkiutumaan eroon vähiten hyödyllisestä tiilestä (sellaisesta, joka ei vaikuta lupaavalta tulevien kuvioiden kannalta).
tutorial.moves.discarding.others_claim=Muut pelaajat voivat [hl]vaatia[/] poisheitetyn tiilen parantaakseen käsiään tai jopa [hl]voittaakseen[/].
tutorial.moves.counterclockwise.title=Vuorojärjestys
tutorial.moves.counterclockwise.this_tile=[hl]Napsauta tätä tiiltä[/] heittääksesi sen pois.
tutorial.moves.counterclockwise.click_callout=Heitä pois
tutorial.moves.counterclockwise.if_nobody=Kukaan ei [hl]vaatinut[/] sitä, joten se jäi heitetyksi.
tutorial.moves.counterclockwise.the_river=[hl]Joki[/] toimii kuin poistopakka korttipeleissä: vaatimattomat tiilet jäävät kuvapuoli ylöspäin kunkin pelaajan eteen.
tutorial.moves.counterclockwise.to_the_right=Vuoro siirtyy aina heittäjän [hl]oikealla[/] puolella olevalle pelaajalle.
tutorial.moves.counterclockwise.right_next=Olet [hl]Itä[/] (pöydän alareunassa). [hl]Oikea[/] pelaa seuraavaksi — hän nosti muurista ja heittää sitten tiilen pois.
tutorial.moves.counterclockwise.right_discards=Oikea [hl]heittää pois[/] tiilen. Kukaan ei vaatinut sitä, joten vuoro siirtyy [hl]Vastapäiselle[/], joka nostaa muurista.

