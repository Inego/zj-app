tutorial.orient.wall.copies=Kutakin kuvaa on neljä tiiltä — yhteensä 136.
tutorial.orient.wall.drawpile=Muuri toimii kuin nostopakka korttipeleissä: aloituskädet ja vuoron nostot tulevat kaikki siitä.
tutorial.orient.wall.ritual=Oikeassa pöydässä pelattaessa muurin rakentaminen on rituaali.
