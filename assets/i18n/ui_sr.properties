# Move order
tutorial.moves.east_player.title=Igrač Istok
tutorial.moves.east_player.four=Igraju [hl]četiri[/] igrača. U svakoj ruci jedan od njih je [hl]Istok[/] (delilac). Zatim, u smeru suprotnom od kazaljke: [hl]Jug[/], [hl]Zapad[/] i [hl]Sever[/].
tutorial.moves.east_player.pass=Nakon svake ruke, pozicije vetrova se pomeraju [hl]suprotno od smera kazaljke[/]. Igrač koji je bio Jug postaje novi Istok.
tutorial.moves.discarding.title=Odbacivanje
tutorial.moves.discarding.east_14=Na početku svake ruke, igrač koji je [hl]Istok[/] (delilac) ima [hl]14[/] pločica u ruci (za razliku od ostala 3 igrača koji imaju po [hl]13[/] pločica).
tutorial.moves.discarding.east_hu=Ako ovih 14 pločica formira [hl]pobedničku ruku[/], Istok može odmah objaviti pobedu („[hl]Hu![/]“) — to je [Blagoslov Neba](pattern-9.4.1).
tutorial.moves.discarding.east_hu_odds=Ipak, statistička šansa za to je tek [hl]1 prema 328.909[/]. Možete igrati mahdžong celog života i nikada to ne doživeti.
tutorial.moves.discarding.must_discard=Ako ova ruka nije pobednička (što je uobičajeno), Istok mora izabrati jednu pločicu za [hl]odbacivanje[/] kako bi broj pločica vratio na 13.
tutorial.moves.discarding.least_useful=Prilikom odbacivanja, trudite se da izbacite najmanje korisnu pločicu (onu koja nema potencijal za pravljenje budućih kombinacija).
tutorial.moves.discarding.others_claim=Ostali igrači mogu [hl]prijaviti[/] odbačenu pločicu da bi poboljšali svoju ruku ili čak [hl]pobedili[/].
tutorial.moves.counterclockwise.title=Redosled poteza
tutorial.moves.counterclockwise.this_tile=[hl]Kliknite na ovu pločicu[/] da je odbacite.
tutorial.moves.counterclockwise.click_callout=Odbacite je
tutorial.moves.counterclockwise.if_nobody=Niko je nije [hl]prijavio[/], pa je ostala odbačena.
tutorial.moves.counterclockwise.the_river=[hl]Reka[/] je poput gomile odbačenih karata: neprijavljene pločice ostaju licem nagore ispred igrača koji ih je odbacio.
tutorial.moves.counterclockwise.to_the_right=Potez uvek prelazi na igrača sa [hl]desne strane[/] onoga ko je odbacio.
tutorial.moves.counterclockwise.right_next=Vi ste [hl]Istok[/] (na dnu stola). [hl]Desni[/] igrač je sledeći na potezu — povukao je pločicu sa zida, a zatim će odbaciti.
tutorial.moves.counterclockwise.right_discards=Desni igrač [hl]odbacuje[/] pločicu. Niko je nije prijavio, pa red prelazi na igrača [hl]Prekoputa[/], koji vuče pločicu sa zida.

# Claiming
tutorial.claims.click_callout=Izaberite ovo
tutorial.claims.pung.title=Pung
tutorial.claims.pung.offer=Igrač Prekoputa je odbacio pločicu od koje već imate [hl]par[/] ({0}). [hl]Kliknite na Pung[/] da kompletirate trojku.
tutorial.claims.pung.reveal=Uzimanje pločice koju je odbacio drugi igrač zahteva [hl]otkrivanje[/] formiranog seta — ovde, [hl]trojke[/].
tutorial.claims.pung.must_discard=Sada imate [hl]14[/] pločica, i pošto ovo nije pobednička ruka, morate [hl]odbaciti[/] jednu pločicu.
tutorial.claims.pung.skips_left=Zato što ste je uzeli, igrač sa [hl]Leve strane[/] preskače potez — on bi inače bio sledeći koji [hl]vuče sa zida[/].
tutorial.claims.pung.third_for_two=Možete prijaviti [hl]treću[/] pločicu uz svoja dva primerka. Ne možete prijaviti [hl]drugu[/] uz samo jedan.
tutorial.claims.last_discard.title=Poslednje odbacivanje
tutorial.claims.last_discard.only_fresh=Pločicu možete uzeti samo [hl]neposredno nakon[/] što je odbačena. Ne možete uzeti pločicu koja se već nalazi u [hl]reci[/].
tutorial.claims.last_discard.callout=Ova pločica je odbačena poslednja
tutorial.claims.chow.title=Čou
tutorial.claims.chow.offer=Igrač Levo je odbacio pločicu ({0}) koja kompletira [hl]sekvencu[/] sa dve vaše pločice. [hl]Kliknite na Čou[/] da je kompletirate.
tutorial.claims.chow.reveal=Uzimanje pločice koju je odbacio drugi igrač zahteva [hl]otkrivanje[/] formiranog seta — ovde, [hl]sekvence[/].
tutorial.claims.chow.must_discard=Sada imate [hl]14[/] pločica, i pošto ovo nije pobednička ruka, morate [hl]odbaciti[/] jednu pločicu.
tutorial.claims.chow.only_left=Čou možete uzeti [hl]samo[/] od igrača sa [hl]Leve strane[/] (igrača neposredno pre vas). Odbacivanja od igrača Prekoputa ili Desno ne mogu se uzeti za Čou.
tutorial.claims.hu.title=Hu
tutorial.claims.hu.offer=Ovde je vaša pobednička ruka skoro kompletna, i čekate pločicu za par. Igrač Prekoputa je upravo odbacio pločicu koja vam treba ({0}). [hl]Kliknite na Hu[/] da prijavite pobedu.
tutorial.claims.hu.not_a_set=Kada odbačena pločica kompletira [hl]pobedničku ruku[/], možete je prijaviti. Ona [hl]ne[/] mora kompletirati [hl]set[/] — ovde je kompletirala [hl]par[/].
tutorial.claims.hu.breakdown=Ako vam panel za obračun poena zaklanja sto, možete ga [hl]prevući[/] u stranu ili [hl]skupiti i proširiti[/] pomoću dugmeta sa strelicom. Probajte da ga pomerite ili skupite sada!

# Claiming — Claim priority
tutorial.claims.priority.title=Prioritet prijave
tutorial.claims.priority.conflict=Igrač Levo je upravo odbacio {3s}. Vi držite {12s} i možete pozvati **Čou**, ali igrač Desno drži par {3s}. Pokušajte da prijavite [hl]Čou[/] da vidite šta će se desiti!
tutorial.claims.priority.pung_beats_chow=Iako ste prijavili Čou, [hl]Pung ima prednost nad Čouom[/]! Prijavom igrača Desno vaša se poništava — Desni uzima pločicu, a vaš potez se preskače!
tutorial.claims.priority.hierarchy=Univerzalna hijerarhija prioriteta je: [hl]Pobeda (Hu)[/] pobeđuje [hl]Pung i Kong[/], koji pobeđuju [hl]Čou[/].
tutorial.claims.priority.multi_win=Ako više igrača prijavi [hl]Hu[/] na isto odbacivanje, pobeđuje igrač koji je najbliži po redosledu poteza (nema dvostrukih pobeda).

# Kongs — Big exposed kong
tutorial.kongs.melded.title=Otvoreni kong
tutorial.kongs.melded.offer=Igrač Prekoputa je odbacio pločicu ({0}) koja odgovara vašoj zatvorenoj trojci. Kliknite na [hl]Kong[/] da objavite četvorku!
tutorial.kongs.melded.reveal=Uzimanje odbačene 4. pločice otkriva četvorku na stolu kao [hl]otvoreni kong[/].
tutorial.kongs.melded.one_kong=Formiranje konga donosi [hl]5[/] poena za [Jedan kong](pattern-4.3.1), a sa više kongova poeni rastu.
tutorial.kongs.melded.compensation=Pošto kong ima 4 pločice, vučete [hl]dopunsku pločicu[/] sa kraja zida kako biste zadržali ispravan broj pločica u ruci.
tutorial.kongs.melded.must_discard=Nakon vučenja dopunske pločice, morate [hl]odbaciti[/] jednu pločicu da završite svoj potez.
tutorial.kongs.melded.already_melded=Ne možete uzeti odbačenu 4. pločicu ako je vaša trojka već otvorena na stolu kao [hl]Pung[/].

# Kongs — Concealed kong
tutorial.kongs.concealed.title=Zatvoreni kong
tutorial.kongs.concealed.offer=Upravo ste izvukli pločicu sa zida i imate sva četiri primerka {0}. Kliknite na [hl]Objavi zatvoreni kong[/]!
tutorial.kongs.concealed.arrangement=Obratite pažnju na raspored: dve **krajnje pločice su zatvorene** (okrenute nadole) kako bi pokazale da je set zatvoren, dok srednje pločice dokazuju set.
tutorial.kongs.concealed.scoring=U Zung Džungu se ovaj set računa kao **zatvoren** za bodovanje — [Zatvorena ruka](pattern-1.2) ostaje važeća!
tutorial.kongs.concealed.compensation=Vučete [hl]dopunsku pločicu[/] sa kraja zida, a zatim odbacujete normalno da biste završili potez.

# Kongs — Promoted kong
tutorial.kongs.promoted.title=Unapređeni kong
tutorial.kongs.promoted.offer=Imate otvoreni pung {0} i upravo ste izvukli 4. pločicu! Kliknite na [hl]Unapredi u kong[/] da nadogradite set.
tutorial.kongs.promoted.upgraded=Četvrta pločica se pridružuje vašem otvorenom pungu, pretvarajući ga u otvoreni kong i kvalifikujući se za [Jedan kong](pattern-4.3.1).
tutorial.kongs.promoted.robbing=Upozorenje: Ovo je jedini trenutak kada protivnici mogu izvršiti [Krađu konga](pattern-9.3) ako im ova pločica završava ruku!
tutorial.kongs.promoted.compensation=Ako je bezbedno, vučete [hl]dopunsku pločicu[/] sa kraja zida i odbacujete da završite potez.

# Hands and scoring — Winning a hand
tutorial.hands.win.title=Pobeda u ruci
tutorial.hands.win.hand_size=Igrači obično drže [hl]13[/] pločica. Samo privremeno držite [hl]14[/] prilikom vučenja ili prijave. Ako ne pobeđujete, morate odbaciti nazad na 13.
tutorial.hands.win.patterns=Da biste pobedili u ruci, pločice moraju formirati određene priznate kombinacije.
tutorial.hands.win.all_in_groups=Obično, u pobedničkoj ruci, svaka pločica mora pripadati jednom od četiri [hl]seta[/] ili jednom [hl]paru[/]. To je ukupno [hl]14[/] pločica.
tutorial.hands.win.set_kinds=Set je [hl]sekvenca[/], [hl]trojka[/] ili [hl]kong[/].
tutorial.hands.win.kong_size=Ovde je jedan od četiri seta [hl]kong[/]. Zbog tog konga ruka ima [hl]15[/] pločica umesto 14.

# Hands and scoring — Patternless hand
tutorial.hands.chicken.title=Ruka bez kombinacije
tutorial.hands.chicken.one=Ako se na ruku ne primenjuje nijedna posebna kombinacija, ona se naziva [hl]rukom bez kombinacije[/] i vredi [hl]1[/] poen.
tutorial.hands.chicken.tournament=Na turnirima ruke bez kombinacije mogu biti [hl]zabranjene[/] — ruka mora vredeti najmanje [hl]5[/] poena da bi se priznala pobeda.
tutorial.hands.chicken.next=U sledećim lekcijama obradićemo osnovne kombinacije koje omogućavaju ruci da osvoji [hl]5[/] ili više poena.

# Hands and scoring — Concealed hand
tutorial.hands.concealed.title=Zatvorena ruka
tutorial.hands.concealed.offer=Igrač Prekoputa je odbacio pločicu ({0}) koja kompletira sekvencu sa dve vaše pločice. Ne možete uzeti Čou od Prekoputa — ali pošto kompletira celu ruku, možete pozvati [hl]Hu 5[/]! Kliknite na [hl]Hu[/] za pobedu.
tutorial.hands.concealed.points=Svaki protivnik plaća vrednost ruke pobedniku. Za ruku od [hl]5[/] poena, sva tri plaćaju po 5 — donoseći vam [hl]3×[/] vrednost ruke ([hl]+15[/] poena)!
tutorial.hands.concealed.concealed_rule=Ruka je [hl]zatvorena[/] ako niste vršili otvorene prijave (kao što su **Čou** ili **Pung**) pre proglašenja pobede.
tutorial.hands.concealed.discard_win=Iako ste uzeli odbačenu pločicu od igrača Prekoputa za završetak te sekvence, pobeda na odbačenoj pločici je [hl]dozvoljena[/] — samo otvoreni setovi pre pobede kvare Zatvorenu ruku.
tutorial.hands.concealed.kongs=Prijavljivanje bilo kog [hl]Čoua[/], [hl]Punga[/] ili [hl]Konga[/] ranije u igri izlaže taj set na sto, čineći ruku otvorenom i poništavajući ovu kombinaciju.

# Hands and scoring — All sequences
tutorial.hands.all_sequences.title=Sve sekvence
tutorial.hands.all_sequences.offer=Igrač Prekoputa je odbacio pločicu ({0}) koja kompletira vašu četvrtu sekvencu. Iako je ruka otvorena zbog ranijeg Čoua, dugme nudi [hl]Hu 5[/]! Kliknite na [hl]Hu[/] za pobedu.
tutorial.hands.all_sequences.points=Ruka u kojoj su sva četiri seta sekvence (bez trojki i kongova) donosi [hl]5[/] poena za [Sve sekvence](pattern-1.1).
tutorial.hands.all_sequences.open_allowed=Za razliku od Zatvorene ruke, [Sve sekvence](pattern-1.1) dozvoljavaju otvorene Čouove. Čak i sa otvorenim setom na stolu, četiri sekvence donose 5 poena.
tutorial.hands.all_sequences.unrestricted=Dozvoljen je bilo koji par — čak i zmajevi ili vetrovi — i bilo koja vrsta čekanja se priznaje.

# Hands and scoring — No terminals
tutorial.hands.no_terminals.title=Bez terminala
tutorial.hands.no_terminals.offer=Igrač Prekoputa je odbacio pločicu ({0}) koja kompletira vašu ruku. Svaka pločica u vašoj ruci je običan broj od 2 do 8. Kliknite na [hl]Hu[/] za pobedu.
tutorial.hands.no_terminals.terminals_def=U tri brojčane boje, krajnje pločice — **1** i **9** ({1m}, {9s}) — zovu se [hl]terminali[/]. Srednje pločice od **2** do **8** zovu se [hl]jednostavne[/]. Počasne pločice nisu ni jedno ni drugo.
tutorial.hands.no_terminals.points=Kombinacija [Bez terminala](pattern-1.3) vredi [hl]5[/] poena. Svaka pločica u ruci — sva četiri seta i par — mora biti [hl]jednostavna[/], bez terminala i bez počasnih pločica.
tutorial.hands.no_terminals.flexibility=Primetite da ova ruka ima otvorenu trojku ({5p}{5p}{5p}), pa nije ni zatvorena ni sve sekvence. Ali pošto je svaka pločica jednostavna, kvalifikuje se za [hl]Bez terminala (5 poena)[/]!
tutorial.hands.no_terminals.stacking=Bez terminala se takođe može [hl]kombinovati[/] sa drugim obrascima kao što su [Sve sekvence](pattern-1.1) ili [Zatvorena ruka](pattern-1.2), donoseći 10 ili 15 poena.

# Hands and scoring — Kongs
tutorial.hands.kongs.title=Kongovi
tutorial.hands.kongs.offer=Igrač Prekoputa je odbacio pločicu ({0}) koja kompletira vašu ruku. Već imate dva otvorena konga na stolu. Kliknite na [hl]Hu[/] za pobedu.
tutorial.hands.kongs.two_kongs=Kao što smo videli, [Jedan kong](pattern-4.3.1) donosi [hl]5[/] poena. Imati **dva konga** povećava rezultat na [hl]20[/] poena za [Dva konga](pattern-4.3.2)!
tutorial.hands.kongs.hand_size=Pošto svaki kong uzima 4 pločice umesto 3 i vuče dopunsku pločicu, ova pobednička ruka ima [hl]16[/] pločica umesto uobičajenih 14.
tutorial.hands.kongs.ladder=Viši kongovi donose još više: [Tri konga](pattern-4.3.3) vredi [hl]120[/] poena, a [Četiri konga](pattern-4.3.4) donosi maksimalni limit od [hl]480[/] poena!

# Hands and scoring — Value honor
tutorial.hands.value_honor.title=Vredne počasne pločice
tutorial.hands.value_honor.offer=Igrač Prekoputa je odbacio pločicu ({0}) koja kompletira vašu ruku. Vaša otvorena trojka Crvenih zmajeva donosi ovoj ruci [hl]Hu 10[/]! Kliknite na [hl]Hu[/] za pobedu.
tutorial.hands.value_honor.dragons=Trojka ili kong [hl]vredne počasne pločice[/] vredi [hl]10[/] poena ([Vredne počasne](pattern-3.1)). Bilo koji od tri zmaja — **Crveni** ({C}), **Zeleni** ({F}) ili **Beli** ({P}) — uvek je vredna počasna pločica za svakog igrača.
tutorial.hands.value_honor.seat_winds=Vaš sopstveni **vetar mesta** (npr. {E} za Istok) takođe je vredna počasna pločica. Vetrovi ostala tri mesta ne donose poene. U Zung Džungu **nema preovlađujućeg vetra runde**.
tutorial.hands.value_honor.stacking=Vredne počasne pločice se računaju [hl]kumulativno po setu[/]: dve priznate trojke donose [hl]20[/] poena. Otvoreni setovi su dozvoljeni, ali **parovi** nikada ne donose poene — samo trojke i kongovi.

# Hands and scoring — All triplets
tutorial.hands.all_triplets.title=Sve trojke
tutorial.hands.all_triplets.offer=Igrač Prekoputa je odbacio pločicu ({0}) koja kompletira vašu ruku u četiri trojke i par. Kliknite na [hl]Hu[/] za pobedu!
tutorial.hands.all_triplets.pattern=Kombinacija [Sve trojke](pattern-4.1) zahteva četiri trojke (ili konga) i par, bez sekvenci. Otvoreni pungovi su dozvoljeni, a kombinacija donosi čak [hl]30[/] poena!
tutorial.hands.all_triplets.settlement_cap=Prilikom pobede na odbacivanju preko 25 poena, igrači koji nisu odbacili plaćaju [hl]najviše 25 poena[/] (Levo/Desno plaćaju [hl]-25[/]). Igrač koji je odbacio pokriva razliku: 30 + 5 + 5 = **40** ([hl]-40[/])!
tutorial.hands.all_triplets.self_draw=I dalje dobijate punih **90 poena** (3 \u00d7 30). Pri **vučenju sa zida**, nema krivca za odbacivanje, pa sva tri protivnika plaćaju punih 30 poena.

# Hands and scoring — Nine-tile straight
tutorial.hands.nine_tile_straight.title=Niz od devet pločica
tutorial.hands.nine_tile_straight.offer=Igrač Prekoputa je odbacio pločicu ({0}) koja kompletira vašu ruku u niz od 1 do 9 u karakterima. Kliknite na [hl]Hu[/] za pobedu!
tutorial.hands.nine_tile_straight.pattern=Kombinacija [Niz od devet pločica](pattern-7.1) vredi ogromnih [hl]40[/] poena! Zahteva tri sekvence koje pokrivaju **od 1 do 9 u jednoj boji** ({1m} do {9m}). Otvoreni čouovi su dozvoljeni.
tutorial.hands.nine_tile_straight.composition=Preostalih 5 pločica mogu biti bilo koji ispravan set i par u bilo kojoj boji. Ovde trojka {555p} i par {99s} kompletiraju vašu pobedničku ruku od 14 pločica.
tutorial.hands.nine_tile_straight.settlement=Za ruku od 40 poena, igrači koji nisu odbacili plaćaju maksimalno [hl]-25[/]. Igrač Prekoputa plaća svojih 40 plus obe razlike od po 15 poena ([hl]-70[/]), što vam donosi [hl]+120[/] poena (3 \u00d7 40)!

# Hands and scoring — Seven pairs
tutorial.hands.seven_pairs.title=Sedam parova
tutorial.hands.seven_pairs.offer=Igrač Prekoputa je odbacio pločicu ({0}) koja kompletira vašu ruku u sedam parova. Kliknite na [hl]Hu[/] za pobedu!
tutorial.hands.seven_pairs.pattern=Sve pobedničke ruke do sada imale su 4 seta i 1 par. [Sedam parova](pattern-10.2) je [hl]nestandardna ruka[/] — krši to pravilo formiranjem **sedam parova** za [hl]30[/] poena!
tutorial.hands.seven_pairs.concealed_only=Sedam parova mora biti [hl]potpuno zatvorena ruka[/]. Ne možete pozivati Čou, Pung ili Kong — svi parovi moraju biti izvučeni sa zida. Međutim, možete uzeti odbačenu pločicu protivnika za kompletiranje 7. para!
tutorial.hands.seven_pairs.four_of_a_kind=Čekanje kod Sedam parova je uvek [hl]čekanje na jednu pločicu[/] za 7. par. U Zung Džungu, držanje sva **četiri primerka** iste pločice (bez objave konga) legalno se računa kao **dva para**.

# Hands and scoring — Two identical sequences
tutorial.hands.two_identical_sequences.title=Dve identične sekvence
tutorial.hands.two_identical_sequences.offer=Igrač Prekoputa je odbacio pločicu ({0}) koja kompletira vašu drugu identičnu sekvencu. Kliknite na [hl]Hu[/] za pobedu!
tutorial.hands.two_identical_sequences.pattern=[Dve identične sekvence](pattern-5.1.1) donosi [hl]10[/] poena za dve identične sekvence u istoj boji ({234s} i {234s}). U ruci izgledaju kao uzastopni parovi ({223344s}). Otvoreni čouovi su dozvoljeni!
tutorial.hands.two_identical_sequences.ladder=Viši rangovi u ovoj seriji donose ogromne poene: [Tri identične sekvence](pattern-5.1.3) vredi [hl]120[/] poena, a [Četiri identične sekvence](pattern-5.1.4) donosi limit od [hl]480[/] poena!

# Hands and scoring — Two concealed triplets
tutorial.hands.two_concealed_triplets.title=Dve zatvorene trojke
tutorial.hands.two_concealed_triplets.offer=Igrač Prekoputa je odbacio pločicu ({0}) koja kompletira vašu ruku. Kliknite na [hl]Hu[/] za pobedu!
tutorial.hands.two_concealed_triplets.pattern=[Dve zatvorene trojke](pattern-4.2.1) donosi [hl]5[/] poena za dve trojke formirane potpuno u vašoj zatvorenoj ruci ({333p} i {666s}). Otvoreni pungovi se ne računaju!
tutorial.hands.two_concealed_triplets.ladder=Zatvorene trojke brzo rastu: [Tri zatvorene trojke](pattern-4.2.2) vredi [hl]30[/] poena, a [Četiri zatvorene trojke](pattern-4.2.3) vredi [hl]125[/] poena!

# Hands and scoring — Three similar triplets
tutorial.hands.three_similar_triplets.title=Tri slične trojke
tutorial.hands.three_similar_triplets.offer=Igrač Prekoputa je odbacio pločicu ({0}) koja kompletira vašu ruku. Kliknite na [hl]Hu[/] za pobedu!
tutorial.hands.three_similar_triplets.pattern=[Tri slične trojke](pattern-6.2.2) donosi čak [hl]120[/] poena za trojke sa **istim brojem** u sve tri boje ({555m}, {555p}, {555s}). Otvoreni pungovi su dozvoljeni!
tutorial.hands.three_similar_triplets.small_triplets=Manji oblik, [Male tri slične trojke](pattern-6.2.1), donosi [hl]30[/] poena za **dve trojke i par** sa istim brojem ({555m}, {555p} i {55s}). Početnici ga često previde, a mnogo ga je lakše ostvariti!

# Hands and scoring — One-suit hands
tutorial.hands.one_suit.title=Jednobojne ruke
tutorial.hands.one_suit.offer=Igrač Prekoputa je odbacio pločicu ({0}) koja kompletira vašu ruku u kružnim pločicama i počasnim pločicama. Kliknite na [hl]Hu[/] za pobedu!
tutorial.hands.one_suit.mixed=Držanje pločica iz samo **jedne brojčane boje** uz **počasne pločice** donosi [hl]40[/] poena za [Polučistu ruku](pattern-2.1.1). Otvoreni čouovi i pungovi su dozvoljeni!
tutorial.hands.one_suit.pure=Ako potpuno izbacite počasne pločice, [Čista ruka](pattern-2.1.2) udvostručuje rezultat na [hl]80[/] poena! Svaki set i par tada pripadaju toj jednoj boji.

# Hands and scoring — More patterns
tutorial.hands.more_patterns.title=Još kombinacija
