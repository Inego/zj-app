tutorial.orient.wall.seats=U svakoj ruci, jedan igrač je Istok, sledeći je Jug, pa Zapad, pa Sever.
tutorial.orient.wall.east=Istok deli pločice i prvi igra u toj ruci.
tutorial.orient.wall.deal=Istok započinje bacanjem dve kockice.
