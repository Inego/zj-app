tutorial.orient.tiles.tags_try=U ovoj igri možete uključiti ili isključiti oznake u [Podešavanjima](settings). Ovih trinaest pločica prati to podešavanje — kliknite na vezu i promenite opciju da vidite kako izgleda.
tutorial.orient.numbers.title=Brojevi
