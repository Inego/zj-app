tutorial.orient.wall.title=Izgradnja zida
tutorial.orient.wall.faces=Kompletan skup pločica: tri boje od 1 do 9, plus četiri vetra i tri zmaja — ukupno 34 vrste.
tutorial.orient.wall.copies=Svaka pločica ima četiri primerka — ukupno 136 pločica.
tutorial.orient.wall.drawpile=Zid je poput špila u kartama: početne ruke i vučenje pločica tokom igre dolaze iz njega.
tutorial.orient.wall.ritual=Tokom igre za pravim stolom, slaganje zida predstavlja poseban ritual.
tutorial.orient.wall.facedown=Da bi se izgradio zid, pločice se prvo okreću licem nadole...
tutorial.orient.wall.shuffle=I dobro se promešaju.
tutorial.orient.wall.formed=Zatim se formira zid: četiri strane od po 17 stubaca, visine dve pločice.
