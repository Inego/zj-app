# Notice engine: a notice is stored as a template key plus its
# arguments, and the client fills the template in the player's locale. Mail
# renders these same templates from this English base until server-side i18n.
notice.title=Obaveštenja
notice.empty=Još nema obaveštenja
# {0} player name, {1} their rating, {2} attempt id, {3} your score, {4} their
# score, {5} your rating change, {6} rating before, {7} rating after.
notice.later_play=**{0}** ({1}) je odigrao [hl]{2}[/]. Vi ste ostvarili **{3}**, {0} je ostvario **{4}**. Rejting {5} ({6} → {7}).
# One row of a later-play batch: {0} attempt id, {1} score.
notice.later_play_row=| {0} | {1} |
# {0} new comparisons, {1} attempt count, {2} rating change, {3} rating before,
# {4} rating after; {5} is the batch of digest rows.
notice.digest=**{0}** · **{1}**. Rejting {2} ({3} → {4}).\n\n| Senka rangirana | Vi | Kasnija igra | Rejting |\n|---|---|---|---|\n{5}
# One digest row: {0} attempt id, {1} your score, {2} the later play, {3} rating.
notice.digest_row=| {0} | {1} | {2} | {3} |
# An admin broadcast: {0} the message.
notice.admin={0}
notice.digest.comparisons=Novih poređenja: {0}
notice.digest.challenges=Izazova: {0}
notice.digest.players=Igrača: {0}

