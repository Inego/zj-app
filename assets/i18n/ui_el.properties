tutorial.orient.wall.title=Χτίσιμο του τοίχου
tutorial.orient.wall.faces=Το πλήρες σετ όψεων: τρεις φυλές από 1–9, συν τέσσερις άνεμοι και τρεις δράκοι — 34 συνολικά.
tutorial.orient.wall.copies=Κάθε όψη έχει τέσσερα πλακίδια — 136 συνολικά.
tutorial.orient.wall.drawpile=Ο τοίχος μοιάζει με τη στοίβα τραβήγματος στα χαρτιά: τα αρχικά χέρια και τα τραβήγματα κατά τη διάρκεια του παιχνιδιού προέρχονται από αυτόν.
tutorial.orient.wall.ritual=Όταν παίζετε σε πραγματικό τραπέζι, το χτίσιμο του τοίχου είναι μια ιεροτελεστία.
tutorial.orient.wall.facedown=Για να χτιστεί ο τοίχος, πρώτα γυρίζουν τα πλακίδια ανάποδα...
tutorial.orient.wall.shuffle=Και ανακατεύονται σχολαστικά.
tutorial.orient.wall.formed=Στη συνέχεια σχηματίζεται ο τοίχος: τέσσερις πλευρές από 17 στοίβες, ύψους δύο πλακιδίων.
tutorial.orient.wall.pushed=Οι τοίχοι σπρώχνονται προς τα μέσα ώστε να ενωθούν οι άκρες.
tutorial.orient.wall.seats=Σε κάθε χέρι, ένας παίκτης είναι η Ανατολή, ο επόμενος ο Νότος, μετά η Δύση και μετά ο Βορράς.
tutorial.orient.wall.east=Η Ανατολή είναι ο ντίλερ και ο πρώτος που κάνει κίνηση στο χέρι.
tutorial.orient.wall.deal=Η Ανατολή μοιράζει ρίχνοντας δύο 6-πλευρα ζάρια.
tutorial.orient.wall.dice=Το άθροισμα των ζαριών καθορίζει πού σπάει ο τοίχος.
tutorial.orient.wall.count={0}+{1}={2}. Από το δεξί άκρο του τοίχου της Ανατολής, μετρήστε {2} στοίβες.
tutorial.orient.wall.break=Ο τοίχος σπάει μετά τις μετρημένες στοίβες. Οι στοίβες στα αριστερά μετατοπίζονται αριστερά, ανοίγοντας ένα κενό.
tutorial.orient.wall.take7=Μετρήστε 7 στοίβες στα δεξιά του κενού.
tutorial.orient.wall.dead=Αφήστε τις στην άκρη για να σχηματίσετε τον ξεχωριστό νεκρό τοίχο.
tutorial.orient.wall.dead_out=Αυτά τα 14 πλακίδια δεν τραβιούνται ποτέ, προσθέτοντας αβεβαιότητα προς το τέλος του χεριού.
tutorial.orient.wall.hands=Για να σχηματίσουν τα χέρια τους, οι παίκτες παίρνουν από 2 στοίβες μετά το κενό, αποδομώντας τον τοίχο δεξιόστροφα — τρεις φορές.
tutorial.orient.wall.hands_13=Μετά από αυτό, κάθε παίκτης έχει 3x4 = 12 πλακίδια. Παίρνουν από 1 ακόμα πλακίδιο για να γίνουν 13.
tutorial.orient.wall.east_14=Επειδή η Ανατολή παίζει πρώτη, ξεκινά τη σειρά της παίρνοντας το 14ο πλακίδιο.
tutorial.orient.wall.look_hands=Κάθε παίκτης κοιτάζει το χέρι του...
tutorial.orient.wall.sort_hands=...και το ταξινομεί.
tutorial.orient.wall.east_discard=Τώρα, ο παίκτης της Ανατολής πρέπει να κάνει την πρώτη του κίνηση απορρίπτοντας ένα πλακίδιο.
tutorial.orient.wall.app_table=Σε αυτήν την εφαρμογή, για εξοικονόμηση χώρου, ο ενεργός τοίχος εμφανίζεται απλοποιημένος και ο νεκρός τοίχος δεν εμφανίζεται καθόλου.
tutorial.orient.wall.live_count=Το **69** στο κέντρο είναι ο αριθμός των πλακιδίων που απομένουν στον ενεργό τοίχο.

# Σειρά κινήσεων
tutorial.moves.east_player.title=Παίκτης Ανατολής
tutorial.moves.east_player.four=Υπάρχουν [hl]τέσσερις[/] παίκτες. Για κάθε χέρι, ένας από αυτούς είναι η [hl]Ανατολή[/] (ο ντίλερ). Στη συνέχεια, αριστερόστροφα: [hl]Νότος[/], [hl]Δύση[/] και [hl]Βορράς[/].
tutorial.moves.east_player.pass=Μετά από κάθε χέρι, η ανάθεση των ανέμων περιστρέφεται [hl]αριστερόστροφα[/]. Ο παίκτης που ήταν Νότος γίνεται η νέα Ανατολή.
tutorial.moves.discarding.title=Απόρριψη
tutorial.moves.discarding.east_14=Στην αρχή κάθε χεριού, ο παίκτης που είναι η [hl]Ανατολή[/] (ο Ντίλερ) έχει [hl]14[/] πλακίδια στο χέρι του (σε αντίθεση με τους άλλους 3 παίκτες που έχουν από [hl]13[/] πλακίδια).
tutorial.moves.discarding.east_hu=Εάν αυτά τα 14 πλακίδια σχηματίζουν ένα [hl]νικητήριο χέρι[/], η Ανατολή μπορεί να δηλώσει νίκη ("[hl]Χου![/]") αμέσως — αυτή είναι η [Ευλογία του Ουρανού](pattern-9.4.1).
tutorial.moves.discarding.east_hu_odds=Αν και στατιστικά, η πιθανότητα να συμβεί αυτό είναι [hl]1 στις 328.909[/]. Μπορεί να παίζετε mahjong σε όλη σας τη ζωή και να μην το δείτε ποτέ.
tutorial.moves.discarding.must_discard=Εάν αυτό το χέρι δεν κερδίζει (όπως συμβαίνει συνήθως), η Ανατολή πρέπει να διαλέξει ένα πλακίδιο για [hl]απόρριψη[/], ώστε ο αριθμός των πλακιδίων να επιστρέψει στο 13.
tutorial.moves.discarding.least_useful=Κατά την απόρριψη, προσπαθήστε να ξεφορτωθείτε το λιγότερο χρήσιμο πλακίδιο (αυτό που δεν φαίνεται πολλά υποσχόμενο για μελλοντικούς συνδυασμούς).
tutorial.moves.discarding.others_claim=Οι άλλοι παίκτες μπορούν να [hl]δηλώσουν[/] το απορριφθέν πλακίδιο για να βελτιώσουν το χέρι τους ή ακόμα και να [hl]κερδίσουν[/].
tutorial.moves.counterclockwise.title=Σειρά παιχνιδιού
tutorial.moves.counterclockwise.this_tile=[hl]Κάντε κλικ σε αυτό το πλακίδιο[/] για να το απορρίψετε.
tutorial.moves.counterclockwise.click_callout=Απορρίψτε το
tutorial.moves.counterclockwise.if_nobody=Κανείς δεν το [hl]διεκδίκησε[/], οπότε παρέμεινε απορριμμένο.
tutorial.moves.counterclockwise.the_river=Το [hl]ποτάμι[/] είναι σαν τη στοίβα απορρίψεων στα χαρτιά: τα μη διεκδικηθέντα πλακίδια παραμένουν ανοιχτά μπροστά από τον παίκτη που τα απέρριψε.
tutorial.moves.counterclockwise.to_the_right=Η σειρά μεταβαίνει πάντα στον παίκτη στα [hl]δεξιά[/] αυτού που απέρριψε.
tutorial.moves.counterclockwise.right_next=Είστε η [hl]Ανατολή[/] (κάτω μέρος του τραπεζιού). Ο παίκτης [hl]Δεξιά[/] παίζει μετά — τράβηξε από τον τοίχο και στη συνέχεια θα απορρίψει.
tutorial.moves.counterclockwise.right_discards=Ο παίκτης Δεξιά [hl]απορρίπτει[/] ένα πλακίδιο. Κανείς δεν το διεκδίκησε, οπότε η σειρά πηγαίνει στον παίκτη [hl]Απέναντι[/], ο οποίος τραβάει από τον τοίχο.

# Δηλώσεις (Claiming)
tutorial.claims.click_callout=Επιλέξτε αυτό
tutorial.claims.pung.title=Πουνγκ
tutorial.claims.pung.offer=Ο παίκτης Απέναντι απέρριψε ένα πλακίδιο του οποίου έχετε ήδη ένα [hl]ζεύγος[/] ({0}). [hl]Κάντε κλικ στο Πουνγκ[/] για να συμπληρώσετε μια τριάδα.
tutorial.claims.pung.reveal=Η διεκδίκηση ενός πλακιδίου που απορρίφθηκε από άλλον παίκτη απαιτεί την [hl]αποκάλυψη[/] του σχηματισμένου σετ — εδώ, της [hl]τριάδας[/].
tutorial.claims.pung.must_discard=Τώρα έχετε [hl]14[/] πλακίδια και εφόσον δεν πρόκειται για νικητήριο χέρι, πρέπει να [hl]απορρίψετε[/] ένα πλακίδιο.
tutorial.claims.pung.skips_left=Επειδή το διεκδικήσατε, ο παίκτης [hl]Αριστερά[/] χάνει τη σειρά του — θα είχε [hl]τραβήξει από τον τοίχο[/] στη συνέχεια.
tutorial.claims.pung.third_for_two=Μπορείτε να διεκδικήσετε ένα [hl]τρίτο[/] έχοντας δύο αντίγραφα. Δεν μπορείτε να διεκδικήσετε ένα [hl]δεύτερο[/] έχοντας ένα.
tutorial.claims.last_discard.title=Τελευταία απόρριψη
tutorial.claims.last_discard.only_fresh=Μπορείτε να διεκδικήσετε ένα πλακίδιο [hl]αμέσως μόλις[/] απορριφθεί. Δεν μπορείτε να διεκδικήσετε πλακίδιο που βρίσκεται ήδη στο [hl]ποτάμι[/].
tutorial.claims.last_discard.callout=Αυτό το πλακίδιο απορρίφθηκε τελευταίο
tutorial.claims.chow.title=Τσόου
tutorial.claims.chow.offer=Ο παίκτης Αριστερά απέρριψε ένα πλακίδιο ({0}) που συμπληρώνει μια [hl]σειρά[/] με δύο πλακίδια που έχετε ήδη. [hl]Κάντε κλικ στο Τσόου[/] για να την ολοκληρώσετε.
tutorial.claims.chow.reveal=Η διεκδίκηση ενός πλακιδίου που απορρίφθηκε από άλλον παίκτη απαιτεί την [hl]αποκάλυψη[/] του σχηματισμένου σετ — εδώ, της [hl]σειράς[/].
tutorial.claims.chow.must_discard=Τώρα έχετε [hl]14[/] πλακίδια και εφόσον δεν πρόκειται για νικητήριο χέρι, πρέπει να [hl]απορρίψετε[/] ένα πλακίδιο.
tutorial.claims.chow.only_left=Μπορείτε να κάνετε τσόου [hl]μόνο[/] από τον παίκτη [hl]Αριστερά[/] (τον αμέσως προηγούμενο παίκτη). Απορρίψεις από Απέναντι ή Δεξιά δεν μπορούν να γίνουν τσόου.
tutorial.claims.hu.title=Χου
tutorial.claims.hu.offer=Εδώ, το νικητήριο χέρι σας είναι σχεδόν έτοιμο και περιμένετε ένα ζεύγος. Ο παίκτης Απέναντι μόλις απέρριψε το πλακίδιο που χρειάζεστε ({0}). [hl]Κάντε κλικ στο Χου[/] για να το διεκδικήσετε.
tutorial.claims.hu.not_a_set=Όταν ένα απορριφθέν πλακίδιο συμπληρώνει ένα [hl]νικητήριο χέρι[/], μπορείτε να το διεκδικήσετε. [hl]Δεν[/] χρειάζεται να συμπληρώνει ένα [hl]σετ[/] — εδώ συμπλήρωσε το [hl]ζεύγος[/].
tutorial.claims.hu.breakdown=Εάν ο πίνακας ανάλυσης βαθμολογίας εμποδίζει την προβολή του τραπεζιού, μπορείτε να τον [hl]σύρετε[/] παράμερα ή να τον [hl]συμπτύξετε και να τον αναπτύξετε[/] χρησιμοποιώντας το κουμπί με το βέλος. Δοκιμάστε να τον σύρετε ή να τον συμπτύξετε τώρα!
tutorial.claims.priority.title=Προτεραιότητα διεκδίκησης
tutorial.claims.priority.conflict=Ο παίκτης Αριστερά μόλις απέρριψε το {3s}. Κρατάτε τα {12s} και θα μπορούσατε να κάνετε **Τσόου**, αλλά ο παίκτης Δεξιά κρατά ένα ζεύγος από {3s}. Δοκιμάστε να δηλώσετε [hl]Τσόου[/] για να δείτε τι θα συμβεί!
tutorial.claims.priority.pung_beats_chow=Αν και δηλώσατε Τσόου, το [hl]Πουνγκ κερδίζει το Τσόου[/]! Η δήλωση του παίκτη Δεξιά υπερισχύει — ο παίκτης Δεξιά παίρνει το πλακίδιο και η σειρά σας παραλείπεται!
tutorial.claims.priority.hierarchy=Η καθολική ιεραρχία δηλώσεων είναι: Η [hl]Νίκη (Χου)[/] κερδίζει το [hl]Πουνγκ & Κονγκ[/], τα οποία κερδίζουν το [hl]Τσόου[/].
tutorial.claims.priority.multi_win=Εάν πολλοί παίκτες δηλώσουν [hl]Χου[/] στην ίδια απόρριψη, ο παίκτης που βρίσκεται πιο κοντά στον παίκτη που απέρριψε κατά τη σειρά παιχνιδιού κερδίζει (χωρίς διπλές νίκες).

# Κονγκ — Ανοιχτό κονγκ
tutorial.kongs.melded.title=Ανοιχτό Κονγκ
tutorial.kongs.melded.offer=Ο παίκτης Απέναντι απέρριψε ένα πλακίδιο ({0}) που ταιριάζει με την κρυφή τριάδα σας. Κάντε κλικ στο [hl]Κονγκ[/] για να δηλώσετε καρέ (τετράδα)!
tutorial.kongs.melded.reveal=Η διεκδίκηση ενός απορριφθέντος 4ου πλακιδίου αποκαλύπτει την τετράδα στο τραπέζι ως [hl]ανοιχτό κονγκ[/].
tutorial.kongs.melded.one_kong=Ο σχηματισμός ενός κονγκ δίνει [hl]5[/] πόντους για [Ένα Κονγκ](pattern-4.3.1) και κλιμακώνεται με πολλαπλά κονγκ.
tutorial.kongs.melded.compensation=Επειδή ένα κονγκ έχει 4 πλακίδια, τραβάτε ένα [hl]συμπληρωματικό πλακίδιο[/] από την ουρά του τοίχου για να διατηρήσετε έγκυρο μέγεθος χεριού.
tutorial.kongs.melded.must_discard=Αφού τραβήξετε το συμπληρωματικό πλακίδιο, πρέπει να [hl]απορρίψετε[/] για να ολοκληρώσετε τη σειρά σας.
tutorial.kongs.melded.already_melded=Δεν μπορείτε να διεκδικήσετε απορριφθέν 4ο πλακίδιο εάν η τριάδα σας είναι ήδη εκτεθειμένη στο τραπέζι ως ανοιχτό [hl]Πουνγκ[/].

# Κονγκ — Κρυφό κονγκ
tutorial.kongs.concealed.title=Κρυφό Κονγκ
tutorial.kongs.concealed.offer=Μόλις πήρατε ένα πλακίδιο από τον τοίχο και κρατάτε και τα τέσσερα αντίγραφα του {0}. Κάντε κλικ στη [hl]Δήλωση κρυφού Κονγκ[/]!
tutorial.kongs.concealed.arrangement=Παρατηρήστε τη διάταξη: τα δύο **ακραία πλακίδια είναι κλειστά** (γυρισμένα ανάποδα) για να δείξουν ότι παραμένει κρυφό, ενώ τα μεσαία πλακίδια αποδεικνύουν το σετ.
tutorial.kongs.concealed.scoring=Στο Zung Jung, παραμένει **κρυφό** για τη βαθμολογία — το [Κρυφό χέρι](pattern-1.2) παραμένει έγκυρο!
tutorial.kongs.concealed.compensation=Τραβάτε ένα [hl]συμπληρωματικό πλακίδιο[/] από την ουρά του τοίχου και στη συνέχεια απορρίπτετε κανονικά για να ολοκληρώσετε τη σειρά σας.

# Κονγκ — Αναβαθμισμένο κονγκ
tutorial.kongs.promoted.title=Αναβαθμισμένο Κονγκ
tutorial.kongs.promoted.offer=Έχετε ένα ανοιχτό πουνγκ από {0} και μόλις τραβήξατε το 4ο πλακίδιο! Κάντε κλικ στην [hl]Αναβάθμιση σε Κονγκ[/] για να αναβαθμίσετε τον συνδυασμό σας.
tutorial.kongs.promoted.upgraded=Το τέταρτο πλακίδιο ενώνεται με το ανοιχτό πουνγκ σας, αναβαθμίζοντάς το σε ανοιχτό κονγκ και δίνοντας δικαίωμα για [Ένα Κονγκ](pattern-4.3.1).
tutorial.kongs.promoted.robbing=Προειδοποίηση: Αυτή είναι η μόνη στιγμή που οι αντίπαλοι μπορούν να κάνουν [Κλοπή του Κονγκ](pattern-9.3) εάν αυτό το πλακίδιο συμπληρώνει το νικητήριο χέρι τους!
tutorial.kongs.promoted.compensation=Εάν είστε ασφαλείς, τραβάτε ένα [hl]συμπληρωματικό πλακίδιο[/] από την ουρά του τοίχου και απορρίπτετε για να ολοκληρώσετε τη σειρά σας.

# Χέρια και βαθμολογία — Νίκη σε ένα χέρι
tutorial.hands.win.title=Νίκη σε ένα χέρι
tutorial.hands.win.hand_size=Οι παίκτες κρατούν κανονικά [hl]13[/] πλακίδια. Κρατάτε [hl]14[/] μόνο προσωρινά κατά το τράβηγμα ή τη δήλωση. Εάν δεν κερδίσετε, πρέπει να απορρίψετε επιστρέφοντας στα 13.
tutorial.hands.win.patterns=Για να κερδίσετε ένα χέρι, τα πλακίδια στο χέρι σας πρέπει να σχηματίζουν συγκεκριμένους συνδυασμούς.
tutorial.hands.win.all_in_groups=Κανονικά, σε ένα νικητήριο χέρι, κάθε πλακίδιο πρέπει να ανήκει σε ένα από τα τέσσερα [hl]σετ[/] ή στο μοναδικό [hl]ζεύγος[/]. Αυτό αντιστοιχεί συνήθως σε [hl]14[/] πλακίδια.
tutorial.hands.win.set_kinds=Ένα σετ είναι μια [hl]σειρά[/], μια [hl]τριάδα[/] ή ένα [hl]κονγκ[/].
tutorial.hands.win.kong_size=Εδώ, ένα από τα τέσσερα σετ είναι ένα [hl]κονγκ[/]. Λόγω αυτού του κονγκ, το χέρι έχει [hl]15[/] πλακίδια, όχι 14.

# Χέρια και βαθμολογία — Χέρι χωρίς συνδυασμούς
tutorial.hands.chicken.title=Χέρι χωρίς συνδυασμούς
tutorial.hands.chicken.one=Εάν δεν ισχύει ειδική βαθμολογία για αυτό το χέρι, ονομάζεται [hl]χέρι χωρίς συνδυασμούς[/] και αξίζει [hl]1[/] πόντο.
tutorial.hands.chicken.tournament=Σε τουρνουά, τα χέρια χωρίς συνδυασμούς μπορεί να [hl]απαγορεύονται[/] — το χέρι πρέπει να αξίζει τουλάχιστον [hl]5[/] πόντους για να θεωρηθεί νικητήριο.
tutorial.hands.chicken.next=Στα επόμενα μαθήματα, θα καλύψουμε τους βασικούς συνδυασμούς που επιτρέπουν σε ένα χέρι να συγκεντρώσει [hl]5[/] ή περισσότερους πόντους.

# Χέρια και βαθμολογία — Κρυφό χέρι
tutorial.hands.concealed.title=Κρυφό χέρι
tutorial.hands.concealed.offer=Ο παίκτης Απέναντι απέρριψε ένα πλακίδιο ({0}) που συμπληρώνει μια σειρά με δύο πλακίδια που έχετε ήδη. Δεν μπορείτε να κάνετε Τσόου από τον Απέναντι — αλλά επειδή συμπληρώνει το χέρι σας, μπορείτε να δηλώσετε [hl]Χου 5[/]! Κάντε κλικ στο [hl]Χου[/] για να κερδίσετε.
tutorial.hands.concealed.points=Κάθε αντίπαλος πληρώνει τη βαθμολογία του χεριού στον νικητή. Για ένα χέρι [hl]5[/] πόντων, και οι τρεις πληρώνουν από 5 — αποφέροντας σας [hl]3×[/] τη βαθμολογία του χεριού ([hl]+15[/] πόντους)!
tutorial.hands.concealed.concealed_rule=Ένα χέρι είναι [hl]κρυφό[/] εάν δεν έχετε κάνει ανοιχτές δηλώσεις (όπως **Τσόου** ή **Πουνγκ**) πριν δηλώσετε τη νίκη.
tutorial.hands.concealed.discard_win=Αν και διεκδικήσατε την απόρριψη του Απέναντι για να συμπληρώσετε αυτήν την τελική σειρά, η νίκη με απόρριψη [hl]επιτρέπεται[/] — μόνο οι ανοιχτοί συνδυασμοί που γίνονται *πριν* από τη νίκη ακυρώνουν το Κρυφό χέρι.
tutorial.hands.concealed.kongs=Η δήλωση οποιουδήποτε [hl]Τσόου[/], [hl]Πουνγκ[/] ή [hl]Κονγκ[/] νωρίτερα στο χέρι αποκαλύπτει αυτό το σετ στο τραπέζι, καθιστώντας το χέρι σας ανοιχτό και ακυρώνοντας αυτόν τον συνδυασμό.

# Χέρια και βαθμολογία — Όλα σειρές
tutorial.hands.all_sequences.title=Όλα σειρές
tutorial.hands.all_sequences.offer=Ο παίκτης Απέναντι απέρριψε ένα πλακίδιο ({0}) που συμπληρώνει την τέταρτη σειρά σας. Αν και το χέρι σας είναι ανοιχτό από προηγούμενο Τσόου, το κουμπί προσφέρει [hl]Χου 5[/]! Κάντε κλικ στο [hl]Χου[/] για να κερδίσετε.
tutorial.hands.all_sequences.points=Ένα χέρι όπου και τα τέσσερα σετ είναι σειρές (χωρίς τριάδες ή κονγκ) δίνει [hl]5[/] πόντους για το [Όλα σειρές](pattern-1.1).
tutorial.hands.all_sequences.open_allowed=Σε αντίθεση με το Κρυφό χέρι, το [Όλα σειρές](pattern-1.1) επιτρέπει ανοιχτά Τσόου. Ακόμη και με ανοιχτό συνδυασμό στο τραπέζι, το να έχετε τέσσερις σειρές εξακολουθεί να δίνει 5 πόντους.
tutorial.hands.all_sequences.unrestricted=Οποιοδήποτε ζεύγος επιτρέπεται — ακόμα και τιμές δράκων ή ανέμων — και οποιοσδήποτε τύπος αναμονής πληροί τις προϋποθέσεις.

# Χέρια και βαθμολογία — Χωρίς άκρα
tutorial.hands.no_terminals.title=Χωρίς άκρα
tutorial.hands.no_terminals.offer=Ο παίκτης Απέναντι απέρριψε ένα πλακίδιο ({0}) που συμπληρώνει το νικητήριο χέρι σας. Κάθε πλακίδιο στο χέρι σας είναι ένας απλός αριθμός από το 2 έως το 8. Κάντε κλικ στο [hl]Χου[/] για να κερδίσετε.
tutorial.hands.no_terminals.terminals_def=Στις τρεις αριθμητικές φυλές, τα ακραία πλακίδια — **1** και **9** ({1m}, {9s}) — ονομάζονται [hl]άκρα[/]. Τα εσωτερικά πλακίδια από **2** έως **8** ονομάζονται [hl]απλά[/]. Οι τιμές δεν είναι τίποτα από τα δύο.
tutorial.hands.no_terminals.points=Ο συνδυασμός [Χωρίς άκρα](pattern-1.3) αξίζει [hl]5[/] πόντους. Κάθε πλακίδιο στο χέρι — και τα τέσσερα σετ και το ζεύγος — πρέπει να είναι [hl]απλό[/], χωρίς άκρα και χωρίς τιμές.
tutorial.hands.no_terminals.flexibility=Παρατηρήστε ότι αυτό το χέρι έχει μια ανοιχτή τριάδα ({5p}{5p}{5p}), οπότε δεν είναι ούτε κρυφό ούτε όλες σειρές. Αλλά επειδή κάθε πλακίδιο είναι απλό, πληροί τις προϋποθέσεις για [hl]Χωρίς άκρα (5 πόντοι)[/]!
tutorial.hands.no_terminals.stacking=Το Χωρίς άκρα μπορεί επίσης να [hl]συνδυαστεί[/] με άλλους συνδυασμούς όπως [Όλα σειρές](pattern-1.1) ή [Κρυφό χέρι](pattern-1.2) όταν ισχύουν, φτάνοντας τους 10 ή 15 πόντους.

# Χέρια και βαθμολογία — Κονγκ
tutorial.hands.kongs.title=Κονγκ
tutorial.hands.kongs.offer=Ο παίκτης Απέναντι απέρριψε ένα πλακίδιο ({0}) που συμπληρώνει το νικητήριο χέρι σας. Έχετε ήδη δύο ανοιχτά κονγκ στο τραπέζι. Κάντε κλικ στο [hl]Χου[/] για να κερδίσετε.
tutorial.hands.kongs.two_kongs=Όπως είδαμε νωρίτερα, το [Ένα Κονγκ](pattern-4.3.1) δίνει [hl]5[/] πόντους. Τα **δύο κονγκ** ανεβάζουν τη βαθμολογία στους [hl]20[/] πόντους για [Δύο Κονγκ](pattern-4.3.2)!
tutorial.hands.kongs.hand_size=Επειδή κάθε κονγκ απαιτεί 4 πλακίδια αντί για 3 και τραβάει ένα συμπληρωματικό πλακίδιο, αυτό το νικητήριο χέρι έχει [hl]16[/] πλακίδια αντί για τα συνηθισμένα 14.
tutorial.hands.kongs.ladder=Υψηλότεροι συνδυασμοί κονγκ ανεβαίνουν απότομα: [Τρία Κονγκ](pattern-4.3.3) δίνουν [hl]120[/] πόντους, και [Τέσσερα Κονγκ](pattern-4.3.4) φτάνουν το όριο των [hl]480[/] πόντων!

# Χέρια και βαθμολογία — Τιμή αξίας
tutorial.hands.value_honor.title=Τιμή αξίας
tutorial.hands.value_honor.offer=Ο παίκτης Απέναντι απέρριψε ένα πλακίδιο ({0}) που συμπληρώνει το χέρι σας. Η ανοιχτή τριάδα Κόκκινων δράκων κάνει αυτό το χέρι να αξίζει [hl]Χου 10[/]! Κάντε κλικ στο [hl]Χου[/] για να κερδίσετε.
tutorial.hands.value_honor.dragons=Μια τριάδα ή κονγκ μιας [hl]τιμής αξίας[/] αξίζει [hl]10[/] πόντους ([Τιμή αξίας](pattern-3.1)). Οποιοσδήποτε από τους τρεις δράκους — **Κόκκινος** ({C}), **Πράσινος** ({F}) ή **Λευκός** ({P}) — είναι πάντα τιμή αξίας για κάθε παίκτη.
tutorial.hands.value_honor.seat_winds=Ο **άνεμος της θέσης σας** (όπως το {E} για τη θέση της Ανατολής) είναι επίσης τιμή αξίας. Οι άνεμοι των άλλων τριών θέσεων ("φιλοξενούμενοι άνεμοι") δεν δίνουν πόντους. Στο Zung Jung, **δεν υπάρχει κυρίαρχος άνεμος γύρου**.
tutorial.hands.value_honor.stacking=Η Τιμή αξίας μετρά [hl]σωρευτικά ανά σετ[/]: η κατοχή δύο έγκυρων τριάδων δίνει [hl]20[/] πόντους. Οι ανοιχτοί συνδυασμοί επιτρέπονται, αλλά τα **ζεύγη** δεν δίνουν ποτέ πόντους — μετρούν μόνο οι τριάδες και τα κονγκ.

# Χέρια και βαθμολογία — Όλα τριάδες
tutorial.hands.all_triplets.title=Όλα τριάδες
tutorial.hands.all_triplets.offer=Ο παίκτης Απέναντι απέρριψε ένα πλακίδιο ({0}) που συμπληρώνει το χέρι σας σε τέσσερις τριάδες και ένα ζεύγος. Κάντε κλικ στο [hl]Χου[/] για να κερδίσετε!
tutorial.hands.all_triplets.pattern=Ο συνδυασμός [Όλα τριάδες](pattern-4.1) απαιτεί τέσσερις τριάδες (ή κονγκ) και ένα ζεύγος, χωρίς σειρές. Τα ανοιχτά πουνγκ επιτρέπονται και ο συνδυασμός απονέμει [hl]30[/] πόντους!
tutorial.hands.all_triplets.settlement_cap=Σε νίκη με απόρριψη άνω των 25 πόντων, οι μη απορρίψαντες [hl]έχουν ανώτατο όριο 25 πόντων[/] (Αριστερά/Δεξιά πληρώνουν [hl]-25[/]). Αυτός που απέρριψε καλύπτει και τις δύο διαφορές: 30 + 5 + 5 = **40** ([hl]-40[/])!
tutorial.hands.all_triplets.self_draw=Εξακολουθείτε να λαμβάνετε τους πλήρεις **90 πόντους** (3 \u00d7 30). Σε **αυτο-τράβηγμα**, δεν υπάρχει παίκτης που απέρριψε, οπότε και οι τρεις αντίπαλοι πληρώνουν τους πλήρεις 30 πόντους.

# Χέρια και βαθμολογία — Ευθεία εννέα πλακιδίων
tutorial.hands.nine_tile_straight.title=Ευθεία εννέα πλακιδίων
tutorial.hands.nine_tile_straight.offer=Ο παίκτης Απέναντι απέρριψε ένα πλακίδιο ({0}) που συμπληρώνει το χέρι σας σε ευθεία 1 έως 9 στους χαρακτήρες. Κάντε κλικ στο [hl]Χου[/] για να κερδίσετε!
tutorial.hands.nine_tile_straight.pattern=Ο συνδυασμός [Ευθεία εννέα πλακιδίων](pattern-7.1) αξίζει [hl]40[/] πόντους! Απαιτεί τρεις σειρές που καλύπτουν το **1 έως 9 σε μία μόνο φυλή** ({1m} έως {9m}). Τα ανοιχτά τσόου επιτρέπονται.
tutorial.hands.nine_tile_straight.composition=Τα υπόλοιπα 5 πλακίδια μπορούν να είναι οποιοδήποτε έγκυρο σετ και ζεύγος σε οποιαδήποτε φυλή. Εδώ, μια τριάδα {555p} και ένα ζεύγος {99s} ολοκληρώνουν το νικητήριο χέρι σας των 14 πλακιδίων.
tutorial.hands.nine_tile_straight.settlement=Με χέρι 40 πόντων, οι μη απορρίψαντες έχουν όριο [hl]-25[/]. Ο Απέναντι καλύπτει τους 40 του συν τις δύο διαφορές των 15 πόντων ([hl]-70[/]), αποφέροντας σας [hl]+120[/] πόντους (3 \u00d7 40)!

# Χέρια και βαθμολογία — Επτά ζεύγη
tutorial.hands.seven_pairs.title=Επτά ζεύγη
tutorial.hands.seven_pairs.offer=Ο παίκτης Απέναντι απέρριψε ένα πλακίδιο ({0}) που συμπληρώνει το χέρι σας σε επτά ζεύγη. Κάντε κλικ στο [hl]Χου[/] για να κερδίσετε!
tutorial.hands.seven_pairs.pattern=Όλα τα νικητήρια χέρια μέχρι τώρα αποτελούνταν από 4 σετ και 1 ζεύγος. Τα [Επτά ζεύγη](pattern-10.2) είναι ένα [hl]ακανόνιστο χέρι[/] — σπάει αυτόν τον κανόνα συμπληρώνοντας **επτά ζεύγη** για [hl]30[/] πόντους!
tutorial.hands.seven_pairs.concealed_only=Τα Επτά ζεύγη πρέπει να είναι [hl]πλήρως κρυφά[/]. Δεν μπορείτε να καλέσετε Τσόου, Πουνγκ ή Κονγκ — όλα τα ζεύγη πρέπει να τραβηχτούν από τον τοίχο. Μπορείτε, ωστόσο, να διεκδικήσετε το τελικό πλακίδιο στην απόρριψη αντιπάλου για να συμπληρώσετε το 7ο ζεύγος σας!
tutorial.hands.seven_pairs.four_of_a_kind=Η αναμονή στα Επτά ζεύγη είναι πάντα [hl]αναμονή ενός πλακιδίου[/] για το 7ο ζεύγος σας. Στο Zung Jung, η κατοχή και των **τεσσάρων αντιγράφων** του ίδιου πλακιδίου (χωρίς δήλωση κονγκ) υπολογίζεται νόμιμα ως **δύο ζεύγη**.

# Χέρια και βαθμολογία — Δύο ίδιες σειρές
tutorial.hands.two_identical_sequences.title=Δύο ίδιες σειρές
tutorial.hands.two_identical_sequences.offer=Ο παίκτης Απέναντι απέρριψε ένα πλακίδιο ({0}) που συμπληρώνει τη δεύτερη ίδια σειρά σας. Κάντε κλικ στο [hl]Χου[/] για να κερδίσετε!
tutorial.hands.two_identical_sequences.pattern=Το [Δύο ίδιες σειρές](pattern-5.1.1) δίνει [hl]10[/] πόντους για δύο πανομοιότυπες σειρές στην ίδια φυλή ({234s} και {234s}). Στο χέρι μοιάζουν με διαδοχικά ζεύγη ({223344s}). Τα ανοιχτά τσόου επιτρέπονται!
tutorial.hands.two_identical_sequences.ladder=Υψηλότερα επίπεδα σε αυτή τη σειρά δίνουν τεράστιους πόντους: [Τρεις ίδιες σειρές](pattern-5.1.3) δίνουν [hl]120[/] πόντους, και [Τέσσερις ίδιες σειρές](pattern-5.1.4) φτάνουν το όριο των [hl]480[/] πόντων!

# Χέρια και βαθμολογία — Δύο κρυφές τριάδες
tutorial.hands.two_concealed_triplets.title=Δύο κρυφές τριάδες
tutorial.hands.two_concealed_triplets.offer=Ο παίκτης Απέναντι απέρριψε ένα πλακίδιο ({0}) που συμπληρώνει το χέρι σας. Κάντε κλικ στο [hl]Χου[/] για να κερδίσετε!
tutorial.hands.two_concealed_triplets.pattern=Το [Δύο κρυφές τριάδες](pattern-4.2.1) δίνει [hl]5[/] πόντους για δύο τριάδες που σχηματίστηκαν εξ ολοκλήρου στο κρυφό σας χέρι ({333p} και {666s}). Τα ανοιχτά πουνγκ δεν πληρούν τις προϋποθέσεις!
tutorial.hands.two_concealed_triplets.ladder=Οι κρυφές τριάδες κλιμακώνονται απότομα: [Τρεις κρυφές τριάδες](pattern-4.2.2) δίνουν [hl]30[/] πόντους, και [Τέσσερις κρυφές τριάδες](pattern-4.2.3) δίνουν [hl]125[/] πόντους!

# Χέρια και βαθμολογία — Τρεις παρόμοιες τριάδες
tutorial.hands.three_similar_triplets.title=Τρεις παρόμοιες τριάδες
tutorial.hands.three_similar_triplets.offer=Ο παίκτης Απέναντι απέρριψε ένα πλακίδιο ({0}) που συμπληρώνει το χέρι σας. Κάντε κλικ στο [hl]Χου[/] για να κερδίσετε!
tutorial.hands.three_similar_triplets.pattern=Το [Τρεις παρόμοιες τριάδες](pattern-6.2.2) δίνει [hl]120[/] πόντους για τριάδες του **ίδιου αριθμού** και στις τρεις φυλές ({555m}, {555p}, {555s}). Τα ανοιχτά πουνγκ επιτρέπονται!
tutorial.hands.three_similar_triplets.small_triplets=Η μικρότερη μορφή, [Μικρές τρεις παρόμοιες τριάδες](pattern-6.2.1), δίνει [hl]30[/] πόντους για **δύο τριάδες και ένα ζεύγος** του ίδιου αριθμού ({555m}, {555p} και {55s}). Οι αρχάριοι συχνά την παραβλέπουν, αλλά είναι πολύ πιο ρεαλιστικό να επιτευχθεί!

# Χέρια και βαθμολογία — Χέρια μίας φυλής
tutorial.hands.one_suit.title=Χέρια μίας φυλής
tutorial.hands.one_suit.offer=Ο παίκτης Απέναντι απέρριψε ένα πλακίδιο ({0}) που συμπληρώνει το χέρι σας σε κύκλους και τιμές. Κάντε κλικ στο [hl]Χου[/] για να κερδίσετε!
tutorial.hands.one_suit.mixed=Η κατοχή πλακιδίων από μόνο **μία αριθμητική φυλή** (με πορτοκαλί) μαζί με **τιμές** (με μπλε) δίνει [hl]40[/] πόντους για [Μικτή μία φυλή](pattern-2.1.1). Τα ανοιχτά τσόου και πουνγκ επιτρέπονται!
tutorial.hands.one_suit.pure=Εάν εξαλείψετε εντελώς τα πλακίδια τιμών, η [Καθαρή μία φυλή](pattern-2.1.2) διπλασιάζει τη βαθμολογία στους [hl]80[/] πόντους! Κάθε σετ και το ζεύγος ανήκουν πλέον σε αυτήν τη μοναδική φυλή.

# Χέρια και βαθμολογία — Περισσότεροι συνδυασμοί
tutorial.hands.more_patterns.title=Περισσότεροι συνδυασμοί
tutorial.hands.more_patterns.rarer=Έχουμε καλύψει τους βασικούς συνδυασμούς. Πολλά πιο σπάνια χέρια — όπως σειρές δράκων, χέρια ανέμων και οριακά χέρια — περιγράφονται λεπτομερώς στον [Οδηγό](reference).
tutorial.hands.more_patterns.practice=Μπορείτε να συμβουλευτείτε τον [Οδηγό](reference) ανά πάσα στιγμή από το μενού του παιχνιδιού για να ελέγξετε κανόνες συνδυασμών και αξίες βαθμολογίας. Καλό παιχνίδι!

