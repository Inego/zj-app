tutorial.orient.wall.dead_out=Эти 14 костей никогда не берутся, создавая неопределённость ближе к концу раздачи.
tutorial.orient.wall.hands=Для набора рук игроки берут по 2 стопки после разрыва, разбирая стену по часовой стрелке — три круга.
tutorial.orient.wall.hands_13=После этого у каждого игрока 3x4 = 12 костей. Они берут ещё по 1 кости, получая 13.
tutorial.orient.wall.east_14=Так как Восток ходит первым, он начинает свой ход с получения 14-й кости.
tutorial.orient.wall.look_hands=Каждый игрок смотрит в свою руку...
tutorial.orient.wall.sort_hands=...и сортирует её.
tutorial.orient.wall.east_discard=Теперь Восток должен сделать первый ход, сбросив кость.
tutorial.orient.wall.app_table=В этом приложении ради экономии места живая стена показана упрощённо, а мёртвая не отображается вовсе.
tutorial.orient.wall.live_count=Число **69** в центре — это количество оставшихся костей в живой стене.

# Move order
tutorial.moves.east_player.title=Игрок Востока
tutorial.moves.east_player.four=В игре участвуют [hl]четверо[/] игроков. В каждой раздаче один из них — [hl]Восток[/] (раздающий). Далее против часовой стрелки: [hl]Юг[/], [hl]Запад[/] и [hl]Север[/].
tutorial.moves.east_player.pass=После каждой раздачи распределение ветров смещается [hl]против часовой стрелки[/]. Игрок, бывший Югом, становится новым Востоком.
tutorial.moves.discarding.title=Сброс кости
tutorial.moves.discarding.east_14=В начале любой раздачи у [hl]Востока[/] (раздающего) в руке [hl]14[/] костей (в отличие от остальных трёх игроков, у которых по [hl]13[/] костей).
tutorial.moves.discarding.east_hu=Если эти 14 костей сразу образуют [hl]выигрышную руку[/], Восток может сразу объявить победу («[hl]Ху![/]») — это [Благословение Небес](pattern-9.4.1).
tutorial.moves.discarding.east_hu_odds=Впрочем, статистически шанс этого составляет [hl]1 к 328 909[/]. Можно играть в маджонг всю жизнь и ни разу этого не увидеть.
tutorial.moves.discarding.must_discard=Если рука не выигрышная (что бывает почти всегда), Восток должен выбрать и [hl]сбросить[/] одну из костей, вернув размер руки к 13.
tutorial.moves.discarding.least_useful=При сбросе старайтесь избавиться от наименее полезной кости (той, из которой вряд ли сложатся комбинации).
tutorial.moves.discarding.others_claim=Остальные игроки могут [hl]забрать[/] сброшенную кость объявлением, чтобы улучшить руку или даже [hl]выиграть[/].
tutorial.moves.counterclockwise.title=Очерёдность хода
tutorial.moves.counterclockwise.this_tile=[hl]Нажмите на эту кость[/], чтобы сбросить её.
tutorial.moves.counterclockwise.click_callout=Сбросьте её
tutorial.moves.counterclockwise.if_nobody=Никто не стал [hl]забирать[/] её, поэтому она осталась в сбросе.
tutorial.moves.counterclockwise.the_river=[hl]Река[/] устроена как стопка сброса в картах: невостребованные кости лежат открытыми перед сбросившим их игроком.
tutorial.moves.counterclockwise.to_the_right=Ход всегда переходит к игроку [hl]справа[/] от сбросившего.
tutorial.moves.counterclockwise.right_next=Вы — [hl]Восток[/] (внизу стола). Следующим ходит игрок [hl]Справа[/]: он взял кость со стены и теперь должен сбросить.
tutorial.moves.counterclockwise.right_discards=Игрок Справа [hl]сбрасывает[/] кость. Никто не забрал её, поэтому ход переходит к игроку [hl]Напротив[/], который берёт кость со стены.

# Claiming
tutorial.claims.click_callout=Выберите это
tutorial.claims.pung.title=Панг
tutorial.claims.pung.offer=Игрок Напротив сбросил кость, [hl]пара[/] к которой у вас уже есть ({0}). Нажмите [hl]Панг[/], чтобы собрать тройку.
tutorial.claims.pung.reveal=Если забрать кость со сброса другого игрока, собранный сет нужно [hl]раскрыть[/] — в данном случае [hl]тройку[/].
tutorial.claims.pung.must_discard=Теперь у вас [hl]14[/] костей, и поскольку рука ещё не выигрышная, вы должны [hl]сбросить[/] кость.
tutorial.claims.pung.skips_left=Так как вы забрали кость, игрок [hl]Слева[/] пропускает свой ход — а ведь именно он должен был [hl]брать кость со стены[/].
tutorial.claims.pung.third_for_two=Со сброса можно забрать [hl]третью[/] кость к двум в руке. Забрать [hl]вторую[/] к одной нельзя.
tutorial.claims.last_discard.title=Последний сброс
tutorial.claims.last_discard.only_fresh=Забрать кость можно только [hl]сразу после[/] её сброса. Нельзя забрать кость, которая уже лежит в [hl]реке[/].
tutorial.claims.last_discard.callout=Эта кость была сброшена последней
# Claiming — Chow
tutorial.claims.chow.title=Чоу
tutorial.claims.chow.offer=Игрок Слева сбросил кость ({0}), завершающую [hl]последовательность[/] с двумя вашими костями. Нажмите [hl]Чоу[/], чтобы собрать её.
tutorial.claims.chow.reveal=Если забрать кость со сброса другого игрока, собранный сет нужно [hl]раскрыть[/] — здесь это [hl]последовательность[/].
tutorial.claims.chow.must_discard=Теперь у вас [hl]14[/] костей, и поскольку рука ещё не выигрышная, вы должны [hl]сбросить[/] кость.
tutorial.claims.chow.only_left=Объявить чоу можно [hl]только[/] со сброса игрока [hl]Слева[/] (ходящего перед вами). Сбросы игроков Напротив или Справа забрать в чоу нельзя.
tutorial.claims.hu.title=Ху
tutorial.claims.hu.offer=Ваша выигрышная рука почти собрана, не хватает только пары. Игрок Напротив только что сбросил нужную кость ({0}). Нажмите [hl]Ху[/], чтобы забрать её.
tutorial.claims.hu.not_a_set=Когда сброшенная кость завершает [hl]выигрышную руку[/], её можно забрать. Она [hl]не[/] обязана дополнять [hl]сет[/] — здесь она завершила [hl]пару[/].
tutorial.claims.hu.breakdown=Если панель подсчёта очков закрывает обзор стола, её можно [hl]перетащить[/] в сторону либо [hl]свернуть и развернуть[/] с помощью кнопки-шеврона. Попробуйте переместить или свернуть её прямо сейчас!

# Claiming — Claim priority
tutorial.claims.priority.title=Приоритет объявлений
tutorial.claims.priority.conflict=Игрок Слева только что сбросил {3s}. У вас на руках {12s}, и вы могли бы объявить **Чоу**, но у игрока Справа пара {3s}. Попробуйте объявить [hl]Чоу[/] и посмотрите, что произойдёт!
tutorial.claims.priority.pung_beats_chow=Хотя вы нажали Чоу, [hl]Панг старше Чоу[/]! Объявление игрока Справа отменяет ваше: Справа забирает кость, а ваш ход пропускается!
tutorial.claims.priority.hierarchy=Общий приоритет объявлений: [hl]Выигрыш (Ху)[/] старше [hl]Панга и Конга[/], а они оба старше [hl]Чоу[/].
tutorial.claims.priority.multi_win=Если несколько игроков заявляют [hl]Ху[/] на один и тот же сброс, выигрывает ближайший к сбросившему по очерёдности хода (двойных выигрышей нет).

# Kongs — Big exposed kong
tutorial.kongs.melded.title=Открытый конг
tutorial.kongs.melded.offer=Игрок Напротив сбросил кость ({0}), совпадающую с вашей закрытой тройкой. Нажмите [hl]Конг[/], чтобы объявить четыре одинаковые!
tutorial.kongs.melded.reveal=Если забрать 4-ю кость со сброса, четвёрка выкладывается на стол как [hl]открытый конг[/].
tutorial.kongs.melded.one_kong=Собранный конг приносит [hl]5[/] очков за [Один конг](pattern-4.3.1) и даёт больше очков при нескольких конгах.
tutorial.kongs.melded.compensation=Поскольку в конге 4 кости, вы берёте [hl]добавочную кость[/] с конца стены, чтобы сохранить правильный размер руки.
tutorial.kongs.melded.must_discard=Взяв добавочную кость, вы должны [hl]сбросить[/] кость для завершения хода.
tutorial.kongs.melded.already_melded=Нельзя забрать сброшенную 4-ю кость, если ваша тройка уже открыта на столе в виде [hl]Панга[/].

# Kongs — Concealed kong
tutorial.kongs.concealed.title=Закрытый конг
tutorial.kongs.concealed.offer=Вы только что взяли кость со стены, и у вас на руках все четыре копии {0}. Нажмите [hl]Объявить закрытый конг[/]!
tutorial.kongs.concealed.arrangement=Обратите внимание на выкладку: две **крайние кости закрыты** (рубашкой вверх), показывая, что конг остаётся закрытым, а средние открыты для проверки.
tutorial.kongs.concealed.scoring=В Чжун-юн такой конг остаётся **закрытым** при подсчёте очков — [Закрытая рука](pattern-1.2) остаётся в силе!
tutorial.kongs.concealed.compensation=Вы берёте [hl]добавочную кость[/] с конца стены, затем сбрасываете кость как обычно для завершения хода.

# Kongs — Promoted kong
tutorial.kongs.promoted.title=Достроенный конг
tutorial.kongs.promoted.offer=У вас есть открытый панг {0}, и вы только что взяли 4-ю кость! Нажмите [hl]Достроить конг[/], чтобы улучшить объявление.
tutorial.kongs.promoted.upgraded=Четвёртая кость добавляется к открытому пангу, превращая его в открытый конг и принося [Один конг](pattern-4.3.1).
tutorial.kongs.promoted.robbing=Внимание: это единственный момент, когда соперники могут совершить [Ограбление конга](pattern-9.3), если эта кость завершает их победную руку!
tutorial.kongs.promoted.compensation=Если всё безопасно, вы берёте [hl]добавочную кость[/] с конца стены и сбрасываете кость для завершения хода.

# Hands and scoring — Winning a hand
tutorial.hands.win.title=Выигрыш раздачи
tutorial.hands.win.hand_size=Обычно у игроков на руках [hl]13[/] костей. [hl]14[/] костей у вас бывает лишь временно — при взятии со стены или объявлении. Если вы не выигрываете, нужно сбросить кость обратно до 13.
tutorial.hands.win.patterns=Чтобы выиграть раздачу, кости в руке должны образовывать определённые комбинации.
tutorial.hands.win.all_in_groups=Обычно в победной руке каждая кость должна входить в один из четырёх [hl]сетов[/] или в единственную [hl]пару[/]. Как правило, это [hl]14[/] костей.
tutorial.hands.win.set_kinds=Сет — это [hl]последовательность[/], [hl]тройка[/] или [hl]конг[/].
tutorial.hands.win.kong_size=Здесь один из четырёх сетов — [hl]конг[/]. Из-за этого конга в руке не 14, а [hl]15[/] костей.

# Hands and scoring — Patternless hand
tutorial.hands.chicken.title=Рука без комбинаций
tutorial.hands.chicken.one=Если к этой руке не подходят специальные комбинации, она называется [hl]рукой без комбинаций[/] и стоит [hl]1[/] очко.
tutorial.hands.chicken.tournament=На турнирах руки без комбинаций могут быть [hl]запрещены[/] — в таком случае рука должна стоить не менее [hl]5[/] очков, чтобы считаться выигрышной.
tutorial.hands.chicken.next=В следующих уроках мы разберём базовые комбинации, позволяющие руке набрать [hl]5[/] и более очков.

# Hands and scoring — Concealed hand
tutorial.hands.concealed.title=Закрытая рука
tutorial.hands.concealed.offer=Игрок Напротив сбросил кость ({0}), завершающую последовательность с двумя вашими костями. Объявить Чоу от игрока Напротив нельзя, но поскольку она завершает вашу руку, можно объявить [hl]Ху 5[/]! Нажмите [hl]Ху[/], чтобы победить.
tutorial.hands.concealed.points=Каждый соперник выплачивает победителю стоимость руки. За руку в [hl]5[/] очков все трое платят по 5 очков — в сумме вы получаете [hl]3×[/] от стоимости руки ([hl]+15[/] очков)!
tutorial.hands.concealed.concealed_rule=Рука считается [hl]закрытой[/], если до объявления выигрыша вы не делали открытых объявлений (таких как **Чоу** или **Панг**).
tutorial.hands.concealed.discard_win=Хотя вы взяли сброс игрока Напротив для завершения последней последовательности, выигрыш на сбросе [hl]разрешён[/] — только открытые сеты, собранные *до* выигрыша, ломают Закрытую руку.
tutorial.hands.concealed.kongs=Объявление любого [hl]Чоу[/], [hl]Панга[/] или [hl]Конга[/] со сброса раскрывает этот сет на столе, делая руку открытой и лишая её этой комбинации.

# Hands and scoring — All sequences
tutorial.hands.all_sequences.title=Все последовательности
tutorial.hands.all_sequences.offer=Игрок Напротив сбросил кость ({0}), завершающую вашу четвёртую последовательность. Хотя ваша рука уже открыта из-за более раннего Чоу, кнопка предлагает [hl]Ху 5[/]! Нажмите [hl]Ху[/], чтобы победить.
tutorial.hands.all_sequences.points=Рука, в которой все четыре сета — последовательности (без троек и конгов), приносит [hl]5[/] очков за комбинацию [Все последовательности](pattern-1.1).
tutorial.hands.all_sequences.open_allowed=В отличие от Закрытой руки, комбинация [Все последовательности](pattern-1.1) разрешает открытые Чоу. Даже при наличии открытого сета на столе четыре последовательности всё равно приносят 5 очков.
tutorial.hands.all_sequences.unrestricted=Разрешена любая пара — даже из драконов или ветров, — и подходит любой тип ожидания.

# Hands and scoring — No terminals
tutorial.hands.no_terminals.title=Все простые
tutorial.hands.no_terminals.offer=Игрок Напротив сбросил кость ({0}), завершающую вашу выигрышную руку. Каждая кость в вашей руке — простая номерная от 2 до 8. Нажмите [hl]Ху[/], чтобы победить.
tutorial.hands.no_terminals.terminals_def=В трёх номерных мастях крайние кости — **1** и **9** ({1m}, {9s}) — называются [hl]терминалами[/]. Внутренние кости от **2** до **8** называются [hl]простыми[/]. Благородные не относятся ни к тем, ни к другим.
tutorial.hands.no_terminals.points=Комбинация [Все простые](pattern-1.3) приносит [hl]5[/] очков. Каждая кость в руке — все четыре сета и пара — должна быть [hl]простой[/], без терминалов и благородных.
tutorial.hands.no_terminals.flexibility=Обратите внимание: в этой руке есть открытая тройка ({5p}{5p}{5p}), так что она не закрытая и не состоит из одних чоу. Но поскольку каждая кость простая, рука подходит под комбинацию [hl]Все простые (5 очков)[/]!
tutorial.hands.no_terminals.stacking=Комбинация «Все простые» может также [hl]складываться[/] с другими комбинациями, например [Все последовательности](pattern-1.1) или [Закрытая рука](pattern-1.2), давая в сумме 10 или 15 очков.

# Hands and scoring — Kongs
tutorial.hands.kongs.title=Конги
tutorial.hands.kongs.offer=Игрок Напротив сбросил кость ({0}), завершающую вашу выигрышную руку. У вас на столе уже есть два открытых конга. Нажмите [hl]Ху[/], чтобы победить.
tutorial.hands.kongs.two_kongs=Как мы видели ранее, [Один конг](pattern-4.3.1) приносит [hl]5[/] очков. Наличие **двух конгов** увеличивает награду до [hl]20[/] очков за комбинацию [Два конга](pattern-4.3.2)!
tutorial.hands.kongs.hand_size=Поскольку каждый конг состоит из 4 костей вместо 3 и требует взятия добавочной кости, в этой победной руке [hl]16[/] костей вместо обычных 14.
tutorial.hands.kongs.ladder=Более высокие комбинации конгов растут стремительно: [Три конга](pattern-4.3.3) приносят [hl]120[/] очков, а [Четыре конга](pattern-4.3.4) приносят максимум — [hl]480[/] очков!

# Hands and scoring — Value honor
tutorial.hands.value_honor.title=Ценные благородные
tutorial.hands.value_honor.offer=Игрок Напротив сбросил кость ({0}), завершающую вашу руку. Ваша открытая тройка Красных драконов делает стоимость этой руки [hl]Ху 10[/]! Нажмите [hl]Ху[/], чтобы победить.
tutorial.hands.value_honor.dragons=Тройка или конг [hl]ценных благородных[/] приносит [hl]10[/] очков ([Ценные благородные](pattern-3.1)). Любой из трёх драконов — **Красный** ({C}), **Зелёный** ({F}) или **Белый** ({P}) — всегда считается ценным для каждого игрока.
tutorial.hands.value_honor.seat_winds=Ваш собственный **ветер места** (например, {E} для Востока) также является ценным благородным. Ветры остальных трёх мест очков не приносят. В Чжун-юн **нет превалирующего ветра стола**.
tutorial.hands.value_honor.stacking=Ценные благородные [hl]суммируются за каждый сет[/]: две подходящие тройки принесут [hl]20[/] очков. Открытые сеты разрешены, но **пары** очков никогда не приносят — засчитываются только тройки и конги.

# Hands and scoring — All triplets
tutorial.hands.all_triplets.title=Все панги
tutorial.hands.all_triplets.offer=Игрок Напротив сбросил кость ({0}), собирающую вашу руку в четыре тройки и пару. Нажмите [hl]Ху[/], чтобы победить!
tutorial.hands.all_triplets.pattern=Комбинация [Все панги](pattern-4.1) требует четыре тройки (или конга) и пару, без последовательностей. Открытые панги разрешены, а сама комбинация приносит щедрые [hl]30[/] очков!
tutorial.hands.all_triplets.settlement_cap=При выигрыше на сбросе свыше 25 очков выплаты не сбросивших игроков [hl]ограничены 25 очками[/] (Слева и Справа платят по [hl]-25[/]). Сбросивший покрывает обе недостачи: 30 + 5 + 5 = **40** ([hl]-40[/])!
tutorial.hands.all_triplets.self_draw=Вы всё равно получаете полные **90 очков** (3 × 30). При **взятии со стены** сбросившего нет, поэтому все трое соперников платят полные 30 очков.

# Hands and scoring — Nine-tile straight
tutorial.hands.nine_tile_straight.title=Чистый ряд
tutorial.hands.nine_tile_straight.offer=Игрок Напротив сбросил кость ({0}), собирающую вашу руку в ряд с 1 по 9 в иероглифах. Нажмите [hl]Ху[/], чтобы победить!
tutorial.hands.nine_tile_straight.pattern=Комбинация [Чистый ряд](pattern-7.1) приносит целых [hl]40[/] очков! Она требует три последовательности от **1 до 9 в одной масти** ({1m}–{9m}). Открытые чоу разрешены.
tutorial.hands.nine_tile_straight.composition=Остальные 5 костей могут быть любым законным сетом и парой в любой масти. Здесь тройка {555p} и пара {99s} дополняют вашу 14-костную победную руку.
tutorial.hands.nine_tile_straight.settlement=При руке в 40 очков выплаты не сбросивших игроков ограничены [hl]-25[/]. Игрок Напротив выплачивает свои 40 плюс обе недостачи по 15 очков ([hl]-70[/]), принося вам [hl]+120[/] очков (3 × 40)!

# Hands and scoring — Seven pairs
tutorial.hands.seven_pairs.title=Семь пар
tutorial.hands.seven_pairs.offer=Игрок Напротив сбросил кость ({0}), собирающую вашу руку в семь пар. Нажмите [hl]Ху[/], чтобы победить!
tutorial.hands.seven_pairs.pattern=Все победные руки до сих пор состояли из 4 сетов и 1 пары. [Семь пар](pattern-10.2) — это [hl]нестандартная рука[/]: она нарушает это правило, собирая **семь пар** за [hl]30[/] очков!
tutorial.hands.seven_pairs.concealed_only=Семь пар должны быть [hl]полностью закрытыми[/]. Нельзя объявлять Чоу, Панг или Конг — все пары должны быть взяты со стены. Однако завершающую кость для 7-й пары можно забрать со сброса соперника!
tutorial.hands.seven_pairs.four_of_a_kind=Ожидание в Семи парах — это всегда [hl]одностороннее ожидание[/] на седьмую пару. В Чжун-юн все **четыре копии** одной кости (без объявления конга) по правилам считаются **двумя парами**.

# Hands and scoring — Two identical sequences
tutorial.hands.two_identical_sequences.title=Два одинаковых чоу
tutorial.hands.two_identical_sequences.offer=Игрок Напротив сбросил кость ({0}), завершающую ваше второе одинаковое чоу. Нажмите [hl]Ху[/], чтобы победить!
tutorial.hands.two_identical_sequences.pattern=Комбинация [Два одинаковых чоу](pattern-5.1.1) приносит [hl]10[/] очков за две совпадающие последовательности одной масти ({234s} и {234s}). В руке они выглядят как три пары подряд ({223344s}). Открытые чоу разрешены!
tutorial.hands.two_identical_sequences.ladder=Старшие ступени этой серии дают огромные очки: [Три одинаковых чоу](pattern-5.1.3) приносят [hl]120[/] очков, а [Четыре одинаковых чоу](pattern-5.1.4) дают максимум — [hl]480[/] очков!

# Hands and scoring — Two concealed triplets
tutorial.hands.two_concealed_triplets.title=Два закрытых панга
tutorial.hands.two_concealed_triplets.offer=Игрок Напротив сбросил кость ({0}), завершающую вашу руку. Нажмите [hl]Ху[/], чтобы победить!
tutorial.hands.two_concealed_triplets.pattern=Комбинация [Два закрытых панга](pattern-4.2.1) приносит [hl]5[/] очков за две тройки, собранные полностью в закрытой руке ({333p} и {666s}). Открытые панги не засчитываются!
tutorial.hands.two_concealed_triplets.ladder=Закрытые тройки быстро растут в цене: [Три закрытых панга](pattern-4.2.2) приносят [hl]30[/] очков, а [Четыре закрытых панга](pattern-4.2.3) — [hl]125[/] очков!

# Hands and scoring — Three similar triplets
tutorial.hands.three_similar_triplets.title=Три смешанных панга
tutorial.hands.three_similar_triplets.offer=Игрок Напротив сбросил кость ({0}), завершающую вашу руку. Нажмите [hl]Ху[/], чтобы победить!
tutorial.hands.three_similar_triplets.pattern=Комбинация [Три смешанных панга](pattern-6.2.2) приносит внушительные [hl]120[/] очков за тройки **одного достоинства** во всех трёх мастях ({555m}, {555p}, {555s}). Открытые панги разрешены!
tutorial.hands.three_similar_triplets.small_triplets=Младшая форма, [Малые три смешанных панга](pattern-6.2.1), даёт [hl]30[/] очков за **две тройки и пару** одного достоинства ({555m}, {555p} и {55s}). Новички часто забывают о ней, хотя собрать её гораздо реальнее!

# Hands and scoring — One-suit hands
tutorial.hands.one_suit.title=Одна масть
tutorial.hands.one_suit.offer=Игрок Напротив сбросил кость ({0}), завершающую вашу руку из точек и благородных. Нажмите [hl]Ху[/], чтобы победить!
tutorial.hands.one_suit.mixed=Рука только из **одной номерной масти** (оранжевые) с добавлением **благородных** (синие) приносит [hl]40[/] очков за комбинацию [Полумасть](pattern-2.1.1). Открытые чоу и панги разрешены!
tutorial.hands.one_suit.pure=Если полностью убрать благородные кости, [Чистая масть](pattern-2.1.2) удваивает результат до [hl]80[/] очков! Каждый сет и пара теперь принадлежат этой единственной масти.

# Hands and scoring — More patterns
tutorial.hands.more_patterns.title=Другие комбинации
tutorial.hands.more_patterns.rarer=Мы познакомились с основными комбинациями. Множество более редких рук — например, серии драконов, ветров и предельные руки — подробно описаны в [Справке](reference).
tutorial.hands.more_patterns.practice=Вы можете в любой момент открыть [Справку](reference) из игрового меню во время партии, чтобы уточнить правила комбинаций и стоимость очков. Приятной игры!

