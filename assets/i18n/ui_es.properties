tutorial.orient.numbers.bamboo1=Una cara que conviene fijar
tutorial.orient.numbers.bamboo1_callout=El 1 de Bambú se dibuja tradicionalmente como un pájaro.
# Enseñanza de secuencias (final de Números): definición y luego pasos de "no es una secuencia".
tutorial.orient.numbers.sequence=Una secuencia es **exactamente tres** números consecutivos del mismo palo — por ejemplo {234m}, {567p} o {123s}.
tutorial.orient.numbers.four=Cuatro fichas consecutivas de un mismo palo **no** son una secuencia.
tutorial.orient.numbers.four_aside3=O bien aparta el **3**.
tutorial.orient.numbers.four_aside6=O aparta el **6**.
tutorial.orient.numbers.prompt=Encuentra una **secuencia** — selecciona sus tres fichas.
tutorial.orient.honors.title=Honores
tutorial.orient.honors.intro=Los vientos y los dragones son fichas [hl]de honor[/]. **No** forman secuencias numéricas.
tutorial.orient.honors.prompt=Selecciona todas las fichas de honor (vientos y dragones).
tutorial.orient.wall.title=Construir el muro
tutorial.orient.wall.faces=El conjunto completo de caras: tres palos del 1 al 9, más cuatro vientos y tres dragones — 34 en total.
tutorial.orient.wall.copies=Cada cara tiene cuatro fichas — 136 en total.
tutorial.orient.wall.drawpile=El muro es como el montón del que se roba en las cartas: las manos iniciales y los robos durante el juego salen de él.
tutorial.orient.wall.ritual=Cuando se juega en una mesa real, construir el muro es un ritual.
tutorial.orient.wall.facedown=Para construir un muro, primero gira las fichas boca abajo...
tutorial.orient.wall.shuffle=Y mézclalas bien.
tutorial.orient.wall.formed=Luego empieza a formar el muro: cuatro lados de 17 pilas, de dos fichas de alto.
tutorial.orient.wall.pushed=Los muros se empujan hacia dentro para que los extremos se junten.
tutorial.orient.wall.seats=En cada mano, un jugador es Este, el siguiente es Sur, luego Oeste y luego Norte.
tutorial.orient.wall.east=Este es el repartidor y el primero en mover en la mano.
tutorial.orient.wall.deal=Este reparte lanzando dos d6.
tutorial.orient.wall.dice=La suma de los dados determina dónde se rompe el muro.
tutorial.orient.wall.count={0}+{1}={2}. Desde el extremo derecho del muro de Este, cuenta {2} pilas.
tutorial.orient.wall.break=El muro se rompe tras las pilas contadas. Las pilas a su izquierda se desplazan a la izquierda, abriendo un hueco.
tutorial.orient.wall.take7=Cuenta 7 pilas a la derecha del hueco.
tutorial.orient.wall.dead=Apártalas para formar un muro muerto separado.
tutorial.orient.wall.dead_out=Esas 14 fichas nunca se roban, lo que añade incertidumbre hacia el final de la mano.
tutorial.orient.wall.hands=Para formar sus manos, los jugadores toman 2 pilas cada uno tras el hueco, desmontando el muro en sentido horario — tres veces.
tutorial.orient.wall.hands_13=Después de eso, cada jugador tiene 3x4 = 12 fichas. Toman 1 ficha más cada uno para llegar a 13.
tutorial.orient.wall.east_14=Como Este va primero, empieza su turno tomando la 14.ª ficha.
tutorial.orient.wall.look_hands=Cada jugador mira su mano...
tutorial.orient.wall.sort_hands=...y la ordena.
tutorial.orient.wall.east_discard=Ahora, el jugador Este debe hacer su primer movimiento descartando una ficha.
tutorial.orient.wall.app_table=En esta aplicación, para ahorrar espacio en pantalla, el muro vivo se muestra de forma simplificada y el muro muerto no se muestra en absoluto.
tutorial.orient.wall.live_count=El **69** del centro es el número de fichas que quedan en el muro vivo.

# Orden de movimientos
tutorial.moves.east_player.title=Jugador Este
tutorial.moves.east_player.four=Hay [hl]cuatro[/] jugadores. En cada mano, uno de ellos es [hl]Este[/] (el repartidor). Luego, en sentido antihorario: [hl]Sur[/], [hl]Oeste[/] y [hl]Norte[/].
tutorial.moves.east_player.pass=Tras cada mano, la asignación de vientos gira en sentido [hl]antihorario[/]. El jugador que era Sur se convierte en el nuevo Este.
tutorial.moves.discarding.title=Descartar
tutorial.moves.discarding.east_14=Al inicio de cualquier mano, el jugador que es [hl]Este[/] (el repartidor) tiene [hl]14[/] fichas en la mano (a diferencia de los otros 3 jugadores, que tienen [hl]13[/] cada uno).
tutorial.moves.discarding.east_hu=Si estas 14 fichas forman una [hl]mano ganadora[/], Este puede declarar la victoria ("[hl]¡Hu![/]") de inmediato — esta es la [Bendición del Cielo](pattern-9.4.1).
tutorial.moves.discarding.east_hu_odds=Aunque, estadísticamente, la probabilidad de que esto ocurra es de [hl]1 entre 328.909[/]. Puede que juegues al mahjong toda tu vida y nunca lo presencies.
tutorial.moves.discarding.must_discard=Si esta mano no es ganadora (que es lo normal), Este debe elegir una de sus fichas para [hl]descartarla[/] y devolver el número de fichas a 13.
tutorial.moves.discarding.least_useful=Al descartar, intenta deshacerte de la ficha menos útil (una que no parezca lo bastante prometedora para formar figuras futuras).
tutorial.moves.discarding.others_claim=Los otros jugadores pueden [hl]reclamar[/] la ficha descartada para mejorar sus manos o incluso [hl]ganar[/].
tutorial.moves.counterclockwise.title=Orden de turnos
tutorial.moves.counterclockwise.this_tile=[hl]Haz clic en esta ficha[/] para descartarla.
tutorial.moves.counterclockwise.click_callout=Descártala
tutorial.moves.counterclockwise.if_nobody=Nadie la [hl]reclamó[/], así que quedó descartada.
tutorial.moves.counterclockwise.the_river=El [hl]río[/] es como el montón de descartes en las cartas: las fichas no reclamadas quedan boca arriba delante del jugador que las descartó.
tutorial.moves.counterclockwise.to_the_right=El turno pasa siempre al jugador a la [hl]derecha[/] del que descarta.
tutorial.moves.counterclockwise.right_next=Tú eres [hl]Este[/] (parte inferior de la mesa). [hl]Derecha[/] juega después — ha robado del muro, luego descartará.
tutorial.moves.counterclockwise.right_discards=Derecha [hl]descarta[/] una ficha. Nadie la reclamó, así que el turno pasa a [hl]Enfrente[/], que roba del muro.

# Reclamar
tutorial.claims.click_callout=Selecciona esto
tutorial.claims.pung.title=Pung
tutorial.claims.pung.offer=Enfrente descartó una ficha de la que ya tienes una [hl]pareja[/] ({0}). [hl]Haz clic en Pung[/] para completar un trío.
tutorial.claims.pung.reveal=Reclamar una ficha descartada por otro jugador exige [hl]revelar[/] el grupo formado — aquí, el [hl]trío[/].
tutorial.claims.pung.must_discard=Ahora tienes [hl]14[/] fichas y, como esta no es una mano ganadora, debes [hl]descartar[/] una ficha.
tutorial.claims.pung.skips_left=Como la reclamaste, [hl]Izquierda[/] se salta su turno — le tocaba [hl]robar del muro[/] a continuación.
tutorial.claims.pung.third_for_two=Puedes reclamar una [hl]tercera[/] para dos copias. No puedes reclamar una [hl]segunda[/] por una.
tutorial.claims.last_discard.title=Último descarte
tutorial.claims.last_discard.only_fresh=Puedes reclamar una ficha [hl]justo después[/] de que se descarte. No puedes reclamar una ficha que ya está en el [hl]río[/].
tutorial.claims.last_discard.callout=Esta ficha se descartó la última
# Reclamar — Chow
tutorial.claims.chow.title=Chow
tutorial.claims.chow.offer=Izquierda descartó una ficha ({0}) que completa una [hl]secuencia[/] con dos fichas que ya tienes. [hl]Haz clic en Chow[/] para completarla.
tutorial.claims.chow.reveal=Reclamar una ficha descartada por otro jugador exige [hl]revelar[/] el grupo formado — aquí, la [hl]secuencia[/].
tutorial.claims.chow.must_discard=Ahora tienes [hl]14[/] fichas y, como esta no es una mano ganadora, debes [hl]descartar[/] una ficha.
tutorial.claims.chow.only_left=Solo puedes hacer chow de [hl]Izquierda[/] (el jugador justo antes de ti). Los descartes de Enfrente o Derecha no se pueden convertir en chow.
tutorial.claims.hu.title=Hu
tutorial.claims.hu.offer=Aquí, tu mano ganadora está casi completa y esperas una pareja. Enfrente acaba de descartar la ficha que necesitas ({0}). [hl]Haz clic en Hu[/] para reclamarla.
tutorial.claims.hu.not_a_set=Cuando una ficha descartada completa una [hl]mano ganadora[/], puedes reclamarla. [hl]No[/] tiene que completar un [hl]grupo[/] — aquí completó la [hl]pareja[/].
tutorial.claims.hu.breakdown=Si el panel de desglose de puntos te tapa la mesa, puedes [hl]arrastrarlo[/] a otro lugar o [hl]plegarlo y desplegarlo[/] con el botón de chevrón. ¡Prueba a arrastrarlo o plegarlo ahora!

# Reclamar — Prioridad de reclamación
tutorial.claims.priority.title=Prioridad de reclamación
tutorial.claims.priority.conflict=Izquierda acaba de descartar {3s}. Tienes {12s} y podrías hacer **Chow**, pero Derecha tiene una pareja de {3s}. ¡Intenta reclamar [hl]Chow[/] para ver qué pasa!
tutorial.claims.priority.pung_beats_chow=Aunque reclamaras Chow, [hl]el Pung vence al Chow[/]. La reclamación de Derecha anula la tuya — Derecha se lleva la ficha y tu turno se salta.
tutorial.claims.priority.hierarchy=La jerarquía universal de reclamaciones es: [hl]Ganar (Hu)[/] vence a [hl]Pung y Kong[/], que a su vez vencen a [hl]Chow[/].
tutorial.claims.priority.multi_win=Si varios jugadores reclaman [hl]Hu[/] sobre el mismo descarte, gana el jugador más cercano al que descartó en el orden de turno (sin victorias dobles).

# Kongs — Kong expuesto grande
tutorial.kongs.melded.title=Kong expuesto
tutorial.kongs.melded.offer=Enfrente descartó una ficha ({0}) que coincide con tu trío oculto. ¡Haz clic en [hl]Kong[/] para declarar las cuatro fichas!
tutorial.kongs.melded.reveal=Reclamar la cuarta ficha descartada expone las cuatro fichas sobre la mesa como un [hl]kong abierto[/].
tutorial.kongs.melded.one_kong=Formar un kong otorga [hl]5[/] puntos por [Un kong](pattern-4.3.1) y aumenta con varios kongs.
tutorial.kongs.melded.compensation=Como un kong tiene 4 fichas, robas una [hl]ficha de suplemento[/] del final del muro para mantener un tamaño de mano válido.
tutorial.kongs.melded.must_discard=Tras robar la ficha de suplemento, debes [hl]descartar[/] para completar tu turno.
tutorial.kongs.melded.already_melded=No puedes reclamar una cuarta ficha descartada si tu trío ya está expuesto sobre la mesa como un [hl]Pung[/] abierto.

# Kongs — Kong oculto
tutorial.kongs.concealed.title=Kong oculto
tutorial.kongs.concealed.offer=Acabas de tomar una ficha del muro y tienes las cuatro copias de {0}. ¡Haz clic en [hl]Declarar kong oculto[/]!
tutorial.kongs.concealed.arrangement=Fíjate en la combinación: las dos **fichas de los extremos están cerradas** (boca abajo) para mostrar que sigue oculta, mientras que las centrales demuestran el grupo.
tutorial.kongs.concealed.scoring=En Zung Jung, sigue siendo **oculta** a efectos de puntuación — [Mano oculta](pattern-1.2) sigue siendo válida.
tutorial.kongs.concealed.compensation=Robas una [hl]ficha de suplemento[/] del final del muro y luego descartas con normalidad para terminar tu turno.

# Kongs — Kong promovido
tutorial.kongs.promoted.title=Kong promovido
tutorial.kongs.promoted.offer=Tienes un pung abierto de {0} y acabas de robar la 4.ª ficha. ¡Haz clic en [hl]Promover kong[/] para mejorar tu combinación!
tutorial.kongs.promoted.upgraded=La cuarta ficha se une a tu pung abierto, ascendiendo a kong abierto y cumpliendo los requisitos de [Un kong](pattern-4.3.1).
tutorial.kongs.promoted.robbing=Advertencia: este es el único momento en que los rivales pueden [Robar un kong](pattern-9.3) si esta ficha completa su mano ganadora.
tutorial.kongs.promoted.compensation=Si es seguro, robas una [hl]ficha de suplemento[/] del final del muro y descartas para completar tu turno.

# Manos y puntuación — Ganar una mano
tutorial.hands.win.title=Ganar una mano
tutorial.hands.win.hand_size=Normalmente los jugadores tienen [hl]13[/] fichas. Solo tienes [hl]14[/] temporalmente al robar o reclamar. Si no ganas, debes descartar hasta volver a 13.
tutorial.hands.win.patterns=Para ganar una mano, las fichas de tu mano deben formar unas figuras concretas.
tutorial.hands.win.all_in_groups=Normalmente, en una mano ganadora, cada ficha debe estar en uno de los cuatro [hl]grupos[/] o en la única [hl]pareja[/]. Eso suele ser [hl]14[/] fichas.
tutorial.hands.win.set_kinds=Un grupo es una [hl]secuencia[/], un [hl]trío[/] o un [hl]kong[/].
tutorial.hands.win.kong_size=Aquí, uno de los cuatro grupos es un [hl]kong[/]. Por ese kong, la mano tiene [hl]15[/] fichas, no 14.

# Manos y puntuación — Mano sin figura
tutorial.hands.chicken.title=Mano sin figura
tutorial.hands.chicken.one=Si no se aplica ninguna puntuación especial a esta mano, se llama [hl]mano sin figura[/] y vale [hl]1[/] punto.
tutorial.hands.chicken.tournament=En los torneos, las manos sin figura pueden estar [hl]prohibidas[/] — la mano debe valer al menos [hl]5[/] puntos para contar como ganable.
tutorial.hands.chicken.next=En las próximas lecciones veremos las figuras básicas de puntuación que permiten que una mano puntúe [hl]5[/] o más puntos.

# Manos y puntuación — Mano oculta
tutorial.hands.concealed.title=Mano oculta
tutorial.hands.concealed.offer=Enfrente descartó una ficha ({0}) que completa una secuencia con dos fichas que ya tienes. No puedes hacer Chow desde Enfrente — pero como completa tu mano, puedes reclamar [hl]Hu 5[/]. Haz clic en [hl]Hu[/] para ganar.
tutorial.hands.concealed.points=Cada rival paga la puntuación de la mano al ganador. Por una mano de [hl]5[/] puntos, los tres pagan 5 cada uno — ¡obtienes [hl]3×[/] la puntuación de la mano ([hl]+15[/] puntos)!
tutorial.hands.concealed.concealed_rule=Una mano está [hl]oculta[/] si no has hecho ninguna reclamación abierta (como **Chow** o **Pung**) antes de declarar la victoria.
tutorial.hands.concealed.discard_win=Aunque reclamaras el descarte de Enfrente para completar esa secuencia final, ganar con descarte está [hl]permitido[/] — solo las combinaciones abiertas hechas *antes* de la victoria rompen la Mano oculta.
tutorial.hands.concealed.kongs=Reclamar cualquier [hl]Chow[/], [hl]Pung[/] o [hl]Kong[/] antes en la mano expone ese grupo sobre la mesa, volviendo tu mano abierta y rompiendo esta figura.

# Manos y puntuación — Todas las secuencias
tutorial.hands.all_sequences.title=Todas las secuencias
tutorial.hands.all_sequences.offer=Enfrente descartó una ficha ({0}) que completa tu cuarta secuencia. Aunque tu mano está abierta por un Chow anterior, el botón ofrece [hl]Hu 5[/]. Haz clic en [hl]Hu[/] para ganar.
tutorial.hands.all_sequences.points=Una mano en la que los cuatro grupos son secuencias (sin tríos ni kongs) puntúa [hl]5[/] puntos por [Todas las secuencias](pattern-1.1).
tutorial.hands.all_sequences.open_allowed=A diferencia de la Mano oculta, [Todas las secuencias](pattern-1.1) permite Chows abiertos. Incluso con una combinación abierta sobre la mesa, tener cuatro secuencias sigue otorgando 5 puntos.
tutorial.hands.all_sequences.unrestricted=Se permite cualquier pareja — incluso honores de dragón o viento — y cualquier tipo de espera vale.

# Manos y puntuación — Sin terminales
tutorial.hands.no_terminals.title=Sin terminales
tutorial.hands.no_terminals.offer=Enfrente descartó una ficha ({0}) que completa tu mano ganadora. Todas las fichas de tu mano son números simples del 2 al 8. Haz clic en [hl]Hu[/] para ganar.
tutorial.hands.no_terminals.terminals_def=En los tres palos numerados, las fichas de los extremos — **1** y **9** ({1m}, {9s}) — se llaman [hl]terminales[/]. Las fichas interiores del **2** al **8** se llaman [hl]simples[/]. Los honores no son ninguna de las dos.
tutorial.hands.no_terminals.points=La figura [Sin terminales](pattern-1.3) vale [hl]5[/] puntos. Todas las fichas de la mano — los cuatro grupos y la pareja — deben ser [hl]simples[/], sin terminales ni honores.
tutorial.hands.no_terminals.flexibility=Fíjate en que esta mano tiene un trío abierto ({5p}{5p}{5p}), así que no es ni oculta ni todas secuencias. Pero como todas las fichas son simples, cumple los requisitos de [hl]Sin terminales (5 pts)[/].
tutorial.hands.no_terminals.stacking=Sin terminales también puede [hl]acumularse[/] con otras figuras como [Todas las secuencias](pattern-1.1) o [Mano oculta](pattern-1.2) cuando se aplican, sumando 10 o 15 puntos.

# Manos y puntuación — Kongs
tutorial.hands.kongs.title=Kongs
tutorial.hands.kongs.offer=Enfrente descartó una ficha ({0}) que completa tu mano ganadora. Ya tienes dos kongs abiertos sobre la mesa. Haz clic en [hl]Hu[/] para ganar.
tutorial.hands.kongs.two_kongs=Como vimos antes, tener [Un kong](pattern-4.3.1) otorga [hl]5[/] puntos. ¡Tener **dos kongs** sube la puntuación a [hl]20[/] puntos por [Dos kongs](pattern-4.3.2)!
tutorial.hands.kongs.hand_size=Como cada kong toma 4 fichas en lugar de 3 y roba una ficha de compensación, esta mano ganadora tiene [hl]16[/] fichas en lugar de las 14 habituales.
tutorial.hands.kongs.ladder=Las figuras de kong superiores suben en picado: [Tres kongs](pattern-4.3.3) puntúa [hl]120[/] puntos, y [Cuatro kongs](pattern-4.3.4) puntúa el límite de [hl]480[/] puntos.

# Manos y puntuación — Honor de valor
tutorial.hands.value_honor.title=Honor de valor
tutorial.hands.value_honor.offer=Enfrente descartó una ficha ({0}) que completa tu mano. Tu trío abierto de dragones rojos hace que esta mano valga [hl]Hu 10[/]. Haz clic en [hl]Hu[/] para ganar.
tutorial.hands.value_honor.dragons=Un trío o kong de un [hl]honor de valor[/] vale [hl]10[/] puntos ([Honor de valor](pattern-3.1)). Cualquiera de los tres dragones — **Rojo** ({C}), **Verde** ({F}) o **Blanco** ({P}) — es siempre un honor de valor para todos los jugadores.
tutorial.hands.value_honor.seat_winds=Tu propio **viento de asiento** (como {E} para el asiento Este) también es un honor de valor. Los vientos de los otros tres asientos ("vientos invitados") no puntúan. En Zung Jung **no hay viento dominante ni de ronda**.
tutorial.hands.value_honor.stacking=El Honor de valor cuenta [hl]de forma acumulativa por grupo[/]: tener dos tríos válidos puntúa [hl]20[/] puntos. Se permiten combinaciones abiertas, pero las **parejas** nunca puntúan — solo cuentan los tríos y los kongs.

# Manos y puntuación — Todos tríos
tutorial.hands.all_triplets.title=Todos tríos
tutorial.hands.all_triplets.offer=Enfrente descartó una ficha ({0}) que completa tu mano con cuatro tríos y una pareja. ¡Haz clic en [hl]Hu[/] para ganar!
tutorial.hands.all_triplets.pattern=La figura [Todos tríos](pattern-4.1) exige cuatro tríos (o kongs) y una pareja, sin secuencias. Se permiten pungs abiertos, y la figura otorga unos generosos [hl]30[/] puntos.
tutorial.hands.all_triplets.settlement_cap=En una victoria por descarte de más de 25 puntos, los no descartadores quedan [hl]limitados a 25 puntos[/] (Izquierda/Derecha pagan [hl]-25[/]). El que descartó cubre ambas diferencias: 30 + 5 + 5 = **40** ([hl]-40[/]).
tutorial.hands.all_triplets.self_draw=Sigues recibiendo los **90 puntos** completos (3 \u00d7 30). En un **robo propio** no hay descartador, así que los tres rivales pagan los 30 puntos completos.

# Manos y puntuación — Escalera de nueve fichas
tutorial.hands.nine_tile_straight.title=Escalera de nueve fichas
tutorial.hands.nine_tile_straight.offer=Enfrente descartó una ficha ({0}) que completa tu mano con una escalera del 1 al 9 en caracteres. ¡Haz clic en [hl]Hu[/] para ganar!
tutorial.hands.nine_tile_straight.pattern=La figura [Escalera de nueve fichas](pattern-7.1) vale la enorme cifra de [hl]40[/] puntos. Exige tres secuencias que abarquen **del 1 al 9 en un solo palo** ({1m} a {9m}). Se permiten chows abiertos.
tutorial.hands.nine_tile_straight.composition=Las 5 fichas restantes pueden ser cualquier grupo y pareja válidos de cualquier palo. Aquí, un trío de {555p} y una pareja de {99s} completan tu mano ganadora de 14 fichas.
tutorial.hands.nine_tile_straight.settlement=Con una mano de 40 puntos, los no descartadores quedan limitados a [hl]-25[/]. Enfrente cubre sus 40 más ambas diferencias de 15 puntos ([hl]-70[/]), ¡dándote [hl]+120[/] puntos netos (3 \u00d7 40)!

# Manos y puntuación — Siete parejas
tutorial.hands.seven_pairs.title=Siete parejas
tutorial.hands.seven_pairs.offer=Enfrente descartó una ficha ({0}) que completa tu mano con siete parejas. ¡Haz clic en [hl]Hu[/] para ganar!
tutorial.hands.seven_pairs.pattern=Todas las manos ganadoras hasta ahora estaban formadas por 4 grupos y 1 pareja. [Siete parejas](pattern-10.2) es una [hl]mano irregular[/] — rompe esa regla al completar **siete parejas** por [hl]30[/] puntos.
tutorial.hands.seven_pairs.concealed_only=Siete parejas debe estar [hl]totalmente oculta[/]. No puedes cantar Chow, Pung o Kong — todas las parejas deben robarse del muro. Sin embargo, puedes reclamar la ficha final de un descarte rival para completar tu 7.ª pareja.
tutorial.hands.seven_pairs.four_of_a_kind=Esperar Siete parejas es siempre una [hl]espera de una sola ficha[/] por tu 7.ª pareja. En Zung Jung, tener las **cuatro copias** de la misma ficha (sin declarar un kong) cuenta, según las reglas, como **dos parejas**.

# Manos y puntuación — Dos secuencias idénticas
tutorial.hands.two_identical_sequences.title=Dos secuencias idénticas
tutorial.hands.two_identical_sequences.offer=Enfrente descartó una ficha ({0}) que completa tu segunda secuencia idéntica. ¡Haz clic en [hl]Hu[/] para ganar!
tutorial.hands.two_identical_sequences.pattern=[Dos secuencias idénticas](pattern-5.1.1) otorga [hl]10[/] puntos por dos secuencias iguales en un mismo palo ({234s} y {234s}). En la mano parecen parejas consecutivas ({223344s}). ¡Se permiten chows abiertos!
tutorial.hands.two_identical_sequences.ladder=Los niveles superiores de esta serie otorgan puntos enormes: [Tres secuencias idénticas](pattern-5.1.3) puntúa [hl]120[/] puntos, y [Cuatro secuencias idénticas](pattern-5.1.4) puntúa el límite de [hl]480[/] puntos.

# Manos y puntuación — Dos tríos ocultos
tutorial.hands.two_concealed_triplets.title=Dos tríos ocultos
tutorial.hands.two_concealed_triplets.offer=Enfrente descartó una ficha ({0}) que completa tu mano. Haz clic en [hl]Hu[/] para ganar.
tutorial.hands.two_concealed_triplets.pattern=[Dos tríos ocultos](pattern-4.2.1) otorga [hl]5[/] puntos por dos tríos formados íntegramente en tu mano oculta ({333p} y {666s}). ¡Los pungs abiertos no valen!
tutorial.hands.two_concealed_triplets.ladder=Los tríos ocultos escalan en picado: [Tres tríos ocultos](pattern-4.2.2) otorga [hl]30[/] puntos, y [Cuatro tríos ocultos](pattern-4.2.3) otorga [hl]125[/] puntos.

# Manos y puntuación — Tres tríos similares
tutorial.hands.three_similar_triplets.title=Tres tríos similares
tutorial.hands.three_similar_triplets.offer=Enfrente descartó una ficha ({0}) que completa tu mano. Haz clic en [hl]Hu[/] para ganar.
tutorial.hands.three_similar_triplets.pattern=[Tres tríos similares](pattern-6.2.2) otorga unos enormes [hl]120[/] puntos por tener tríos del **mismo número** en los tres palos ({555m}, {555p}, {555s}). ¡Se permiten pungs abiertos!
tutorial.hands.three_similar_triplets.small_triplets=La forma menor, [Tres tríos similares pequeños](pattern-6.2.1), otorga [hl]30[/] puntos por **dos tríos y una pareja** del mismo número ({555m}, {555p} y {55s}). Los principiantes suelen pasarla por alto, ¡pero es mucho más realista de conseguir!

# Manos y puntuación — Manos de un solo palo
tutorial.hands.one_suit.title=Manos de un solo palo
tutorial.hands.one_suit.offer=Enfrente descartó una ficha ({0}) que completa tu mano en círculos y honores. Haz clic en [hl]Hu[/] para ganar.
tutorial.hands.one_suit.mixed=Tener fichas de **un solo palo numerado** (en naranja) junto con **honores** (en azul) puntúa [hl]40[/] puntos por [Un solo palo mixto](pattern-2.1.1). ¡Se permiten chows y pungs abiertos!
tutorial.hands.one_suit.pure=Si eliminas por completo las fichas de honor, [Un solo palo puro](pattern-2.1.2) duplica la puntuación a [hl]80[/] puntos. Cada grupo y la pareja pertenecen ahora a ese único palo.

# Manos y puntuación — Más figuras
tutorial.hands.more_patterns.title=Más figuras
tutorial.hands.more_patterns.rarer=Hemos cubierto las figuras principales. Muchas manos más raras — como las series de dragones, las manos de vientos y las manos límite — se detallan en la [Referencia](reference).
tutorial.hands.more_patterns.practice=Puedes consultar la [Referencia](reference) en cualquier momento desde el menú del juego durante la partida para comprobar las reglas de las figuras y los valores de puntuación. ¡Feliz partida!

