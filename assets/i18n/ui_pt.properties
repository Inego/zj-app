tutorial.orient.tiles.tags_try=Neste aplicativo, você pode ativar ou desativar as etiquetas em [Configurações](settings). Estas treze peças seguem essa configuração — clique no link e alterne a caixa de seleção para ver como funciona.
tutorial.orient.numbers.title=Números
tutorial.orient.numbers.intro=As peças numéricas vêm em três naipes: Caracteres, Círculos e Bambus (de 1 a 9 cada).
# Passo guiado por destaque: linha superior curta opcional; o ensino fica no balão.
tutorial.orient.numbers.bamboo1=Uma face para notar
tutorial.orient.numbers.bamboo1_callout=O 1 de Bambu é tradicionalmente desenhado como um pássaro.
# Ensino de sequência (fim de Números): definição, depois etapas de “não é uma sequência”.
tutorial.orient.numbers.sequence=Uma sequência é **exatamente três** números consecutivos do mesmo naipe — por exemplo {234m}, {567p} ou {123s}.
tutorial.orient.numbers.four=Quatro peças consecutivas de um mesmo naipe **não** são uma sequência.
tutorial.orient.numbers.four_aside3=Deixe de lado o **3**.
tutorial.orient.numbers.four_aside6=Ou deixe de lado o **6**.
tutorial.orient.numbers.prompt=Encontre uma **sequência** — selecione as três peças dela.
tutorial.orient.honors.title=Honras
tutorial.orient.honors.intro=Ventos e dragões são peças de [hl]honra[/]. Eles **não** formam sequências numéricas.
tutorial.orient.honors.prompt=Selecione todas as peças de honra (ventos e dragões).
tutorial.orient.wall.title=Construindo a muralha
tutorial.orient.wall.faces=O conjunto completo de faces: três naipes de 1–9, mais quatro ventos e três dragões — 34 no total.
tutorial.orient.wall.copies=Cada face tem quatro peças — 136 no total.
tutorial.orient.wall.drawpile=A muralha é como um monte de compra nas cartas: as mãos iniciais e as compras durante o jogo vêm todas dela.
tutorial.orient.wall.ritual=Ao jogar em uma mesa real, construir a muralha é um ritual.
tutorial.orient.wall.facedown=Para construir uma muralha, primeiro vire as peças com a face para baixo...
tutorial.orient.wall.shuffle=E embaralhe-as bem.
tutorial.orient.wall.formed=Depois comece a formar a muralha: quatro lados de 17 pilhas, com duas peças de altura.
tutorial.orient.wall.pushed=As muralhas são empurradas para dentro para que as extremidades se encontrem.
tutorial.orient.wall.seats=Em cada mão, um jogador é Leste, o próximo é Sul, depois Oeste e depois Norte.
tutorial.orient.wall.east=Leste é o distribuidor e o primeiro a fazer uma jogada na mão.
tutorial.orient.wall.deal=Leste distribui lançando dois d6.
tutorial.orient.wall.dice=A soma dos dados determina onde a muralha é quebrada.
tutorial.orient.wall.count={0}+{1}={2}. A partir da extremidade direita da muralha de Leste, conte {2} pilhas.
tutorial.orient.wall.break=A muralha é quebrada após as pilhas contadas. As pilhas à esquerda delas se deslocam para a esquerda, abrindo uma lacuna.
tutorial.orient.wall.take7=Conte 7 pilhas à direita da lacuna.
tutorial.orient.wall.dead=Separe-as para formar uma muralha morta separada.
tutorial.orient.wall.dead_out=Essas 14 peças nunca são compradas, adicionando incerteza no fim da mão.
tutorial.orient.wall.hands=Para formar suas mãos, os jogadores pegam 2 pilhas cada após a lacuna, desmontando a muralha no sentido horário — três vezes.
tutorial.orient.wall.hands_13=Depois disso, cada jogador tem 3x4 = 12 peças. Eles pegam mais 1 peça cada para totalizar 13.
tutorial.orient.wall.east_14=Como Leste joga primeiro, ele começa seu turno pegando a 14ª peça.
tutorial.orient.wall.look_hands=Cada jogador olha para a sua mão...
tutorial.orient.wall.sort_hands=...e a organiza.
tutorial.orient.wall.east_discard=Agora, o jogador Leste precisa fazer sua primeira jogada descartando uma peça.
tutorial.orient.wall.app_table=Neste aplicativo, para economizar espaço na tela, a muralha viva é mostrada de forma simplificada, e a muralha morta não é mostrada.
tutorial.orient.wall.live_count=O **69** no centro é o número de peças restantes na muralha viva.

# Ordem das jogadas
tutorial.moves.east_player.title=Jogador Leste
tutorial.moves.east_player.four=Há [hl]quatro[/] jogadores. Em cada mão, um deles é [hl]Leste[/] (o distribuidor). Depois, no sentido anti-horário: [hl]Sul[/], [hl]Oeste[/] e [hl]Norte[/].
tutorial.moves.east_player.pass=Após cada mão, a atribuição de ventos também gira no [hl]sentido anti-horário[/]. O jogador que era Sul se torna o novo Leste.
tutorial.moves.discarding.title=Descartando
tutorial.moves.discarding.east_14=No início de qualquer mão, o jogador que é [hl]Leste[/] (o Distribuidor) tem [hl]14[/] peças na mão (diferente dos outros 3 jogadores, que têm [hl]13[/] peças cada).
tutorial.moves.discarding.east_hu=Se essas 14 peças formarem uma [hl]mão vencedora[/], Leste pode declarar a vitória ("[hl]Hu![/]") imediatamente — esta é a [Bênção do Céu](pattern-9.4.1).
tutorial.moves.discarding.east_hu_odds=Embora, estatisticamente, a chance de isso acontecer seja de [hl]1 em 328.909[/]. Você pode jogar mahjong a vida toda e nunca presenciar isso.
tutorial.moves.discarding.must_discard=Se esta mão não for vencedora (o que normalmente é o caso), Leste deve escolher uma de suas peças para [hl]descartar[/] e voltar a 13 peças.
tutorial.moves.discarding.least_useful=Ao descartar, tente se livrar da peça menos útil (uma que não pareça promissora o suficiente para formar padrões futuros).
tutorial.moves.discarding.others_claim=Os outros jogadores podem [hl]reclamar[/] a peça descartada para melhorar suas mãos ou até [hl]vencer[/].
tutorial.moves.counterclockwise.title=Ordem dos turnos
tutorial.moves.counterclockwise.this_tile=[hl]Clique nesta peça[/] para descartá-la.
tutorial.moves.counterclockwise.click_callout=Descarte-a
tutorial.moves.counterclockwise.if_nobody=Ninguém a [hl]reclamou[/], então ela permaneceu descartada.
tutorial.moves.counterclockwise.the_river=O [hl]rio[/] é como um monte de descarte nas cartas: as peças não reclamadas ficam com a face para cima na frente do jogador que as descartou.
tutorial.moves.counterclockwise.to_the_right=O turno sempre passa para o jogador à [hl]direita[/] de quem descartou.
tutorial.moves.counterclockwise.right_next=Você é [hl]Leste[/] (parte de baixo da mesa). A [hl]Direita[/] joga em seguida — ela comprou da muralha e depois descartará.
tutorial.moves.counterclockwise.right_discards=A Direita [hl]descarta[/] uma peça. Ninguém a reclamou, então o turno passa para a [hl]Frente[/], que compra da muralha.

# Reclamação
tutorial.claims.click_callout=Selecione isto
tutorial.claims.pung.title=Pung
tutorial.claims.pung.offer=A Frente descartou uma peça da qual você já tem um [hl]par[/] ({0}). [hl]Clique em Pung[/] para completar uma trinca.
tutorial.claims.pung.reveal=Reclamar uma peça descartada por outro jogador exige [hl]revelar[/] o grupo formado — aqui, a [hl]trinca[/].
tutorial.claims.pung.must_discard=Agora você tem [hl]14[/] peças e, como esta não é uma mão vencedora, você deve [hl]descartar[/] uma peça.
tutorial.claims.pung.skips_left=Como você a reclamou, a [hl]Esquerda[/] pula o turno dela — ela teria [hl]comprado da muralha[/] em seguida.
tutorial.claims.pung.third_for_two=Você pode reclamar uma [hl]terceira[/] para duas cópias. Você não pode reclamar uma [hl]segunda[/] para uma.
tutorial.claims.last_discard.title=Último descarte
tutorial.claims.last_discard.only_fresh=Você pode reclamar uma peça [hl]logo após[/] ela ser descartada. Você não pode reclamar uma peça que já está no [hl]rio[/].
tutorial.claims.last_discard.callout=Esta peça foi descartada por último
# Reclamação — Chow
tutorial.claims.chow.title=Chow
tutorial.claims.chow.offer=A Esquerda descartou uma peça ({0}) que completa uma [hl]sequência[/] com duas peças que você já tem. [hl]Clique em Chow[/] para completá-la.
tutorial.claims.chow.reveal=Reclamar uma peça descartada por outro jogador exige [hl]revelar[/] o grupo formado — aqui, a [hl]sequência[/].
tutorial.claims.chow.must_discard=Agora você tem [hl]14[/] peças e, como esta não é uma mão vencedora, você deve [hl]descartar[/] uma peça.
tutorial.claims.chow.only_left=Você pode fazer chow [hl]apenas[/] da [hl]Esquerda[/] (o jogador imediatamente antes de você). Descartes da Frente ou da Direita não podem receber chow.
tutorial.claims.hu.title=Hu
tutorial.claims.hu.offer=Aqui, sua mão vencedora está quase completa, e você está esperando um par. A Frente acabou de descartar a peça que você precisa ({0}). [hl]Clique em Hu[/] para reclamá-la.
tutorial.claims.hu.not_a_set=Quando uma peça descartada completa uma [hl]mão vencedora[/], você pode reclamá-la. Ela [hl]não[/] precisa completar um [hl]grupo[/] — aqui ela completou o [hl]par[/].
tutorial.claims.hu.breakdown=Se o painel de pontuação bloquear sua visão da mesa, você pode [hl]arrastá-lo[/] para o lado ou [hl]recolhê-lo e expandi-lo[/] usando o botão de chevron. Tente arrastá-lo ou recolhê-lo agora!

# Reclamação — Prioridade de reclamação
tutorial.claims.priority.title=Prioridade de reclamação
tutorial.claims.priority.conflict=A Esquerda acabou de descartar {3s}. Você tem {12s} e poderia fazer **Chow**, mas a Direita tem um par de {3s}. Tente reclamar [hl]Chow[/] para ver o que acontece!
tutorial.claims.priority.pung_beats_chow=Mesmo que você tenha reclamado Chow, [hl]Pung vence Chow[/]! A reclamação da Direita se sobrepõe à sua — a Direita pega a peça, e o seu turno é pulado!
tutorial.claims.priority.hierarchy=A hierarquia universal de reclamações é: [hl]Vitória (Hu)[/] vence [hl]Pung e Kong[/], que por sua vez vencem [hl]Chow[/].
tutorial.claims.priority.multi_win=Se vários jogadores reclamarem [hl]Hu[/] no mesmo descarte, o jogador mais próximo de quem descartou na ordem dos turnos vence (sem vitórias duplas).

# Kongs — Kong exposto grande
tutorial.kongs.melded.title=Kong Exposto
tutorial.kongs.melded.offer=A Frente descartou uma peça ({0}) que corresponde à sua trinca oculta. Clique em [hl]Kong[/] para declarar um kong!
tutorial.kongs.melded.reveal=Reclamar uma 4ª peça descartada expõe as quatro peças na mesa como um [hl]kong aberto[/].
tutorial.kongs.melded.one_kong=Formar um kong pontua [hl]5[/] pontos por [Um Kong](pattern-4.3.1) e aumenta com vários kongs.
tutorial.kongs.melded.compensation=Como um kong tem 4 peças, você compra uma [hl]peça suplementar[/] do final da muralha para manter um tamanho de mão válido.
tutorial.kongs.melded.must_discard=Após comprar a peça suplementar, você deve [hl]descartar[/] para completar seu turno.
tutorial.kongs.melded.already_melded=Você não pode reclamar uma 4ª peça descartada se a sua trinca já estiver exposta na mesa como um [hl]Pung[/] aberto.

# Kongs — Kong oculto
tutorial.kongs.concealed.title=Kong Oculto
tutorial.kongs.concealed.offer=Você acabou de pegar uma peça da muralha e tem as quatro cópias de {0}. Clique em [hl]Declarar Kong Oculto[/]!
tutorial.kongs.concealed.arrangement=Observe o conjunto: as duas **peças das extremidades estão fechadas** (com a face para baixo) para mostrar que ele permanece oculto, enquanto as peças centrais comprovam o grupo.
tutorial.kongs.concealed.scoring=No Zung Jung, ele permanece **oculto** para a pontuação — a [Mão Oculta](pattern-1.2) continua válida!
tutorial.kongs.concealed.compensation=Você compra uma [hl]peça suplementar[/] do final da muralha e depois descarta normalmente para encerrar seu turno.

# Kongs — Kong promovido
tutorial.kongs.promoted.title=Kong Promovido
tutorial.kongs.promoted.offer=Você tem um pung aberto de {0} e acabou de comprar a 4ª peça! Clique em [hl]Promover para Kong[/] para melhorar seu conjunto.
tutorial.kongs.promoted.upgraded=A quarta peça se junta ao seu pung aberto, transformando-o em um kong aberto e qualificando para [Um Kong](pattern-4.3.1).
tutorial.kongs.promoted.robbing=Aviso: este é o único momento em que os oponentes podem [Roubar o Kong](pattern-9.3) se esta peça completar a mão vencedora deles!
tutorial.kongs.promoted.compensation=Se for seguro, você compra uma [hl]peça suplementar[/] do final da muralha e descarta para completar seu turno.

# Mãos e pontuação — Ganhar uma mão
tutorial.hands.win.title=Ganhar uma mão
tutorial.hands.win.hand_size=Os jogadores normalmente seguram [hl]13[/] peças. Você só segura [hl]14[/] temporariamente ao comprar ou reclamar. Se você não vencer, deve descartar até voltar a 13.
tutorial.hands.win.patterns=Para ganhar uma mão, as peças da sua mão devem formar alguns padrões específicos.
tutorial.hands.win.all_in_groups=Normalmente, em uma mão vencedora, cada peça deve estar em um dos quatro [hl]grupos[/] ou no único [hl]par[/]. Isso geralmente são [hl]14[/] peças.
tutorial.hands.win.set_kinds=Um grupo é uma [hl]sequência[/], uma [hl]trinca[/] ou um [hl]kong[/].
tutorial.hands.win.kong_size=Aqui, um dos quatro grupos é um [hl]kong[/]. Por causa desse kong, a mão tem [hl]15[/] peças, não 14.

# Mãos e pontuação — Mão sem figura
tutorial.hands.chicken.title=Mão sem figura
tutorial.hands.chicken.one=Se nenhuma pontuação especial se aplica a esta mão, ela é chamada de [hl]mão sem figura[/] e vale [hl]1[/] ponto.
tutorial.hands.chicken.tournament=Em torneios, as mãos sem figura podem ser [hl]proibidas[/] — a mão precisa valer pelo menos [hl]5[/] pontos para contar como vencedora.
tutorial.hands.chicken.next=Nas próximas lições, abordaremos os padrões básicos de pontuação que permitem a uma mão pontuar [hl]5[/] ou mais pontos.

# Mãos e pontuação — Mão oculta
tutorial.hands.concealed.title=Mão oculta
tutorial.hands.concealed.offer=A Frente descartou uma peça ({0}) que completa uma sequência com duas peças que você já tem. Você não pode fazer Chow da Frente — mas como ela completa sua mão, você pode reclamar [hl]Hu 5[/]! Clique em [hl]Hu[/] para vencer.
tutorial.hands.concealed.points=Cada oponente paga a pontuação da mão ao vencedor. Para uma mão de [hl]5[/] pontos, todos os três pagam 5 cada — rendendo a você [hl]3×[/] a pontuação da mão ([hl]+15[/] pontos)!
tutorial.hands.concealed.concealed_rule=Uma mão é [hl]oculta[/] se você não fez nenhuma reclamação aberta (como **Chow** ou **Pung**) antes de declarar a vitória.
tutorial.hands.concealed.discard_win=Mesmo que você tenha reclamado o descarte da Frente para completar aquela sequência final, vencer em um descarte é [hl]permitido[/] — apenas conjuntos abertos feitos *antes* da vitória quebram a Mão Oculta.
tutorial.hands.concealed.kongs=Reclamar qualquer [hl]Chow[/], [hl]Pung[/] ou [hl]Kong[/] mais cedo na mão expõe esse grupo na mesa, tornando sua mão aberta e quebrando este padrão.

# Mãos e pontuação — Todas as sequências
tutorial.hands.all_sequences.title=Todas as sequências
tutorial.hands.all_sequences.offer=A Frente descartou uma peça ({0}) que completa sua quarta sequência. Mesmo que sua mão esteja aberta por causa de um Chow anterior, o botão oferece [hl]Hu 5[/]! Clique em [hl]Hu[/] para vencer.
tutorial.hands.all_sequences.points=Uma mão em que todos os quatro grupos são sequências (sem trincas nem kongs) pontua [hl]5[/] pontos por [Todas as Sequências](pattern-1.1).
tutorial.hands.all_sequences.open_allowed=Diferente da Mão Oculta, [Todas as Sequências](pattern-1.1) permite Chows abertos. Mesmo com um conjunto aberto na mesa, ter quatro sequências ainda concede 5 pontos.
tutorial.hands.all_sequences.unrestricted=Qualquer par é permitido — até honras de dragão ou vento — e qualquer tipo de espera se qualifica.

# Mãos e pontuação — Sem terminais
tutorial.hands.no_terminals.title=Sem terminais
tutorial.hands.no_terminals.offer=A Frente descartou uma peça ({0}) que completa sua mão vencedora. Cada peça da sua mão é um número simples de 2 a 8. Clique em [hl]Hu[/] para vencer.
tutorial.hands.no_terminals.terminals_def=Nos três naipes numéricos, as peças das extremidades — **1** e **9** ({1m}, {9s}) — são chamadas de [hl]terminais[/]. As peças internas de **2** a **8** são chamadas de [hl]simples[/]. As honras não se encaixam em nenhuma das duas categorias.
tutorial.hands.no_terminals.points=O padrão [Sem Terminais](pattern-1.3) vale [hl]5[/] pontos. Cada peça da mão — todos os quatro grupos e o par — deve ser uma [hl]simples[/], sem terminais e sem honras.
tutorial.hands.no_terminals.flexibility=Observe que esta mão tem uma trinca aberta ({5p}{5p}{5p}), então ela não é nem oculta nem todas as sequências. Mas como cada peça é uma simples, ela se qualifica para [hl]Sem Terminais (5 pts)[/]!
tutorial.hands.no_terminals.stacking=Sem Terminais também pode [hl]acumular[/] com outros padrões como [Todas as Sequências](pattern-1.1) ou [Mão Oculta](pattern-1.2) quando aplicáveis, combinando para 10 ou 15 pontos.

# Mãos e pontuação — Kongs
tutorial.hands.kongs.title=Kongs
tutorial.hands.kongs.offer=A Frente descartou uma peça ({0}) que completa sua mão vencedora. Você já tem dois kongs abertos na mesa. Clique em [hl]Hu[/] para vencer.
tutorial.hands.kongs.two_kongs=Como vimos antes, ter [Um Kong](pattern-4.3.1) concede [hl]5[/] pontos. Ter **dois kongs** eleva a pontuação para [hl]20[/] pontos por [Dois Kongs](pattern-4.3.2)!
tutorial.hands.kongs.hand_size=Como cada kong usa 4 peças em vez de 3 e compra uma peça de compensação, esta mão vencedora tem [hl]16[/] peças em vez das 14 habituais.
tutorial.hands.kongs.ladder=Padrões de kong mais altos sobem acentuadamente: [Três Kongs](pattern-4.3.3) pontua [hl]120[/] pontos, e [Quatro Kongs](pattern-4.3.4) pontua o limite de [hl]480[/] pontos!

# Mãos e pontuação — Honra de valor
tutorial.hands.value_honor.title=Honra de valor
tutorial.hands.value_honor.offer=A Frente descartou uma peça ({0}) que completa sua mão. Sua trinca aberta de dragões Vermelhos faz esta mão valer [hl]Hu 10[/]! Clique em [hl]Hu[/] para vencer.
tutorial.hands.value_honor.dragons=Uma trinca ou kong de uma [hl]honra de valor[/] vale [hl]10[/] pontos ([Honra de Valor](pattern-3.1)). Qualquer um dos três dragões — **Vermelho** ({C}), **Verde** ({F}) ou **Branco** ({P}) — é sempre uma honra de valor para todos os jogadores.
tutorial.hands.value_honor.seat_winds=Seu próprio **vento de assento** (como {E} para o assento Leste) também é uma honra de valor. Os ventos dos outros três assentos ("ventos convidados") não pontuam. No Zung Jung, **não há vento predominante ou de rodada**.
tutorial.hands.value_honor.stacking=Honra de Valor conta [hl]cumulativamente por grupo[/]: ter duas trincas qualificadas pontua [hl]20[/] pontos. Conjuntos abertos são permitidos, mas **pares** nunca pontuam — apenas trincas e kongs contam.

# Mãos e pontuação — Todas as trincas
tutorial.hands.all_triplets.title=Todas as trincas
tutorial.hands.all_triplets.offer=A Frente descartou uma peça ({0}) que completa sua mão em quatro trincas e um par. Clique em [hl]Hu[/] para vencer!
tutorial.hands.all_triplets.pattern=O padrão [Todas as Trincas](pattern-4.1) exige quatro trincas (ou kongs) e um par, sem sequências. Pungs abertos são permitidos, e o padrão concede generosos [hl]30[/] pontos!
tutorial.hands.all_triplets.settlement_cap=Em uma vitória por descarte acima de 25 pontos, os não-descartadores são [hl]limitados a 25 pontos[/] (Esquerda/Direita pagam [hl]-25[/]). Quem descartou cobre ambas as diferenças: 30 + 5 + 5 = **40** ([hl]-40[/])!
tutorial.hands.all_triplets.self_draw=Você ainda recebe os **90 pontos** completos (3 \u00d7 30). Em uma **compra própria**, não há descartador, então todos os três oponentes pagam os 30 pontos completos.

# Mãos e pontuação — Sequência de nove peças
tutorial.hands.nine_tile_straight.title=Sequência de nove peças
tutorial.hands.nine_tile_straight.offer=A Frente descartou uma peça ({0}) que completa sua mão em uma sequência de 1 a 9 em caracteres. Clique em [hl]Hu[/] para vencer!
tutorial.hands.nine_tile_straight.pattern=O padrão [Sequência de Nove Peças](pattern-7.1) vale enormes [hl]40[/] pontos! Ele exige três sequências abrangendo **1 a 9 em um único naipe** ({1m} a {9m}). Chows abertos são permitidos.
tutorial.hands.nine_tile_straight.composition=As 5 peças restantes podem ser qualquer grupo e par válidos em qualquer naipe. Aqui, uma trinca de {555p} e um par de {99s} completam sua mão vencedora de 14 peças.
tutorial.hands.nine_tile_straight.settlement=Com uma mão de 40 pontos, os não-descartadores são limitados a [hl]-25[/]. A Frente cobre os 40 dela mais ambas as diferenças de 15 pontos ([hl]-70[/]), rendendo a você [hl]+120[/] pontos (3 \u00d7 40)!

# Mãos e pontuação — Sete pares
tutorial.hands.seven_pairs.title=Sete pares
tutorial.hands.seven_pairs.offer=A Frente descartou uma peça ({0}) que completa sua mão em sete pares. Clique em [hl]Hu[/] para vencer!
tutorial.hands.seven_pairs.pattern=Todas as mãos vencedoras até agora eram compostas de 4 grupos e 1 par. [Sete Pares](pattern-10.2) é uma [hl]mão irregular[/] — ela quebra essa regra ao completar **sete pares** por [hl]30[/] pontos!
tutorial.hands.seven_pairs.concealed_only=Sete Pares deve ser [hl]totalmente oculta[/]. Você não pode chamar Chow, Pung ou Kong — todos os pares devem ser comprados da muralha. No entanto, você pode reclamar a peça final no descarte de um oponente para completar seu 7º par!
tutorial.hands.seven_pairs.four_of_a_kind=Esperar em Sete Pares é sempre uma [hl]espera de peça única[/] no seu 7º par. No Zung Jung, ter todas as **quatro cópias** da mesma peça (sem declarar um kong) é contado oficialmente como **dois pares**.

# Mãos e pontuação — Duas sequências idênticas
tutorial.hands.two_identical_sequences.title=Duas sequências idênticas
tutorial.hands.two_identical_sequences.offer=A Frente descartou uma peça ({0}) que completa sua segunda sequência idêntica. Clique em [hl]Hu[/] para vencer!
tutorial.hands.two_identical_sequences.pattern=[Duas Sequências Idênticas](pattern-5.1.1) concede [hl]10[/] pontos por duas sequências iguais em um naipe ({234s} e {234s}). Na mão, elas parecem pares consecutivos ({223344s}). Chows abertos são permitidos!
tutorial.hands.two_identical_sequences.ladder=Níveis mais altos desta série concedem pontos enormes: [Três Sequências Idênticas](pattern-5.1.3) pontua [hl]120[/] pontos, e [Quatro Sequências Idênticas](pattern-5.1.4) pontua o limite de [hl]480[/] pontos!

# Mãos e pontuação — Duas trincas ocultas
tutorial.hands.two_concealed_triplets.title=Duas trincas ocultas
tutorial.hands.two_concealed_triplets.offer=A Frente descartou uma peça ({0}) que completa sua mão. Clique em [hl]Hu[/] para vencer!
tutorial.hands.two_concealed_triplets.pattern=[Duas Trincas Ocultas](pattern-4.2.1) concede [hl]5[/] pontos por duas trincas formadas inteiramente na sua mão oculta ({333p} e {666s}). Pungs abertos não se qualificam!
tutorial.hands.two_concealed_triplets.ladder=As trincas ocultas aumentam acentuadamente: [Três Trincas Ocultas](pattern-4.2.2) concede [hl]30[/] pontos, e [Quatro Trincas Ocultas](pattern-4.2.3) concede [hl]125[/] pontos!

# Mãos e pontuação — Três trincas semelhantes
tutorial.hands.three_similar_triplets.title=Três trincas semelhantes
tutorial.hands.three_similar_triplets.offer=A Frente descartou uma peça ({0}) que completa sua mão. Clique em [hl]Hu[/] para vencer!
tutorial.hands.three_similar_triplets.pattern=[Três Trincas Semelhantes](pattern-6.2.2) concede enormes [hl]120[/] pontos por ter trincas do **mesmo número** nos três naipes ({555m}, {555p}, {555s}). Pungs abertos são permitidos!
tutorial.hands.three_similar_triplets.small_triplets=A forma menor, [Três Trincas Semelhantes Pequenas](pattern-6.2.1), concede [hl]30[/] pontos por **duas trincas e um par** do mesmo número ({555m}, {555p} e {55s}). Iniciantes muitas vezes a ignoram, mas é muito mais realista de alcançar!

# Mãos e pontuação — Mãos de naipe único
tutorial.hands.one_suit.title=Mãos de naipe único
tutorial.hands.one_suit.offer=A Frente descartou uma peça ({0}) que completa sua mão em círculos e honras. Clique em [hl]Hu[/] para vencer!
tutorial.hands.one_suit.mixed=Ter peças de apenas **um naipe numérico** (em laranja) junto com **honras** (em azul) pontua [hl]40[/] pontos por [Naipe Único Misto](pattern-2.1.1). Chows e pungs abertos são permitidos!
tutorial.hands.one_suit.pure=Se você eliminar completamente as peças de honra, [Naipe Único Puro](pattern-2.1.2) dobra a pontuação para [hl]80[/] pontos! Cada grupo e o par agora pertencem a esse único naipe.

# Mãos e pontuação — Mais padrões
tutorial.hands.more_patterns.title=Mais padrões
tutorial.hands.more_patterns.rarer=Cobrimos os padrões principais. Muitas mãos mais raras — como a série de dragões, mãos de ventos e mãos limite — estão detalhadas na [Referência](reference).
tutorial.hands.more_patterns.practice=Você pode consultar a [Referência](reference) a qualquer momento no menu do jogo durante a partida para verificar as regras dos padrões e os valores de pontuação. Bom jogo!

