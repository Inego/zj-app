tutorial.moves.counterclockwise.if_nobody=Kimse taşı [hl]almadı[/], bu yüzden atılmış olarak kaldı.
tutorial.moves.counterclockwise.the_river=[hl]Nehir[/], kart oyunlarındaki atık destesi gibidir: alınmayan taşlar, onları atan oyuncunun önünde açık durur.
tutorial.moves.counterclockwise.to_the_right=Sıra her zaman taşı atan oyuncunun [hl]sağındaki[/] oyuncuya geçer.
tutorial.moves.counterclockwise.right_next=Siz [hl]Doğu[/]sunuz (masanın alt tarafı). Sırada [hl]Sağ[/] oynar — duvardan taş çekti, ardından bir taş atacak.
tutorial.moves.counterclockwise.right_discards=Sağdaki bir taş [hl]atar[/]. Kimse almadığı için sıra duvardan taş çeken [hl]Karşı[/] oyuncuya geçer.

# Taş alma
tutorial.claims.click_callout=Bunu seçin
tutorial.claims.pung.title=Pung
tutorial.claims.pung.offer=Karşı oyuncu elinizde zaten bir [hl]çift[/] bulunan taştan attı ({0}). Bir üçlü tamamlamak için [hl]Pung'a tıklayın[/].
tutorial.claims.pung.reveal=Başka bir oyuncunun attığı taşı almak, oluşan grubun — burada [hl]üçlü[/] — [hl]açılmasını[/] gerektirir.
tutorial.claims.pung.must_discard=Şimdi elinizde [hl]14[/] taş var ve bu kazanan bir el olmadığından bir taş [hl]atmalısınız[/].
tutorial.claims.pung.skips_left=Taşı aldığınız için [hl]Sol[/] oyuncu sırasını atlar — normalde sırada [hl]duvardan o taş çekecekti[/].
tutorial.claims.pung.third_for_two=İki kopyanız varken [hl]üçüncü[/] taşı alabilirsiniz. Bir kopyanız varken [hl]ikinci[/] taşı alamazsınız.
tutorial.claims.last_discard.title=Son atılan taş
tutorial.claims.last_discard.only_fresh=Bir taşı yalnızca atıldığı [hl]hemen o anda[/] alabilirsiniz. Zaten [hl]nehirde[/] bulunan bir taşı sonradan alamazsınız.
tutorial.claims.last_discard.callout=En son bu taş atıldı
tutorial.claims.chow.title=Chow
tutorial.claims.chow.offer=Sol oyuncu elinizdeki iki taşla [hl]sıralı bir grup[/] oluşturan bir taş attı ({0}). Tamamlamak için [hl]Chow'a tıklayın[/].
tutorial.claims.chow.reveal=Başka bir oyuncunun attığı taşı almak, oluşan grubun — burada [hl]sıralı grup[/] — [hl]açılmasını[/] gerektirir.
tutorial.claims.chow.must_discard=Şimdi elinizde [hl]14[/] taş var ve bu kazanan bir el olmadığından bir taş [hl]atmalısınız[/].
tutorial.claims.chow.only_left=Chow'u [hl]yalnızca[/] [hl]Sol[/] oyuncudan (hemen sizden önceki oyuncu) alabilirsiniz. Karşı veya Sağ oyuncunun attığı taşlar Chow yapılamaz.
tutorial.claims.hu.title=Hu
tutorial.claims.hu.offer=Burada kazanan eliniz neredeyse tamamlandı ve bir çift bekliyorsunuz. Karşı oyuncu tam ihtiyacınız olan taşı attı ({0}). Almak için [hl]Hu'ya tıklayın[/].
tutorial.claims.hu.not_a_set=Atılan bir taş [hl]kazanan eli[/] tamamladığında onu alabilirsiniz. Bir [hl]grup[/] tamamlaması gerekmez — burada [hl]çifti[/] tamamladı.
tutorial.claims.hu.breakdown=Puan dökümü paneli masayı görmenizi engelliyorsa, [hl]sürükleyerek[/] kenara çekebilir veya ok düğmesini kullanarak [hl]daraltıp genişletebilirsiniz[/]. Şimdi sürüklemeyi veya daraltmayı deneyin!

# Hamle önceliği
tutorial.claims.priority.title=Hamle önceliği
tutorial.claims.priority.conflict=Sol oyuncu az önce {3s} attı. Elinizde {12s} var ve **Chow** yapabilirsiniz, ancak Sağ oyuncuda bir çift {3s} var. Ne olduğunu görmek için [hl]Chow[/] yapmayı deneyin!
tutorial.claims.priority.pung_beats_chow=Siz Chow talep etseniz bile [hl]Pung Chow'u yener[/]! Sağ oyuncunun talebi sizinkini geçersiz kılar — Sağ taşı alır ve sıranız atlanır!
tutorial.claims.priority.hierarchy=Evrensel öncelik hiyerarşisi şöyledir: [hl]Galibiyet (Hu)[/] [hl]Pung ve Kong[/]'u yener; bunların her ikisi de [hl]Chow[/]'u yener.
tutorial.claims.priority.multi_win=Aynı atılan taşa birden fazla oyuncu [hl]Hu[/] derse, hamle sırasına göre taşı atana en yakın olan oyuncu kazanır (çifte galibiyet yoktur).

# Konglar — Büyük açık kong
tutorial.kongs.melded.title=Açık Kong
tutorial.kongs.melded.offer=Karşı oyuncu kapalı üçlünüzle eşleşen bir taş ({0}) attı. Dörtlü ilan etmek için [hl]Kong[/]'a tıklayın!
tutorial.kongs.melded.reveal=Atılan 4. taşı almak, masadaki dörtlü seti [hl]açık kong[/] olarak gösterir.
tutorial.kongs.melded.one_kong=Bir kong oluşturmak [Bir Kong](pattern-4.3.1) için [hl]5[/] puan kazandırır ve birden fazla kong ile artar.
tutorial.kongs.melded.compensation=Kong 4 taştan oluştuğundan geçerli el boyutunu korumak için duvarın sonundan bir [hl]tamamlayıcı taş[/] çekersiniz.
tutorial.kongs.melded.must_discard=Tamamlayıcı taşı çektikten sonra sıranızı tamamlamak için bir taş [hl]atmalısınız[/].
tutorial.kongs.melded.already_melded=Üçlünüz masada açık bir [hl]Pung[/] olarak zaten duruyorsa atılan 4. taşı talep edemezsiniz.

# Konglar — Kapalı kong
tutorial.kongs.concealed.title=Kapalı Kong
tutorial.kongs.concealed.offer=Duvardan bir taş çektiniz ve {0} taşının dört kopyasına da sahipsiniz. [hl]Kapalı Kong İlan Et[/]'e tıklayın!
tutorial.kongs.concealed.arrangement=Açılışa dikkat edin: kapalı kaldığını göstermek için iki **kenar taş kapalıdır** (yüzüstü), ortadaki taşlar ise seti doğrular.
tutorial.kongs.concealed.scoring=Zung Jung'da puanlama açısından **kapalı** sayılmaya devam eder — [Kapalı El](pattern-1.2) bozulmaz!
tutorial.kongs.concealed.compensation=Duvarın sonundan bir [hl]tamamlayıcı taş[/] çeker, ardından sıranızı tamamlamak için normal şekilde taş atarsınız.

# Konglar — Yükseltilmiş kong
tutorial.kongs.promoted.title=Yükseltilmiş Kong
tutorial.kongs.promoted.offer=Açık bir {0} pungunuz var ve az önce 4. taşı çektiniz! Setinizi yükseltmek için [hl]Kong'a Yükselt[/]'e tıklayın.
tutorial.kongs.promoted.upgraded=Dördüncü taş açık pungunuza katılarak onu açık bir konga dönüştürür ve [Bir Kong](pattern-4.3.1) puanına hak kazanır.
tutorial.kongs.promoted.robbing=Uyarı: Rakiplerin elini tamamlıyorsa [Kong Çalma](pattern-9.3) yapabilecekleri tek an budur!
tutorial.kongs.promoted.compensation=Güvendeyse duvarın sonundan bir [hl]tamamlayıcı taş[/] çeker ve sıranızı tamamlamak için taş atarsınız.

# Eller ve puanlama — El kazanma
tutorial.hands.win.title=El kazanma
tutorial.hands.win.hand_size=Oyuncular normalde [hl]13[/] taş tutar. Yalnızca taş çekerken veya alırken geçici olarak [hl]14[/] taş tutarsınız. Kazanamazsanız tekrar 13 taşa düşmelisiniz.
tutorial.hands.win.patterns=Bir eli kazanmak için elinizdeki taşların belirli kombinasyonları oluşturması gerekir.
tutorial.hands.win.all_in_groups=Normalde kazanan bir elde her taş dört [hl]gruptan[/] birinde veya tek [hl]çiftin[/] içinde olmalıdır. Bu genellikle [hl]14[/] taştır.
tutorial.hands.win.set_kinds=Bir grup; [hl]sıralı[/], [hl]üçlü[/] veya [hl]kong[/] olabilir.
tutorial.hands.win.kong_size=Burada dört gruptan biri [hl]kong[/]dur. Bu kong nedeniyle el 14 değil [hl]15[/] taşa sahiptir.

# Eller ve puanlama — Kombinasyonsuz el
tutorial.hands.chicken.title=Kombinasyonsuz el
tutorial.hands.chicken.one=Bu ele hiçbir özel puan kombinasyonu uygulanmıyorsa buna [hl]kombinasyonsuz el[/] denir ve [hl]1[/] puan değerindedir.
tutorial.hands.chicken.tournament=Turnuvalarda kombinasyonsuz eller [hl]yasaklanabilir[/] — bir elin kazanabilir sayılması için en az [hl]5[/] puan değerinde olması gerekir.
tutorial.hands.chicken.next=Sonraki derslerde bir elin [hl]5[/] veya daha fazla puan almasını sağlayan temel puan kombinasyonlarını ele alacağız.

# Eller ve puanlama — Kapalı el
tutorial.hands.concealed.title=Kapalı el
tutorial.hands.concealed.offer=Karşı oyuncu elinizdeki iki taşla bir sıralı tamamlayan bir taş attı ({0}). Karşı oyuncudan Chow alamazsınız — ancak elinizi tamamladığı için [hl]Hu 5[/] diyebilirsiniz! Kazanmak için [hl]Hu[/]'ya tıklayın.
tutorial.hands.concealed.points=Her rakip el puanını kazanana öder. [hl]5[/] puanlık bir el için üç oyuncu da 5'er puan öder — böylece el puanının [hl]3 katını[/] ([hl]+15[/] puan) kazanırsınız!
tutorial.hands.concealed.concealed_rule=Galibiyeti ilan etmeden önce hiçbir açık hamle (**Chow** veya **Pung** gibi) yapmadıysanız el [hl]kapalı[/] kabul edilir.
tutorial.hands.concealed.discard_win=Son sıralıyı tamamlamak için Karşı oyuncunun attığı taşı almış olsanız bile atılan taşla kazanmaya [hl]izin verilir[/] — yalnızca galibiyetten *önce* yapılan açık hamleler Kapalı El'i bozar.
tutorial.hands.concealed.kongs=Elin daha önceki aşamalarında herhangi bir [hl]Chow[/], [hl]Pung[/] veya [hl]Kong[/] almak o seti masaya açar, elinizi açık hale getirir ve bu kombinasyonu bozar.

# Eller ve puanlama — Hepsi sıralı
tutorial.hands.all_sequences.title=Hepsi sıralı
tutorial.hands.all_sequences.offer=Karşı oyuncu dördüncü sıralı grubunuzu tamamlayan bir taş attı ({0}). Eliniz önceki bir Chow nedeniyle açık olsa bile düğme [hl]Hu 5[/] sunar! Kazanmak için [hl]Hu[/]'ya tıklayın.
tutorial.hands.all_sequences.points=Dört grubun da sıralı olduğu (üçlü veya kong içermeyen) bir el, [Hepsi Sıralı](pattern-1.1) kombinasyonundan [hl]5[/] puan alır.
tutorial.hands.all_sequences.open_allowed=Kapalı El'in aksine, [Hepsi Sıralı](pattern-1.1) açık Chow'lara izin verir. Masada açık bir grup olsa bile dört sıralıya sahip olmak yine de 5 puan kazandırır.
tutorial.hands.all_sequences.unrestricted=Herhangi bir çift kabul edilir — ejderha veya rüzgar onurları bile olabilir — ve her türlü bekleyiş geçerlidir.

# Eller ve puanlama — Uç taşsız
tutorial.hands.no_terminals.title=Uç taşsız
tutorial.hands.no_terminals.offer=Karşı oyuncu kazanan elinizi tamamlayan bir taş attı ({0}). Elinizdeki her taş 2'den 8'e kadar olan basit sayılardır. Kazanmak için [hl]Hu[/]'ya tıklayın.
tutorial.hands.no_terminals.terminals_def=Üç sayılı grupta uç taşlara — **1** ve **9** ({1m}, {9s}) — [hl]uç taşlar[/] denir. **2**'den **8**'e kadar olan iç taşlara [hl]sıradan sayılar[/] denir. Onurlar ikisi de değildir.
tutorial.hands.no_terminals.points=[Uç Taşsız](pattern-1.3) kombinasyonu [hl]5[/] puan değerindedir. Eldeki her taş — dört grup ve çift — uç taş veya onur içermeyen [hl]sıradan sayılardan[/] oluşmalıdır.
tutorial.hands.no_terminals.flexibility=Bu elin açık bir üçlüye ({5p}{5p}{5p}) sahip olduğuna dikkat edin; yani ne kapalı el ne de hepsi sıralıdır. Ancak her taş sıradan sayı olduğundan [hl]Uç Taşsız (5 puan)[/] almaya hak kazanır!
tutorial.hands.no_terminals.stacking=Uç Taşsız, geçerli olduğunda [Hepsi Sıralı](pattern-1.1) veya [Kapalı El](pattern-1.2) gibi diğer kombinasyonlarla [hl]birleşerek[/] 10 veya 15 puan getirebilir.

# Eller ve puanlama — Konglar
tutorial.hands.kongs.title=Konglar
tutorial.hands.kongs.offer=Karşı oyuncu kazanan elinizi tamamlayan bir taş attı ({0}). Masada zaten iki açık kongunuz var. Kazanmak için [hl]Hu[/]'ya tıklayın.
tutorial.hands.kongs.two_kongs=Daha önce gördüğümüz gibi [Bir Kong](pattern-4.3.1) sahibi olmak [hl]5[/] puan kazandırır. **İki konga** sahip olmak puanı [İki Kong](pattern-4.3.2) için [hl]20[/] puana yükseltir!
tutorial.hands.kongs.hand_size=Her kong 3 yerine 4 taş aldığından ve bir tamamlama taşı çektiğinden bu kazanan el alışılagelmiş 14 yerine [hl]16[/] taşa sahiptir.
tutorial.hands.kongs.ladder=Daha yüksek kong kombinasyonları hızla yükselir: [Üç Kong](pattern-4.3.3) [hl]120[/] puan ve [Dört Kong](pattern-4.3.4) [hl]480[/] puanlık üst limiti verir!

# Eller ve puanlama — Değerli onur
tutorial.hands.value_honor.title=Değerli onur
tutorial.hands.value_honor.offer=Karşı oyuncu elinizi tamamlayan bir taş attı ({0}). Kırmızı ejderha açık üçlünüz bu eli [hl]Hu 10[/] değerinde yapar! Kazanmak için [hl]Hu[/]'ya tıklayın.
tutorial.hands.value_honor.dragons=Bir [hl]değerli onur[/] üçlüsü veya kongu [hl]10[/] puan değerindedir ([Değerli Onur](pattern-3.1)). Üç ejderhadan herhangi biri — **Kırmızı** ({C}), **Yeşil** ({F}) veya **Beyaz** ({P}) — her oyuncu için her zaman değerli onurdur.
tutorial.hands.value_honor.seat_winds=Kendi **koltuk rüzgarınız** da (Doğu koltuğu için {E} gibi) değerli onurdur. Diğer üç koltuğun rüzgarları ("misafir rüzgarlar") puan kazandırmaz. Zung Jung'da **hakim veya tur rüzgarı yoktur**.
tutorial.hands.value_honor.stacking=Değerli Onur [hl]set başına kümülatif[/] olarak sayılır: iki geçerli üçlüye sahip olmak [hl]20[/] puan verir. Açık setlere izin verilir ancak **çiftler** asla puan kazandırmaz — yalnızca üçlüler ve konglar sayılır.

# Eller ve puanlama — Hepsi üçlü
tutorial.hands.all_triplets.title=Hepsi üçlü
tutorial.hands.all_triplets.offer=Karşı oyuncu elinizi dört üçlü ve bir çifte tamamlayan bir taş attı ({0}). Kazanmak için [hl]Hu[/]'ya tıklayın!
tutorial.hands.all_triplets.pattern=[Hepsi Üçlü](pattern-4.1) kombinasyonu hiç sıralı olmadan dört üçlü (veya kong) ve bir çift gerektirir. Açık punglara izin verilir ve kombinasyon cömert bir [hl]30[/] puan kazandırır!
tutorial.hands.all_triplets.settlement_cap=25 puanın üzerindeki bir atılan taş galibiyetinde, taşı atmayanlar [hl]25 puanla sınırlandırılır[/] (Sol/Sağ [hl]-25[/] öder). Taşı atan oyuncu her iki açığı da kapatır: 30 + 5 + 5 = **40** ([hl]-40[/])!
tutorial.hands.all_triplets.self_draw=Yine de toplam **90 puanın** tamamını alırsınız (3 \u00d7 30). **Duvardan çekerek kazanmada** taşı atan kimse olmadığından üç rakip de tam 30 puan öder.

# Eller ve puanlama — Dokuz taşlık seri
tutorial.hands.nine_tile_straight.title=Dokuz taşlık seri
tutorial.hands.nine_tile_straight.offer=Karşı oyuncu elinizi karakterlerde 1'den 9'a kadar bir seriye tamamlayan bir taş attı ({0}). Kazanmak için [hl]Hu[/]'ya tıklayın!
tutorial.hands.nine_tile_straight.pattern=[Dokuz Taşlık Seri](pattern-7.1) kombinasyonu tam [hl]40[/] puan değerindedir! **Tek bir renkte 1'den 9'a** uzanan üç sıralı grup gerektirir ({1m} ile {9m} arası). Açık chow'lara izin verilir.
tutorial.hands.nine_tile_straight.composition=Kalan 5 taş herhangi bir renkte geçerli bir grup ve çift olabilir. Burada bir {555p} üçlüsü ve bir {99s} çifti 14 taşlık kazanan elinizi tamamlar.
tutorial.hands.nine_tile_straight.settlement=40 puanlık bir elde, taşı atmayanlar [hl]-25[/] ile sınırlandırılır. Karşı oyuncu kendi 40 puanı artı iki adet 15 puanlık açığı ([hl]-70[/]) karşılar ve size [hl]+120[/] puan (3 \u00d7 40) kazandırır!

# Eller ve puanlama — Yedi çift
tutorial.hands.seven_pairs.title=Yedi çift
tutorial.hands.seven_pairs.offer=Karşı oyuncu elinizi yedi çifte tamamlayan bir taş attı ({0}). Kazanmak için [hl]Hu[/]'ya tıklayın!
tutorial.hands.seven_pairs.pattern=Şimdiye kadarki tüm kazanan eller 4 grup ve 1 çiftten oluşuyordu. [Yedi Çift](pattern-10.2) [hl]özel bir eldir[/] — **yedi çifti** tamamlayarak bu kuralı bozar ve [hl]30[/] puan kazandırır!
tutorial.hands.seven_pairs.concealed_only=Yedi Çift [hl]tamamen kapalı[/] olmalıdır. Chow, Pung veya Kong diyemezsiniz — tüm çiftler duvardan çekilmelidir. Ancak 7. çiftinizi tamamlamak için bir rakibin attığı son taşı alabilirsiniz!
tutorial.hands.seven_pairs.four_of_a_kind=Yedi Çift'i beklemek her zaman 7. çiftiniz üzerinde [hl]tek taşlık bir bekleyiştir[/]. Zung Jung'da aynı taştan **dört kopyaya** sahip olmak (kong ilan etmeden) yasal olarak **iki çift** sayılır.

# Eller ve puanlama — İki özdeş sıralı
tutorial.hands.two_identical_sequences.title=İki özdeş sıralı
tutorial.hands.two_identical_sequences.offer=Karşı oyuncu ikinci özdeş sıralı grubunuzu tamamlayan bir taş attı ({0}). Kazanmak için [hl]Hu[/]'ya tıklayın!
tutorial.hands.two_identical_sequences.pattern=[İki Özdeş Sıralı](pattern-5.1.1), tek bir renkte iki eşleşen sıralı grup ({234s} ve {234s}) için [hl]10[/] puan kazandırır. Elde ardışık çiftler gibi görünürler ({223344s}). Açık chow'lara izin verilir!
tutorial.hands.two_identical_sequences.ladder=Bu serideki daha yüksek kademeler devasa puanlar kazandırır: [Üç Özdeş Sıralı](pattern-5.1.3) [hl]120[/] puan ve [Dört Özdeş Sıralı](pattern-5.1.4) [hl]480[/] puanlık üst limiti verir!

# Eller ve puanlama — İki kapalı üçlü
tutorial.hands.two_concealed_triplets.title=İki kapalı üçlü
tutorial.hands.two_concealed_triplets.offer=Karşı oyuncu elinizi tamamlayan bir taş attı ({0}). Kazanmak için [hl]Hu[/]'ya tıklayın!
tutorial.hands.two_concealed_triplets.pattern=[İki Kapalı Üçlü](pattern-4.2.1), tamamen kapalı elinizde oluşturulan iki üçlü için ({333p} ve {666s}) [hl]5[/] puan verir. Açık punglar sayılmaz!
tutorial.hands.two_concealed_triplets.ladder=Kapalı üçlüler katlanarak artar: [Üç Kapalı Üçlü](pattern-4.2.2) [hl]30[/] puan, [Dört Kapalı Üçlü](pattern-4.2.3) ise [hl]125[/] puan kazandırır!

# Eller ve puanlama — Üç benzer üçlü
tutorial.hands.three_similar_triplets.title=Üç benzer üçlü
tutorial.hands.three_similar_triplets.offer=Karşı oyuncu elinizi tamamlayan bir taş attı ({0}). Kazanmak için [hl]Hu[/]'ya tıklayın!
tutorial.hands.three_similar_triplets.pattern=[Üç Benzer Üçlü](pattern-6.2.2), her üç renkte de **aynı sayının** üçlülerine sahip olmak için ({555m}, {555p}, {555s}) muazzam bir [hl]120[/] puan kazandırır. Açık punglara izin verilir!
tutorial.hands.three_similar_triplets.small_triplets=Daha mütevazı hali olan [Küçük Üç Benzer Üçlü](pattern-6.2.1), aynı sayının **iki üçlüsü ve bir çifti** ({555m}, {555p} ve {55s}) için [hl]30[/] puan verir. Yeni başlayanlar genellikle bunu gözden kaçırır, ancak elde edilmesi çok daha gerçekçidir!

# Eller ve puanlama — Tek renk eller
tutorial.hands.one_suit.title=Tek renk eller
tutorial.hands.one_suit.offer=Karşı oyuncu elinizi noktalar ve onurlarla tamamlayan bir taş attı ({0}). Kazanmak için [hl]Hu[/]'ya tıklayın!
tutorial.hands.one_suit.mixed=Yalnızca **tek bir sayılı gruptan** taşların yanında **onur taşları** tutmak [Karışık Tek Renk](pattern-2.1.1) için [hl]40[/] puan kazandırır. Açık chow ve punglara izin verilir!
tutorial.hands.one_suit.pure=Onur taşlarını tamamen çıkarırsanız [Saf Tek Renk](pattern-2.1.2) puanı ikiye katlayarak [hl]80[/] puana çıkarır! Artık her grup ve çift o tek renge aittir.

# Eller ve puanlama — Diğer kombinasyonlar
