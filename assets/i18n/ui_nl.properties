tutorial.orient.tiles.title=Stenen
tutorial.orient.tiles.intro=Er zijn 34 verschillende steenmotieven in mahjong: 27 getalmotieven en 7 eresteenmotieven. Hier zijn er een paar van elk.
tutorial.orient.tiles.tags=Stenen kunnen **met labels** of **zonder** worden getoond.
tutorial.orient.tiles.tags_try=In deze app kun je labels aan- of uitzetten in [Instellingen](settings). Deze dertien stenen volgen die instelling — klik op de link en schakel het vakje om te zien hoe het werkt.
tutorial.orient.numbers.title=Getallen
tutorial.orient.numbers.intro=Getalstenen komen in drie kleuren: Tekens, Stippen en Bamboes (elk 1 tot en met 9).
tutorial.orient.numbers.bamboo1=Eén motief om op te letten
tutorial.orient.numbers.bamboo1_callout=De 1 Bamboe wordt traditioneel als een vogel getekend.
tutorial.orient.numbers.sequence=Een reeks is **precies drie** opeenvolgende getallen in dezelfde kleur — bijvoorbeeld {234m}, {567p} of {123s}.
tutorial.orient.numbers.four=Vier opeenvolgende stenen in één kleur zijn **geen** reeks.
tutorial.orient.numbers.four_aside3=Leg óf de **3** apart.
tutorial.orient.numbers.four_aside6=Óf leg de **6** apart.
tutorial.orient.numbers.prompt=Zoek een **reeks** — selecteer de drie stenen.
tutorial.orient.honors.title=Erestenen
tutorial.orient.honors.intro=Winden en draken zijn [hl]erestenen[/]. Ze vormen **geen** getalreeksen.
tutorial.orient.honors.prompt=Selecteer elke eresteen (winden en draken).
tutorial.orient.wall.title=De muur bouwen
tutorial.orient.wall.faces=De volledige set motieven: drie kleuren van 1–9, plus vier winden en drie draken — 34 in totaal.
tutorial.orient.wall.copies=Elk motief heeft vier stenen — 136 in totaal.
tutorial.orient.wall.drawpile=De muur is als een trekstapel bij kaarten: de beginhanden en alle trekkingen tijdens het spel komen eruit.
tutorial.orient.wall.ritual=Aan een echte tafel is het bouwen van de muur een ritueel.
tutorial.orient.wall.facedown=Om een muur te bouwen keer je eerst de stenen met de voorkant naar beneden...
tutorial.orient.wall.shuffle=En schud je ze grondig.
tutorial.orient.wall.formed=Dan begin je de muur te vormen: vier zijden van 17 stapels, twee stenen hoog.
tutorial.orient.wall.pushed=De muren worden naar binnen geschoven zodat de uiteinden elkaar raken.
tutorial.orient.wall.seats=In elke hand is één speler Oost, de volgende Zuid, dan West en dan Noord.
tutorial.orient.wall.east=Oost is de deler en doet de eerste zet in de hand.
tutorial.orient.wall.deal=Oost deelt door twee zeszijdige dobbelstenen te gooien.
tutorial.orient.wall.dice=De som van de dobbelstenen bepaalt waar de muur wordt gebroken.
tutorial.orient.wall.count={0}+{1}={2}. Tel vanaf het rechteruiteinde van Oosts muur {2} stapels.
tutorial.orient.wall.break=De muur wordt na de getelde stapels gebroken. De stapels links ervan schuiven naar links en openen een gat.
tutorial.orient.wall.take7=Tel 7 stapels rechts van het gat.
tutorial.orient.wall.dead=Leg ze apart om een aparte dode muur te vormen.
tutorial.orient.wall.dead_out=Die 14 stenen worden nooit getrokken, wat tegen het einde van de hand onzekerheid toevoegt.
tutorial.orient.wall.hands=Om hun handen te vormen nemen de spelers na het gat elk 2 stapels, terwijl ze de muur met de klok mee afbreken — drie keer.
tutorial.orient.wall.hands_13=Daarna heeft elke speler 3x4 = 12 stenen. Ze nemen elk nog 1 steen om op 13 te komen.
tutorial.orient.wall.east_14=Omdat Oost begint, start die de beurt met het nemen van de 14e steen.
tutorial.orient.wall.look_hands=Elke speler bekijkt de eigen hand...
tutorial.orient.wall.sort_hands=...en sorteert die.
tutorial.orient.wall.east_discard=Nu moet de Oost-speler de eerste zet doen door een steen af te leggen.
tutorial.orient.wall.app_table=In deze app wordt, om schermruimte te sparen, de levende muur vereenvoudigd getoond en de dode muur helemaal niet.
tutorial.orient.wall.live_count=De **69** in het midden is het aantal stenen dat nog in de levende muur zit.
tutorial.moves.east_player.title=Oost-speler
tutorial.moves.east_player.four=Er zijn [hl]vier[/] spelers. Per hand is één van hen [hl]Oost[/] (de deler). Daarna, tegen de klok in: [hl]Zuid[/], [hl]West[/] en [hl]Noord[/].
tutorial.moves.east_player.pass=Na elke hand draait de windtoewijzing zelf [hl]tegen de klok in[/]. De speler die Zuid was, wordt de nieuwe Oost.
tutorial.moves.discarding.title=Afleggen
tutorial.moves.discarding.east_14=Aan het begin van elke hand heeft de speler die [hl]Oost[/] is (de deler) [hl]14[/] stenen (anders dan de andere 3 spelers, die elk [hl]13[/] stenen hebben).
tutorial.moves.discarding.east_hu=Als deze 14 stenen een [hl]winnende hand[/] vormen, kan Oost de winst direct aangeven ("[hl]Hu![/]") — dit is [Zegen van de hemel](pattern-9.4.1).
tutorial.moves.discarding.east_hu_odds=Statistisch is de kans hierop echter [hl]1 op 328.909[/]. Je kunt je hele leven mahjong spelen en dit nooit meemaken.
tutorial.moves.discarding.must_discard=Als deze hand niet wint (wat normaal het geval is), moet Oost één steen kiezen om [hl]af te leggen[/] om het aantal stenen weer op 13 te brengen.
tutorial.moves.discarding.least_useful=Probeer bij het afleggen de minst nuttige steen kwijt te raken (een steen die niet veelbelovend genoeg is om toekomstige patronen te vormen).
tutorial.moves.discarding.others_claim=De andere spelers kunnen de afgelegde steen [hl]claimen[/] om hun hand te verbeteren of zelfs [hl]te winnen[/].
tutorial.moves.counterclockwise.title=Beurtvolgorde
tutorial.moves.counterclockwise.this_tile=[hl]Klik op deze steen[/] om die af te leggen.
tutorial.moves.counterclockwise.click_callout=Leg deze af
tutorial.moves.counterclockwise.if_nobody=Niemand [hl]claimde[/] die, dus bleef die liggen.
tutorial.moves.counterclockwise.the_river=De [hl]rivier[/] is als een aflegstapel bij kaarten: niet-geclaimde stenen blijven open liggen vóór de speler die ze aflegde.
tutorial.moves.counterclockwise.to_the_right=De beurt gaat altijd naar de speler [hl]rechts[/] van de aflegger.
tutorial.moves.counterclockwise.right_next=Jij bent [hl]Oost[/] (onderaan de tafel). [hl]Rechts[/] speelt daarna — die trok uit de muur en legt vervolgens af.
tutorial.moves.counterclockwise.right_discards=Rechts [hl]legt een steen af[/]. Niemand claimde die, dus gaat de beurt naar [hl]Tegenover[/], die uit de muur trekt.
tutorial.claims.click_callout=Selecteer deze
tutorial.claims.pung.title=Pung
tutorial.claims.pung.offer=Tegenover legde een steen af waarvan je al een [hl]paar[/] hebt ({0}). [hl]Klik op Pung[/] om een drieling te voltooien.
tutorial.claims.pung.reveal=Het claimen van een steen die door een andere speler is afgelegd, vereist dat je de gevormde groep [hl]openlegt[/] — hier de [hl]drieling[/].
tutorial.claims.pung.must_discard=Nu heb je [hl]14[/] stenen, en omdat dit geen winnende hand is, moet je een steen [hl]afleggen[/].
tutorial.claims.pung.skips_left=Omdat je die claimde, slaat [hl]Links[/] de beurt over — die zou nu [hl]uit de muur trekken[/].
tutorial.claims.pung.third_for_two=Je kunt een [hl]derde[/] claimen voor twee kopieën. Je kunt geen [hl]tweede[/] claimen voor één.
tutorial.claims.last_discard.title=Laatste afleg
tutorial.claims.last_discard.only_fresh=Je kunt een steen [hl]direct nadat[/] die is afgelegd claimen. Je kunt een steen die al in de [hl]rivier[/] ligt niet claimen.
tutorial.claims.last_discard.callout=Deze steen is het laatst afgelegd
tutorial.claims.chow.title=Chow
tutorial.claims.chow.offer=Links legde een steen af ({0}) die een [hl]reeks[/] voltooit met twee stenen die je al hebt. [hl]Klik op Chow[/] om die te voltooien.
tutorial.claims.chow.reveal=Het claimen van een steen die door een andere speler is afgelegd, vereist dat je de gevormde groep [hl]openlegt[/] — hier de [hl]reeks[/].
tutorial.claims.chow.must_discard=Nu heb je [hl]14[/] stenen, en omdat dit geen winnende hand is, moet je een steen [hl]afleggen[/].
tutorial.claims.chow.only_left=Je kunt [hl]alleen[/] chowen van [hl]Links[/] (de speler direct vóór je). Afleggingen van Tegenover of Rechts kunnen niet worden gechowd.
tutorial.claims.hu.title=Hu
tutorial.claims.hu.offer=Hier is je winnende hand bijna compleet en wacht je op een paar. Tegenover heeft net de steen afgelegd die je nodig hebt ({0}). [hl]Klik op Hu[/] om die te claimen.
tutorial.claims.hu.not_a_set=Als een afgelegde steen een [hl]winnende hand[/] voltooit, kun je die claimen. Die hoeft [hl]geen[/] [hl]groep[/] te voltooien — hier voltooide die het [hl]paar[/].
tutorial.claims.hu.breakdown=Als het scorepaneel je zicht op de tafel blokkeert, kun je het [hl]verslepen[/] of [hl]in- en uitklappen[/] met de chevronknop. Probeer het nu te verslepen of in te klappen!
tutorial.claims.priority.title=Claimprioriteit
tutorial.claims.priority.conflict=Links legde net {3s} af. Jij hebt {12s} en zou die kunnen **Chowen**, maar Rechts heeft een paar {3s}. Probeer [hl]Chow[/] te claimen om te zien wat er gebeurt!
tutorial.claims.priority.pung_beats_chow=Hoewel je Chow claimde, [hl]verslaat Pung Chow[/]! De claim van Rechts gaat vóór die van jou — Rechts neemt de steen en jouw beurt wordt overgeslagen!
tutorial.claims.priority.hierarchy=De universele claimhiërarchie is: [hl]Winst (Hu)[/] verslaat [hl]Pung & Kong[/], die beide [hl]Chow[/] verslaan.
tutorial.claims.priority.multi_win=Als meerdere spelers [hl]Hu[/] claimen op dezelfde afleg, wint de speler die in beurtvolgorde het dichtst bij de aflegger zit (geen dubbele winst).
tutorial.kongs.melded.title=Open kong
tutorial.kongs.melded.offer=Tegenover legde een steen af ({0}) die past bij je gesloten drieling. Klik op [hl]Kong[/] om vier gelijke stenen aan te geven!
tutorial.kongs.melded.reveal=Het claimen van een afgelegde 4e steen legt de vier gelijke stenen op tafel als een [hl]open kong[/].
tutorial.kongs.melded.one_kong=Een kong vormen levert [hl]5[/] punten op voor [Eén kong](pattern-4.3.1) en schaalt op met meerdere kongen.
tutorial.kongs.melded.compensation=Omdat een kong 4 stenen heeft, trek je een [hl]suppletiesteen[/] uit het uiteinde van de muur om een geldige handgrootte te behouden.
tutorial.kongs.melded.must_discard=Na het trekken van de suppletiesteen moet je [hl]afleggen[/] om je beurt af te maken.
tutorial.kongs.melded.already_melded=Je kunt geen afgelegde 4e steen claimen als je drieling al open op tafel ligt als een open [hl]Pung[/].
tutorial.kongs.concealed.title=Gesloten kong
tutorial.kongs.concealed.offer=Je hebt net een steen uit de muur getrokken en bezit alle vier de kopieën van {0}. Klik op [hl]Gesloten kong aangeven[/]!
tutorial.kongs.concealed.arrangement=Let op de combinatie: de twee **randstenen zijn gesloten** (met de voorkant naar beneden) om te tonen dat die gesloten blijft, terwijl de middelste stenen de groep bewijzen.
tutorial.kongs.concealed.scoring=In Zung Jung blijft die **gesloten** voor de score — [Gesloten hand](pattern-1.2) blijft geldig!
tutorial.kongs.concealed.compensation=Je trekt een [hl]suppletiesteen[/] uit het uiteinde van de muur en legt daarna normaal af om je beurt af te maken.
tutorial.kongs.promoted.title=Gepromoveerde kong
tutorial.kongs.promoted.offer=Je hebt een open pung van {0} en trok net de 4e steen! Klik op [hl]Kong promoveren[/] om je combinatie te upgraden.
tutorial.kongs.promoted.upgraded=De vierde steen voegt zich bij je open pung, promoveert die tot een open kong en kwalificeert voor [Eén kong](pattern-4.3.1).
tutorial.kongs.promoted.robbing=Waarschuwing: dit is het enige moment waarop tegenstanders [de kong kunnen beroven](pattern-9.3) als deze steen hun winnende hand voltooit!
tutorial.kongs.promoted.compensation=Als het veilig is, trek je een [hl]suppletiesteen[/] uit het uiteinde van de muur en leg je af om je beurt af te maken.
tutorial.hands.win.title=Een hand winnen
tutorial.hands.win.hand_size=Spelers hebben normaal [hl]13[/] stenen. Je hebt tijdelijk [hl]14[/] stenen bij het trekken of claimen. Als je niet wint, moet je terug afleggen naar 13.
tutorial.hands.win.patterns=Om een hand te winnen moeten de stenen in je hand bepaalde specifieke patronen vormen.
tutorial.hands.win.all_in_groups=Normaal moet in een winnende hand elke steen in een van de vier [hl]groepen[/] of het enkele [hl]paar[/] zitten. Dat zijn meestal [hl]14[/] stenen.
tutorial.hands.win.set_kinds=Een groep is een [hl]reeks[/], een [hl]drieling[/] of een [hl]kong[/].
tutorial.hands.win.kong_size=Hier is een van de vier groepen een [hl]kong[/]. Door die kong heeft de hand [hl]15[/] stenen, geen 14.
tutorial.hands.chicken.title=Patroonloze hand
tutorial.hands.chicken.one=Als er geen speciale scores van toepassing zijn op deze hand, heet die een [hl]patroonloze hand[/] en is die [hl]1[/] punt waard.
tutorial.hands.chicken.tournament=In toernooien kunnen patroonloze handen [hl]verboden[/] zijn — de hand moet minstens [hl]5[/] punten waard zijn om als winbaar te tellen.
tutorial.hands.chicken.next=In de volgende lessen behandelen we de basispatronen waarmee een hand [hl]5[/] of meer punten kan scoren.
tutorial.hands.concealed.title=Gesloten hand
tutorial.hands.concealed.offer=Tegenover legde een steen af ({0}) die een reeks voltooit met twee stenen die je al hebt. Je kunt niet chowen van Tegenover — maar omdat die je hand voltooit, kun je [hl]Hu 5[/] claimen! Klik op [hl]Hu[/] om te winnen.
tutorial.hands.concealed.points=Elke tegenstander betaalt de handscore aan de winnaar. Voor een hand van [hl]5[/] punten betalen alle drie er 5 — wat je [hl]3\u00d7[/] de handscore oplevert ([hl]+15[/] punten)!
tutorial.hands.concealed.concealed_rule=Een hand is [hl]gesloten[/] als je vóór het aangeven van de winst geen open claims hebt gedaan (zoals **Chow** of **Pung**).
tutorial.hands.concealed.discard_win=Hoewel je de afleg van Tegenover claimde om die laatste reeks te voltooien, is winnen op een afleg [hl]toegestaan[/] — alleen open combinaties die *vóór* de winst zijn gemaakt, breken Gesloten hand.
tutorial.hands.concealed.kongs=Het eerder in de hand claimen van een [hl]Chow[/], [hl]Pung[/] of [hl]Kong[/] legt die groep open op tafel, waardoor je hand open wordt en dit patroon breekt.
tutorial.hands.all_sequences.title=Alle reeksen
tutorial.hands.all_sequences.offer=Tegenover legde een steen af ({0}) die je vierde reeks voltooit. Hoewel je hand open is door een eerdere Chow, biedt de knop [hl]Hu 5[/]! Klik op [hl]Hu[/] om te winnen.
tutorial.hands.all_sequences.points=Een hand waarin alle vier groepen reeksen zijn (zonder drielingen of kongen) scoort [hl]5[/] punten voor [Alle reeksen](pattern-1.1).
tutorial.hands.all_sequences.open_allowed=Anders dan Gesloten hand staat [Alle reeksen](pattern-1.1) open Chows toe. Zelfs met een open combinatie op tafel levert vier reeksen nog 5 punten op.
tutorial.hands.all_sequences.unrestricted=Elk paar is toegestaan — zelfs draak- of winderestenen — en elk type wachtsituatie kwalificeert.
tutorial.hands.no_terminals.title=Geen eindstenen
tutorial.hands.no_terminals.offer=Tegenover legde een steen af ({0}) die je winnende hand voltooit. Elke steen in je hand is een gewoon getal van 2 tot 8. Klik op [hl]Hu[/] om te winnen.
tutorial.hands.no_terminals.terminals_def=In de drie getalkleuren heten de eindstenen — **1** en **9** ({1m}, {9s}) — [hl]eindstenen[/]. De binnenste stenen van **2** tot en met **8** heten [hl]gewone stenen[/]. Erestenen zijn geen van beide.
tutorial.hands.no_terminals.points=Het patroon [Geen eindstenen](pattern-1.3) is [hl]5[/] punten waard. Elke steen in de hand — alle vier groepen en het paar — moet een [hl]gewone steen[/] zijn, zonder eindstenen en zonder erestenen.
tutorial.hands.no_terminals.flexibility=Let op: deze hand heeft een open drieling ({5p}{5p}{5p}), dus die is noch gesloten noch alle reeksen. Maar omdat elke steen een gewone steen is, kwalificeert die voor [hl]Geen eindstenen (5 pt)[/]!
tutorial.hands.no_terminals.stacking=Geen eindstenen kan ook [hl]stapelen[/] met andere patronen zoals [Alle reeksen](pattern-1.1) of [Gesloten hand](pattern-1.2) wanneer die van toepassing zijn, en samen 10 of 15 punten opleveren.
tutorial.hands.kongs.title=Kongen
tutorial.hands.kongs.offer=Tegenover legde een steen af ({0}) die je winnende hand voltooit. Je hebt al twee open kongen op tafel. Klik op [hl]Hu[/] om te winnen.
tutorial.hands.kongs.two_kongs=Zoals eerder gezien levert [Eén kong](pattern-4.3.1) [hl]5[/] punten op. **Twee kongen** verhoogt de score naar [hl]20[/] punten voor [Twee kongen](pattern-4.3.2)!
tutorial.hands.kongs.hand_size=Omdat elke kong 4 stenen in plaats van 3 heeft en een compensatiesteen trekt, heeft deze winnende hand [hl]16[/] stenen in plaats van de gebruikelijke 14.
tutorial.hands.kongs.ladder=Hogere kongpatronen stijgen steil: [Drie kongen](pattern-4.3.3) scoort [hl]120[/] punten en [Vier kongen](pattern-4.3.4) scoort de limiet van [hl]480[/] punten!
tutorial.hands.value_honor.title=Waardesteen
tutorial.hands.value_honor.offer=Tegenover legde een steen af ({0}) die je hand voltooit. Je open drieling van Rode draken maakt deze hand [hl]Hu 10[/] waard! Klik op [hl]Hu[/] om te winnen.
tutorial.hands.value_honor.dragons=Een drieling of kong van een [hl]waardesteen[/] is [hl]10[/] punten waard ([Waardesteen](pattern-3.1)). Elk van de drie draken — **Rood** ({C}), **Groen** ({F}) of **Wit** ({P}) — is voor elke speler altijd een waardesteen.
tutorial.hands.value_honor.seat_winds=Je eigen **zitplaats-wind** (zoals {E} voor de Oost-zitplaats) is ook een waardesteen. Winden van de andere drie zitplaatsen ("gastwinden") scoren niet. In Zung Jung is er **geen heersende of rondewind**.
tutorial.hands.value_honor.stacking=Waardesteen telt [hl]cumulatief per groep[/]: twee kwalificerende drielingen scoren [hl]20[/] punten. Open combinaties zijn toegestaan, maar **paren** scoren nooit — alleen drielingen en kongen tellen.
tutorial.hands.all_triplets.title=Alleen drielingen
tutorial.hands.all_triplets.offer=Tegenover legde een steen af ({0}) die je hand voltooit tot vier drielingen en een paar. Klik op [hl]Hu[/] om te winnen!
tutorial.hands.all_triplets.pattern=Het patroon [Alleen drielingen](pattern-4.1) vereist vier drielingen (of kongen) en een paar, zonder reeksen. Open pungens zijn toegestaan en het patroon levert een royale [hl]30[/] punten op!
tutorial.hands.all_triplets.settlement_cap=Bij een winst op afleg boven 25 punten zijn niet-afleggers [hl]beperkt tot 25 punten[/] (Links/Rechts betalen [hl]-25[/]). De aflegger dekt beide tekorten: 30 + 5 + 5 = **40** ([hl]-40[/])!
tutorial.hands.all_triplets.self_draw=Je ontvangt nog steeds de volledige **90 punten** (3 \u00d7 30). Bij een **zelf trekken** is er geen aflegger, dus betalen alle drie tegenstanders de volledige 30 punten.
tutorial.hands.nine_tile_straight.title=Negen-stenen-straat
tutorial.hands.nine_tile_straight.offer=Tegenover legde een steen af ({0}) die je hand voltooit tot een straat van 1 tot en met 9 in tekens. Klik op [hl]Hu[/] om te winnen!
tutorial.hands.nine_tile_straight.pattern=Het patroon [Negen-stenen-straat](pattern-7.1) is een enorme [hl]40[/] punten waard! Het vereist drie reeksen die **1 tot en met 9 in één kleur** beslaan ({1m} tot {9m}). Open chows zijn toegestaan.
tutorial.hands.nine_tile_straight.composition=De resterende 5 stenen kunnen elke geldige groep en paar in elke kleur zijn. Hier voltooien een drieling van {555p} en een paar {99s} je winnende hand van 14 stenen.
tutorial.hands.nine_tile_straight.settlement=Met een hand van 40 punten zijn niet-afleggers beperkt tot [hl]-25[/]. Tegenover dekt hun 40 plus beide tekorten van 15 punten ([hl]-70[/]), wat je [hl]+120[/] punten oplevert (3 \u00d7 40)!
tutorial.hands.seven_pairs.title=Zeven paren
tutorial.hands.seven_pairs.offer=Tegenover legde een steen af ({0}) die je hand voltooit tot zeven paren. Klik op [hl]Hu[/] om te winnen!
tutorial.hands.seven_pairs.pattern=Alle winnende handen tot nu toe bestonden uit 4 groepen en 1 paar. [Zeven paren](pattern-10.2) is een [hl]onregelmatige hand[/] — die breekt die regel door **zeven paren** te voltooien voor [hl]30[/] punten!
tutorial.hands.seven_pairs.concealed_only=Zeven paren moeten [hl]volledig gesloten[/] zijn. Je kunt geen Chow, Pung of Kong roepen — alle paren moeten uit de muur worden getrokken. Je kunt echter wel de laatste steen op een afleg van een tegenstander claimen om je 7e paar te voltooien!
tutorial.hands.seven_pairs.four_of_a_kind=Het wachten op Zeven paren is altijd een [hl]wachtsituatie op één steen[/] voor je 7e paar. In Zung Jung tellen alle **vier kopieën** van dezelfde steen (zonder een kong aan te geven) wettelijk als **twee paren**.
tutorial.hands.two_identical_sequences.title=Twee identieke reeksen
tutorial.hands.two_identical_sequences.offer=Tegenover legde een steen af ({0}) die je tweede identieke reeks voltooit. Klik op [hl]Hu[/] om te winnen!
tutorial.hands.two_identical_sequences.pattern=[Twee identieke reeksen](pattern-5.1.1) geeft [hl]10[/] punten voor twee gelijke reeksen in één kleur ({234s} en {234s}). In de hand zien ze eruit als opeenvolgende paren ({223344s}). Open chows zijn toegestaan!
tutorial.hands.two_identical_sequences.ladder=Hogere niveaus in deze reeks geven enorme punten: [Drie identieke reeksen](pattern-5.1.3) scoort [hl]120[/] punten en [Vier identieke reeksen](pattern-5.1.4) scoort de limiet van [hl]480[/] punten!
tutorial.hands.two_concealed_triplets.title=Twee gesloten drielingen
tutorial.hands.two_concealed_triplets.offer=Tegenover legde een steen af ({0}) die je hand voltooit. Klik op [hl]Hu[/] om te winnen!
tutorial.hands.two_concealed_triplets.pattern=[Twee gesloten drielingen](pattern-4.2.1) geeft [hl]5[/] punten voor twee drielingen die volledig in je gesloten hand zijn gevormd ({333p} en {666s}). Open pungens kwalificeren niet!
tutorial.hands.two_concealed_triplets.ladder=Gesloten drielingen schalen steil: [Drie gesloten drielingen](pattern-4.2.2) geeft [hl]30[/] punten en [Vier gesloten drielingen](pattern-4.2.3) geeft [hl]125[/] punten!
tutorial.hands.three_similar_triplets.title=Drie gelijksoortige drielingen
tutorial.hands.three_similar_triplets.offer=Tegenover legde een steen af ({0}) die je hand voltooit. Klik op [hl]Hu[/] om te winnen!
tutorial.hands.three_similar_triplets.pattern=[Drie gelijksoortige drielingen](pattern-6.2.2) geeft een enorme [hl]120[/] punten voor drielingen met **hetzelfde getal** in alle drie de kleuren ({555m}, {555p}, {555s}). Open pungens zijn toegestaan!
tutorial.hands.three_similar_triplets.small_triplets=De kleinere vorm, [Kleine drie gelijksoortige drielingen](pattern-6.2.1), geeft [hl]30[/] punten voor **twee drielingen en een paar** van hetzelfde getal ({555m}, {555p} en {55s}). Beginners zien die vaak over het hoofd, maar hij is veel realistischer om te halen!
tutorial.hands.one_suit.title=Handen van één kleur
tutorial.hands.one_suit.offer=Tegenover legde een steen af ({0}) die je hand voltooit in stippen en erestenen. Klik op [hl]Hu[/] om te winnen!
tutorial.hands.one_suit.mixed=Stenen uit slechts **één getalkleur** (in oranje) samen met **erestenen** (in blauw) scoren [hl]40[/] punten voor [Gemengd één kleur](pattern-2.1.1). Open chows en pungens zijn toegestaan!
tutorial.hands.one_suit.pure=Als je erestenen helemaal weglaat, verdubbelt [Puur één kleur](pattern-2.1.2) de score naar [hl]80[/] punten! Elke groep en het paar horen dan bij die ene kleur.
tutorial.hands.more_patterns.title=Meer patronen
tutorial.hands.more_patterns.rarer=We hebben de kernpatronen behandeld. Veel zeldzamere handen — zoals drakenreeksen, windhanden en limiethanden — staan in de [Naslag](reference).
tutorial.hands.more_patterns.practice=Je kunt de [Naslag](reference) tijdens het spel altijd openen via het spelmenu om patroonregels en scorewaarden op te zoeken. Veel plezier!
