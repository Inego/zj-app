tutorial.orient.numbers.sequence=Postupku tvoří **přesně tři** po sobě jdoucí čísla ve stejné barvě — například {234m}, {567p} nebo {123s}.
tutorial.orient.numbers.four=Čtyři po sobě jdoucí kameny v jedné barvě **nejsou** postupka.
tutorial.orient.numbers.four_aside3=Buď odlož **3**.
tutorial.orient.numbers.four_aside6=Nebo odlož **6**.
tutorial.orient.numbers.prompt=Najdi **postupku** — vyber její tři kameny.
tutorial.orient.honors.title=Čestné kameny
tutorial.orient.honors.intro=Větry a draci jsou [hl]čestné[/] kameny. **Netvoří** číselné postupky.
tutorial.orient.honors.prompt=Vyber všechny čestné kameny (větry a draky).
tutorial.orient.wall.title=Stavba zdi
tutorial.orient.wall.faces=Celá sada líců: tři barvy od 1 do 9, k tomu čtyři větry a tři draci — celkem 34.
tutorial.orient.wall.copies=Každý líc má čtyři kameny — dohromady 136.
tutorial.orient.wall.drawpile=Zeď je jako dobírací balíček v kartách: pochází z ní úvodní ruky i všechna dobrání během hry.
tutorial.orient.wall.ritual=Při hře u skutečného stolu je stavba zdi obřad.
tutorial.orient.wall.facedown=Chceš-li postavit zeď, nejdřív otoč kameny lícem dolů...
tutorial.orient.wall.shuffle=A důkladně je zamíchej.
tutorial.orient.wall.formed=Pak začni zeď skládat: čtyři strany po 17 hromádkách, každá dva kameny vysoká.
tutorial.orient.wall.pushed=Strany zdi se k sobě posunou, aby se konce setkaly.
tutorial.orient.wall.seats=V každém rozdání je jeden hráč Východ, další Jih, pak Západ a pak Sever.
tutorial.orient.wall.east=Východ je rozdávající a v rozdání táhne jako první.
tutorial.orient.wall.deal=Východ rozdává hodem dvou šestistěnných kostek.
tutorial.orient.wall.dice=Součet na kostkách určí, kde se zeď rozlomí.
tutorial.orient.wall.count={0}+{1}={2}. Od pravého konce Východovy zdi napočítej {2} hromádek.
tutorial.orient.wall.break=Zeď se rozlomí za napočítanými hromádkami. Hromádky nalevo se posunou doleva a vznikne mezera.
tutorial.orient.wall.take7=Vpravo od mezery napočítej 7 hromádek.
tutorial.orient.wall.dead=Odlož je stranou jako samostatnou mrtvou zeď.
tutorial.orient.wall.dead_out=Těchto 14 kamenů se nikdy nedobírá, což ke konci rozdání přidává nejistotu.
tutorial.orient.wall.hands=Aby si hráči vytvořili ruku, berou po mezeře vždy 2 hromádky a zeď přitom rozebírají po směru hodinových ručiček — celkem třikrát.
tutorial.orient.wall.hands_13=Potom má každý hráč 3×4 = 12 kamenů. Každý si vezme ještě 1 kámen, aby jich bylo 13.
tutorial.orient.wall.east_14=Protože Východ hraje první, začíná svůj tah dobíráním 14. kamene.
tutorial.orient.wall.look_hands=Každý hráč si prohlédne svou ruku...
tutorial.orient.wall.sort_hands=...a srovná ji.
tutorial.orient.wall.east_discard=Teď musí hráč na Východě udělat první tah a zahodit kámen.
tutorial.orient.wall.app_table=V této aplikaci se kvůli úspoře místa na obrazovce zobrazuje živá zeď zjednodušeně a mrtvá zeď se nezobrazuje vůbec.
tutorial.orient.wall.live_count=**69** uprostřed je počet kamenů, které zbývají v živé zdi.

# Pořadí tahů
tutorial.moves.east_player.title=Hráč na Východě
tutorial.moves.east_player.four=Hráči jsou [hl]čtyři[/]. V každém rozdání je jeden z nich [hl]Východ[/] (rozdávající). Pak proti směru hodinových ručiček: [hl]Jih[/], [hl]Západ[/] a [hl]Sever[/].
tutorial.moves.east_player.pass=Po každém rozdání se přiřazení větrů otočí [hl]proti směru hodinových ručiček[/]. Novým Východem se stává dosavadní Jih.
tutorial.moves.discarding.title=Odhoz
tutorial.moves.discarding.east_14=Na začátku každého rozdání má hráč na [hl]Východě[/] (rozdávající) v ruce [hl]14[/] kamenů (na rozdíl od ostatních 3 hráčů, kteří mají po [hl]13[/]).
tutorial.moves.discarding.east_hu=Pokud těchto 14 kamenů tvoří [hl]výherní ruku[/], může Východ hned hlásit výhru („[hl]Hu![/]“) — to je [Nebeské požehnání](pattern-9.4.1).
tutorial.moves.discarding.east_hu_odds=Statisticky je ale šance [hl]1 ku 328 909[/]. Můžeš hrát mahjong celý život a nikdy to nevidět.
tutorial.moves.discarding.must_discard=Pokud ruka není výherní (což je obvyklé), musí Východ jeden kámen [hl]zahodit[/], aby se počet kamenů vrátil na 13.
tutorial.moves.discarding.least_useful=Při odhozu se zbav kamene, který je nejméně užitečný (který nevypadá nadějně pro budoucí vzorce).
tutorial.moves.discarding.others_claim=Ostatní hráči mohou odhozený kámen [hl]nárokovat[/], aby si vylepšili ruku, nebo dokonce [hl]vyhrát[/].
tutorial.moves.counterclockwise.title=Sled tahů
tutorial.moves.counterclockwise.this_tile=[hl]Klikni na tento kámen[/] a zahodíš ho.
tutorial.moves.counterclockwise.click_callout=Zahodit
tutorial.moves.counterclockwise.if_nobody=Žádný [hl]nárok[/] nepřišel, takže zůstal odhozený.
tutorial.moves.counterclockwise.the_river=[hl]Řeka[/] je jako odkládací hromádka v kartách: nenárokované kameny zůstávají lícem nahoru před hráčem, od kterého odhoz pochází.
tutorial.moves.counterclockwise.to_the_right=Tah vždy přechází na hráče po [hl]pravici[/] odhazujícího.
tutorial.moves.counterclockwise.right_next=Jsi [hl]Východ[/] (dole u stolu). Další hraje [hl]hráč vpravo[/] — dobírá ze zdi a teď zahodí.
tutorial.moves.counterclockwise.right_discards=Hráč vpravo [hl]zahodí[/] kámen. Žádný nárok nepřišel, takže tah přechází na [hl]hráče naproti[/], který dobírá ze zdi.

# Nároky
tutorial.claims.click_callout=Vyber
tutorial.claims.pung.title=Pong
tutorial.claims.pung.offer=Hráč naproti odhazuje kámen, který už máš v [hl]páru[/] ({0}). [hl]Klikni na Pong[/] a dokončíš trojici.
tutorial.claims.pung.reveal=Nárokovat kámen odhozený jiným hráčem znamená [hl]odkrýt[/] vzniklou sadu — tady [hl]trojici[/].
tutorial.claims.pung.must_discard=Teď máš [hl]14[/] kamenů, a protože to není výherní ruka, musíš jeden [hl]zahodit[/].
tutorial.claims.pung.skips_left=Protože nárok patří tobě, [hl]hráč vlevo[/] přichází o tah — na řadě by teď bylo [hl]dobrání ze zdi[/].
tutorial.claims.pung.third_for_two=[hl]Třetí[/] kámen můžeš nárokovat, když máš dvě kopie. [hl]Druhý[/] kámen nárokovat nemůžeš, když máš jen jednu.
tutorial.claims.last_discard.title=Poslední odhoz
tutorial.claims.last_discard.only_fresh=Kámen můžeš nárokovat [hl]hned poté[/], co ho někdo odhodí. Kámen, který už leží v [hl]řece[/], nárokovat nelze.
tutorial.claims.last_discard.callout=Tohle je poslední odhoz
# Nároky — Čou
tutorial.claims.chow.title=Čou
tutorial.claims.chow.offer=Hráč vlevo odhazuje kámen ({0}), který s dvěma tvými kameny tvoří [hl]postupku[/]. [hl]Klikni na Čou[/] a dokončíš ji.
tutorial.claims.chow.reveal=Nárokovat kámen odhozený jiným hráčem znamená [hl]odkrýt[/] vzniklou sadu — tady [hl]postupku[/].
tutorial.claims.chow.must_discard=Teď máš [hl]14[/] kamenů, a protože to není výherní ruka, musíš jeden [hl]zahodit[/].
tutorial.claims.chow.only_left=Čou můžeš vzít [hl]jen[/] od [hl]hráče vlevo[/] (to je ten těsně před tebou). Z odhozů hráče naproti ani hráče vpravo Čou nárokovat nelze.
tutorial.claims.hu.title=Hu
tutorial.claims.hu.offer=Tady je tvoje výherní ruka skoro hotová a čekáš už jen na pár. Hráč naproti právě odhazuje kámen, který potřebuješ ({0}). [hl]Klikni na Hu[/] a nárokuj ho.
tutorial.claims.hu.not_a_set=Když odhozený kámen dokončí [hl]výherní ruku[/], můžeš ho nárokovat. [hl]Nemusí[/] přitom dokončit [hl]sadu[/] — tady dokončil [hl]pár[/].
tutorial.claims.hu.breakdown=Pokud ti panel s rozpisem skóre překáží ve výhledu na stůl, můžeš ho [hl]přetáhnout[/] stranou nebo ho tlačítkem se šipkou [hl]sbalit a zase rozbalit[/]. Zkus ho teď přetáhnout nebo sbalit!

# Nároky — Priorita nároků
tutorial.claims.priority.title=Priorita nároků
tutorial.claims.priority.conflict=Hráč vlevo právě odhazuje {3s}. V ruce máš {12s}, takže na něj **Čou** uplatnit můžeš, ale hráč vpravo drží pár {3s}. Zkus nárokovat [hl]Čou[/] a uvidíš, co se stane!
tutorial.claims.priority.pung_beats_chow=I když Čou nárokuješ, [hl]Pong má přednost před Čou[/]! Nárok hráče vpravo přebije ten tvůj — kámen bere on a ty o tah přicházíš!
tutorial.claims.priority.hierarchy=Univerzální pořadí nároků je: [hl]výhra (Hu)[/] má přednost před [hl]Pongem a Kongem[/], a oba mají přednost před [hl]Čou[/].
tutorial.claims.priority.multi_win=Když na stejný odhoz hlásí [hl]Hu[/] víc hráčů, vyhraje ten, kdo je v pořadí tahů blíž odhazujícímu (dvojí výhra neexistuje).

# Kongy — Velký odkrytý kong. „Melded“ = odkrytý: skrytá trojice dokončená
# nárokem odhozu. Neznamená „spojený/slitý“ (portugalsky „combinado“).
# „four-of-a-kind“ v těchto textech znamená kong, ne pokerový termín.
tutorial.kongs.melded.title=Odkrytý kong
tutorial.kongs.melded.offer=Hráč naproti odhazuje kámen ({0}), který doplní tvoji skrytou trojici. Klikni na [hl]Kong[/] a vyložíš kong!
tutorial.kongs.melded.reveal=Nárokem odhozeného 4. kamene vyložíš kong na stůl jako [hl]odkrytý kong[/].
tutorial.kongs.melded.one_kong=Sestavený kong přinese [hl]5[/] bodů za [Jeden kong](pattern-4.3.1) a s každým dalším kongem se skóre zvedá.
tutorial.kongs.melded.compensation=Protože má kong 4 kameny, dobíráš si [hl]náhradní kámen[/] z konce zdi, aby ti zůstala správná velikost ruky.
tutorial.kongs.melded.must_discard=Po dobrání náhradního kamene musíš [hl]zahodit[/] a tah tím uzavřeš.
tutorial.kongs.melded.already_melded=Odhozený 4. kámen nemůžeš nárokovat, když už je tvoje trojice vyložená na stole jako odkrytý [hl]Pong[/].

# Kongy — Skrytý kong
tutorial.kongs.concealed.title=Skrytý kong
tutorial.kongs.concealed.offer=Právě ti ze zdi přišel kámen a v ruce máš všechny čtyři kopie {0}. Klikni na [hl]Hlásit skrytý kong[/]!
tutorial.kongs.concealed.arrangement=Všimni si sady: dva **krajní kameny jsou zakryté** (lícem dolů), aby bylo vidět, že kong zůstává skrytý, zatímco prostřední kameny sadu dokazují.
tutorial.kongs.concealed.scoring=V Zung Jung zůstává pro bodování **skrytý** — [Skrytá ruka](pattern-1.2) platí dál!
tutorial.kongs.concealed.compensation=Dobereš si [hl]náhradní kámen[/] z konce zdi a pak normálně zahodíš, čímž tah uzavřeš.

# Kongy — Povýšený kong
tutorial.kongs.promoted.title=Povýšený kong
tutorial.kongs.promoted.offer=Máš odkrytý pong {0} a právě ti přišel 4. kámen! Klikni na [hl]Povýšit na kong[/] a sadu vylepšíš.
tutorial.kongs.promoted.upgraded=Čtvrtý kámen se přidá k odkrytému pongu, tím se z něj stane odkrytý kong a vznikne nárok na [Jeden kong](pattern-4.3.1).
tutorial.kongs.promoted.robbing=Pozor: tohle je jediná chvíle, kdy ti soupeř může vzít kong ([Uloupení kongu](pattern-9.3)), pokud mu kámen dokončí výherní ruku!
tutorial.kongs.promoted.compensation=Když je to bezpečné, dobereš si [hl]náhradní kámen[/] z konce zdi, zahodíš a tah uzavřeš.

# Ruky a bodování — Výherní ruka
tutorial.hands.win.title=Výherní ruka
tutorial.hands.win.hand_size=Hráči běžně drží [hl]13[/] kamenů. [hl]14[/] máš jen krátce při dobrání nebo nároku. Když nevyhraješ, musíš jeden zahodit a vrátit se na 13.
tutorial.hands.win.patterns=Chceš-li vyhrát, musí kameny v tvé ruce tvořit určité vzorce.
tutorial.hands.win.all_in_groups=Ve výherní ruce musí obvykle každý kámen patřit do jedné ze čtyř [hl]sad[/] nebo do jediného [hl]páru[/]. To je zpravidla [hl]14[/] kamenů.
tutorial.hands.win.set_kinds=Sada je [hl]postupka[/], [hl]trojice[/] nebo [hl]kong[/].
tutorial.hands.win.kong_size=Tady je jedna ze čtyř sad [hl]kong[/]. Kvůli němu má ruka [hl]15[/] kamenů, ne 14.

# Ruky a bodování — Ruka bez vzorce
tutorial.hands.chicken.title=Ruka bez vzorce
tutorial.hands.chicken.one=Když na ruku nepasuje žádný bodovací vzorec, nazývá se [hl]ruka bez vzorce[/] a má cenu [hl]1[/] bodu.
tutorial.hands.chicken.tournament=Na turnajích mohou být ruky bez vzorce [hl]zakázané[/] — ruka musí mít aspoň [hl]5[/] bodů, aby se počítala jako výherní.
tutorial.hands.chicken.next=V dalších lekcích projdeme základní bodovací vzorce, díky nimž má ruka [hl]5[/] nebo víc bodů.

# Ruky a bodování — Skrytá ruka
tutorial.hands.concealed.title=Skrytá ruka
tutorial.hands.concealed.offer=Hráč naproti odhazuje kámen ({0}), který s dvěma tvými kameny tvoří postupku. Čou od naproti vzít nelze — ale protože ti kámen dokončí ruku, můžeš nárokovat [hl]Hu 5[/]! Klikni na [hl]Hu[/] a vyhraješ.
tutorial.hands.concealed.points=Každý soupeř platí výherci skóre ruky. Za ruku za [hl]5[/] bodů zaplatí všichni tři po 5 — čistě tak získáš [hl]3×[/] skóre ruky ([hl]+15[/] bodů)!
tutorial.hands.concealed.concealed_rule=Ruka je [hl]skrytá[/], když před ohlášením výhry nemáš žádný odkrytý nárok (třeba **Čou** nebo **Pong**).
tutorial.hands.concealed.discard_win=I když si odhoz hráče naproti bereš, aby poslední postupka byla kompletní, výhra na odhozu je [hl]povolená[/] — Skrytou ruku ruší jen odkryté sady vzniklé *před* výhrou.
tutorial.hands.concealed.kongs=Když si během rozdání nárokuješ [hl]Čou[/], [hl]Pong[/] nebo [hl]Kong[/], sada se vyloží na stůl, tvoje ruka se tím otevře a vzorec neplatí.

# Ruky a bodování — Všechny postupky
tutorial.hands.all_sequences.title=Všechny postupky
tutorial.hands.all_sequences.offer=Hráč naproti odhazuje kámen ({0}), který dokončí tvou čtvrtou postupku. I když je tvoje ruka otevřená kvůli dřívějšímu Čou, tlačítko nabízí [hl]Hu 5[/]! Klikni na [hl]Hu[/] a vyhraješ.
tutorial.hands.all_sequences.points=Ruka, ve které jsou všechny čtyři sady postupky (žádné trojice ani kongy), má [hl]5[/] bodů za [Všechny postupky](pattern-1.1).
tutorial.hands.all_sequences.open_allowed=Na rozdíl od Skryté ruky dovolují [Všechny postupky](pattern-1.1) i odkrytá Čou. I s odkrytou sadou na stole ti čtyři postupky dají 5 bodů.
tutorial.hands.all_sequences.unrestricted=Povolený je jakýkoli pár — i drak nebo vítr — a stačí jakýkoli typ čekání.

# Ruky a bodování — Bez krajních kamenů
tutorial.hands.no_terminals.title=Bez krajních kamenů
tutorial.hands.no_terminals.offer=Hráč naproti odhazuje kámen ({0}), který dokončí tvoji výherní ruku. Každý kámen v ruce je číslo od 2 do 8. Klikni na [hl]Hu[/] a vyhraješ.
tutorial.hands.no_terminals.terminals_def=Ve třech číselných barvách se krajním kamenům — **1** a **9** ({1m}, {9s}) — říká [hl]krajní kameny[/]. Kamenům uvnitř, od **2** do **8**, se říká [hl]prostřední kameny[/]. Čestné kameny nejsou ani krajní, ani prostřední.
tutorial.hands.no_terminals.points=Vzorec [Bez krajních kamenů](pattern-1.3) má cenu [hl]5[/] bodů. Každý kámen v ruce — všechny čtyři sady i pár — musí být [hl]prostřední[/], bez krajních a bez čestných kamenů.
tutorial.hands.no_terminals.flexibility=Všimni si, že tahle ruka má odkrytou trojici ({5p}{5p}{5p}), takže není ani skrytá, ani všechny postupky. Ale protože je každý kámen prostřední, má nárok na [hl]Bez krajních kamenů (5 bodů)[/]!
tutorial.hands.no_terminals.stacking=Bez krajních kamenů se může [hl]sčítat[/] s dalšími vzorci, jako jsou [Všechny postupky](pattern-1.1) nebo [Skrytá ruka](pattern-1.2), a dohromady dají 10 nebo 15 bodů.

# Ruky a bodování — Kongy
tutorial.hands.kongs.title=Kongy
tutorial.hands.kongs.offer=Hráč naproti odhazuje kámen ({0}), který dokončí tvoji výherní ruku. Na stole už máš dva odkryté kongy. Klikni na [hl]Hu[/] a vyhraješ.
tutorial.hands.kongs.two_kongs=Jak už jsme viděli, [Jeden kong](pattern-4.3.1) přinese [hl]5[/] bodů. **Dva kongy** zvednou skóre na [hl]20[/] bodů za [Dva kongy](pattern-4.3.2)!
tutorial.hands.kongs.hand_size=Protože každý kong zabírá 4 kameny místo 3 a bere si náhradní kámen, má tahle výherní ruka [hl]16[/] kamenů místo obvyklých 14.
tutorial.hands.kongs.ladder=Vyšší kongové vzorce rostou strmě: [Tři kongy](pattern-4.3.3) mají [hl]120[/] bodů a [Čtyři kongy](pattern-4.3.4) dosahují limitu [hl]480[/] bodů!

# Ruky a bodování — Cenný čestný kámen
tutorial.hands.value_honor.title=Cenný čestný kámen
tutorial.hands.value_honor.offer=Hráč naproti odhazuje kámen ({0}), který dokončí tvoji ruku. Díky odkryté trojici červených draků má ruka cenu [hl]Hu 10[/]! Klikni na [hl]Hu[/] a vyhraješ.
tutorial.hands.value_honor.dragons=Trojice nebo kong [hl]cenného čestného kamene[/] má cenu [hl]10[/] bodů ([Cenný čestný kámen](pattern-3.1)). Kterýkoli ze tří draků — **červený** ({C}), **zelený** ({F}) nebo **bílý** ({P}) — je cenným čestným kamenem pro každého hráče.
tutorial.hands.value_honor.seat_winds=Tvůj **vítr místa** (například {E} na místě Východu) je také cenný čestný kámen. Větry ostatních tří míst („cizí větry“) se nepočítají. Zung Jung **nezná vítr kola**.
tutorial.hands.value_honor.stacking=Cenný čestný kámen se počítá [hl]za každou sadu zvlášť[/]: dvě vyhovující trojice dají [hl]20[/] bodů. Odkryté sady jsou povolené, ale **páry** se nikdy nepočítají — počítají se jen trojice a kongy.

# Ruky a bodování — Všechny trojice
tutorial.hands.all_triplets.title=Všechny trojice
tutorial.hands.all_triplets.offer=Hráč naproti odhazuje kámen ({0}), který dokončí tvoji ruku na čtyři trojice a pár. Klikni na [hl]Hu[/] a vyhraješ!
tutorial.hands.all_triplets.pattern=Vzorec [Všechny trojice](pattern-4.1) chce čtyři trojice (nebo kongy) a pár, žádné postupky. Odkryté pongy jsou povolené a vzorec dává štědrých [hl]30[/] bodů!
tutorial.hands.all_triplets.settlement_cap=Při výhře na odhoz za víc než 25 bodů se ostatním hráčům [hl]počítá nejvýš 25 bodů[/] (hráči vlevo a vpravo platí [hl]-25[/]). Odhazující doplácí oba rozdíly: 30 + 5 + 5 = **40** ([hl]-40[/])!
tutorial.hands.all_triplets.self_draw=Přesto dostaneš plných **90 bodů** (3 × 30). Při **dobrání ze zdi** žádný odhazující není, takže všichni tři soupeři platí plných 30 bodů.

# Ruky a bodování — Devítikamenná přímka
tutorial.hands.nine_tile_straight.title=Devítikamenná přímka
tutorial.hands.nine_tile_straight.offer=Hráč naproti odhazuje kámen ({0}), který dokončí tvoji ruku na přímku od 1 do 9 ve znacích. Klikni na [hl]Hu[/] a vyhraješ!
tutorial.hands.nine_tile_straight.pattern=Vzorec [Devítikamenná přímka](pattern-7.1) má obrovskou cenu [hl]40[/] bodů! Chce tři postupky pokrývající **1 až 9 v jedné barvě** ({1m} až {9m}). Čou může být odkryté.
tutorial.hands.nine_tile_straight.composition=Zbylých 5 kamenů může být jakákoli platná sada a pár v libovolné barvě. Tady tvoji čtrnáctikamennou výherní ruku dokončí trojice {555p} a pár {99s}.
tutorial.hands.nine_tile_straight.settlement=U ruky za 40 bodů se ostatním hráčům počítá nejvýš [hl]-25[/]. Hráč naproti doplácí svých 40 i oba patnáctibodové rozdíly ([hl]-70[/]) a tobě čistě vychází [hl]+120[/] bodů (3 × 40)!

# Ruky a bodování — Sedm párů
tutorial.hands.seven_pairs.title=Sedm párů
tutorial.hands.seven_pairs.offer=Hráč naproti odhazuje kámen ({0}), který dokončí tvoji ruku na sedm párů. Klikni na [hl]Hu[/] a vyhraješ!
tutorial.hands.seven_pairs.pattern=Všechny výherní ruky zatím byly ze 4 sad a 1 páru. [Sedm párů](pattern-10.2) je [hl]nepravidelná ruka[/] — porušuje to pravidlo a skládá se ze **sedmi párů** za [hl]30[/] bodů!
tutorial.hands.seven_pairs.concealed_only=Sedm párů musí být [hl]úplně skrytých[/]. Nesmíš nárokovat Čou, Pong ani Kong — všechny páry musíš dobrat ze zdi. Poslední kámen si ale můžeš nárokovat na odhozu soupeře a 7. pár máš hotový!
# „legálně“ zde znamená „podle pravidel“ (ne „zákonně“).
tutorial.hands.seven_pairs.four_of_a_kind=U Sedmi párů se vždycky čeká už jen na [hl]jediný kámen[/] do 7. páru. V Zung Jung se všechny **čtyři kopie** stejného kamene (bez ohlášení kongu) podle pravidel počítají jako **dva páry**.

# Ruky a bodování — Dvě stejné postupky
tutorial.hands.two_identical_sequences.title=Dvě stejné postupky
tutorial.hands.two_identical_sequences.offer=Hráč naproti odhazuje kámen ({0}), který dokončí tvoji druhou stejnou postupku. Klikni na [hl]Hu[/] a vyhraješ!
tutorial.hands.two_identical_sequences.pattern=[Dvě stejné postupky](pattern-5.1.1) dávají [hl]10[/] bodů za dvě shodné postupky v jedné barvě ({234s} a {234s}). V ruce vypadají jako po sobě jdoucí páry ({223344s}). Odkrytá Čou jsou povolená!
tutorial.hands.two_identical_sequences.ladder=Vyšší stupně této série dávají obrovské body: [Tři stejné postupky](pattern-5.1.3) mají [hl]120[/] bodů a [Čtyři stejné postupky](pattern-5.1.4) dosahují limitu [hl]480[/] bodů!

# Ruky a bodování — Dvě skryté trojice
tutorial.hands.two_concealed_triplets.title=Dvě skryté trojice
tutorial.hands.two_concealed_triplets.offer=Hráč naproti odhazuje kámen ({0}), který dokončí tvoji ruku. Klikni na [hl]Hu[/] a vyhraješ!
tutorial.hands.two_concealed_triplets.pattern=[Dvě skryté trojice](pattern-4.2.1) dávají [hl]5[/] bodů za dvě trojice složené celé ve skryté ruce ({333p} a {666s}). Odkryté pongy se nepočítají!
tutorial.hands.two_concealed_triplets.ladder=Skryté trojice rostou strmě: [Tři skryté trojice](pattern-4.2.2) dávají [hl]30[/] bodů a [Čtyři skryté trojice](pattern-4.2.3) [hl]125[/] bodů!

# Ruky a bodování — Tři podobné trojice
tutorial.hands.three_similar_triplets.title=Tři podobné trojice
tutorial.hands.three_similar_triplets.offer=Hráč naproti odhazuje kámen ({0}), který dokončí tvoji ruku. Klikni na [hl]Hu[/] a vyhraješ!
tutorial.hands.three_similar_triplets.pattern=[Tři podobné trojice](pattern-6.2.2) dávají ohromných [hl]120[/] bodů za trojice **stejného čísla** ve všech třech barvách ({555m}, {555p}, {555s}). Odkryté pongy jsou povolené!
tutorial.hands.three_similar_triplets.small_triplets=Menší forma, [Malé tři podobné trojice](pattern-6.2.1), dává [hl]30[/] bodů za **dvě trojice a pár** stejného čísla ({555m}, {555p} a {55s}). Začátečníci ji často přehlédnou, ale je mnohem dosažitelnější!

# Ruky a bodování — Ruky jedné barvy
tutorial.hands.one_suit.title=Ruky jedné barvy
tutorial.hands.one_suit.offer=Hráč naproti odhazuje kámen ({0}), který dokončí tvoji ruku v kolečkách a čestných kamenech. Klikni na [hl]Hu[/] a vyhraješ!
tutorial.hands.one_suit.mixed=Vzorec [Smíšená jedna barva](pattern-2.1.1) dá [hl]40[/] bodů za ruku jen z **jedné číselné barvy** (oranžově) a z **čestných kamenů** (modře). Čou i pongy mohou být odkryté!
tutorial.hands.one_suit.pure=Když čestné kameny úplně vynecháš, [Čistá jedna barva](pattern-2.1.2) skóre zdvojnásobí na [hl]80[/] bodů! Všechny sady i pár teď patří do jediné barvy.

# Ruky a bodování — Další vzorce
tutorial.hands.more_patterns.title=Další vzorce
tutorial.hands.more_patterns.rarer=Základní vzorce máme za sebou. Spousta vzácnějších ruk — třeba dračí řady, větrné ruky a limitní ruky — je podrobně v [Příručce](reference).
tutorial.hands.more_patterns.practice=[Příručku](reference) si můžeš kdykoli během hry otevřít z menu a ověřit si pravidla vzorců i hodnoty skóre. Přeju příjemnou hru!

