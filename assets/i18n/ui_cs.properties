# České uživatelské rozhraní — klíče jsou stabilní; hodnoty jsou zdrojový text.
# Dodávané jazyky (ui_*.properties) mohou klíče vynechat; chybějící klíče se
# doplní z tohoto souboru přes I18NBundle. Klíče, které se záměrně nepřekládají,
# jsou uvedené v assets/i18n/untranslated-keys.txt; BundleCoverageTest hlídá,
# že vynechat lze jen tyto klíče.
#
# Poznámka k překladu: „hrát/hra“ v tomto souboru vždy znamená hraní hry, nikdy
# přehrávání médií. Řetězce, kde hraje stroj za tebe, jsou označené níže.

