tutorial.moves.east_player.pass=Minden leosztás után a szélkiosztás maga is elfordul az [hl]óramutató járásával ellentétesen[/]. Az a játékos lesz az új Kelet, aki korábban Dél volt.
tutorial.moves.discarding.title=Eldobás
tutorial.moves.discarding.east_14=Bármely leosztás kezdetén a [hl]Kelet[/] játékos (az osztó) kezében [hl]14[/] kő van (szemben a másik 3 játékossal, akiknek 13-13 kövük van).
tutorial.moves.discarding.east_hu=Ha ez a 14 kő azonnal egy [hl]nyerő kezet[/] alkot, Kelet azonnal bemondhatja a győzelmet („[hl]Hu![/]”) — ez a [Mennyei áldás](pattern-9.4.1).
tutorial.moves.discarding.east_hu_odds=Bár statisztikailag ennek az esélye mindössze [hl]1 a 328 909-hez[/]. Elképzelhető, hogy egész életében mahjongozik, és soha nem lát ilyet.
tutorial.moves.discarding.must_discard=Ha ez a kéz nem nyerő (ami a szokásos eset), Keletnek ki kell választania az egyik kövét, hogy [hl]eldobja[/], visszacsökkentve a kövei számát 13-ra.
tutorial.moves.discarding.least_useful=Az eldobáskor próbáljon meg megszabadulni a legkevésbé hasznos kőtől (amely nem tűnik ígéretesnek a jövőbeli kombinációkhoz).
tutorial.moves.discarding.others_claim=A többi játékos [hl]elveheti[/] az eldobott követ, hogy javítsa a kezét, vagy akár [hl]nyerjen[/].
tutorial.moves.counterclockwise.title=Lépések sorrendje
tutorial.moves.counterclockwise.this_tile=[hl]Kattintson erre a kőre[/] az eldobásához.
tutorial.moves.counterclockwise.click_callout=Dobja el
tutorial.moves.counterclockwise.if_nobody=Senki sem [hl]vette el[/], így eldobva maradt.
tutorial.moves.counterclockwise.the_river=A [hl]folyó[/] olyan, mint az eldobott kövek gyűjtőhelye: az el nem vett kövek képpel felfelé maradnak az előtt a játékos előtt, aki eldobta őket.
tutorial.moves.counterclockwise.to_the_right=A kör mindig az eldobó játékos [hl]jobb[/] oldalán ülő játékosra száll.
tutorial.moves.counterclockwise.right_next=Ön [hl]Kelet[/] (az asztal alján). A [hl]Jobb[/] oldali játékos következik — húzott a falból, majd el fog dobni egy követ.
tutorial.moves.counterclockwise.right_discards=Jobb [hl]eldob[/] egy követ. Senki sem kérte el, így a kör átkerül a [hl]Szemben[/] lévő játékoshoz, aki húz a falból.

# Kövek elvétele
tutorial.claims.click_callout=Válassza ezt
tutorial.claims.pung.title=Pung
tutorial.claims.pung.offer=Szemben eldobott egy olyan követ, amelyből már van egy [hl]párja[/] ({0}). [hl]Kattintson a Pung gombra[/] egy terc befejezéséhez.
tutorial.claims.pung.reveal=Egy másik játékos által eldobott kő elvételéhez [hl]fel kell fednie[/] a kialakított csoportot — itt a [hl]tercet[/].
tutorial.claims.pung.must_discard=Most [hl]14[/] köve van, és mivel ez nem nyerő kéz, [hl]el kell dobnia[/] egy követ.
tutorial.claims.pung.skips_left=Mivel elvette a követ, a [hl]Bal[/] oldali játékos köre kimarad — egyébként ő [hl]húzott volna a falból[/] most.
tutorial.claims.pung.third_for_two=Elkérheti a [hl]harmadikat[/] két meglévő kőhöz. Nem kérheti el a [hl]másodikat[/] egy meglévőhöz.
tutorial.claims.last_discard.title=Legutolsó eldobás
tutorial.claims.last_discard.only_fresh=Egy követ csak [hl]közvetlenül az eldobása után[/] vehet el. Nem vehet el olyan követ, amely már korábban a [hl]folyóba[/] került.
tutorial.claims.last_discard.callout=Ezt a követ dobták el legutoljára
# Elvétel — Chow
tutorial.claims.chow.title=Chow
tutorial.claims.chow.offer=Bal eldobott egy olyan követ ({0}), amely [hl]sorozatot[/] alkot két már meglévő kövével. [hl]Kattintson a Chow gombra[/] a befejezéséhez.
tutorial.claims.chow.reveal=Egy másik játékos által eldobott kő elvételéhez [hl]fel kell fednie[/] a kialakított csoportot — itt a [hl]sorozatot[/].
tutorial.claims.chow.must_discard=Most [hl]14[/] köve van, és mivel ez nem nyerő kéz, [hl]el kell dobnia[/] egy követ.
tutorial.claims.chow.only_left=[hl]Csak a Bal[/] oldali játékostól vehet el követ Chow-val (a közvetlenül Ön előtt lévő játékostól). A Szemben vagy Jobb által eldobott köveket nem lehet Chow-val elvenni.
tutorial.claims.hu.title=Hu
tutorial.claims.hu.offer=Itt a nyerő keze szinte kész, és már csak egy párra vár. Szemben most dobta el a szükséges követ ({0}). [hl]Kattintson a Hu gombra[/] az elvételéhez.
tutorial.claims.hu.not_a_set=Amikor egy eldobott kő kiegészít egy [hl]nyerő kezet[/], elveheti azt. [hl]Nem[/] szükséges, hogy csoportot alkosson — itt a [hl]párt[/] egészítette ki.
tutorial.claims.hu.breakdown=Ha a pontrészletező panel eltakarja az asztalt, [hl]elhúzhatja[/] az útból, vagy a nyíl gombbal [hl]összecsukhatja és kibonthatja[/]. Próbálja ki az elhúzását vagy összecsukását most!

# Elvétel — Elvételi prioritás
tutorial.claims.priority.title=Elvételi prioritás
tutorial.claims.priority.conflict=Bal most dobta el a {3s} követ. Ön kezében {12s} van, és bemondhatná a **Chow**-t, de Jobbnak van egy pár {3s} köve. Próbálja meg bemondani a [hl]Chow[/]-t, hogy lássa, mi történik!
tutorial.claims.priority.pung_beats_chow=Bár bemondta a Chow-t, a [hl]Pung megelőzi a Chow-t[/]! Jobb bemondása felülírja az Önét — Jobb viszi el a követ, az Ön köre pedig kimarad!
tutorial.claims.priority.hierarchy=Az egyetemes bemondási rangsor: a [hl]Győzelem (Hu)[/] megelőzi a [hl]Pungot és a Kongot[/], amelyek megelőzik a [hl]Chow-t[/].
tutorial.claims.priority.multi_win=Ha több játékos mond be [hl]Hu-t[/] ugyanarra az eldobásra, az eldobóhoz körsorrendben legközelebbi játékos nyer (nincs többszörös győzelem).

# Kongok — Nyílt kong
tutorial.kongs.melded.title=Nyílt kong
tutorial.kongs.melded.offer=Szemben eldobott egy olyan követ ({0}), amely megegyezik a zárt tercével. Kattintson a [hl]Kong[/] gombra a négyes bejelentéséhez!
tutorial.kongs.melded.reveal=Az eldobott 4. kő elvétele felfedi a négyes csoportot az asztalon mint [hl]nyílt kongot[/].
tutorial.kongs.melded.one_kong=Egy kong kialakítása [hl]5[/] pontot ér az [Egy kong](pattern-4.3.1) kombinációért, és több kong esetén növekszik.
tutorial.kongs.melded.compensation=Mivel egy kong 4 kőből áll, egy [hl]pótkövet[/] húz a fal végéből, hogy megmaradjon a kéz érvényes mérete.
tutorial.kongs.melded.must_discard=A pótkő felhúzása után [hl]el kell dobnia[/] egy követ a köre befejezéséhez.
tutorial.kongs.melded.already_melded=Nem kérheti el az eldobott 4. követ, ha a terce már nyílt [hl]Pungként[/] ki van terítve az asztalon.

# Kongok — Zárt kong
tutorial.kongs.concealed.title=Zárt kong
tutorial.kongs.concealed.offer=Épp most húzott egy követ a falból, és mind a négy darab {0} kő a kezében van. Kattintson a [hl]Zárt kong bemondása[/] gombra!
tutorial.kongs.concealed.arrangement=Figyelje meg az elrendezést: a két **szélső kő le van fordítva**, jelezve, hogy zárt maradt, míg a középsők igazolják a csoportot.
tutorial.kongs.concealed.scoring=A Zung Jungban a pontozás szempontjából **zárt** marad — a [Zárt kéz](pattern-1.2) kombináció érvényben marad!
tutorial.kongs.concealed.compensation=Húz egy [hl]pótkövet[/] a fal végéből, majd a szokásos módon eldob egy követ a köre befejezéséhez.

# Kongok — Kiegészített kong
tutorial.kongs.promoted.title=Kiegészített kong
tutorial.kongs.promoted.offer=Van egy nyílt terce {0} kövekből, és most húzta fel a 4. darabot! Kattintson a [hl]Kong kiegészítése[/] gombra a csoport felfejlesztéséhez.
tutorial.kongs.promoted.upgraded=A negyedik kő csatlakozik a nyílt terchez, nyílt konggá fejlesztve azt, és feljogosít az [Egy kong](pattern-4.3.1) kombinációra.
tutorial.kongs.promoted.robbing=Figyelem: Ez az egyetlen pillanat, amikor az ellenfelek [Elrabolhatják a kongot](pattern-9.3), ha ez a kő kiegészíti a nyerő kezüket!
tutorial.kongs.promoted.compensation=Ha biztonságos, húz egy [hl]pótkövet[/] a fal végéből, és eldob egy követ a köre befejezéséhez.

# Kezek és pontozás — Nyerés egy leosztásban
tutorial.hands.win.title=Nyerés egy leosztásban
tutorial.hands.win.hand_size=A játékosok általában [hl]13[/] követ tartanak a kezükben. Csak ideiglenesen tart 14-et húzás vagy elvétel közben. Ha nem nyer, vissza kell dobnia 13-ra.
tutorial.hands.win.patterns=A leosztás megnyeréséhez a kézben lévő köveknek meghatározott mintákat (kombinációkat) kell alkotniuk.
tutorial.hands.win.all_in_groups=Normális esetben a nyerő kézben minden kőnek a négy [hl]csoport[/] egyikébe vagy az egyetlen [hl]párba[/] kell tartoznia. Ez általában [hl]14[/] kő.
tutorial.hands.win.set_kinds=Egy csoport lehet [hl]sorozat[/], [hl]terc[/] vagy [hl]kong[/].
tutorial.hands.win.kong_size=Itt a négy csoport egyike egy [hl]kong[/]. Emiatt a kéznek [hl]15[/] köve van 14 helyett.

# Kezek és pontozás — Minta nélküli kéz
tutorial.hands.chicken.title=Minta nélküli kéz
tutorial.hands.chicken.one=Ha semmilyen különleges pontozási kombináció nem érvényes a kézre, azt [hl]minta nélküli kéznek[/] nevezik, és [hl]1[/] pontot ér.
tutorial.hands.chicken.tournament=Versenyeken a minta nélküli kezek [hl]tiltva[/] lehetnek — ilyenkor a kéznek legalább [hl]5[/] pontot kell érnie a nyeréshez.
tutorial.hands.chicken.next=A következő leckékben bemutatjuk azokat az alapvető kombinációkat, amelyekkel egy kéz elérheti az [hl]5[/] vagy több pontot.

# Kezek és pontozás — Zárt kéz
tutorial.hands.concealed.title=Zárt kéz
tutorial.hands.concealed.offer=Szemben eldobott egy követ ({0}), amely sorozatot alkot két már meglévő kövével. Nem veheti el Chow-val Szembentől — de mivel kiegészíti a kezét, bemondhatja a [hl]Hu 5[/]-öt! Kattintson a [hl]Hu[/] gombra a nyeréshez.
tutorial.hands.concealed.points=Minden ellenfél kifizeti a kéz pontértékét a győztesnek. Egy [hl]5[/] pontos kézért mindhárman 5-5 pontot fizetnek — összesen a kézérték [hl]3-szorosát[/] kapja meg ([hl]+15[/] pont)!
tutorial.hands.concealed.concealed_rule=Egy kéz akkor [hl]zárt[/], ha nem hajtott végre nyílt elvételt (mint a **Chow** vagy a **Pung**) a győzelem bemondása előtt.
tutorial.hands.concealed.discard_win=Bár Szemben eldobott kövét vette el az utolsó sorozat befejezéséhez, az eldobásra való nyerés [hl]megengedett[/] — csak a győzelem *előtt* végzett nyílt csoportok rontják el a Zárt kéz kombinációt.
tutorial.hands.concealed.kongs=Bármilyen [hl]Chow[/], [hl]Pung[/] vagy nyílt [hl]Kong[/] elvétele korábban a leosztás során felfedi a csoportot az asztalon, nyílttá téve a kezet és megtörve ezt a kombinációt.

# Kezek és pontozás — Csupa sorozat
tutorial.hands.all_sequences.title=Csupa sorozat
tutorial.hands.all_sequences.offer=Szemben eldobott egy követ ({0}), amely kiegészíti a negyedik sorozatát. Bár a keze nyitott egy korábbi Chow miatt, a gomb felkínálja a [hl]Hu 5[/]-öt! Kattintson a [hl]Hu[/] gombra a nyeréshez.
tutorial.hands.all_sequences.points=Egy olyan kéz, amelyben mind a négy csoport sorozat (nincsenek tercek vagy kongok), [hl]5[/] pontot ér a [Csupa sorozat](pattern-1.1) kombinációért.
tutorial.hands.all_sequences.open_allowed=A Zárt kézzel ellentétben a [Csupa sorozat](pattern-1.1) engedélyezi a nyílt Chow-kat. Még kiterített nyílt csoporttal is jár az 5 pont.
tutorial.hands.all_sequences.unrestricted=Bármilyen pár megengedett — akár sárkány vagy szél kitüntetés is —, és bármilyen várakozási mód érvényes.

# Kezek és pontozás — Nincsenek szélsők
tutorial.hands.no_terminals.title=Nincsenek szélsők
tutorial.hands.no_terminals.offer=Szemben eldobott egy követ ({0}), amely kiegészíti a nyerő kezét. A kezében lévő összes kő 2 és 8 közötti egyszerű számkő. Kattintson a [hl]Hu[/] gombra a nyeréshez.
tutorial.hands.no_terminals.terminals_def=A három számozott színben a szélső köveket — az **1-est** és a **9-est** ({1m}, {9s}) — [hl]szélsőknek[/] nevezzük. A belső köveket **2-től 8-ig** [hl]középsőknek[/] hívjuk. A kitüntetések egyikbe sem tartoznak.
tutorial.hands.no_terminals.points=A [Nincsenek szélsők](pattern-1.3) kombináció értéke [hl]5[/] pont. A kéz minden kövének — mind a négy csoportnak és a párnak — [hl]középsőnek[/] kell lennie, szélsők és kitüntetések nélkül.
tutorial.hands.no_terminals.flexibility=Vegye észre, hogy ebben a kézben van egy nyílt terc ({5p}{5p}{5p}), így nem zárt és nem csupa sorozat. De mivel minden kő középső, jogosult a [hl]Nincsenek szélsők (5 pont)[/] kombinációra!
tutorial.hands.no_terminals.stacking=A Nincsenek szélsők más kombinációkkal is [hl]összeadódhat[/], mint a [Csupa sorozat](pattern-1.1) vagy a [Zárt kéz](pattern-1.2), így 10 vagy 15 pontot adva.

# Kezek és pontozás — Kongok
tutorial.hands.kongs.title=Kongok
tutorial.hands.kongs.offer=Szemben eldobott egy követ ({0}), amely kiegészíti a nyerő kezét. Már két nyílt kong van az asztalán. Kattintson a [hl]Hu[/] gombra a nyeréshez.
tutorial.hands.kongs.two_kongs=Mint láttuk, az [Egy kong](pattern-4.3.1) [hl]5[/] pontot ér. **Két kong** jelenléte már [hl]20[/] pontra emeli az értéket a [Két kong](pattern-4.3.2) kombinációval!
tutorial.hands.kongs.hand_size=Mivel minden kong 3 helyett 4 kőből áll és pótkövet igényel, ez a nyerő kéz a szokásos 14 helyett [hl]16[/] kőből áll.
tutorial.hands.kongs.ladder=A magasabb kong-kombinációk meredeken emelkednek: a [Három kong](pattern-4.3.3) [hl]120[/] pontot ér, a [Négy kong](pattern-4.3.4) pedig eléri a [hl]480[/] pontos limitet!

# Kezek és pontozás — Értékes kitüntetés
tutorial.hands.value_honor.title=Értékes kitüntetés
tutorial.hands.value_honor.offer=Szemben eldobott egy követ ({0}), amely kiegészíti a kezét. A Vörös sárkányokból álló nyílt terce miatt ez a kéz [hl]Hu 10[/]-et ér! Kattintson a [hl]Hu[/] gombra a nyeréshez.
tutorial.hands.value_honor.dragons=Egy [hl]értékes kitüntetésből[/] álló terc vagy kong [hl]10[/] pontot ér ([Értékes kitüntetés](pattern-3.1)). A három sárkány bármelyike — **Vörös** ({C}), **Zöld** ({F}) vagy **Fehér** ({P}) — mindig értékes kitüntetés minden játékos számára.
tutorial.hands.value_honor.seat_winds=A saját **helyi szele** (mint a {E} a Kelet helyen) szintén értékes kitüntetés. A másik három szék szele („vendégszelek”) nem ad pontot. A Zung Jungban **nincs uralkodó vagy fordulószél**.
tutorial.hands.value_honor.stacking=Az Értékes kitüntetés [hl]csoportonként összeadódik[/]: két megfelelő terc birtoklása [hl]20[/] pontot ér. Nyílt csoportok megengedettek, de a **párok** soha nem adnak pontot — csak a tercek és kongok számítanak.

# Kezek és pontozás — Csupa terc
tutorial.hands.all_triplets.title=Csupa terc
tutorial.hands.all_triplets.offer=Szemben eldobott egy követ ({0}), amely négy tercre és egy párra egészíti ki a kezét. Kattintson a [hl]Hu[/] gombra a nyeréshez!
tutorial.hands.all_triplets.pattern=A [Csupa terc](pattern-4.1) kombinációhoz négy terc (vagy kong) és egy pár szükséges, sorozatok nélkül. Nyílt tercek megengedettek, és a kombináció bőséges [hl]30[/] pontot ad!
tutorial.hands.all_triplets.settlement_cap=A 25 pont feletti eldobásos győzelemnél a nem eldobó játékosok fizetése [hl]legfeljebb 25 pontra van korlátozva[/] (Bal/Jobb fizetése [hl]-25[/]). Az eldobó állja a hiányt: 30 + 5 + 5 = **40** ([hl]-40[/])!
tutorial.hands.all_triplets.self_draw=Ön továbbra is a teljes **90 pontot** kapja meg (3 × 30). **Önhúzás** esetén nincs eldobó játékos, így mindhárom ellenfél a teljes 30 pontot fizeti meg.

# Kezek és pontozás — Kilencköves sor
tutorial.hands.nine_tile_straight.title=Kilencköves sor
tutorial.hands.nine_tile_straight.offer=Szemben eldobott egy követ ({0}), amely egy karakterekből álló, 1-től 9-ig terjedő sorrá egészíti ki a kezét. Kattintson a [hl]Hu[/] gombra a nyeréshez!
tutorial.hands.nine_tile_straight.pattern=A [Kilencköves sor](pattern-7.1) kombináció hatalmas [hl]40[/] pontot ér! Három sorozat szükséges hozzá, amelyek lefedik az **1-től 9-ig terjedő számokat egyetlen színben** ({1m}-től {9m}-ig). Nyílt Chow-k megengedettek.
tutorial.hands.nine_tile_straight.composition=A fennmaradó 5 kő bármilyen érvényes csoport és pár lehet bármely színből. Itt egy {555p} terc és egy {99s} pár egészíti ki a 14 köves nyerő kezet.
tutorial.hands.nine_tile_straight.settlement=Egy 40 pontos kéznél a nem eldobó játékosok kifizetése [hl]-25[/] pontra van korlátozva. Szemben fizeti a saját 40 pontját plusz mindkét 15 pontos hiányt ([hl]-70[/]), így Ön [hl]+120[/] pontot kap (3 × 40)!

# Kezek és pontozás — Hét pár
tutorial.hands.seven_pairs.title=Hét pár
tutorial.hands.seven_pairs.offer=Szemben eldobott egy követ ({0}), amely hét párra egészíti ki a kezét. Kattintson a [hl]Hu[/] gombra a nyeréshez!
tutorial.hands.seven_pairs.pattern=Az eddigi összes nyerő kéz 4 csoportból és 1 párból állt. A [Hét pár](pattern-10.2) egy [hl]szabálytalan kéz[/] — megtöri ezt a szabályt azáltal, hogy **hét párt** alkot [hl]30[/] pontért!
tutorial.hands.seven_pairs.concealed_only=A Hét párnak [hl]teljesen zártnak[/] kell lennie. Nem mondhat be Chow-t, Pungot vagy Kongot — minden párt a falból kell húzni. Azonban az ellenfél eldobásából elveheti az utolsó követ a 7. pár befejezéséhez!
tutorial.hands.seven_pairs.four_of_a_kind=A Hét párra való várakozás mindig [hl]egyetlen kőre való várakozás[/] a 7. párnál. A Zung Jungban ugyanabból a kőből mind a **négy darab** birtoklása (kong bemondása nélkül) szabályosan **két párnak** számít.

# Kezek és pontozás — Két azonos sorozat
tutorial.hands.two_identical_sequences.title=Két azonos sorozat
tutorial.hands.two_identical_sequences.offer=Szemben eldobott egy követ ({0}), amely kiegészíti a második azonos sorozatát. Kattintson a [hl]Hu[/] gombra a nyeréshez!
tutorial.hands.two_identical_sequences.pattern=A [Két azonos sorozat](pattern-5.1.1) [hl]10[/] pontot ér két azonos sorozatért ugyanabból a színből ({234s} és {234s}). Kézben úgy néznek ki, mint egymást követő párok ({223344s}). Nyílt Chow-k megengedettek!
tutorial.hands.two_identical_sequences.ladder=A sorozat magasabb szintjei hatalmas pontokat adnak: a [Három azonos sorozat](pattern-5.1.3) [hl]120[/] pontot ér, a [Négy azonos sorozat](pattern-5.1.4) pedig eléri a [hl]480[/] pontos limitet!

# Kezek és pontozás — Két zárt terc
tutorial.hands.two_concealed_triplets.title=Két zárt terc
tutorial.hands.two_concealed_triplets.offer=Szemben eldobott egy követ ({0}), amely kiegészíti a kezét. Kattintson a [hl]Hu[/] gombra a nyeréshez!
tutorial.hands.two_concealed_triplets.pattern=A [Két zárt terc](pattern-4.2.1) [hl]5[/] pontot ad két olyan tercért, amely teljesen a zárt kézben jött létre ({333p} és {666s}). A nyílt tercek nem számítanak!
tutorial.hands.two_concealed_triplets.ladder=A zárt tercek meredeken növekednek: a [Három zárt terc](pattern-4.2.2) [hl]30[/] pontot ad, a [Négy zárt terc](pattern-4.2.3) pedig [hl]125[/] pontot ér!

# Kezek és pontozás — Három hasonló terc
tutorial.hands.three_similar_triplets.title=Három hasonló terc
tutorial.hands.three_similar_triplets.offer=Szemben eldobott egy követ ({0}), amely kiegészíti a kezét. Kattintson a [hl]Hu[/] gombra a nyeréshez!
tutorial.hands.three_similar_triplets.pattern=A [Három hasonló terc](pattern-6.2.2) hatalmas [hl]120[/] pontot ad az **azonos számú** tercek birtoklásáért mindhárom színben ({555m}, {555p}, {555s}). Nyílt tercek megengedettek!
tutorial.hands.three_similar_triplets.small_triplets=A kisebb változat, a [Kis három hasonló terc](pattern-6.2.1), [hl]30[/] pontot ér **két tercért és egy párért** ugyanabból a számból ({555m}, {555p} és {55s}). A kezdők gyakran figyelmen kívül hagyják, pedig sokkal reálisabb elérni!

# Kezek és pontozás — Egyszínű kezek
tutorial.hands.one_suit.title=Egyszínű kezek
tutorial.hands.one_suit.offer=Szemben eldobott egy követ ({0}), amely körökből és kitüntetésekből egészíti ki a kezét. Kattintson a [hl]Hu[/] gombra a nyeréshez!
tutorial.hands.one_suit.mixed=Ha csak **egyetlen számozott színből** (narancssárga) és **kitüntetésekből** (kék) áll a kéz, az [hl]40[/] pontot ér a [Vegyes egyszínű](pattern-2.1.1) kombinációért. Nyílt Chow-k és Pungok megengedettek!
tutorial.hands.one_suit.pure=Ha a kitüntetésköveket teljesen elhagyja, a [Tiszta egyszínű](pattern-2.1.2) megduplázza a pontszámot [hl]80[/] pontra! Minden csoport és a pár is kizárólag ahhoz az egy színhez tartozik.

