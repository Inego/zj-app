notice.empty=Noch keine Mitteilungen
# {0} Spielername, {1} dessen Wertung, {2} Versuchs-ID, {3} deine Punktzahl,
# {4} dessen Punktzahl, {5} deine Wertungsänderung, {6} Wertung vorher, {7} danach.
notice.later_play=**{0}** ({1}) hat [hl]{2}[/] gespielt. Du hast **{3}** erzielt, {0} hat **{4}** erzielt. Wertung {5} ({6} → {7}).
# Eine Zeile eines Später-Spielt-Stapels: {0} Versuchs-ID, {1} Punktzahl.
notice.later_play_row=| {0} | {1} |
# {0} neue Vergleiche, {1} Anzahl Versuche, {2} Wertungsänderung, {3} Wertung
# vorher, {4} Wertung danach; {5} ist der Stapel der Digest-Zeilen.
