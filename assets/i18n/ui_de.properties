tutorial.orient.tiles.intro=Im Mahjong gibt es 34 verschiedene Steinbilder: 27 Zahlenbilder und 7 Ehrenbilder. Hier sind einige von jeder Sorte.
tutorial.orient.tiles.tags=Steine können **mit Beschriftung** oder **ohne** angezeigt werden.
tutorial.orient.tiles.tags_try=In dieser App kannst du die Beschriftungen in den [Einstellungen](settings) ein- oder ausschalten. Diese dreizehn Steine folgen dieser Einstellung — klicke den Link und schalte das Kästchen um, um zu sehen, wie es funktioniert.
tutorial.orient.numbers.title=Zahlen
tutorial.orient.numbers.intro=Zahlensteine gibt es in drei Farben: Zeichen, Punkte und Bambus (je 1 bis 9).
# Callout-geführter Takt: kurze obere Zeile optional; die Lehre lebt in der Sprechblase.
tutorial.orient.numbers.bamboo1=Ein Bild zum Merken
tutorial.orient.numbers.bamboo1_callout=Die 1 Bambus wird traditionell als Vogel dargestellt.
# Folgenlehre (Ende von Zahlen): Definition, dann schrittweises Abziehen „keine Folge“.
tutorial.orient.numbers.sequence=Eine Folge sind **genau drei** aufeinanderfolgende Zahlen derselben Farbe — zum Beispiel {234m}, {567p} oder {123s}.
tutorial.orient.numbers.four=Vier aufeinanderfolgende Steine einer Farbe sind **keine** Folge.
tutorial.orient.numbers.four_aside3=Lege entweder die **3** beiseite.
tutorial.orient.numbers.four_aside6=Oder lege die **6** beiseite.
tutorial.orient.numbers.prompt=Finde eine **Folge** — wähle ihre drei Steine aus.
tutorial.orient.honors.title=Ehren
tutorial.orient.honors.intro=Winde und Drachen sind [hl]Ehren[/]-Steine. Sie bilden **keine** Zahlenfolgen.
tutorial.orient.honors.prompt=Wähle jeden Ehrenstein (Winde und Drachen) aus.
tutorial.orient.wall.title=Die Mauer bauen
tutorial.orient.wall.faces=Der komplette Satz Bilder: drei Farben von 1–9, dazu vier Winde und drei Drachen — insgesamt 34.
tutorial.orient.wall.copies=Jedes Bild gibt es viermal — insgesamt 136 Steine.
tutorial.orient.wall.drawpile=Die Mauer ist wie ein Ziehstapel bei Karten: Startsteine und Ziehungen während des Spiels kommen alle von ihr.
tutorial.orient.wall.ritual=An einem echten Tisch ist das Bauen der Mauer ein Ritual.
tutorial.orient.wall.facedown=Bevor du eine Mauer baust, drehe die Steine zuerst mit dem Bild nach unten...
tutorial.orient.wall.shuffle=Und mische sie gründlich.
tutorial.orient.wall.formed=Dann beginne, die Mauer zu bilden: vier Seiten mit 17 Stapeln, zwei Steine hoch.
tutorial.orient.wall.pushed=Die Mauern werden zusammengeschoben, damit die Enden aufeinandertreffen.
tutorial.orient.wall.seats=In jeder Hand ist ein Spieler Ost, der nächste Süd, dann West, dann Nord.
tutorial.orient.wall.east=Ost ist der Geber und macht den ersten Zug in der Hand.
tutorial.orient.wall.deal=Ost teilt aus, indem er zwei d6 wirft.
tutorial.orient.wall.dice=Die Summe der Würfel bestimmt, wo die Mauer aufgebrochen wird.
tutorial.orient.wall.count={0}+{1}={2}. Vom rechten Ende der Mauer von Ost aus zähle {2} Stapel.
tutorial.orient.wall.break=Die Mauer wird nach den gezählten Stapeln aufgebrochen. Die Stapel links davon rücken nach links und öffnen eine Lücke.
tutorial.orient.wall.take7=Zähle 7 Stapel rechts von der Lücke.
tutorial.orient.wall.dead=Lege sie beiseite, um eine separate tote Mauer zu bilden.
tutorial.orient.wall.dead_out=Diese 14 Steine werden nie gezogen, was gegen Ende der Hand für Unsicherheit sorgt.
tutorial.orient.wall.hands=Um ihre Hände zu bilden, nehmen die Spieler je 2 Stapel nach der Lücke und bauen die Mauer im Uhrzeigersinn ab — dreimal.
tutorial.orient.wall.hands_13=Danach hat jeder Spieler 3x4 = 12 Steine. Jeder nimmt noch 1 Stein, damit es 13 sind.
tutorial.orient.wall.east_14=Da Ost beginnt, startet er seinen Zug mit dem 14. Stein.
tutorial.orient.wall.look_hands=Jeder Spieler schaut sich seine Hand an...
tutorial.orient.wall.sort_hands=...und sortiert sie.
tutorial.orient.wall.east_discard=Jetzt muss der Spieler Ost seinen ersten Zug machen, indem er einen Stein abwirft.
tutorial.orient.wall.app_table=In dieser App wird die Spielmauer platzsparend vereinfacht dargestellt; die tote Mauer wird gar nicht angezeigt.
tutorial.orient.wall.live_count=Die **69** in der Mitte ist die Anzahl der verbleibenden Steine in der Spielmauer.

# Zugreihenfolge
tutorial.moves.east_player.title=Spieler Ost
tutorial.moves.east_player.four=Es gibt [hl]vier[/] Spieler. Für jede Hand ist einer davon [hl]Ost[/] (der Geber). Dann, gegen den Uhrzeigersinn: [hl]Süd[/], [hl]West[/] und [hl]Nord[/].
tutorial.moves.east_player.pass=Nach jeder Hand dreht sich die Windzuordnung selbst [hl]gegen den Uhrzeigersinn[/]. Der Spieler, der Süd war, wird der neue Ost.
tutorial.moves.discarding.title=Abwerfen
tutorial.moves.discarding.east_14=Zu Beginn jeder Hand hat der Spieler, der [hl]Ost[/] (der Geber) ist, [hl]14[/] Steine auf der Hand (anders als die anderen 3 Spieler mit je [hl]13[/] Steinen).
tutorial.moves.discarding.east_hu=Wenn diese 14 Steine eine [hl]Gewinnhand[/] bilden, kann Ost den Sieg sofort erklären („[hl]Hu![/]“) — das ist der [Segen des Himmels](pattern-9.4.1).
tutorial.moves.discarding.east_hu_odds=Statistisch beträgt die Chance dafür allerdings [hl]1 zu 328.909[/]. Du kannst dein ganzes Leben Mahjong spielen und dies nie erleben.
tutorial.moves.discarding.must_discard=Wenn diese Hand nicht gewinnt (was normalerweise der Fall ist), muss Ost einen seiner Steine [hl]abwerfen[/], um wieder auf 13 Steine zu kommen.
tutorial.moves.discarding.least_useful=Versuche beim Abwerfen, den nutzlosesten Stein loszuwerden (einen, der nicht vielversprechend genug für künftige Muster aussieht).
tutorial.moves.discarding.others_claim=Die anderen Spieler können den abgeworfenen Stein [hl]beanspruchen[/], um ihre Hände zu verbessern oder sogar zu [hl]gewinnen[/].
tutorial.moves.counterclockwise.title=Zugreihenfolge
tutorial.moves.counterclockwise.this_tile=[hl]Klicke diesen Stein[/], um ihn abzuwerfen.
tutorial.moves.counterclockwise.click_callout=Wirf ihn ab
tutorial.moves.counterclockwise.if_nobody=Niemand [hl]beanspruchte[/] ihn, also blieb er abgeworfen.
tutorial.moves.counterclockwise.the_river=Der [hl]Fluss[/] ist wie ein Ablagestapel bei Karten: nicht beanspruchte Steine bleiben offen vor dem Spieler liegen, der sie abgeworfen hat.
tutorial.moves.counterclockwise.to_the_right=Der Zug geht immer zum Spieler [hl]rechts[/] vom Abwerfenden.
tutorial.moves.counterclockwise.right_next=Du bist [hl]Ost[/] (unten am Tisch). [hl]Rechts[/] spielt als Nächstes — er zieht von der Mauer, dann wirft er ab.
tutorial.moves.counterclockwise.right_discards=Rechts [hl]wirft[/] einen Stein ab. Niemand beanspruchte ihn, also geht der Zug an [hl]Gegenüber[/], der von der Mauer zieht.

# Beanspruchen
tutorial.claims.click_callout=Dies auswählen
tutorial.claims.pung.title=Pung
tutorial.claims.pung.offer=Gegenüber hat einen Stein abgeworfen, von dem du bereits ein [hl]Paar[/] hast ({0}). [hl]Klicke Pung[/], um einen Drilling zu vervollständigen.
tutorial.claims.pung.reveal=Einen von einem anderen Spieler abgeworfenen Stein zu beanspruchen erfordert, die gebildete Gruppe [hl]aufzudecken[/] — hier den [hl]Drilling[/].
tutorial.claims.pung.must_discard=Jetzt hast du [hl]14[/] Steine, und da dies keine Gewinnhand ist, musst du einen Stein [hl]abwerfen[/].
tutorial.claims.pung.skips_left=Weil du ihn beansprucht hast, überspringt [hl]Links[/] seinen Zug — er hätte als Nächstes [hl]von der Mauer gezogen[/].
tutorial.claims.pung.third_for_two=Du kannst einen [hl]dritten[/] für zwei Kopien beanspruchen. Du kannst keinen [hl]zweiten[/] für eine beanspruchen.
tutorial.claims.last_discard.title=Letzter Abwurf
tutorial.claims.last_discard.only_fresh=Du kannst einen Stein [hl]direkt danach[/] beanspruchen, wenn er abgeworfen wird. Du kannst keinen Stein beanspruchen, der bereits im [hl]Fluss[/] liegt.
tutorial.claims.last_discard.callout=Dieser Stein wurde zuletzt abgeworfen
# Beanspruchen — Chow
tutorial.claims.chow.title=Chow
tutorial.claims.chow.offer=Links hat einen Stein abgeworfen ({0}), der mit zwei Steinen, die du bereits hast, eine [hl]Folge[/] vervollständigt. [hl]Klicke Chow[/], um sie zu vervollständigen.
tutorial.claims.chow.reveal=Einen von einem anderen Spieler abgeworfenen Stein zu beanspruchen erfordert, die gebildete Gruppe [hl]aufzudecken[/] — hier die [hl]Folge[/].
tutorial.claims.chow.must_discard=Jetzt hast du [hl]14[/] Steine, und da dies keine Gewinnhand ist, musst du einen Stein [hl]abwerfen[/].
tutorial.claims.chow.only_left=Du kannst [hl]nur[/] von [hl]Links[/] chowen (der Spieler direkt vor dir). Abwürfe von Gegenüber oder Rechts können nicht gechowt werden.
tutorial.claims.hu.title=Hu
tutorial.claims.hu.offer=Hier ist deine Gewinnhand fast vollständig, und du wartest auf ein Paar. Gegenüber hat gerade den Stein abgeworfen, den du brauchst ({0}). [hl]Klicke Hu[/], um ihn zu beanspruchen.
tutorial.claims.hu.not_a_set=Wenn ein abgeworfener Stein eine [hl]Gewinnhand[/] vervollständigt, kannst du ihn beanspruchen. Er muss [hl]nicht[/] eine [hl]Gruppe[/] vervollständigen — hier vervollständigte er das [hl]Paar[/].
tutorial.claims.hu.breakdown=Wenn die Punkteübersicht die Sicht auf den Tisch verdeckt, kannst du sie [hl]beiseiteschieben[/] oder mit der Chevron-Schaltfläche [hl]ein- und ausklappen[/]. Probiere jetzt aus, sie zu verschieben oder einzuklappen!

# Beanspruchen — Beanspruchungs-Priorität
tutorial.claims.priority.title=Beanspruchungs-Priorität
tutorial.claims.priority.conflict=Links hat gerade {3s} abgeworfen. Du hältst {12s} und könntest **Chow** rufen, aber Rechts hält ein Paar {3s}. Versuche [hl]Chow[/] zu beanspruchen, um zu sehen, was passiert!
tutorial.claims.priority.pung_beats_chow=Obwohl du Chow beansprucht hast, [hl]schlägt Pung Chow[/]! Die Beanspruchung von Rechts überstimmt deine — Rechts nimmt den Stein, und dein Zug wird übersprungen!
tutorial.claims.priority.hierarchy=Die allgemeine Beanspruchungs-Hierarchie ist: [hl]Sieg (Hu)[/] schlägt [hl]Pung & Kong[/], die beide [hl]Chow[/] schlagen.
tutorial.claims.priority.multi_win=Wenn mehrere Spieler [hl]Hu[/] auf denselben Abwurf beanspruchen, gewinnt der Spieler, der dem Abwerfenden in der Zugreihenfolge am nächsten ist (keine Doppelsiege).

# Kongs — Großer offener Kong
tutorial.kongs.melded.title=Gemeldeter Kong
tutorial.kongs.melded.offer=Gegenüber hat einen Stein abgeworfen ({0}), der zu deinem verdeckten Drilling passt. Klicke [hl]Kong[/], um einen Vierling zu erklären!
tutorial.kongs.melded.reveal=Einen abgeworfenen 4. Stein zu beanspruchen legt den Vierling als [hl]offenen Kong[/] auf den Tisch.
tutorial.kongs.melded.one_kong=Einen Kong zu bilden bringt [hl]5[/] Punkte für [Einen Kong](pattern-4.3.1) und steigt mit mehreren Kongs.
tutorial.kongs.melded.compensation=Da ein Kong 4 Steine hat, ziehst du einen [hl]Ersatzstein[/] vom Ende der Mauer, um eine gültige Handgröße zu behalten.
tutorial.kongs.melded.must_discard=Nach dem Ziehen des Ersatzsteins musst du [hl]abwerfen[/], um deinen Zug abzuschließen.
tutorial.kongs.melded.already_melded=Du kannst keinen abgeworfenen 4. Stein beanspruchen, wenn dein Drilling bereits als offener [hl]Pung[/] auf dem Tisch liegt.

# Kongs — Verdeckter Kong
tutorial.kongs.concealed.title=Verdeckter Kong
tutorial.kongs.concealed.offer=Du hast gerade einen Stein von der Mauer genommen und hältst alle vier Kopien von {0}. Klicke [hl]Verdeckten Kong erklären[/]!
tutorial.kongs.concealed.arrangement=Beachte die Meldung: Die beiden **Randsteine sind geschlossen** (mit dem Bild nach unten), um anzuzeigen, dass sie verdeckt bleibt, während die mittleren Steine die Gruppe belegen.
tutorial.kongs.concealed.scoring=In Zung Jung bleibt sie für die Wertung **verdeckt** — [Verdeckte Hand](pattern-1.2) bleibt gültig!
tutorial.kongs.concealed.compensation=Du ziehst einen [hl]Ersatzstein[/] vom Ende der Mauer und wirfst dann normal ab, um deinen Zug zu beenden.

# Kongs — Beförderter Kong
tutorial.kongs.promoted.title=Beförderter Kong
tutorial.kongs.promoted.offer=Du hast einen offenen Pung von {0} und gerade den 4. Stein gezogen! Klicke [hl]Zu Kong aufwerten[/], um deine Meldung aufzuwerten.
tutorial.kongs.promoted.upgraded=Der vierte Stein schließt sich deinem offenen Pung an, wertet ihn zu einem offenen Kong auf und qualifiziert für [Einen Kong](pattern-4.3.1).
tutorial.kongs.promoted.robbing=Warnung: Dies ist der einzige Moment, in dem Gegner den [Kong ausrauben](pattern-9.3) können, wenn dieser Stein ihre Gewinnhand vervollständigt!
tutorial.kongs.promoted.compensation=Wenn es sicher ist, ziehst du einen [hl]Ersatzstein[/] vom Ende der Mauer und wirfst ab, um deinen Zug abzuschließen.

# Hände und Wertung — Eine Hand gewinnen
tutorial.hands.win.title=Eine Hand gewinnen
tutorial.hands.win.hand_size=Spieler halten normalerweise [hl]13[/] Steine. Du hältst nur vorübergehend [hl]14[/], wenn du ziehst oder beanspruchst. Wenn du nicht gewinnst, musst du auf 13 zurück abwerfen.
tutorial.hands.win.patterns=Um eine Hand zu gewinnen, müssen die Steine auf deiner Hand bestimmte Muster bilden.
tutorial.hands.win.all_in_groups=Normalerweise muss in einer Gewinnhand jeder Stein Teil einer der vier [hl]Gruppen[/] oder des einzelnen [hl]Paares[/] sein. Das sind üblicherweise [hl]14[/] Steine.
tutorial.hands.win.set_kinds=Eine Gruppe ist eine [hl]Folge[/], ein [hl]Drilling[/] oder ein [hl]Kong[/].
tutorial.hands.win.kong_size=Hier ist eine der vier Gruppen ein [hl]Kong[/]. Wegen dieses Kongs hat die Hand [hl]15[/] Steine, nicht 14.

# Hände und Wertung — Musterlose Hand
tutorial.hands.chicken.title=Musterlose Hand
tutorial.hands.chicken.one=Wenn keine besonderen Wertungen auf diese Hand zutreffen, heißt sie eine [hl]Musterlose Hand[/] und ist [hl]1[/] Punkt wert.
tutorial.hands.chicken.tournament=In Turnieren können musterloose Hände [hl]verboten[/] sein — die Hand muss mindestens [hl]5[/] Punkte wert sein, um als gewinnbar zu gelten.
tutorial.hands.chicken.next=In den nächsten Lektionen behandeln wir die grundlegenden Wertungsmuster, mit denen eine Hand [hl]5[/] oder mehr Punkte erzielt.

# Hände und Wertung — Verdeckte Hand
tutorial.hands.concealed.title=Verdeckte Hand
tutorial.hands.concealed.offer=Gegenüber hat einen Stein abgeworfen ({0}), der eine Folge mit zwei Steinen vervollständigt, die du bereits hast. Du kannst nicht von Gegenüber chowen — aber weil er deine Hand vervollständigt, kannst du [hl]Hu 5[/] beanspruchen! Klicke [hl]Hu[/], um zu gewinnen.
tutorial.hands.concealed.points=Jeder Gegner zahlt die Handpunktzahl an den Gewinner. Bei einer [hl]5[/]-Punkte-Hand zahlen alle drei je 5 — netto [hl]3×[/] die Handpunktzahl ([hl]+15[/] Punkte)!
tutorial.hands.concealed.concealed_rule=Eine Hand ist [hl]verdeckt[/], wenn du vor der Siegerklärung keine offenen Beanspruchungen (wie **Chow** oder **Pung**) gemacht hast.
tutorial.hands.concealed.discard_win=Auch wenn du den Abwurf von Gegenüber beansprucht hast, um diese letzte Folge zu vervollständigen, ist ein Sieg auf einem Abwurf [hl]erlaubt[/] — nur offene Meldungen, die *vor* dem Sieg gemacht wurden, brechen die Verdeckte Hand.
tutorial.hands.concealed.kongs=Jeden [hl]Chow[/], [hl]Pung[/] oder [hl]Kong[/] früher in der Hand zu beanspruchen legt diese Gruppe auf den Tisch und macht deine Hand offen, was dieses Muster bricht.

# Hände und Wertung — Nur Folgen
tutorial.hands.all_sequences.title=Nur Folgen
tutorial.hands.all_sequences.offer=Gegenüber hat einen Stein abgeworfen ({0}), der deine vierte Folge vervollständigt. Obwohl deine Hand durch ein früheres Chow offen ist, bietet der Knopf [hl]Hu 5[/] an! Klicke [hl]Hu[/], um zu gewinnen.
tutorial.hands.all_sequences.points=Eine Hand, in der alle vier Gruppen Folgen sind (ohne Drillinge oder Kongs), bringt [hl]5[/] Punkte für [Nur Folgen](pattern-1.1).
tutorial.hands.all_sequences.open_allowed=Anders als die Verdeckte Hand erlaubt [Nur Folgen](pattern-1.1) offene Chows. Selbst mit einer offenen Meldung auf dem Tisch bringen vier Folgen 5 Punkte.
tutorial.hands.all_sequences.unrestricted=Jedes Paar ist erlaubt — sogar Drachen- oder Windehren — und jede Art Wartestellung qualifiziert.

# Hände und Wertung — Keine Endsteine
tutorial.hands.no_terminals.title=Keine Endsteine
tutorial.hands.no_terminals.offer=Gegenüber hat einen Stein abgeworfen ({0}), der deine Gewinnhand vervollständigt. Jeder Stein auf deiner Hand ist eine einfache Zahl von 2 bis 8. Klicke [hl]Hu[/], um zu gewinnen.
tutorial.hands.no_terminals.terminals_def=In den drei Zahlenfarben heißen die Endsteine — **1** und **9** ({1m}, {9s}) — [hl]Endsteine[/]. Die inneren Steine von **2** bis **8** heißen [hl]einfache Steine[/]. Ehren sind keines von beiden.
tutorial.hands.no_terminals.points=Das Muster [Keine Endsteine](pattern-1.3) ist [hl]5[/] Punkte wert. Jeder Stein der Hand — alle vier Gruppen und das Paar — muss ein [hl]einfacher Stein[/] sein, ohne Endsteine und ohne Ehren.
tutorial.hands.no_terminals.flexibility=Beachte, dass diese Hand einen offenen Drilling ({5p}{5p}{5p}) hat, also weder verdeckt noch nur Folgen ist. Aber weil jeder Stein einfach ist, qualifiziert sie für [hl]Keine Endsteine (5 Pkt.)[/]!
tutorial.hands.no_terminals.stacking=Keine Endsteine kann auch mit anderen Mustern wie [Nur Folgen](pattern-1.1) oder [Verdeckte Hand](pattern-1.2) [hl]gestapelt[/] werden, wenn diese zutreffen, und kombiniert dann auf 10 oder 15 Punkte.

# Hände und Wertung — Kongs
tutorial.hands.kongs.title=Kongs
tutorial.hands.kongs.offer=Gegenüber hat einen Stein abgeworfen ({0}), der deine Gewinnhand vervollständigt. Du hältst bereits zwei offene Kongs auf dem Tisch. Klicke [hl]Hu[/], um zu gewinnen.
tutorial.hands.kongs.two_kongs=Wie wir früher sahen, bringt [Einen Kong](pattern-4.3.1) [hl]5[/] Punkte. Mit **zwei Kongs** steigt die Punktzahl auf [hl]20[/] Punkte für [Zwei Kongs](pattern-4.3.2)!
tutorial.hands.kongs.hand_size=Da jeder Kong 4 Steine statt 3 nimmt und einen Ersatzstein zieht, hat diese Gewinnhand [hl]16[/] Steine statt der üblichen 14.
tutorial.hands.kongs.ladder=Höhere Kong-Muster steigen steil: [Drei Kongs](pattern-4.3.3) bringen [hl]120[/] Punkte, und [Vier Kongs](pattern-4.3.4) erreichen das [hl]480[/]-Punkte-Limit!

# Hände und Wertung — Wertvolle Ehre
tutorial.hands.value_honor.title=Wertvolle Ehre
tutorial.hands.value_honor.offer=Gegenüber hat einen Stein abgeworfen ({0}), der deine Hand vervollständigt. Dein offener Drilling roter Drachen macht diese Hand [hl]Hu 10[/] wert! Klicke [hl]Hu[/], um zu gewinnen.
tutorial.hands.value_honor.dragons=Ein Drilling oder Kong einer [hl]wertvollen Ehre[/] ist [hl]10[/] Punkte wert ([Wertvolle Ehre](pattern-3.1)). Jeder der drei Drachen — **Rot** ({C}), **Grün** ({F}) oder **Weiß** ({P}) — ist für jeden Spieler immer eine wertvolle Ehre.
tutorial.hands.value_honor.seat_winds=Dein eigener **Sitzwind** (wie {E} für den Sitz Ost) ist ebenfalls eine wertvolle Ehre. Winde der anderen drei Sitze („Gastwinde“) zählen nicht. In Zung Jung gibt es **keinen vorherrschenden oder Rundwind**.
tutorial.hands.value_honor.stacking=Wertvolle Ehre zählt [hl]kumulativ pro Gruppe[/]: zwei qualifizierende Drillinge bringen [hl]20[/] Punkte. Offene Meldungen sind erlaubt, aber **Paare** zählen nie — nur Drillinge und Kongs zählen.

# Hände und Wertung — Nur Drillinge
tutorial.hands.all_triplets.title=Nur Drillinge
tutorial.hands.all_triplets.offer=Gegenüber hat einen Stein abgeworfen ({0}), der deine Hand zu vier Drillingen und einem Paar vervollständigt. Klicke [hl]Hu[/], um zu gewinnen!
tutorial.hands.all_triplets.pattern=Das Muster [Nur Drillinge](pattern-4.1) erfordert vier Drillinge (oder Kongs) und ein Paar, ohne Folgen. Offene Pungs sind erlaubt, und das Muster bringt großzügige [hl]30[/] Punkte!
tutorial.hands.all_triplets.settlement_cap=Bei einem Sieg auf Abwurf über 25 Punkte werden Nicht-Abwerfende [hl]auf 25 Punkte begrenzt[/] (Links/Rechts zahlen [hl]-25[/]). Der Abwerfende deckt beide Fehlbeträge: 30 + 5 + 5 = **40** ([hl]-40[/])!
tutorial.hands.all_triplets.self_draw=Du erhältst weiterhin die vollen **90 Punkte** (3 \u00d7 30). Bei einer **Selbstziehung** gibt es keinen Abwerfenden, also zahlen alle drei Gegner die vollen 30 Punkte.

# Hände und Wertung — Neun-Steine-Straße
tutorial.hands.nine_tile_straight.title=Neun-Steine-Straße
tutorial.hands.nine_tile_straight.offer=Gegenüber hat einen Stein abgeworfen ({0}), der deine Hand zu einer Straße von 1 bis 9 in Zeichen vervollständigt. Klicke [hl]Hu[/], um zu gewinnen!
tutorial.hands.nine_tile_straight.pattern=Das Muster [Neun-Steine-Straße](pattern-7.1) ist enorme [hl]40[/] Punkte wert! Es erfordert drei Folgen, die **1 bis 9 in einer einzigen Farbe** ({1m} bis {9m}) abdecken. Offene Chows sind erlaubt.
tutorial.hands.nine_tile_straight.composition=Die verbleibenden 5 Steine können eine beliebige gültige Gruppe und ein Paar in jeder Farbe sein. Hier vervollständigen ein Drilling {555p} und ein Paar {99s} deine 14-Steine-Gewinnhand.
tutorial.hands.nine_tile_straight.settlement=Bei einer 40-Punkte-Hand werden Nicht-Abwerfende auf [hl]-25[/] begrenzt. Gegenüber deckt seine 40 plus beide 15-Punkte-Fehlbeträge ([hl]-70[/]) und bringt dir netto [hl]+120[/] Punkte (3 \u00d7 40)!

# Hände und Wertung — Sieben Paare
tutorial.hands.seven_pairs.title=Sieben Paare
tutorial.hands.seven_pairs.offer=Gegenüber hat einen Stein abgeworfen ({0}), der deine Hand zu sieben Paaren vervollständigt. Klicke [hl]Hu[/], um zu gewinnen!
tutorial.hands.seven_pairs.pattern=Alle bisherigen Gewinnhände bestanden aus 4 Gruppen und 1 Paar. [Sieben Paare](pattern-10.2) ist eine [hl]irreguläre Hand[/] — sie bricht diese Regel, indem sie **sieben Paare** für [hl]30[/] Punkte bildet!
tutorial.hands.seven_pairs.concealed_only=Sieben Paare müssen [hl]vollständig verdeckt[/] sein. Du kannst kein Chow, Pung oder Kong rufen — alle Paare müssen von der Mauer gezogen werden. Du kannst jedoch den letzten Stein auf dem Abwurf eines Gegners beanspruchen, um dein 7. Paar zu vervollständigen!
tutorial.hands.seven_pairs.four_of_a_kind=Das Warten auf Sieben Paare ist immer ein [hl]Einzelstein-Warten[/] auf dein 7. Paar. In Zung Jung zählt das Halten aller **vier Kopien** desselben Steins (ohne einen Kong zu erklären) legal als **zwei Paare**.

# Hände und Wertung — Zwei identische Folgen
tutorial.hands.two_identical_sequences.title=Zwei identische Folgen
tutorial.hands.two_identical_sequences.offer=Gegenüber hat einen Stein abgeworfen ({0}), der deine zweite identische Folge vervollständigt. Klicke [hl]Hu[/], um zu gewinnen!
tutorial.hands.two_identical_sequences.pattern=[Zwei identische Folgen](pattern-5.1.1) bringt [hl]10[/] Punkte für zwei gleiche Folgen in einer Farbe ({234s} und {234s}). In der Hand sehen sie wie aufeinanderfolgende Paare aus ({223344s}). Offene Chows sind erlaubt!
tutorial.hands.two_identical_sequences.ladder=Höhere Stufen dieser Reihe bringen enorme Punkte: [Drei identische Folgen](pattern-5.1.3) bringen [hl]120[/] Punkte, und [Vier identische Folgen](pattern-5.1.4) erreichen das [hl]480[/]-Punkte-Limit!

# Hände und Wertung — Zwei verdeckte Drillinge
tutorial.hands.two_concealed_triplets.title=Zwei verdeckte Drillinge
tutorial.hands.two_concealed_triplets.offer=Gegenüber hat einen Stein abgeworfen ({0}), der deine Hand vervollständigt. Klicke [hl]Hu[/], um zu gewinnen!
tutorial.hands.two_concealed_triplets.pattern=[Zwei verdeckte Drillinge](pattern-4.2.1) bringt [hl]5[/] Punkte für zwei Drillinge, die vollständig in deiner verdeckten Hand gebildet wurden ({333p} und {666s}). Offene Pungs qualifizieren nicht!
tutorial.hands.two_concealed_triplets.ladder=Verdeckte Drillinge steigen steil: [Drei verdeckte Drillinge](pattern-4.2.2) bringen [hl]30[/] Punkte, und [Vier verdeckte Drillinge](pattern-4.2.3) bringen [hl]125[/] Punkte!

# Hände und Wertung — Drei ähnliche Drillinge
tutorial.hands.three_similar_triplets.title=Drei ähnliche Drillinge
tutorial.hands.three_similar_triplets.offer=Gegenüber hat einen Stein abgeworfen ({0}), der deine Hand vervollständigt. Klicke [hl]Hu[/], um zu gewinnen!
tutorial.hands.three_similar_triplets.pattern=[Drei ähnliche Drillinge](pattern-6.2.2) bringt enorme [hl]120[/] Punkte für Drillinge mit der **gleichen Zahl** in allen drei Farben ({555m}, {555p}, {555s}). Offene Pungs sind erlaubt!
tutorial.hands.three_similar_triplets.small_triplets=Die kleinere Form, [Kleine drei ähnliche Drillinge](pattern-6.2.1), bringt [hl]30[/] Punkte für **zwei Drillinge und ein Paar** derselben Zahl ({555m}, {555p} und {55s}). Anfänger übersehen sie oft, aber sie ist viel realistischer zu erreichen!

# Hände und Wertung — Einfarbige Hände
tutorial.hands.one_suit.title=Einfarbige Hände
tutorial.hands.one_suit.offer=Gegenüber hat einen Stein abgeworfen ({0}), der deine Hand in Punkten und Ehren vervollständigt. Klicke [hl]Hu[/], um zu gewinnen!
tutorial.hands.one_suit.mixed=Steine aus nur **einer Zahlenfarbe** (in Orange) zusammen mit **Ehren** (in Blau) bringen [hl]40[/] Punkte für [Gemischte Einfarbig](pattern-2.1.1). Offene Chows und Pungs sind erlaubt!
tutorial.hands.one_suit.pure=Wenn du Ehrensteine ganz weglässt, verdoppelt [Reine Einfarbig](pattern-2.1.2) die Punktzahl auf [hl]80[/] Punkte! Jede Gruppe und das Paar gehören dann dieser einen Farbe an.

# Hände und Wertung — Weitere Muster
tutorial.hands.more_patterns.title=Weitere Muster
tutorial.hands.more_patterns.rarer=Wir haben die Kernmuster behandelt. Viele seltenere Hände — wie Drachenreihen, Windhände und Limit-Hände — sind in der [Referenz](reference) beschrieben.
tutorial.hands.more_patterns.practice=Du kannst die [Referenz](reference) jederzeit aus dem Spielmenü während des Spiels aufrufen, um Musterregeln und Punktewerte nachzuschlagen. Viel Spaß beim Spielen!

