# Online-Hub: Tab-Leiste des vereinbarten Online-Bildschirms und die Texte des
# Tabs „Shadow Ranked“. Ein Shadow-Ranked-Versuch ist eine feste Austeilung; jeder
# Spieler bekomm am selben Platz dieselben Ziehungen; die Wertung vergleicht einen
# Beenden mit einem festen Bot, mit allen, die diese Auslegung vor ihm beendet haben,
# und — für jene früheren Spieler — mit dem Beenden, der sie danach spielte.
