tutorial.orient.tiles.intro=麻雀牌共有34款不同的牌面：27款數牌與7款字牌。以下展示其中幾款。
tutorial.orient.tiles.tags=牌面可以選擇**顯示標籤**或**隱藏標籤**。
tutorial.orient.tiles.tags_try=在此應用程式中，你可以在[設定](settings)中開啟或關閉標籤。這十三張牌會跟隨該設定 — 點擊連結並切換核取方塊即可查看效果。
tutorial.orient.numbers.title=數牌
tutorial.orient.numbers.intro=數牌分為三種花色：萬子、筒子和索子（各從1到9）。
tutorial.orient.numbers.bamboo1=值得注意的一款牌
tutorial.orient.numbers.bamboo1_callout=一索傳統上通常繪製成鳥的圖案（孔雀或麻雀）。
tutorial.orient.numbers.sequence=順子是指同一花色中**恰好三張**連續數字的牌 — 例如 {234m}、{567p} 或 {123s}。
tutorial.orient.numbers.four=同一花色中連續的四張牌**不是**一組順子。
tutorial.orient.numbers.four_aside3=要麼移開 **3**。
tutorial.orient.numbers.four_aside6=要麼移開 **6**。
tutorial.orient.numbers.prompt=找出一個**順子** — 選取其三張牌。
tutorial.orient.honors.title=字牌
tutorial.orient.honors.intro=風牌與三元牌是[hl]字牌[/]。它們**不能**組成數字順子。
tutorial.orient.honors.prompt=選取所有字牌（風牌與三元牌）。
tutorial.orient.wall.title=砌牌牆
tutorial.orient.wall.faces=完整的牌面款式：三種花色的1–9，加上四個風牌與三個三元牌 — 總共34款。
tutorial.orient.wall.copies=每款有四張相同的牌 — 總共136張。
tutorial.orient.wall.drawpile=牌牆就像撲克牌中的摸牌堆：起手配牌與對局中的摸牌均來自牌牆。
tutorial.orient.wall.ritual=在實體麻雀桌上打牌時，砌牌牆是一套傳統儀式。
tutorial.orient.wall.facedown=砌牌牆前，首先把所有牌牌面朝下蓋上…
tutorial.orient.wall.shuffle=然後充分洗牌。
tutorial.orient.wall.formed=接著開始砌牌牆：四邊各砌17墩，每墩兩張牌高。
tutorial.orient.wall.pushed=把四方牌牆推前湊攏。
tutorial.orient.wall.seats=每局對局中，四家分別為東家、南家、西家、北家。
tutorial.orient.wall.east=東家是莊家，也是該局第一位出牌摸打的玩家。
tutorial.orient.wall.deal=東家擲兩顆骰子開門。
tutorial.orient.wall.dice=骰子點數之和決定從哪裏開門取牌。
tutorial.orient.wall.count={0}+{1}={2}。從東家牌牆右端數起 {2} 墩。
tutorial.orient.wall.break=在數到的墩數之後開門。門左側的牌牆向左移開，露出缺口。
tutorial.orient.wall.take7=從缺口右側數出 7 墩。
tutorial.orient.wall.dead=把它們留在一旁作為獨立的王牌。
tutorial.orient.wall.dead_out=這 14 張牌不用於摸牌，為局末增添了不確定性。
tutorial.orient.wall.hands=各家從缺口順時針方向輪流拿牌，每次拿 2 墩（4張），共拿三次。
tutorial.orient.wall.hands_13=拿完三次後各家已有 3×4 = 12 張牌，各家再拿 1 張，使手牌達到 13 張。
tutorial.orient.wall.east_14=由於東家先出牌，東家直接摸進第 14 張牌開始回合。
tutorial.orient.wall.look_hands=各家檢視各自的手牌…
tutorial.orient.wall.sort_hands=…並整理手牌（理牌）。
tutorial.orient.wall.east_discard=現在，東家必須打出一張牌進行首度捨牌。
tutorial.orient.wall.app_table=在此應用程式中，為節省螢幕空間，牌牆以簡化方式顯示，王牌則不單獨顯示。
tutorial.orient.wall.live_count=中央的 **69** 代表牌牆中剩餘可摸的牌數。

# Move order
tutorial.moves.east_player.title=東家
tutorial.moves.east_player.four=共有[hl]四位[/]玩家。每一局中，其中一位為[hl]東家[/]（莊家）。接著按逆時針方向分別為：[hl]南家[/]、[hl]西家[/]、[hl]北家[/]。
tutorial.moves.east_player.pass=每局結束後輪莊，門風分配按[hl]逆時針方向[/]轉移。原來的南家成為下一局的東家。
tutorial.moves.discarding.title=打牌
tutorial.moves.discarding.east_14=每局開始時，身為[hl]東家[/]（莊家）的玩家手中有[hl]14[/]張牌（其餘三家各有[hl]13[/]張）。
tutorial.moves.discarding.east_hu=若這14張配牌直接構成[hl]和牌形[/]，東家可立即宣佈和牌（「[hl]和！[/]」） — 這就是[天和](pattern-9.4.1)。
tutorial.moves.discarding.east_hu_odds=不過從統計上來看，天和的機率只有大約[hl]328,909分之一[/]。可能打一輩子麻雀也難得一見。
tutorial.moves.discarding.must_discard=若配牌未和（一般情況皆如此），東家必須從手牌中選取一張[hl]打出[/]，使手牌張數回復為13張。
tutorial.moves.discarding.least_useful=打牌時，應盡量打出最無用的一張牌（較難與其他牌配合成和種的面子）。
tutorial.moves.discarding.others_claim=其他玩家可以[hl]鳴取[/]此打出的牌以改善手牌，甚至直接[hl]和牌[/]。
tutorial.moves.counterclockwise.title=行牌順序
tutorial.moves.counterclockwise.this_tile=[hl]點擊此牌[/]將其打出。
tutorial.moves.counterclockwise.click_callout=打出此牌
tutorial.moves.counterclockwise.if_nobody=沒有人[hl]鳴牌[/]，因此這張牌留在牌池中。
tutorial.moves.counterclockwise.the_river=[hl]牌池[/]就像棄牌堆：無人鳴取的打牌會牌面朝上留在打牌者的面前。
tutorial.moves.counterclockwise.to_the_right=輪玩順序永遠轉向打牌者的[hl]右手邊[/]（下家）。
tutorial.moves.counterclockwise.right_next=你是[hl]東家[/]（桌子底端）。[hl]下家[/]接續出牌 — 他們從牌牆摸了一張牌，接著準備打牌。
tutorial.moves.counterclockwise.right_discards=下家[hl]打出[/]一張牌。無人鳴牌，接著輪到[hl]對家[/]從牌牆摸牌。

# Claiming
tutorial.claims.click_callout=選擇此項
tutorial.claims.pung.title=碰牌
tutorial.claims.pung.offer=對家打出一張你手中已有[hl]一對[/]的牌（{0}）。[hl]點擊碰牌[/]以組成刻子。
tutorial.claims.pung.reveal=鳴取他家打出的牌時，必須將組成的面子[hl]打開示眾[/]留在檯上 — 在此處即為[hl]明刻[/]。
tutorial.claims.pung.must_discard=現在你手中有[hl]14[/]張牌，由於尚未和牌，你必須[hl]打出[/]一張牌。
tutorial.claims.pung.skips_left=由於你碰了牌，[hl]上家[/]被跳過回合 — 原本應輪到他們[hl]從牌牆摸牌[/]。
tutorial.claims.pung.third_for_two=手中有兩張相同牌時可鳴取[hl]第三張[/]湊成刻子，但手中只有一張時不可鳴取第二張。
tutorial.claims.last_discard.title=最新打牌
tutorial.claims.last_discard.only_fresh=你只能在剛打出牌時[hl]立即[/]鳴取該牌。不能鳴取早已留在[hl]牌池[/]中的舊牌。
tutorial.claims.last_discard.callout=這是最後打出的一張牌
# Claiming — Chow
tutorial.claims.chow.title=吃牌
tutorial.claims.chow.offer=上家打出一張牌（{0}），能與你手中的兩張牌組成[hl]順子[/]。[hl]點擊吃牌[/]以完成順子。
tutorial.claims.chow.reveal=鳴取他家打出的牌時，必須將組成的面子[hl]打開示眾[/] — 在此處即為[hl]明順[/]。
tutorial.claims.chow.must_discard=現在你手中有[hl]14[/]張牌，由於尚未和牌，你必須[hl]打出[/]一張牌。
tutorial.claims.chow.only_left=你[hl]只能[/]吃[hl]上家[/]（在自己之前輪玩的一家）打出的牌。對家或下家打出的牌不能吃。
tutorial.claims.hu.title=和牌
tutorial.claims.hu.offer=此時你的手牌已聽牌，只差一對眼。對家剛好打出了你所聽的牌（{0}）。[hl]點擊和牌[/]以宣佈和牌！
tutorial.claims.hu.not_a_set=當他家打出的牌能剛好完成你的[hl]和牌形[/]時，即可鳴取和牌。鳴牌和牌[hl]不限於[/]完成[hl]面子[/] — 即使完成的是[hl]眼（對子）[/]亦可！
tutorial.claims.hu.breakdown=如果結算明細面板擋住了牌桌，你可以將其[hl]拖曳[/]移開，或使用箭頭按鈕將其[hl]折疊與展開[/]。現在就試試拖曳或折疊它吧！

# Claiming — Claim priority
tutorial.claims.priority.title=鳴牌優先規條
tutorial.claims.priority.conflict=上家剛打出 {3s}。你持有 {12s} 可以**吃牌**，但下家持有 {3s} 對子。試試點擊[hl]吃牌[/]看看會發生甚麼！
tutorial.claims.priority.pung_beats_chow=雖然你點擊了吃牌，但[hl]碰牌優先於吃牌[/]！下家的碰牌覆蓋了你的吃牌 — 下家鳴取該牌，你的回合被跳過！
tutorial.claims.priority.hierarchy=通用的鳴牌優先順序為：[hl]和牌[/]優先於[hl]碰牌與大明槓[/]，兩者均優先於[hl]吃牌[/]。
tutorial.claims.priority.multi_win=若有多家同時對同一張打牌宣佈[hl]和牌[/]，按輪玩順序最先輪到的一家和牌（傳統單和「截和」規則，不設雙和）。

# Kongs — Big exposed kong
tutorial.kongs.melded.title=大明槓
tutorial.kongs.melded.offer=對家打出一張牌（{0}），正好符合你手中的暗刻。點擊[hl]槓牌[/]開大明槓！
tutorial.kongs.melded.reveal=鳴取他家打出的第四張牌開槓，四張牌會在檯面上打開示眾成為[hl]明槓[/]。
tutorial.kongs.melded.one_kong=開槓可計和種：開一個槓可得[一槓](pattern-4.3.1)的 [hl]5[/] 分，開多個槓分數會相應倍增。
tutorial.kongs.melded.compensation=由於槓子使用了4張牌，你必須從牌牆尾端摸取一張[hl]嶺上牌[/]（補槓），以維持和牌形的手牌張數。
tutorial.kongs.melded.must_discard=補槓後，你必須正常[hl]打出[/]一張牌以完成回合。
tutorial.kongs.melded.already_melded=若你手中的刻子已經碰出在檯面上成為明刻，則不能鳴取他家打出的第四張牌來開槓。

# Kongs — Concealed kong
tutorial.kongs.concealed.title=暗槓
tutorial.kongs.concealed.offer=你剛剛自摸摸齊了四張相同的 {0}。點擊[hl]開暗槓[/]！
tutorial.kongs.concealed.arrangement=留意暗槓的排示方式：兩側的**邊牌蓋上**（背面朝上）以示暗槓，中間兩張打開以資核對。
tutorial.kongs.concealed.scoring=在中庸麻雀中，暗槓在計分時仍視為**門前清** — [門前清](pattern-1.2)依然有效！
tutorial.kongs.concealed.compensation=開槓後摸取一張[hl]嶺上牌[/]（補槓），然後如常打出一張牌結束回合。

# Kongs — Promoted kong
tutorial.kongs.promoted.title=小明槓
tutorial.kongs.promoted.offer=你已碰出一組 {0} 明刻，剛剛自己摸進第四張！點擊[hl]開小明槓[/]將其升級為槓子。
tutorial.kongs.promoted.upgraded=摸到的第四張牌加入已碰出的刻子中，升級為明槓，同樣符合[一槓](pattern-4.3.1)。
tutorial.kongs.promoted.robbing=注意：此時若有他家聽這張牌，他家可以[搶槓](pattern-9.3)宣佈和牌！
tutorial.kongs.promoted.compensation=若無人搶槓，你如常摸取一張[hl]嶺上牌[/]補槓，然後打牌完成回合。

# Hands and scoring — Winning a hand
tutorial.hands.win.title=和牌
tutorial.hands.win.hand_size=玩家手牌平時通常保持為[hl]13[/]張。只有在摸牌或鳴牌時才會暫時持有[hl]14[/]張。若未和牌，必須打出一張回復13張。
tutorial.hands.win.patterns=要宣佈和牌，手牌必須整理成指定的「和牌形」。
tutorial.hands.win.all_in_groups=在通常的基本和牌形中，每張牌都必須歸入四個[hl]面子[/]之一或一對[hl]眼[/]中。一般恰好是[hl]14[/]張牌。
tutorial.hands.win.set_kinds=面子可以是[hl]順子[/]、[hl]刻子[/]或[hl]槓子[/]。
tutorial.hands.win.kong_size=在此例中，四個面子之一是[hl]槓子[/]。由於槓子有4張牌，整副和牌手牌共有[hl]15[/]張而非14張。

# Hands and scoring — Chicken hand
tutorial.hands.chicken.title=雞和
tutorial.hands.chicken.one=若手牌符合和牌形但沒有符合任何特定和種，稱為[hl]雞和[/]，只算[hl]1[/]分。
tutorial.hands.chicken.tournament=在某些比賽中可能設有[hl]起和限制[/]（例如5分起和）— 此時手牌必須至少達到[hl]5[/]分才准和牌。
tutorial.hands.chicken.next=在接下來的幾課中，我們將介紹讓手牌達到[hl]5[/]分以上的基礎和種。

# Hands and scoring — Concealed hand
tutorial.hands.concealed.title=門前清
tutorial.hands.concealed.offer=對家打出一張牌（{0}），能與你手中的兩張牌組成順子。你不能吃對家的牌 — 但因為此牌剛好完成整副和牌形，你可以宣佈[hl]和 5分[/]！點擊[hl]和[/]宣佈和牌。
tutorial.hands.concealed.points=在中庸規則中，各家按得分授受法向和牌者付分。對於[hl]5[/]分的小牌，三家各付5分 — 和牌者總共收取手牌分數的[hl]3倍[/]（[hl]+15[/]分）！
tutorial.hands.concealed.concealed_rule=在和牌之前沒有吃牌、碰牌或開明槓的手牌，稱為[hl]門前清[/]。
tutorial.hands.concealed.discard_win=雖然你是鳴取對家的打牌完成最後一個順子，但銃和[hl]依然允許[/]計門前清 — 只有在和牌*之前*已碰或已吃的明面子才會破壞門前清。
tutorial.hands.concealed.kongs=在對局早期若有任何[hl]吃牌[/]、[hl]碰牌[/]或[hl]開明槓[/]，面子會打開在檯面上，手牌變成副露牌形而無法計此和種。

# Hands and scoring — All sequences
tutorial.hands.all_sequences.title=平和
tutorial.hands.all_sequences.offer=對家打出一張牌（{0}），正好完成你的第四個順子。即使手牌早前因吃牌而副露，按鈕依然提示[hl]和 5分[/]！點擊[hl]和[/]宣佈和牌。
tutorial.hands.all_sequences.points=四個面子全由順子組成（無刻子、無槓子）的手牌，可得[平和](pattern-1.1)的 [hl]5[/] 分。
tutorial.hands.all_sequences.open_allowed=與門前清不同，[平和](pattern-1.1)允許開吃。即使檯面上有吃牌的明面子，只要四個面子全是順子，依然可得5分。
tutorial.hands.all_sequences.unrestricted=中庸的平和對眼和聽牌形完全無限制 — 無論用字牌、番牌做眼，或聽單扉均可算平和。

# Hands and scoring — No terminals
tutorial.hands.no_terminals.title=斷么九
tutorial.hands.no_terminals.offer=對家打出一張牌（{0}）完成你的和牌。你手中的每張牌都是2至8的中張數牌。點擊[hl]和[/]宣佈和牌。
tutorial.hands.no_terminals.terminals_def=在數牌中，兩端的 **1** 與 **9**（{1m}、{9s}）稱為[hl]么九數牌[/]。介於 **2** 到 **8** 之間的數牌稱為[hl]中張數牌[/]。字牌則兩者皆非。
tutorial.hands.no_terminals.points=[斷么九](pattern-1.3)和種值 [hl]5[/] 分。整副手牌（所有四個面子與眼）必須全由[hl]中張數牌[/]組成，不能有任何么九牌與字牌。
tutorial.hands.no_terminals.flexibility=注意此手牌包含一組已碰出的明刻（{5p}{5p}{5p}），因此既非門前清亦非平和。但因為全由中張數牌組成，依然符合[hl]斷么九（5分）[/]！
tutorial.hands.no_terminals.stacking=斷么九亦可與其他和種（如[平和](pattern-1.1)或[門前清](pattern-1.2)）[hl]複合加算[/]，合計為10分或15分。

# Hands and scoring — Kongs
tutorial.hands.kongs.title=槓子
tutorial.hands.kongs.offer=對家打出一張牌（{0}）完成你的和牌。你檯面上已經有兩組開了的明槓。點擊[hl]和[/]宣佈和牌。
tutorial.hands.kongs.two_kongs=如先前所見，開[一槓](pattern-4.3.1)計 [hl]5[/] 分。手牌有**二槓**時分數提升至[二槓](pattern-4.3.2)的 [hl]20[/] 分！
tutorial.hands.kongs.hand_size=由於每個槓子包含4張牌並補回一張牌，這手和牌共有[hl]16[/]張牌，多於通常的14張。
tutorial.hands.kongs.ladder=槓子系列的累計分數相當高：[三槓](pattern-4.3.3)得 [hl]120[/] 分，[四槓](pattern-4.3.4)更達到頂級的 [hl]480[/] 分例牌滿貫！

# Hands and scoring — Value honor
tutorial.hands.value_honor.title=番牌
tutorial.hands.value_honor.offer=對家打出一張牌（{0}）完成你的手牌。你的一組紅中明刻使手牌值[hl]和 10分[/]！點擊[hl]和[/]宣佈和牌。
tutorial.hands.value_honor.dragons=有番字牌的刻子或槓子稱為[hl]番牌[/]，每組計 [hl]10[/] 分（[番牌](pattern-3.1)）。任何三元牌 — **紅中**（{C}）、**發財**（{F}）或**白板**（{P}）對所有玩家皆為番牌。
tutorial.hands.value_honor.seat_winds=自己的**門風**（如東家坐位為 {E}）亦為番牌。其他三家的風牌（客風）不計分。在中庸麻雀中**不計場風（圈風）**。
tutorial.hands.value_honor.stacking=番牌按[hl]每組累計加算[/]：持有兩組番牌刻子共計 [hl]20[/] 分。明刻或暗刻皆可，但字牌的**對子（眼）**不算番牌，只有刻子和槓子才算。

# Hands and scoring — All triplets
tutorial.hands.all_triplets.title=對對和
tutorial.hands.all_triplets.offer=對家打出一張牌（{0}），使你的手牌組成四個刻子加一對眼。點擊[hl]和[/]宣佈和牌！
tutorial.hands.all_triplets.pattern=[對對和](pattern-4.1)要求手牌包含四個刻子（或槓子）加一對眼，完全沒有順子。允許碰出的明刻，可獲豐厚的 [hl]30[/] 分！
tutorial.hands.all_triplets.settlement_cap=在銃和超過25分的大牌時，非出銃者各家付分[hl]以25分為上限[/]（上家與下家各付 [hl]-25[/]）。出銃的銃家包付不足之餘數：30 + 5 + 5 = **40**（[hl]-40[/]）！
tutorial.hands.all_triplets.self_draw=和牌者依然足額收取**90分**（3 × 30）。若是**自摸和**則無銃家，由三家平均攤付全額30分。

# Hands and scoring — Nine-tile straight
tutorial.hands.nine_tile_straight.title=一氣通貫
tutorial.hands.nine_tile_straight.offer=對家打出一張牌（{0}），使你在萬子中組成 1 到 9 的一氣通貫。點擊[hl]和[/]宣佈和牌！
tutorial.hands.nine_tile_straight.pattern=[一氣通貫](pattern-7.1)（俗稱清龍）高達 [hl]40[/] 分！要求在**同一色數牌中集齊 1 到 9** 的三個順子（{1m} 至 {9m}）。允許吃牌。
tutorial.hands.nine_tile_straight.composition=剩餘的5張牌可以是任何花色的合法面子與眼。在此處，一組 {555p} 刻子與 {99s} 對子完成了這副14張的和牌手牌。
tutorial.hands.nine_tile_straight.settlement=40分的大牌中，非銃家各付上限 [hl]-25[/]。對家身為銃家包付自身的40分外加兩家不足的15分差額（共 [hl]-70[/]），使和牌者總共收取 [hl]+120[/] 分（3 × 40）！

# Hands and scoring — Seven pairs
tutorial.hands.seven_pairs.title=七對子
tutorial.hands.seven_pairs.offer=對家打出一張牌（{0}）使你的手牌組成七對牌。點擊[hl]和[/]宣佈和牌！
tutorial.hands.seven_pairs.pattern=至此所見的所有和牌形均由4個面子加1對眼構成。[七對子](pattern-10.2)（俗稱小七對）是一類[hl]特殊和牌形[/] — 它由**七個對子**構成，可得 [hl]30[/] 分！
tutorial.hands.seven_pairs.concealed_only=七對子必須[hl]完全門前清[/]。不可吃、碰或開槓 — 所有對子必須由自己摸進。但最後一張牌可以銃和他家打出的捨牌來完成第7對！
tutorial.hands.seven_pairs.four_of_a_kind=聽七對子時永遠是聽第7對的[hl]單扉聽[/]。在中庸規則中，持有四張完全相同的牌（未開槓）在法規上可**視作兩對**計算。

# Hands and scoring — Two identical sequences
tutorial.hands.two_identical_sequences.title=一般高
tutorial.hands.two_identical_sequences.offer=對家打出一張牌（{0}）完成你的第二組相同順子。點擊[hl]和[/]宣佈和牌！
tutorial.hands.two_identical_sequences.pattern=[一般高](pattern-5.1.1)要求同色同數的兩組完全相同的順子（{234s} 與 {234s}），可得 [hl]10[/] 分。在手中看起來就像連續的對子（{223344s}）。允許吃牌！
tutorial.hands.two_identical_sequences.ladder=此系列的高級和種得分極高：[一色三同順](pattern-5.1.3)計 [hl]120[/] 分，[一色四同順](pattern-5.1.4)更達到頂級的 [hl]480[/] 分滿貫！

# Hands and scoring — Two concealed triplets
tutorial.hands.two_concealed_triplets.title=二暗刻
tutorial.hands.two_concealed_triplets.offer=對家打出一張牌（{0}）完成你的手牌。點擊[hl]和[/]宣佈和牌！
tutorial.hands.two_concealed_triplets.pattern=[二暗刻](pattern-4.2.1)要求手牌中有兩組完全由自己摸進的暗刻（{333p} 與 {666s}），計 [hl]5[/] 分。碰出的明刻不算！
tutorial.hands.two_concealed_triplets.ladder=暗刻系列分數攀升極快：[三暗刻](pattern-4.2.2)可得 [hl]30[/] 分，而[四暗刻](pattern-4.2.3)更獲 [hl]125[/] 分！

# Hands and scoring — Three similar triplets
tutorial.hands.three_similar_triplets.title=三色同刻
tutorial.hands.three_similar_triplets.offer=對家打出一張牌（{0}）完成你的手牌。點擊[hl]和[/]宣佈和牌！
tutorial.hands.three_similar_triplets.pattern=[三色同刻](pattern-6.2.2)（別稱兄弟碰）要求三種花色中各有一組**同數字**的刻子（{555m}、{555p}、{555s}），可獲高達 [hl]120[/] 分！允許碰牌。
tutorial.hands.three_similar_triplets.small_triplets=較易達成的形式為[三色小同刻](pattern-6.2.1)，要求三色同數的**兩組刻子加一對眼**（{555m}、{555p} 與 {55s}），計 [hl]30[/] 分。初學者常會忽略，但實戰中遠比三色同刻更容易達成！

# Hands and scoring — One-suit hands
tutorial.hands.one_suit.title=一色類
tutorial.hands.one_suit.offer=對家打出一張牌（{0}）完成你的筒子與字牌手牌。點擊[hl]和[/]宣佈和牌！
tutorial.hands.one_suit.mixed=手牌全由**同一花色的數牌**加上**字牌**組成，可得[混一色](pattern-2.1.1)的 [hl]40[/] 分。允許吃牌與碰牌！
tutorial.hands.one_suit.pure=若完全沒有字牌，全由同一色數牌組成，[清一色](pattern-2.1.2)可得雙倍的 [hl]80[/] 分！此時所有面子與眼皆屬於該單一花色。

# Hands and scoring — More patterns
tutorial.hands.more_patterns.title=更多和種
tutorial.hands.more_patterns.rarer=我們已經介紹了核心和種。更多罕見大牌 — 例如三元牌系列、四喜風牌系列以及滿貫例牌 — 均詳載於[參考資料](reference)中。
tutorial.hands.more_patterns.practice=你可以在對局中隨時從選單打開[參考資料](reference)，查閱各項和種的定義與分值。祝對局愉快！

