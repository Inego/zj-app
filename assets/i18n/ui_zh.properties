# 線上首頁：統一線上畫面的分頁列，以及影子排位分頁的文字。
# 一次影子排位對局即一次固定牌局，每位玩家在同樣的座位摸到同樣的牌；
# 積分會把先完成者與固定電腦比較、與在他之前完成同一牌局的每一位玩家比較，
# 並且——就那些較早的玩家而言——與其後才完成該牌局的玩家比較。
