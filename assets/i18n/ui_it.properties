tutorial.orient.tiles.title=Tessere
tutorial.orient.tiles.intro=In Mahjong ci sono 34 facce di tessera diverse: 27 facce numeriche e 7 facce onore. Ecco alcune di ciascuna.
tutorial.orient.tiles.tags=Le tessere possono essere mostrate **con tag** o **senza**.
tutorial.orient.tiles.tags_try=In questa app puoi attivare o disattivare i tag in [Impostazioni](settings). Queste tredici tessere seguono quell'impostazione — clicca il link e attiva la casella per vedere come funziona.
tutorial.orient.numbers.title=Numeri
tutorial.orient.numbers.intro=Le tessere numeriche sono di tre semi: Caratteri, Cerchi e Bambù (da 1 a 9 ciascuno).
# Battuta guidata da richiami: riga superiore breve opzionale; l'insegnamento sta nella bolla.
tutorial.orient.numbers.bamboo1=Una faccia da notare
tutorial.orient.numbers.bamboo1_callout=Il Bambù 1 è tradizionalmente disegnato come un uccello.
# Insegnamento delle sequenze (fine di Numeri): definizione, poi passaggi "non è una sequenza".
tutorial.orient.numbers.sequence=Una sequenza è **esattamente tre** numeri consecutivi nello stesso seme — per esempio {234m}, {567p} o {123s}.
tutorial.orient.numbers.four=Quattro tessere consecutive in un seme **non** sono una sequenza.
tutorial.orient.numbers.four_aside3=Metti da parte il **3**.
tutorial.orient.numbers.four_aside6=Oppure metti da parte il **6**.
tutorial.orient.numbers.prompt=Trova una **sequenza** — seleziona le sue tre tessere.
tutorial.orient.honors.title=Onori
tutorial.orient.honors.intro=Venti e draghi sono tessere [hl]onore[/]. **Non** formano sequenze numeriche.
tutorial.orient.honors.prompt=Seleziona ogni tessera onore (venti e draghi).
tutorial.orient.wall.title=Costruire il muro
tutorial.orient.wall.faces=Il set completo di facce: tre semi da 1 a 9, più quattro venti e tre draghi — 34 in totale.
tutorial.orient.wall.copies=Ogni faccia ha quattro tessere — 136 in tutto.
tutorial.orient.wall.drawpile=Il muro è come un mazzo di pesca nelle carte: le mani iniziali e le pesche durante il gioco provengono tutte da lì.
tutorial.orient.wall.ritual=Quando si gioca a un tavolo reale, costruire il muro è un rituale.
tutorial.orient.wall.facedown=Per costruire un muro, prima gira le tessere a faccia in giù...
tutorial.orient.wall.shuffle=E mescolale bene.
tutorial.orient.wall.formed=Poi inizia a formare il muro: quattro lati da 17 pile, alte due tessere.
tutorial.orient.wall.pushed=I muri vengono spinti verso l'interno così che le estremità si tocchino.
tutorial.orient.wall.seats=In ogni mano, un giocatore è Est, il successivo è Sud, poi Ovest, poi Nord.
tutorial.orient.wall.east=Est è il mazziere e il primo a muovere nella mano.
tutorial.orient.wall.deal=Est distribuisce lanciando due d6.
tutorial.orient.wall.dice=La somma dei dadi determina dove viene rotto il muro.
tutorial.orient.wall.count={0}+{1}={2}. Dall'estremità destra del muro di Est, conta {2} pile.
tutorial.orient.wall.break=Il muro viene rotto dopo le pile contate. Le pile alla loro sinistra scorrono a sinistra, aprendo un varco.
tutorial.orient.wall.take7=Conta 7 pile a destra del varco.
tutorial.orient.wall.dead=Mettile da parte per formare un muro morto separato.
tutorial.orient.wall.dead_out=Quelle 14 tessere non vengono mai pescate, aggiungendo incertezza verso la fine della mano.
tutorial.orient.wall.hands=Per formare le loro mani, i giocatori prendono 2 pile ciascuno dopo il varco, smontando il muro in senso orario — tre volte.
tutorial.orient.wall.hands_13=Dopo di che, ogni giocatore ha 3x4 = 12 tessere. Ne prendono 1 in più ciascuno per arrivare a 13.
tutorial.orient.wall.east_14=Poiché Est inizia per primo, comincia il proprio turno prendendo la 14ª tessera.
tutorial.orient.wall.look_hands=Ogni giocatore guarda la propria mano...
tutorial.orient.wall.sort_hands=...e la ordina.
tutorial.orient.wall.east_discard=Ora, il giocatore Est deve fare la sua prima mossa scartando una tessera.
tutorial.orient.wall.app_table=In questa app, per risparmiare spazio sullo schermo, il muro vivo è mostrato in modo semplificato, e il muro morto non è mostrato affatto.
tutorial.orient.wall.live_count=Il **69** al centro è il numero di tessere rimaste nel muro vivo.

# Ordine delle mosse
tutorial.moves.east_player.title=Giocatore Est
tutorial.moves.east_player.four=Ci sono [hl]quattro[/] giocatori. Per ogni mano, uno di loro è [hl]Est[/] (il mazziere). Poi, in senso antiorario: [hl]Sud[/], [hl]Ovest[/] e [hl]Nord[/].
tutorial.moves.east_player.pass=Dopo ogni mano, l'assegnazione dei venti stessa ruota in senso [hl]antiorario[/]. Il giocatore che era Sud diventa il nuovo Est.
tutorial.moves.discarding.title=Scartare
tutorial.moves.discarding.east_14=All'inizio di ogni mano, il giocatore che è [hl]Est[/] (il mazziere) ha [hl]14[/] tessere in mano (a differenza degli altri 3 giocatori che ne hanno [hl]13[/] ciascuno).
tutorial.moves.discarding.east_hu=Se queste 14 tessere formano una [hl]mano vincente[/], Est può dichiarare la vittoria ("[hl]Hu![/]") immediatamente — questa è la [Benedizione del Cielo](pattern-9.4.1).
tutorial.moves.discarding.east_hu_odds=Anche se, statisticamente, la probabilità che ciò accada è di [hl]1 su 328.909[/]. Potresti giocare a mahjong tutta la vita senza mai assistervi.
tutorial.moves.discarding.must_discard=Se questa mano non è vincente (che è normalmente il caso), Est deve scegliere una delle sue tessere da [hl]scartare[/] per riportare il numero di tessere a 13.
tutorial.moves.discarding.least_useful=Quando scarti, cerca di liberarti della tessera meno utile (una che non sembra promettente per formare figure future).
tutorial.moves.discarding.others_claim=Gli altri giocatori possono [hl]chiamare[/] la tessera scartata per migliorare le loro mani o persino [hl]vincere[/].
tutorial.moves.counterclockwise.title=Ordine di turno
tutorial.moves.counterclockwise.this_tile=[hl]Clicca questa tessera[/] per scartarla.
tutorial.moves.counterclockwise.click_callout=Scartala
tutorial.moves.counterclockwise.if_nobody=Nessuno l'ha [hl]chiamata[/], quindi è rimasta scartata.
tutorial.moves.counterclockwise.the_river=Il [hl]fiume[/] è come un mazzo degli scarti nelle carte: le tessere non chiamate restano a faccia in su davanti al giocatore che le ha scartate.
tutorial.moves.counterclockwise.to_the_right=Il turno passa sempre al giocatore alla [hl]destra[/] di chi scarta.
tutorial.moves.counterclockwise.right_next=Tu sei [hl]Est[/] (in basso al tavolo). [hl]Destra[/] gioca dopo — ha pescato dal muro, poi scarterà.
tutorial.moves.counterclockwise.right_discards=Destra [hl]scarta[/] una tessera. Nessuno l'ha chiamata, quindi il turno passa a [hl]Di fronte[/], che pesca dal muro.

# Chiamare
tutorial.claims.click_callout=Seleziona questo
tutorial.claims.pung.title=Pung
tutorial.claims.pung.offer=Di fronte ha scartato una tessera di cui hai già una [hl]coppia[/] ({0}). [hl]Clicca Pung[/] per completare un tris.
tutorial.claims.pung.reveal=Chiamare una tessera scartata da un altro giocatore richiede di [hl]scoprire[/] la combinazione formata — qui, il [hl]tris[/].
tutorial.claims.pung.must_discard=Ora hai [hl]14[/] tessere, e poiché questa non è una mano vincente, devi [hl]scartare[/] una tessera.
tutorial.claims.pung.skips_left=Poiché l'hai chiamata, [hl]Sinistra[/] salta il proprio turno — avrebbe [hl]pescato dal muro[/] come prossimo.
tutorial.claims.pung.third_for_two=Puoi chiamare un [hl]terzo[/] per due copie. Non puoi chiamare un [hl]secondo[/] per una.
tutorial.claims.last_discard.title=Ultimo scarto
tutorial.claims.last_discard.only_fresh=Puoi chiamare una tessera [hl]subito dopo[/] che è stata scartata. Non puoi chiamare una tessera che è già nel [hl]fiume[/].
tutorial.claims.last_discard.callout=Questa tessera è stata scartata per ultima
# Chiamare — Chow
tutorial.claims.chow.title=Chow
tutorial.claims.chow.offer=Sinistra ha scartato una tessera ({0}) che completa una [hl]sequenza[/] con due tessere che hai già. [hl]Clicca Chow[/] per completarla.
tutorial.claims.chow.reveal=Chiamare una tessera scartata da un altro giocatore richiede di [hl]scoprire[/] la combinazione formata — qui, la [hl]sequenza[/].
tutorial.claims.chow.must_discard=Ora hai [hl]14[/] tessere, e poiché questa non è una mano vincente, devi [hl]scartare[/] una tessera.
tutorial.claims.chow.only_left=Puoi fare Chow [hl]solo[/] da [hl]Sinistra[/] (il giocatore subito prima di te). Non si può fare Chow sugli scarti di Di fronte o Destra.
tutorial.claims.hu.title=Hu
tutorial.claims.hu.offer=Qui, la tua mano vincente è quasi completa, e sei in attesa di una coppia. Di fronte ha appena scartato la tessera che ti serve ({0}). [hl]Clicca Hu[/] per chiamarla.
tutorial.claims.hu.not_a_set=Quando una tessera scartata completa una [hl]mano vincente[/], puoi chiamarla. Non [hl]deve[/] per forza completare una [hl]combinazione[/] — qui ha completato la [hl]coppia[/].
tutorial.claims.hu.breakdown=Se il pannello del riepilogo punti copre la visuale del tavolo, puoi [hl]trascinarlo[/] altrove oppure [hl]ridurlo ed espanderlo[/] usando il pulsante a freccia. Prova a trascinarlo o a ridurlo adesso!

# Chiamare — Priorità delle chiamate
tutorial.claims.priority.title=Priorità delle chiamate
tutorial.claims.priority.conflict=Sinistra ha appena scartato {3s}. Tu hai {12s} e potresti fare **Chow**, ma Destra ha una coppia di {3s}. Prova a chiamare [hl]Chow[/] per vedere cosa succede!
tutorial.claims.priority.pung_beats_chow=Anche se hai chiamato Chow, [hl]Pung batte Chow[/]! La chiamata di Destra prevale sulla tua — Destra prende la tessera, e il tuo turno viene saltato!
tutorial.claims.priority.hierarchy=La gerarchia universale delle chiamate è: [hl]Vittoria (Hu)[/] batte [hl]Pung e Kong[/], che battono entrambi [hl]Chow[/].
tutorial.claims.priority.multi_win=Se più giocatori chiamano [hl]Hu[/] sullo stesso scarto, vince il giocatore più vicino a chi scarta nell'ordine di turno (niente doppie vittorie).

# Kong — Kong esposto grande
tutorial.kongs.melded.title=Kong esposto
tutorial.kongs.melded.offer=Di fronte ha scartato una tessera ({0}) che corrisponde al tuo tris chiuso. Clicca [hl]Kong[/] per dichiarare un kong!
tutorial.kongs.melded.reveal=Chiamare una 4ª tessera scartata espone le quattro tessere uguali sul tavolo come [hl]kong aperto[/].
tutorial.kongs.melded.one_kong=Formare un kong vale [hl]5[/] punti per [Un kong](pattern-4.3.1) e cresce con più kong.
tutorial.kongs.melded.compensation=Poiché un kong ha 4 tessere, peschi una [hl]tessera di rimpiazzo[/] dalla coda del muro per mantenere una dimensione valida della mano.
tutorial.kongs.melded.must_discard=Dopo aver pescato la tessera di rimpiazzo, devi [hl]scartare[/] per completare il tuo turno.
tutorial.kongs.melded.already_melded=Non puoi chiamare una 4ª tessera scartata se il tuo tris è già esposto sul tavolo come [hl]Pung[/] aperto.

# Kong — Kong chiuso
tutorial.kongs.concealed.title=Kong chiuso
tutorial.kongs.concealed.offer=Hai appena preso una tessera dal muro e tieni tutte e quattro le copie di {0}. Clicca [hl]Dichiara kong chiuso[/]!
tutorial.kongs.concealed.arrangement=Nota la combinazione: le due **tessere ai bordi sono chiuse** (a faccia in giù) per mostrare che resta chiusa, mentre le tessere centrali provano la combinazione.
tutorial.kongs.concealed.scoring=In Zung Jung, resta **chiusa** ai fini del punteggio — [Mano chiusa](pattern-1.2) rimane valida!
tutorial.kongs.concealed.compensation=Peschi una [hl]tessera di rimpiazzo[/] dalla coda del muro, poi scarti normalmente per finire il tuo turno.

# Kong — Kong promosso
tutorial.kongs.promoted.title=Kong promosso
tutorial.kongs.promoted.offer=Hai un pung aperto di {0} e hai appena pescato la 4ª tessera! Clicca [hl]Promuovi kong[/] per migliorare la tua combinazione.
tutorial.kongs.promoted.upgraded=La quarta tessera si unisce al tuo pung aperto, promuovendolo a kong aperto e qualificandolo per [Un kong](pattern-4.3.1).
tutorial.kongs.promoted.robbing=Attenzione: questo è l'unico momento in cui gli avversari possono [Rubare il kong](pattern-9.3) se questa tessera completa la loro mano vincente!
tutorial.kongs.promoted.compensation=Se è sicuro, peschi una [hl]tessera di rimpiazzo[/] dalla coda del muro e scarti per completare il tuo turno.

# Mani e punteggio — Vincere una mano
tutorial.hands.win.title=Vincere una mano
tutorial.hands.win.hand_size=I giocatori tengono normalmente [hl]13[/] tessere. Ne tieni [hl]14[/] solo temporaneamente quando peschi o chiami. Se non vinci, devi scartare per tornare a 13.
tutorial.hands.win.patterns=Per vincere una mano, le tessere nella tua mano devono formare alcune figure specifiche.
tutorial.hands.win.all_in_groups=Normalmente, in una mano vincente, ogni tessera deve trovarsi in una delle quattro [hl]combinazioni[/] o nella singola [hl]coppia[/]. Di solito sono [hl]14[/] tessere.
tutorial.hands.win.set_kinds=Una combinazione è una [hl]sequenza[/], un [hl]tris[/] o un [hl]kong[/].
tutorial.hands.win.kong_size=Qui, una delle quattro combinazioni è un [hl]kong[/]. A causa di quel kong, la mano ha [hl]15[/] tessere, non 14.

# Mani e punteggio — Mano senza figure
tutorial.hands.chicken.title=Mano senza figure
tutorial.hands.chicken.one=Se nessun punteggio speciale si applica a questa mano, è chiamata [hl]mano senza figure[/] e vale [hl]1[/] punto.
tutorial.hands.chicken.tournament=Nei tornei, le mani senza figure possono essere [hl]proibite[/] — la mano deve valere almeno [hl]5[/] punti per essere considerata vincente.
tutorial.hands.chicken.next=Nelle prossime lezioni tratteremo le figure di punteggio di base che permettono a una mano di totalizzare [hl]5[/] o più punti.

# Mani e punteggio — Mano chiusa
tutorial.hands.concealed.title=Mano chiusa
tutorial.hands.concealed.offer=Di fronte ha scartato una tessera ({0}) che completa una sequenza con due tessere che hai già. Non puoi fare Chow da Di fronte — ma poiché completa la tua mano, puoi chiamare [hl]Hu 5[/]! Clicca [hl]Hu[/] per vincere.
tutorial.hands.concealed.points=Ogni avversario paga il punteggio della mano al vincitore. Per una mano da [hl]5[/] punti, tutti e tre pagano 5 ciascuno — facendoti guadagnare [hl]3×[/] il punteggio della mano ([hl]+15[/] punti)!
tutorial.hands.concealed.concealed_rule=Una mano è [hl]chiusa[/] se non hai fatto alcuna chiamata aperta (come **Chow** o **Pung**) prima di dichiarare la vittoria.
tutorial.hands.concealed.discard_win=Anche se hai chiamato lo scarto di Di fronte per completare quell'ultima sequenza, vincere su uno scarto è [hl]consentito[/] — solo le combinazioni aperte fatte *prima* della vittoria rompono la Mano chiusa.
tutorial.hands.concealed.kongs=Chiamare qualsiasi [hl]Chow[/], [hl]Pung[/] o [hl]Kong[/] in precedenza nella mano espone quella combinazione sul tavolo, rendendo la tua mano aperta e rompendo questa figura.

# Mani e punteggio — Tutte sequenze
tutorial.hands.all_sequences.title=Tutte sequenze
tutorial.hands.all_sequences.offer=Di fronte ha scartato una tessera ({0}) che completa la tua quarta sequenza. Anche se la tua mano è aperta per un Chow precedente, il pulsante offre [hl]Hu 5[/]! Clicca [hl]Hu[/] per vincere.
tutorial.hands.all_sequences.points=Una mano in cui tutte e quattro le combinazioni sono sequenze (senza tris o kong) totalizza [hl]5[/] punti per [Tutte sequenze](pattern-1.1).
tutorial.hands.all_sequences.open_allowed=A differenza della Mano chiusa, [Tutte sequenze](pattern-1.1) consente Chow aperti. Anche con una combinazione aperta sul tavolo, avere quattro sequenze assegna comunque 5 punti.
tutorial.hands.all_sequences.unrestricted=Qualsiasi coppia è permessa — persino onori drago o vento — e qualsiasi tipo di attesa qualifica.

# Mani e punteggio — Senza terminali
tutorial.hands.no_terminals.title=Senza terminali
tutorial.hands.no_terminals.offer=Di fronte ha scartato una tessera ({0}) che completa la tua mano vincente. Ogni tessera nella tua mano è un numero semplice da 2 a 8. Clicca [hl]Hu[/] per vincere.
tutorial.hands.no_terminals.terminals_def=Nei tre semi numerici, le tessere di estremità — **1** e **9** ({1m}, {9s}) — sono chiamate [hl]terminali[/]. Le tessere interne da **2** a **8** sono chiamate [hl]semplici[/]. Gli onori non sono né gli uni né gli altri.
tutorial.hands.no_terminals.points=La figura [Senza terminali](pattern-1.3) vale [hl]5[/] punti. Ogni tessera nella mano — tutte e quattro le combinazioni e la coppia — deve essere un [hl]semplice[/], senza terminali e senza onori.
tutorial.hands.no_terminals.flexibility=Nota che questa mano ha un tris aperto ({5p}{5p}{5p}), quindi non è né chiusa né tutte sequenze. Ma poiché ogni tessera è un semplice, si qualifica per [hl]Senza terminali (5 pt)[/]!
tutorial.hands.no_terminals.stacking=Senza terminali può anche [hl]cumularsi[/] con altre figure come [Tutte sequenze](pattern-1.1) o [Mano chiusa](pattern-1.2) quando si applicano, combinando per 10 o 15 punti.

# Mani e punteggio — Kong
tutorial.hands.kongs.title=Kong
tutorial.hands.kongs.offer=Di fronte ha scartato una tessera ({0}) che completa la tua mano vincente. Hai già due kong aperti sul tavolo. Clicca [hl]Hu[/] per vincere.
tutorial.hands.kongs.two_kongs=Come abbiamo visto prima, avere [Un kong](pattern-4.3.1) assegna [hl]5[/] punti. Avere **due kong** aumenta il punteggio a [hl]20[/] punti per [Due kong](pattern-4.3.2)!
tutorial.hands.kongs.hand_size=Poiché ogni kong prende 4 tessere invece di 3 e pesca una tessera di rimpiazzo, questa mano vincente ha [hl]16[/] tessere invece delle solite 14.
tutorial.hands.kongs.ladder=Le figure con più kong salgono ripide: [Tre kong](pattern-4.3.3) vale [hl]120[/] punti, e [Quattro kong](pattern-4.3.4) raggiunge il limite di [hl]480[/] punti!

# Mani e punteggio — Onore di valore
tutorial.hands.value_honor.title=Onore di valore
tutorial.hands.value_honor.offer=Di fronte ha scartato una tessera ({0}) che completa la tua mano. Il tuo tris aperto di Draghi Rossi fa valere questa mano [hl]Hu 10[/]! Clicca [hl]Hu[/] per vincere.
tutorial.hands.value_honor.dragons=Un tris o kong di un [hl]onore di valore[/] vale [hl]10[/] punti ([Onore di valore](pattern-3.1)). Ognuno dei tre draghi — **Rosso** ({C}), **Verde** ({F}) o **Bianco** ({P}) — è sempre un onore di valore per ogni giocatore.
tutorial.hands.value_honor.seat_winds=Anche il tuo **vento di posto** (come {E} per il posto Est) è un onore di valore. I venti degli altri tre posti ("venti ospiti") non segnano. In Zung Jung **non esiste alcun vento prevalente**.
tutorial.hands.value_honor.stacking=Onore di valore conta [hl]cumulativamente per combinazione[/]: tenere due tris qualificati totalizza [hl]20[/] punti. Le combinazioni aperte sono permesse, ma le **coppie** non segnano mai — contano solo tris e kong.

# Mani e punteggio — Tutti tris
tutorial.hands.all_triplets.title=Tutti tris
tutorial.hands.all_triplets.offer=Di fronte ha scartato una tessera ({0}) che completa la tua mano in quattro tris e una coppia. Clicca [hl]Hu[/] per vincere!
tutorial.hands.all_triplets.pattern=La figura [Tutti tris](pattern-4.1) richiede quattro tris (o kong) e una coppia, senza sequenze. I pung aperti sono permessi, e la figura assegna generosi [hl]30[/] punti!
tutorial.hands.all_triplets.settlement_cap=Su una vittoria su scarto superiore a 25 punti, i non-scartatori sono [hl]limitati a 25 punti[/] (Sinistra/Destra pagano [hl]-25[/]). Chi scarta copre entrambe le differenze: 30 + 5 + 5 = **40** ([hl]-40[/])!
tutorial.hands.all_triplets.self_draw=Ricevi comunque gli interi **90 punti** (3 \u00d7 30). Su una **pesca diretta**, non c'è chi scarta, quindi tutti e tre gli avversari pagano gli interi 30 punti.

# Mani e punteggio — Scala di nove tessere
tutorial.hands.nine_tile_straight.title=Scala di nove tessere
tutorial.hands.nine_tile_straight.offer=Di fronte ha scartato una tessera ({0}) che completa la tua mano in una scala da 1 a 9 nei caratteri. Clicca [hl]Hu[/] per vincere!
tutorial.hands.nine_tile_straight.pattern=La figura [Scala di nove tessere](pattern-7.1) vale ben [hl]40[/] punti! Richiede tre sequenze che coprono **da 1 a 9 in un unico seme** ({1m} fino a {9m}). I chow aperti sono permessi.
tutorial.hands.nine_tile_straight.composition=Le rimanenti 5 tessere possono essere qualsiasi combinazione e coppia valide in qualsiasi seme. Qui, un tris di {555p} e una coppia di {99s} completano la tua mano vincente da 14 tessere.
tutorial.hands.nine_tile_straight.settlement=Con una mano da 40 punti, i non-scartatori sono limitati a [hl]-25[/]. Di fronte copre i loro 40 più entrambe le differenze di 15 punti ([hl]-70[/]), facendoti guadagnare [hl]+120[/] punti (3 \u00d7 40)!

# Mani e punteggio — Sette coppie
tutorial.hands.seven_pairs.title=Sette coppie
tutorial.hands.seven_pairs.offer=Di fronte ha scartato una tessera ({0}) che completa la tua mano in sette coppie. Clicca [hl]Hu[/] per vincere!
tutorial.hands.seven_pairs.pattern=Tutte le mani vincenti finora erano fatte di 4 combinazioni e 1 coppia. [Sette coppie](pattern-10.2) è una [hl]mano irregolare[/] — infrange quella regola completando **sette coppie** per [hl]30[/] punti!
tutorial.hands.seven_pairs.concealed_only=Sette coppie deve essere [hl]completamente chiusa[/]. Non puoi chiamare Chow, Pung o Kong — tutte le coppie devono essere pescate dal muro. Puoi comunque chiamare la tessera finale sullo scarto di un avversario per completare la tua 7ª coppia!
tutorial.hands.seven_pairs.four_of_a_kind=L'attesa su Sette coppie è sempre un'[hl]attesa su tessera singola[/] per la tua 7ª coppia. In Zung Jung, tenere tutte e **quattro le copie** della stessa tessera (senza dichiarare un kong) conta, secondo le regole, come **due coppie**.

# Mani e punteggio — Due sequenze identiche
tutorial.hands.two_identical_sequences.title=Due sequenze identiche
tutorial.hands.two_identical_sequences.offer=Di fronte ha scartato una tessera ({0}) che completa la tua seconda sequenza identica. Clicca [hl]Hu[/] per vincere!
tutorial.hands.two_identical_sequences.pattern=[Due sequenze identiche](pattern-5.1.1) assegna [hl]10[/] punti per due sequenze uguali in un unico seme ({234s} e {234s}). In mano, sembrano coppie consecutive ({223344s}). I chow aperti sono permessi!
tutorial.hands.two_identical_sequences.ladder=I livelli superiori di questa serie assegnano punti enormi: [Tre sequenze identiche](pattern-5.1.3) vale [hl]120[/] punti, e [Quattro sequenze identiche](pattern-5.1.4) raggiunge il limite di [hl]480[/] punti!

# Mani e punteggio — Due tris chiusi
tutorial.hands.two_concealed_triplets.title=Due tris chiusi
tutorial.hands.two_concealed_triplets.offer=Di fronte ha scartato una tessera ({0}) che completa la tua mano. Clicca [hl]Hu[/] per vincere!
tutorial.hands.two_concealed_triplets.pattern=[Due tris chiusi](pattern-4.2.1) assegna [hl]5[/] punti per due tris formati interamente nella tua mano chiusa ({333p} e {666s}). I pung aperti non qualificano!
tutorial.hands.two_concealed_triplets.ladder=I tris chiusi crescono ripidamente: [Tre tris chiusi](pattern-4.2.2) assegna [hl]30[/] punti, e [Quattro tris chiusi](pattern-4.2.3) assegna [hl]125[/] punti!

# Mani e punteggio — Tre tris simili
tutorial.hands.three_similar_triplets.title=Tre tris simili
tutorial.hands.three_similar_triplets.offer=Di fronte ha scartato una tessera ({0}) che completa la tua mano. Clicca [hl]Hu[/] per vincere!
tutorial.hands.three_similar_triplets.pattern=[Tre tris simili](pattern-6.2.2) assegna enormi [hl]120[/] punti per tenere tris dello **stesso numero** in tutti e tre i semi ({555m}, {555p}, {555s}). I pung aperti sono permessi!
tutorial.hands.three_similar_triplets.small_triplets=La forma minore, [Piccoli tre tris simili](pattern-6.2.1), assegna [hl]30[/] punti per **due tris e una coppia** dello stesso numero ({555m}, {555p} e {55s}). I principianti spesso la trascurano, ma è molto più realistica da ottenere!

# Mani e punteggio — Mani di un solo seme
tutorial.hands.one_suit.title=Mani di un solo seme
tutorial.hands.one_suit.offer=Di fronte ha scartato una tessera ({0}) che completa la tua mano in cerchi e onori. Clicca [hl]Hu[/] per vincere!
tutorial.hands.one_suit.mixed=Tenere tessere di **un solo seme numerico** (in arancione) insieme agli **onori** (in blu) totalizza [hl]40[/] punti per [Un solo seme misto](pattern-2.1.1). Chow e pung aperti sono permessi!
tutorial.hands.one_suit.pure=Se elimini del tutto le tessere onore, [Un solo seme puro](pattern-2.1.2) raddoppia il punteggio a [hl]80[/] punti! Ogni combinazione e la coppia appartengono ora a quell'unico seme.

# Mani e punteggio — Altre figure
tutorial.hands.more_patterns.title=Altre figure
tutorial.hands.more_patterns.rarer=Abbiamo trattato le figure principali. Molte mani più rare — come la serie dei draghi, le mani di venti e le mani limite — sono dettagliate nel [Riferimento](reference).
tutorial.hands.more_patterns.practice=Puoi consultare il [Riferimento](reference) in qualsiasi momento dal menu in gioco durante la partita per verificare le regole delle figure e i valori dei punti. Buon divertimento!

