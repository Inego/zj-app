# Online hub: the unified Online screen's tab strip and the Shadow Ranked
# tab's copy. A Shadow Ranked attempt is one fixed deal, every player dealt the
# same draws in the same seat; the rating compares a finisher with a fixed bot,
# with everyone who finished that deal before them, and — for those earlier
# players — against the finisher who played it after them.
