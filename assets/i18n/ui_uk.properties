tutorial.orient.tiles.title=Кістки
tutorial.orient.tiles.intro=У маджонґу 34 різні малюнки кісток: 27 номерних та 7 благородних. Ось деякі з них.
tutorial.orient.tiles.tags=Кістки можна показувати **з позначеннями** або **без**.
tutorial.orient.tiles.tags_try=У цьому застосунку позначення вмикаються та вимикаються у розділі [Налаштування](settings). Ці тринадцять кісток слідують цьому налаштуванню — натисніть посилання та перемкніть прапорець, щоб побачити, як це працює.
tutorial.orient.numbers.title=Номерні кістки
tutorial.orient.numbers.intro=Номерні кістки поділяються на три масті: Символи, Круги та Бамбуки (від 1 до 9 у кожній).
# Callout-led beat: short top line optional; teaching lives in the bubble.
tutorial.orient.numbers.bamboo1=Особливий малюнок
tutorial.orient.numbers.bamboo1_callout=1 Бамбуків традиційно зображується у вигляді птаха.
# Sequence teaching (end of Numbers): definition, then stepped “not a sequence” peels.
tutorial.orient.numbers.sequence=Послідовність (чоу) — це **рівно три** послідовні номери однієї масті, наприклад {234m}, {567p} або {123s}.
tutorial.orient.numbers.four=Чотири кістки однієї масті поспіль — це **не** послідовність.
tutorial.orient.numbers.four_aside3=Або відкладіть **3**.
tutorial.orient.numbers.four_aside6=Або відкладіть **6**.
tutorial.orient.numbers.prompt=Знайдіть **послідовність** — оберіть три її кістки.
tutorial.orient.honors.title=Благородні кістки
tutorial.orient.honors.intro=Вітри та дракони — [hl]благородні[/] кістки. Вони **не** утворюють номерних послідовностей.
tutorial.orient.honors.prompt=Оберіть усі благородні кістки (вітри та дракони).
tutorial.orient.wall.title=Побудова стіни
tutorial.orient.wall.faces=Повний набір малюнків: три масті з 1 до 9, чотири вітри та три дракони — загалом 34.
tutorial.orient.wall.copies=Кожен малюнок повторюється чотири рази — разом 136 кісток.
tutorial.orient.wall.drawpile=Стіна схожа на колоду в картах: з неї беруть початкові руки та тягнуть кістки під час гри.
tutorial.orient.wall.ritual=Під час гри за справжнім столом побудова стіни — це цілий ритуал.
tutorial.orient.wall.facedown=Щоб побудувати стіну, спочатку переверніть кістки лицьовим боком донизу...
tutorial.orient.wall.shuffle=Та ретельно перемішайте їх.
tutorial.orient.wall.formed=Потім почніть будувати стіну: чотири сторони по 17 стопок, заввишки у дві кістки.
tutorial.orient.wall.pushed=Стіни зсувають до центру, з'єднуючи їхні кінці.
tutorial.orient.wall.seats=У кожній роздачі один гравець — Схід, наступний — Південь, далі Захід і Північ.
tutorial.orient.wall.east=Схід — роздавальний, і він робить перший хід у роздачі.
tutorial.orient.wall.deal=Схід роздає, кидаючи два кубики d6.
tutorial.orient.wall.dice=Сума очок на кубиках визначає місце, де розкривається стіна.
tutorial.orient.wall.count={0}+{1}={2}. Відрахуйте {2} стопок з правого кінця стіни Сходу.
tutorial.orient.wall.break=Після відрахованих стопок стіна розкривається. Стопки ліворуч від них зсуваються, утворюючи розрив.
tutorial.orient.wall.take7=Відрахуйте 7 стопок праворуч від розриву.
tutorial.orient.wall.dead=Відкладіть їх окремо — це мертва стіна.
tutorial.orient.wall.dead_out=Ці 14 кісток ніколи не беруться, створюючи невизначеність ближче до кінця роздачі.
tutorial.orient.wall.hands=Для набору рук гравці беруть по 2 стопки після розриву, розбираючи стіну за годинниковою стрілкою — три кола.
tutorial.orient.wall.hands_13=Після цього у кожного гравця 3x4 = 12 кісток. Вони беруть ще по 1 кістці, отримуючи 13.
tutorial.orient.wall.east_14=Оскільки Схід ходить першим, він починає свій хід з отримання 14-ї кістки.
tutorial.orient.wall.look_hands=Кожен гравець дивиться у свою руку...
tutorial.orient.wall.sort_hands=...та сортує її.
tutorial.orient.wall.east_discard=Тепер Схід має зробити перший хід, скинувши кістку.
tutorial.orient.wall.app_table=У цьому застосунку задля економії місця жива стіна показана спрощено, а мертва не відображається зовсім.
tutorial.orient.wall.live_count=Число **69** у центрі — це кількість кісток, що залишилися в живій стіні.

# Move order
tutorial.moves.east_player.title=Гравець Сходу
tutorial.moves.east_player.four=У грі беруть участь [hl]четверо[/] гравців. У кожній роздачі один із них — [hl]Схід[/] (роздавальний). Далі проти годинникової стрілки: [hl]Південь[/], [hl]Захід[/] та [hl]Північ[/].
tutorial.moves.east_player.pass=Після кожної роздачі розподіл вітрів зміщується [hl]проти годинникової стрілки[/]. Гравець, який був Півднем, стає новим Сходом.
tutorial.moves.discarding.title=Скидання кістки
tutorial.moves.discarding.east_14=На початку будь-якої роздачі у [hl]Сходу[/] (роздавального) в руці [hl]14[/] кісток (на відміну від решти трьох гравців, у яких по [hl]13[/] кісток).
tutorial.moves.discarding.east_hu=Якщо ці 14 кісток одразу утворюють [hl]виграшну руку[/], Схід може одразу оголосити перемогу («[hl]Ху![/]») — це [Благословення Небес](pattern-9.4.1).
tutorial.moves.discarding.east_hu_odds=Утім, статистично шанс цього становить [hl]1 до 328 909[/]. Можна грати в маджонґ усе життя і жодного разу цього не побачити.
tutorial.moves.discarding.must_discard=Якщо рука не виграшна (що буває майже завжди), Схід повинен обрати та [hl]скинути[/] одну з кісток, повернувши розмір руки до 13.
tutorial.moves.discarding.least_useful=Під час скидання намагайтеся позбутися найменш корисної кістки (тієї, з якої навряд чи складуться комбінації).
tutorial.moves.discarding.others_claim=Інші гравці можуть [hl]забрати[/] скинуту кістку оголошенням, щоб покращити руку або навіть [hl]виграти[/].
tutorial.moves.counterclockwise.title=Черговість ходу
tutorial.moves.counterclockwise.this_tile=[hl]Натисніть на цю кістку[/], щоб скинути її.
tutorial.moves.counterclockwise.click_callout=Скиньте її
tutorial.moves.counterclockwise.if_nobody=Ніхто не став [hl]забирати[/] її, тому вона залишилася у скиданні.
tutorial.moves.counterclockwise.the_river=[hl]Ріка[/] влаштована як стопка скидання в картах: незатребувані кістки лежать відкритими перед гравцем, який їх скинув.
tutorial.moves.counterclockwise.to_the_right=Хід завжди переходить до гравця [hl]праворуч[/] від того, хто скинув.
tutorial.moves.counterclockwise.right_next=Ви — [hl]Схід[/] (унизу столу). Наступним ходить гравець [hl]Праворуч[/]: він узяв кістку зі стіни й тепер має скинути.
tutorial.moves.counterclockwise.right_discards=Гравець Праворуч [hl]скидає[/] кістку. Ніхто не забрав її, тому хід переходить до гравця [hl]Навпроти[/], який бере кістку зі стіни.

# Claiming
tutorial.claims.click_callout=Оберіть це
tutorial.claims.pung.title=Панг
tutorial.claims.pung.offer=Гравець Навпроти скинув кістку, [hl]пара[/] до якої у вас вже є ({0}). Натисніть [hl]Панг[/], щоб зібрати трійку.
tutorial.claims.pung.reveal=Якщо забрати кістку зі скидання іншого гравця, зібраний сет потрібно [hl]розкрити[/] — у цьому разі [hl]трійку[/].
tutorial.claims.pung.must_discard=Тепер у вас [hl]14[/] кісток, і оскільки рука ще не виграшна, ви повинні [hl]скинути[/] кістку.
tutorial.claims.pung.skips_left=Оскільки ви забрали кістку, гравець [hl]Ліворуч[/] пропускає свій хід — хоча саме він мав [hl]брати кістку зі стіни[/].
tutorial.claims.pung.third_for_two=Зі скидання можна забрати [hl]третю[/] кістку до двох у руці. Забрати [hl]другу[/] до однієї не можна.
tutorial.claims.last_discard.title=Останнє скидання
tutorial.claims.last_discard.only_fresh=Забрати кістку можна лише [hl]одразу після[/] її скидання. Не можна забрати кістку, яка вже лежить у [hl]ріці[/].
tutorial.claims.last_discard.callout=Цю кістку було скинуто останньою
# Claiming — Chow
tutorial.claims.chow.title=Чоу
tutorial.claims.chow.offer=Гравець Ліворуч скинув кістку ({0}), що завершує [hl]послідовність[/] із двома вашими кістками. Натисніть [hl]Чоу[/], щоб зібрати її.
tutorial.claims.chow.reveal=Якщо забрати кістку зі скидання іншого гравця, зібраний сет потрібно [hl]розкрити[/] — тут це [hl]послідовність[/].
tutorial.claims.chow.must_discard=Тепер у вас [hl]14[/] кісток, і оскільки рука ще не виграшна, ви повинні [hl]скинути[/] кістку.
tutorial.claims.chow.only_left=Оголосити чоу можна [hl]тільки[/] зі скидання гравця [hl]Ліворуч[/] (який ходить перед вами). Скидання гравців Навпроти або Праворуч забрати в чоу не можна.
tutorial.claims.hu.title=Ху
tutorial.claims.hu.offer=Ваша виграшна рука майже зібрана, бракує лише пари. Гравець Навпроти щойно скинув потрібну кістку ({0}). Натисніть [hl]Ху[/], щоб забрати її.
tutorial.claims.hu.not_a_set=Коли скинута кістка завершує [hl]виграшну руку[/], її можна забрати. Вона [hl]не[/] зобов'язана доповнювати [hl]сет[/] — тут вона завершила [hl]пару[/].
tutorial.claims.hu.breakdown=Якщо панель підрахунку очок закриває огляд столу, її можна [hl]перетягнути[/] вбік або [hl]згорнути й розгорнути[/] за допомогою кнопки-шеврона. Спробуйте перемістити або згорнути її просто зараз!

# Claiming — Claim priority
tutorial.claims.priority.title=Пріоритет оголошень
tutorial.claims.priority.conflict=Гравець Ліворуч щойно скинув {3s}. У вас на руках {12s}, і ви могли б оголосити **Чоу**, але у гравця Праворуч пара {3s}. Спробуйте оголосити [hl]Чоу[/] і подивіться, що станеться!
tutorial.claims.priority.pung_beats_chow=Хоча ви натиснули Чоу, [hl]Панг старший за Чоу[/]! Оголошення гравця Праворуч скасовує ваше: Праворуч забирає кістку, а ваш хід пропускається!
tutorial.claims.priority.hierarchy=Загальний пріоритет оголошень: [hl]Перемога (Ху)[/] старша за [hl]Панг і Конг[/], а вони обидва старші за [hl]Чоу[/].
tutorial.claims.priority.multi_win=Якщо кілька гравців заявляють [hl]Ху[/] на одне й те саме скидання, виграє найближчий до того, хто скинув, за черговістю ходу (подвійних виграшів немає).

# Kongs — Big exposed kong
tutorial.kongs.melded.title=Відкритий конг
tutorial.kongs.melded.offer=Гравець Навпроти скинув кістку ({0}), що збігається з вашою закритою трійкою. Натисніть [hl]Конг[/], щоб оголосити чотири однакові!
tutorial.kongs.melded.reveal=Якщо забрати 4-ту кістку зі скидання, четвірка викладається на стіл як [hl]відкритий конг[/].
tutorial.kongs.melded.one_kong=Зібраний конг приносить [hl]5[/] очок за [Один конг](pattern-4.3.1) і дає більше очок за наявності кількох конгів.
tutorial.kongs.melded.compensation=Оскільки в конгу 4 кістки, ви берете [hl]додаткову кістку[/] з кінця стіни, щоб зберегти правильний розмір руки.
tutorial.kongs.melded.must_discard=Узявши додаткову кістку, ви повинні [hl]скинути[/] кістку для завершення ходу.
tutorial.kongs.melded.already_melded=Не можна забрати скинуту 4-ту кістку, якщо ваша трійка вже відкрита на столі у вигляді [hl]Панга[/].

# Kongs — Concealed kong
tutorial.kongs.concealed.title=Закритий конг
tutorial.kongs.concealed.offer=Ви щойно взяли кістку зі стіни, і у вас на руках усі чотири копії {0}. Натисніть [hl]Оголосити закритий конг[/]!
tutorial.kongs.concealed.arrangement=Зверніть увагу на викладку: дві **крайні кістки закриті** (сорочкою догори), показуючи, що конг залишається закритим, а середні відкриті для перевірки.
tutorial.kongs.concealed.scoring=У Чжун-юн такий конг залишається **закритим** під час підрахунку очок — [Закрита рука](pattern-1.2) залишається чинною!
tutorial.kongs.concealed.compensation=Ви берете [hl]додаткову кістку[/] з кінця стіни, потім скидаєте кістку як зазвичай для завершення ходу.

# Kongs — Promoted kong
tutorial.kongs.promoted.title=Добудований конг
tutorial.kongs.promoted.offer=У вас є відкритий панг {0}, і ви щойно взяли 4-ту кістку! Натисніть [hl]Добудувати конг[/], щоб покращити оголошення.
tutorial.kongs.promoted.upgraded=Четверта кістка додається до відкритого панга, перетворюючи його на відкритий конг і приносячи [Один конг](pattern-4.3.1).
tutorial.kongs.promoted.robbing=Увага: це єдиний момент, коли суперники можуть здійснити [Пограбування конга](pattern-9.3), якщо ця кістка завершує їхню виграшну руку!
tutorial.kongs.promoted.compensation=Якщо все безпечно, ви берете [hl]додаткову кістку[/] з кінця стіни та скидаєте кістку для завершення ходу.

# Hands and scoring — Winning a hand
tutorial.hands.win.title=Виграш роздачі
tutorial.hands.win.hand_size=Зазвичай у гравців на руках [hl]13[/] кісток. [hl]14[/] кісток у вас буває лише тимчасово — під час взяття зі стіни або оголошення. Якщо ви не виграєте, потрібно скинути кістку назад до 13.
tutorial.hands.win.patterns=Щоб виграти роздачу, кістки в руці повинні утворювати певні комбінації.
tutorial.hands.win.all_in_groups=Зазвичай у виграшній руці кожна кістка має входити до одного з чотирьох [hl]сетів[/] або до єдиної [hl]пари[/]. Як правило, це [hl]14[/] кісток.
tutorial.hands.win.set_kinds=Сет — це [hl]послідовність[/], [hl]трійка[/] або [hl]конг[/].
tutorial.hands.win.kong_size=Тут один із чотирьох сетів — [hl]конг[/]. Через цей конг у руці не 14, а [hl]15[/] кісток.

# Hands and scoring — Patternless hand
tutorial.hands.chicken.title=Рука без комбінацій
tutorial.hands.chicken.one=Якщо до цієї руки не підходять спеціальні комбінації, вона називається [hl]рукою без комбінацій[/] і коштує [hl]1[/] очко.
tutorial.hands.chicken.tournament=На турнірах руки без комбінацій можуть бути [hl]заборонені[/] — у такому разі рука має коштувати не менше [hl]5[/] очок, щоб вважатися виграшною.
tutorial.hands.chicken.next=У наступних уроках ми розберемо базові комбінації, що дозволяють руці набрати [hl]5[/] і більше очок.

# Hands and scoring — Concealed hand
tutorial.hands.concealed.title=Закрита рука
tutorial.hands.concealed.offer=Гравець Навпроти скинув кістку ({0}), що завершує послідовність із двома вашими кістками. Оголосити Чоу від гравця Навпроти не можна, але оскільки вона завершує вашу руку, можна оголосити [hl]Ху 5[/]! Натисніть [hl]Ху[/], щоб перемогти.
tutorial.hands.concealed.points=Кожен суперник виплачує переможцю вартість руки. За руку в [hl]5[/] очок усі троє платять по 5 очок — у сумі ви отримуєте [hl]3×[/] від вартості руки ([hl]+15[/] очок)!
tutorial.hands.concealed.concealed_rule=Рука вважається [hl]закритою[/], якщо до оголошення виграшу ви не робили відкритих оголошень (таких як **Чоу** або **Панг**).
tutorial.hands.concealed.discard_win=Хоча ви взяли скидання гравця Навпроти для завершення останньої послідовності, виграш на скиданні [hl]дозволено[/] — тільки відкриті сети, зібрані *до* виграшу, порушують Закриту руку.
tutorial.hands.concealed.kongs=Оголошення будь-якого [hl]Чоу[/], [hl]Панга[/] або [hl]Конга[/] зі скидання розкриває цей сет на столі, роблячи руку відкритою та позбавляючи її цієї комбінації.

# Hands and scoring — All sequences
tutorial.hands.all_sequences.title=Усі послідовності
tutorial.hands.all_sequences.offer=Гравець Навпроти скинув кістку ({0}), що завершує вашу четверту послідовність. Хоча ваша рука вже відкрита через раніше оголошене Чоу, кнопка пропонує [hl]Ху 5[/]! Натисніть [hl]Ху[/], щоб перемогти.
tutorial.hands.all_sequences.points=Рука, у якій усі чотири сети — послідовності (без трійок і конгів), приносить [hl]5[/] очок за комбінацію [Усі послідовності](pattern-1.1).
tutorial.hands.all_sequences.open_allowed=На відміну від Закритої руки, комбінація [Усі послідовності](pattern-1.1) дозволяє відкриті Чоу. Навіть за наявності відкритого сету на столі чотири послідовності все одно приносять 5 очок.
tutorial.hands.all_sequences.unrestricted=Дозволена будь-яка пара — навіть із драконів або вітрів, — і підходить будь-який тип очікування.

# Hands and scoring — No terminals
tutorial.hands.no_terminals.title=Усі прості
tutorial.hands.no_terminals.offer=Гравець Навпроти скинув кістку ({0}), що завершує вашу виграшну руку. Кожна кістка у вашій руці — проста номерна від 2 до 8. Натисніть [hl]Ху[/], щоб перемогти.
tutorial.hands.no_terminals.terminals_def=У трьох номерних мастях крайні кістки — **1** та **9** ({1m}, {9s}) — називаються [hl]терміналами[/]. Внутрішні кістки від **2** до **8** називаються [hl]простими[/]. Благородні не належать ні до тих, ні до інших.
tutorial.hands.no_terminals.points=Комбінація [Усі прості](pattern-1.3) приносить [hl]5[/] очок. Кожна кістка в руці — усі чотири сети та пара — повинна бути [hl]простою[/], без терміналів і благородних.
tutorial.hands.no_terminals.flexibility=Зверніть увагу: у цій руці є відкрита трійка ({5p}{5p}{5p}), тож вона не закрита і не складається лише з чоу. Але оскільки кожна кістка проста, рука підходить під комбінацію [hl]Усі прості (5 очок)[/]!
tutorial.hands.no_terminals.stacking=Комбінація «Усі прості» може також [hl]складатися[/] з іншими комбінаціями, наприклад [Усі послідовності](pattern-1.1) або [Закрита рука](pattern-1.2), даючи в сумі 10 чи 15 очок.

# Hands and scoring — Kongs
tutorial.hands.kongs.title=Конги
tutorial.hands.kongs.offer=Гравець Навпроти скинув кістку ({0}), що завершує вашу виграшну руку. У вас на столі вже є два відкриті конги. Натисніть [hl]Ху[/], щоб перемогти.
tutorial.hands.kongs.two_kongs=Як ми бачили раніше, [Один конг](pattern-4.3.1) приносить [hl]5[/] очок. Наявність **двох конгів** збільшує нагороду до [hl]20[/] очок за комбінацію [Два конги](pattern-4.3.2)!
tutorial.hands.kongs.hand_size=Оскільки кожен конг складається з 4 кісток замість 3 і вимагає взяття додаткової кістки, у цій виграшній руці [hl]16[/] кісток замість звичайних 14.
tutorial.hands.kongs.ladder=Вищі комбінації конгів зростають стрімко: [Три конги](pattern-4.3.3) приносять [hl]120[/] очок, а [Чотири конги](pattern-4.3.4) приносять максимум — [hl]480[/] очок!

# Hands and scoring — Value honor
tutorial.hands.value_honor.title=Цінні благородні
tutorial.hands.value_honor.offer=Гравець Навпроти скинув кістку ({0}), що завершує вашу руку. Ваша відкрита трійка Червоних драконів робить вартість цієї руки [hl]Ху 10[/]! Натисніть [hl]Ху[/], щоб перемогти.
tutorial.hands.value_honor.dragons=Трійка або конг [hl]цінних благородних[/] приносить [hl]10[/] очок ([Цінні благородні](pattern-3.1)). Будь-який із трьох драконів — **Червоний** ({C}), **Зелений** ({F}) або **Білий** ({P}) — завжди вважається цінним для кожного гравця.
tutorial.hands.value_honor.seat_winds=Ваш власний **вітер місця** (наприклад, {E} для Сходу) також є цінним благородним. Вітри решти трьох місць очок не приносять. У Чжун-юн **немає переважального вітру столу**.
tutorial.hands.value_honor.stacking=Цінні благородні [hl]підсумовуються за кожен сет[/]: дві відповідні трійки принесуть [hl]20[/] очок. Відкриті сети дозволені, але **пари** очок ніколи не приносять — зараховуються лише трійки та конги.

# Hands and scoring — All triplets
tutorial.hands.all_triplets.title=Усі панги
tutorial.hands.all_triplets.offer=Гравець Навпроти скинув кістку ({0}), що збирає вашу руку в чотири трійки та пару. Натисніть [hl]Ху[/], щоб перемогти!
tutorial.hands.all_triplets.pattern=Комбінація [Усі панги](pattern-4.1) вимагає чотири трійки (або конги) та пару, без послідовностей. Відкриті панги дозволені, а сама комбінація приносить щедрі [hl]30[/] очок!
tutorial.hands.all_triplets.settlement_cap=У разі виграшу на скиданні понад 25 очок виплати гравців, які не скидали, [hl]обмежені 25 очками[/] (Ліворуч і Праворуч платять по [hl]-25[/]). Той, хто скинув, покриває обидві нестачі: 30 + 5 + 5 = **40** ([hl]-40[/])!
tutorial.hands.all_triplets.self_draw=Ви все одно отримуєте повні **90 очок** (3 × 30). У разі **взяття зі стіни** того, хто скинув, немає, тому всі троє суперників платять повні 30 очок.

# Hands and scoring — Nine-tile straight
tutorial.hands.nine_tile_straight.title=Чистий ряд
tutorial.hands.nine_tile_straight.offer=Гравець Навпроти скинув кістку ({0}), що збирає вашу руку в ряд з 1 по 9 у символах. Натисніть [hl]Ху[/], щоб перемогти!
tutorial.hands.nine_tile_straight.pattern=Комбінація [Чистий ряд](pattern-7.1) приносить цілих [hl]40[/] очок! Вона вимагає три послідовності від **1 до 9 в одній масті** ({1m}–{9m}). Відкриті чоу дозволені.
tutorial.hands.nine_tile_straight.composition=Решта 5 кісток можуть бути будь-яким законним сетом і парою в будь-якій масті. Тут трійка {555p} та пара {99s} доповнюють вашу 14-кісткову виграшну руку.
tutorial.hands.nine_tile_straight.settlement=За руки в 40 очок виплати гравців, які не скидали, обмежені [hl]-25[/]. Гравець Навпроти виплачує свої 40 плюс обидві нестачі по 15 очок ([hl]-70[/]), приносячи вам [hl]+120[/] очок (3 × 40)!

# Hands and scoring — Seven pairs
tutorial.hands.seven_pairs.title=Сім пар
tutorial.hands.seven_pairs.offer=Гравець Навпроти скинув кістку ({0}), що збирає вашу руку в сім пар. Натисніть [hl]Ху[/], щоб перемогти!
tutorial.hands.seven_pairs.pattern=Усі виграшні руки досі складалися з 4 сетів та 1 пари. [Сім пар](pattern-10.2) — це [hl]нестандартна рука[/]: вона порушує це правило, збираючи **сім пар** за [hl]30[/] очок!
tutorial.hands.seven_pairs.concealed_only=Сім пар мають бути [hl]повністю закритими[/]. Не можна оголошувати Чоу, Панг або Конг — усі пари мають бути взяті зі стіни. Проте завершальну кістку для 7-ї пари можна забрати зі скидання суперника!
tutorial.hands.seven_pairs.four_of_a_kind=Очікування в Семи парах — це завжди [hl]одностороннє очікування[/] на сьому пару. У Чжун-юн усі **чотири копії** однієї кістки (без оголошення конга) за правилами вважаються **двома парами**.

# Hands and scoring — Two identical sequences
tutorial.hands.two_identical_sequences.title=Два однакові чоу
tutorial.hands.two_identical_sequences.offer=Гравець Навпроти скинув кістку ({0}), що завершує ваше друге однакове чоу. Натисніть [hl]Ху[/], щоб перемогти!
tutorial.hands.two_identical_sequences.pattern=Комбінація [Два однакові чоу](pattern-5.1.1) приносить [hl]10[/] очок за дві однакові послідовності однієї масті ({234s} і {234s}). У руці вони виглядають як три пари поспіль ({223344s}). Відкриті чоу дозволені!
tutorial.hands.two_identical_sequences.ladder=Вищі щаблі цієї серії дають величезні очки: [Три однакові чоу](pattern-5.1.3) приносять [hl]120[/] очок, а [Чотири однакові чоу](pattern-5.1.4) дають максимум — [hl]480[/] очок!

# Hands and scoring — Two concealed triplets
tutorial.hands.two_concealed_triplets.title=Два закриті панги
tutorial.hands.two_concealed_triplets.offer=Гравець Навпроти скинув кістку ({0}), що завершує вашу руку. Натисніть [hl]Ху[/], щоб перемогти!
tutorial.hands.two_concealed_triplets.pattern=Комбінація [Два закриті панги](pattern-4.2.1) приносить [hl]5[/] очок за дві трійки, зібрані повністю в закритій руці ({333p} і {666s}). Відкриті панги не зараховуються!
tutorial.hands.two_concealed_triplets.ladder=Закриті трійки швидко зростають у ціні: [Три закриті панги](pattern-4.2.2) приносять [hl]30[/] очок, а [Чотири закриті панги](pattern-4.2.3) — [hl]125[/] очок!

# Hands and scoring — Three similar triplets
tutorial.hands.three_similar_triplets.title=Три змішані панги
tutorial.hands.three_similar_triplets.offer=Гравець Навпроти скинув кістку ({0}), що завершує вашу руку. Натисніть [hl]Ху[/], щоб перемогти!
tutorial.hands.three_similar_triplets.pattern=Комбінація [Три змішані панги](pattern-6.2.2) приносить значні [hl]120[/] очок за трійки **однакового номіналу** в усіх трьох мастях ({555m}, {555p}, {555s}). Відкриті панги дозволені!
tutorial.hands.three_similar_triplets.small_triplets=Молодша форма, [Малі три змішані панги](pattern-6.2.1), дає [hl]30[/] очок за **дві трійки та пару** однакового номіналу ({555m}, {555p} та {55s}). Новачки часто забувають про неї, хоча зібрати її набагато реальніше!

# Hands and scoring — One-suit hands
tutorial.hands.one_suit.title=Одна масть
tutorial.hands.one_suit.offer=Гравець Навпроти скинув кістку ({0}), що завершує вашу руку з кругів та благородних. Натисніть [hl]Ху[/], щоб перемогти!
tutorial.hands.one_suit.mixed=Рука лише з **однієї номерної масті** (помаранчеві) з додаванням **благородних** (сині) приносить [hl]40[/] очок за комбінацію [Напівмасть](pattern-2.1.1). Відкриті чоу та панги дозволені!
tutorial.hands.one_suit.pure=Якщо повністю прибрати благородні кістки, [Чиста масть](pattern-2.1.2) подвоює результат до [hl]80[/] очок! Кожен сет і пара тепер належать цій єдиній масті.

# Hands and scoring — More patterns
tutorial.hands.more_patterns.title=Інші комбінації
tutorial.hands.more_patterns.rarer=Ми познайомилися з основними комбінаціями. Багато рідкісніших рук — наприклад, серії драконів, вітрів та граничні руки — докладно описані в [Довідці](reference).
tutorial.hands.more_patterns.practice=Ви можете будь-якої миті відкрити [Довідку](reference) з ігрового меню під час партії, щоб уточнити правила комбінацій та вартість очок. Приємної гри!

