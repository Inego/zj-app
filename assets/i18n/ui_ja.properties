tutorial.orient.tiles.title=麻雀牌
tutorial.orient.tiles.intro=麻雀牌には34種類の異なる牌面があります。27種類の数牌と7種類の字牌です。以下にその一部を示します。
tutorial.orient.tiles.tags=牌面には**ラベルを表示**することも**非表示**にすることもできます。
tutorial.orient.tiles.tags_try=このアプリでは[設定](settings)でラベルの表示／非表示を切り替えられます。この13枚の牌はその設定に連動します — リンクをクリックしてチェックボックスを切り替えてみてください。
tutorial.orient.numbers.title=数牌
tutorial.orient.numbers.intro=数牌には3つの種類（花色）があります。萬子、筒子、索子（それぞれ1から9まで）です。
# Callout-led beat: short top line optional; teaching lives in the bubble.
tutorial.orient.numbers.bamboo1=特徴的な牌
tutorial.orient.numbers.bamboo1_callout=一索（1索）は伝統的に鳥（孔雀や雀）の絵柄で描かれます。
# Sequence teaching (end of Numbers): definition, then stepped “not a sequence” peels.
tutorial.orient.numbers.sequence=順子とは、同じ種類で**ちょうど3枚**の連続した数字の組み合わせです — 例: {234m}、{567p}、{123s}。
tutorial.orient.numbers.four=同種で連続した4枚の牌は順子では**ありません**。
tutorial.orient.numbers.four_aside3=**3** を取り除くか、
tutorial.orient.numbers.four_aside6=または **6** を取り除きます。
tutorial.orient.numbers.prompt=**順子**を見つけてください — その3枚の牌を選択してください。
tutorial.orient.honors.title=字牌
tutorial.orient.honors.intro=風牌と三元牌は[hl]字牌[/]です。数字の順子を作ることは**できません**。
tutorial.orient.honors.prompt=すべての字牌（風牌と三元牌）を選択してください。
tutorial.orient.wall.title=牌山を積む
tutorial.orient.wall.faces=牌の種類全34種: 1〜9の数牌3種、風牌4種、三元牌3種。
tutorial.orient.wall.copies=各牌が4枚ずつ — 合計136枚です。
tutorial.orient.wall.drawpile=牌山はカードゲームの山札のようなものです。配牌や対局中のツモはすべて牌山から引きます。
tutorial.orient.wall.ritual=実際の卓でプレイするときは、牌山を積む一連の作法があります。
tutorial.orient.wall.facedown=まず牌をすべて伏せて裏返します...
tutorial.orient.wall.shuffle=そしてよく混ぜ合わせます（洗牌）。
tutorial.orient.wall.formed=次に各プレイヤーの前に2段、17幢（34枚）の山を作ります。
tutorial.orient.wall.pushed=四方の山を中央に押し出して四角く囲みます。
tutorial.orient.wall.seats=各局ごとに、1人が東家、続いて南家、西家、北家となります。
tutorial.orient.wall.east=東家が親（荘家）となり、その局の最初に行動します。
tutorial.orient.wall.deal=東家がサイコロを2個振って開門位置を決めます。
tutorial.orient.wall.dice=サイコロの出目の合計で、牌山のどこを割るかが決まります。
tutorial.orient.wall.count={0}+{1}={2}。東家の山から右端から数えて{2}幢を数えます。
tutorial.orient.wall.break=数えた位置で山を割ります。その左側の山を少し離して隙間を開けます。
tutorial.orient.wall.take7=割れ目の右側から7幢（14枚）を数えます。
tutorial.orient.wall.dead=その14枚を王牌として取り分けておきます。
tutorial.orient.wall.dead_out=この14枚は通常のツモでは引かれません。終局時の緊張感を高めます。
tutorial.orient.wall.hands=配牌を取るため、割れ目の先から時計回りに各プレイヤーが2幢（4枚）ずつ3回取ります。
tutorial.orient.wall.hands_13=これで各自12枚になります。さらに1枚ずつ取って13枚にします。
tutorial.orient.wall.east_14=最初に行動する東家は、手番の最初のツモとして14枚目を取ります。
tutorial.orient.wall.look_hands=各自が手牌を確認し...
tutorial.orient.wall.sort_hands=...手牌を並び替えます（理牌）。
tutorial.orient.wall.east_discard=東家が最初の打牌を行い、ゲームが始まります。
tutorial.orient.wall.app_table=このアプリでは画面をすっきり見せるため、牌山は簡略化して表示され、王牌は表示されません。
tutorial.orient.wall.live_count=中央の **69** という数字は、牌山に残っている引ける牌の数です。

# Move order
tutorial.moves.east_player.title=東家（親）
tutorial.moves.east_player.four=プレイヤーは[hl]4人[/]です。各局で1人が[hl]東家[/]（親）となり、反時計回りに[hl]南家[/]、[hl]西家[/]、[hl]北家[/]（子）となります。
tutorial.moves.east_player.pass=1局終わるごとに、席の担当風が[hl]反時計回り[/]に移動します。南家だったプレイヤーが次の東家になります。
tutorial.moves.discarding.title=打牌（捨てる）
tutorial.moves.discarding.east_14=各局の開始時、[hl]東家[/]（親）の手牌は[hl]14[/]枚あります（他の3人の[hl]13[/]枚とは異なります）。
tutorial.moves.discarding.east_hu=もしこの14枚で最初から[hl]和了形[/]が完成していれば、東家は即座に「[hl]和！[/]」と宣言できます — これが[天和](pattern-9.4.1)です。
tutorial.moves.discarding.east_hu_odds=ただし統計的にこれが起きる確率は[hl]約33万分の1[/]です。生涯で一度も見られないことも珍しくありません。
tutorial.moves.discarding.must_discard=和了していなければ（通常はそうです）、東家は手牌を13枚に戻すために牌を1枚選んで[hl]打牌[/]（捨て）しなければなりません。
tutorial.moves.discarding.least_useful=打牌するときは、最も役に立たなそうな牌（役や面子を作る見込みが薄い牌）を選んで捨てます。
tutorial.moves.discarding.others_claim=捨てられた牌に対して、他のプレイヤーが[hl]鳴き[/]を宣言して手牌を整えたり、[hl]和了[/]したりすることができます。
tutorial.moves.counterclockwise.title=手番の順序
tutorial.moves.counterclockwise.this_tile=[hl]この牌をクリック[/]して捨ててください。
tutorial.moves.counterclockwise.click_callout=これを捨てる
tutorial.moves.counterclockwise.if_nobody=誰も[hl]鳴き[/]を宣言しなかったので、捨て牌は牌河に残りました。
tutorial.moves.counterclockwise.the_river=[hl]牌河[/]（捨て牌置き場）はカードの捨て札の山のようなものです。鳴かれなかった牌は捨てたプレイヤーの前に表向きで並べられます。
tutorial.moves.counterclockwise.to_the_right=手番は常に捨てたプレイヤーの[hl]右隣[/]（下家）に移ります。
tutorial.moves.counterclockwise.right_next=あなたは[hl]東家[/]（手前）です。次は[hl]下家[/]の手番です — 牌山からツモり、打牌します。
tutorial.moves.counterclockwise.right_discards=下家が牌を[hl]捨て[/]ました。誰も鳴かなかったので、手番は[hl]対家[/]に移り、牌山からツモります。

# Claiming
tutorial.claims.click_callout=これを選択
tutorial.claims.pung.title=ポン
tutorial.claims.pung.offer=対家が、あなたが[hl]対子[/]（2枚）で持っている牌（{0}）を捨てました。[hl]「ポン」をクリック[/]して刻子を完成させましょう。
tutorial.claims.pung.reveal=他家の捨て牌を鳴く場合、完成した組み合わせ（ここでは[hl]刻子[/]）を卓上に[hl]晒す[/]（公開する）必要があります。
tutorial.claims.pung.must_discard=これで手牌が[hl]14[/]枚になったので、和了していない限り牌を1枚[hl]打牌[/]しなければなりません。
tutorial.claims.pung.skips_left=あなたが鳴いたため、本来次に[hl]牌山からツモる[/]はずだった[hl]上家[/]の手番はスキップされます。
tutorial.claims.pung.third_for_two=2枚持っているところに3枚目を鳴くことができます。1枚持っているところに2枚目を鳴くことはできません。
tutorial.claims.last_discard.title=直前の捨て牌
tutorial.claims.last_discard.only_fresh=鳴くことができるのは、他家が捨てた[hl]直後[/]の牌だけです。すでに[hl]牌河[/]に並んでいる過去の牌を鳴くことはできません。
tutorial.claims.last_discard.callout=直前に捨てられた牌
# Claiming — Chow
tutorial.claims.chow.title=チー
tutorial.claims.chow.offer=上家が、あなたの手牌の2枚と合わせて[hl]順子[/]ができる牌（{0}）を捨てました。[hl]「チー」をクリック[/]して完成させましょう。
tutorial.claims.chow.reveal=他家の捨て牌を鳴く場合、完成した組み合わせ（ここでは[hl]順子[/]）を卓上に[hl]晒す[/]必要があります。
tutorial.claims.chow.must_discard=手牌が[hl]14[/]枚になったので、和了していない限り牌を1枚[hl]打牌[/]しなければなりません。
tutorial.claims.chow.only_left=チーができるのは[hl]上家[/]（直前の手番のプレイヤー）からだけです。対家や下家の捨て牌をチーすることはできません。
tutorial.claims.hu.title=和（ロン和）
tutorial.claims.hu.offer=手牌がほぼ完成し、最後の雀頭を待っている状態（聴牌）です。対家がちょうどその牌（{0}）を捨てました。[hl]「和」をクリック[/]してロン和を宣言しましょう。
tutorial.claims.hu.not_a_set=他家の捨て牌で[hl]和了形[/]が完成する場合、和ることができます。3枚の[hl]面子[/]である必要はなく、ここでは[hl]雀頭[/]（対子）を完成させて和了しました。
tutorial.claims.hu.breakdown=得点詳細パネルが卓上の視界を遮る場合は、[hl]ドラッグ[/]して移動したり、矢印ボタンで[hl]折りたたみ・展開[/]したりできます。実際にドラッグや折りたたみを試してみてください！

# Claiming — Claim priority
tutorial.claims.priority.title=鳴きの優先順位
tutorial.claims.priority.conflict=上家が {3s} を捨てました。あなたは {12s} を持っていて**チー**できますが、下家は {3s} の対子を持っています。[hl]「チー」[/]をクリックしてどうなるか見てみましょう！
tutorial.claims.priority.pung_beats_chow=あなたがチーを宣言しても、[hl]ポンはチーに優先[/]します！下家のポンが優先され、牌は下家のものになり、あなたの手番はスキップされます。
tutorial.claims.priority.hierarchy=一般的な鳴きの優先順位は: [hl]和（ロン）[/] ＞ [hl]ポン・カン[/] ＞ [hl]チー[/] です。
tutorial.claims.priority.multi_win=同じ捨て牌に対して複数のプレイヤーが[hl]和[/]を宣言した場合、捨てたプレイヤーから手番順が最も近いプレイヤー1人だけが和了となります（二家和はありません）。

# Kongs — Big exposed kong
tutorial.kongs.melded.title=大明槓
tutorial.kongs.melded.offer=対家が、あなたが暗刻（手の中に3枚）で持っている牌（{0}）を捨てました。[hl]「カン」[/]をクリックして4枚組を宣言しましょう！
tutorial.kongs.melded.reveal=他家の捨て牌で4枚目を鳴くことで、卓上に4枚組を[hl]明槓[/]として晒します。
tutorial.kongs.melded.one_kong=槓子を作ると[一槓子](pattern-4.3.1)として[hl]5[/]点になり、槓子の数が増えると高得点になります。
tutorial.kongs.melded.compensation=槓子は4枚で1組となるため、手牌の枚数を保つために牌山（王牌）から[hl]嶺上牌[/]（補充牌）を1枚引きます。
tutorial.kongs.melded.must_discard=嶺上牌を引いた後、手番を終了するために牌を1枚[hl]打牌[/]します。
tutorial.kongs.melded.already_melded=すでに卓上にポンして晒している明刻に対して、他家の捨て牌でカンすることはできません。

# Kongs — Concealed kong
tutorial.kongs.concealed.title=暗槓
tutorial.kongs.concealed.offer=牌山から引いて、{0} を手牌の中で4枚すべて揃えました。[hl]「暗槓」[/]をクリックしてください！
tutorial.kongs.concealed.arrangement=晒し方に注目してください: **両端の2枚を裏向き**にして伏せることで暗槓であることを示し、中央の2枚で牌の種類を証明します。
tutorial.kongs.concealed.scoring=中庸麻雀では、暗槓は得点計算上も**門前**として扱われます — [門前清](pattern-1.2)の役は有効のままです！
tutorial.kongs.concealed.compensation=牌山の末尾から[hl]嶺上牌[/]を1枚引き、通常通り打牌して手番を終えます。

# Kongs — Promoted kong
tutorial.kongs.promoted.title=小明槓（加槓）
tutorial.kongs.promoted.offer=すでにポンしている {0} の4枚目を自分で引いてきました！[hl]「小明槓」[/]をクリックして槓に昇格させましょう。
tutorial.kongs.promoted.upgraded=4枚目の牌が既存の明刻に加わり、明槓に昇格して[一槓子](pattern-4.3.1)の条件を満たします。
tutorial.kongs.promoted.robbing=注意: この瞬間のみ、他家がこの牌で和了できる場合に[搶槓](pattern-9.3)でロン和されるリスクがあります！
tutorial.kongs.promoted.compensation=搶槓されなければ、牌山の末尾から[hl]嶺上牌[/]を引いて打牌し、手番を完了します。

# Hands and scoring — Winning a hand
tutorial.hands.win.title=和了（アガリ）
tutorial.hands.win.hand_size=通常の手牌は[hl]13[/]枚です。牌を引いたり鳴いたりした瞬間だけ一時的に[hl]14[/]枚になります。和了しない場合は1枚捨てて13枚に戻します。
tutorial.hands.win.patterns=和了するためには、手牌が特定の条件（和了形や役）を満たしている必要があります。
tutorial.hands.win.all_in_groups=通常、和了手牌は4つの[hl]面子[/]と1つの[hl]雀頭[/]（対子）で構成されます。合計[hl]14[/]枚です。
tutorial.hands.win.set_kinds=面子とは、[hl]順子[/]、[hl]刻子[/]、または[hl]槓子[/]のことです。
tutorial.hands.win.kong_size=ここでは4つの面子のうち1つが[hl]槓子[/]です。槓子があるため、この手牌は14枚ではなく[hl]15[/]枚になっています。

# Hands and scoring — Chicken hand
tutorial.hands.chicken.title=チキンハンド
tutorial.hands.chicken.one=どの役の条件も満たさない和了手は、俗に[hl]チキンハンド[/]（無役）と呼ばれ、[hl]1[/]点となります。
tutorial.hands.chicken.tournament=大会ルールによっては、チキンハンドが[hl]禁止[/]され、最低[hl]5[/]点以上の役が必要なバリアントもあります（5点縛り）。
tutorial.hands.chicken.next=次のレッスンでは、手牌が[hl]5[/]点以上になる基本的な役を学んでいきましょう。

# Hands and scoring — Concealed hand
tutorial.hands.concealed.title=門前清
tutorial.hands.concealed.offer=対家が、あなたの手牌の2枚と合わせて順子ができる牌（{0}）を捨てました。対家からチーはできませんが、手牌が完成するため[hl]「和 5」[/]と表示されます！クリックして和了しましょう。
tutorial.hands.concealed.points=相手全員が和了者に点数を支払います。[hl]5[/]点の手なら、3人全員が5点ずつ支払うため、手役の点数の[hl]3倍[/]（[hl]+15[/]点）の収入になります！
tutorial.hands.concealed.concealed_rule=和了するまでに一度も鳴き（**チー**や**ポン**）をしていない手を[hl]門前清[/]と呼びます。
tutorial.hands.concealed.discard_win=最後の順子を対家の捨て牌で完成させましたが、ロン和は[hl]門前清を崩しません[/] — 崩れるのは和了の*前*に鳴いた場合だけです。
tutorial.hands.concealed.kongs=事前に[hl]チー[/]、[hl]ポン[/]、[hl]明槓[/]をすると手牌を卓上に晒すことになり、門前清ではなくなります。

# Hands and scoring — All sequences
tutorial.hands.all_sequences.title=平和
tutorial.hands.all_sequences.offer=対家が、4つ目の順子を完成させる牌（{0}）を捨てました。以前のチーで門前清ではありませんが、ボタンには[hl]「和 5」[/]と表示されています！クリックして和了しましょう。
tutorial.hands.all_sequences.points=4つの面子がすべて順子（刻子や槓子なし）の手は、[平和](pattern-1.1)として[hl]5[/]点になります。
tutorial.hands.all_sequences.open_allowed=門前清と異なり、[平和](pattern-1.1)はチーしていても認められます。鳴いていても4組の順子があれば5点獲得できます。
tutorial.hands.all_sequences.unrestricted=雀頭は何でもよく（字牌でも可）、待ちの形も不問です。

# Hands and scoring — No terminals
tutorial.hands.no_terminals.title=断么九
tutorial.hands.no_terminals.offer=対家が和了牌（{0}）を捨てました。手牌のすべての牌が2から8の中張牌で構成されています。クリックして和了しましょう。
tutorial.hands.no_terminals.terminals_def=数牌の端の牌である **1** と **9**（{1m}、{9s}）を[hl]么九数牌[/]と呼びます。内側の **2** から **8** までの牌を[hl]中張数牌[/]と呼びます。字牌はどちらでもありません。
tutorial.hands.no_terminals.points=[断么九](pattern-1.3)は[hl]5[/]点の役です。手牌のすべての牌（4面子と雀頭）が[hl]中張数牌[/]で、么九牌や字牌が一切含まれていない手です。
tutorial.hands.no_terminals.flexibility=この手にはポンした明刻（{5p}{5p}{5p}）があるため、門前清でも平和でもありません。しかし全牌が中張牌なので、[hl]断么九（5点）[/]が成立します！
tutorial.hands.no_terminals.stacking=断么九は[平和](pattern-1.1)や[門前清](pattern-1.2)などの役とも[hl]複合[/]して、10点や15点に加算できます。

# Hands and scoring — Kongs
tutorial.hands.kongs.title=槓子
tutorial.hands.kongs.offer=対家が和了牌（{0}）を捨てました。卓上にはすでに2つの明槓があります。クリックして和了しましょう。
tutorial.hands.kongs.two_kongs=前述の通り、[一槓子](pattern-4.3.1)は[hl]5[/]点ですが、**2つの槓子**があると[二槓子](pattern-4.3.2)として[hl]20[/]点に跳ね上がります！
tutorial.hands.kongs.hand_size=各槓子は3枚ではなく4枚使い、嶺上牌を引いているため、この和了手牌は通常の14枚ではなく[hl]16[/]枚になっています。
tutorial.hands.kongs.ladder=槓子の役はさらに高くなります: [三槓子](pattern-4.3.3)は[hl]120[/]点、[四槓子](pattern-4.3.4)は満貫の[hl]480[/]点です！

# Hands and scoring — Value honor
tutorial.hands.value_honor.title=翻牌
tutorial.hands.value_honor.offer=対家が和了牌（{0}）を捨てました。中の明刻があるため、この手は[hl]「和 10」[/]の価値があります！クリックして和了しましょう。
tutorial.hands.value_honor.dragons=[hl]翻牌[/]の刻子や槓子は1組につき[hl]10[/]点になります（[翻牌](pattern-3.1)）。三元牌 — **中** ({C})、**發** ({F})、**白** ({P}) — のいずれも、どのプレイヤーにとっても常に翻牌です。
tutorial.hands.value_honor.seat_winds=自分の**門風**（自風、東家なら {E}）も翻牌です。他の3つの席の風（客風）は点数になりません。中庸麻雀には**場風（圏風）はありません**。
tutorial.hands.value_honor.stacking=翻牌は[hl]1組ごとに加算[/]されます: 翻牌の刻子を2組持っていれば[hl]20[/]点です。鳴いても有効ですが、字牌の**対子（雀頭）**は翻牌にならず、刻子と槓子のみが対象です。

# Hands and scoring — All triplets
tutorial.hands.all_triplets.title=対々和
tutorial.hands.all_triplets.offer=対家が捨てた牌（{0}）で、手牌が4つの刻子と1つの対子に完成しました。クリックして和了しましょう！
tutorial.hands.all_triplets.pattern=[対々和](pattern-4.1)は、順子がなく4つの刻子（または槓子）と雀頭で構成される役です。ポンした明刻も認められ、[hl]30[/]点という高得点を獲得できます！
tutorial.hands.all_triplets.settlement_cap=25点を超える高い手をロン和した場合、放銃者以外の2人の支払いは[hl]25点が上限[/]になります（上家と下家は[hl]-25[/]ずつ）。放銃者が不足分を包払いします: 30 + 5 + 5 = **40**（[hl]-40[/]）！
tutorial.hands.all_triplets.self_draw=和了者は常に満額の**90点**（3 × 30）を受け取ります。**自摸和**の場合は放銃者がいないため、3人全員が30点ずつ均等に支払います。

# Hands and scoring — Nine-tile straight
tutorial.hands.nine_tile_straight.title=一気通貫
tutorial.hands.nine_tile_straight.offer=対家が捨てた牌（{0}）で、萬子の1から9までの一気通貫が完成しました。クリックして和了しましょう！
tutorial.hands.nine_tile_straight.pattern=[一気通貫](pattern-7.1)はなんと[hl]40[/]点の大役です！**同色の数牌で 1 から 9 まで**の3つの順子（{1m}〜{9m}）を揃える必要があります。チーも認められます。
tutorial.hands.nine_tile_straight.composition=残りの5枚はどの色でもよい面子1組と雀頭です。ここでは {555p} の刻子と {99s} の雀頭で14枚の手牌を完成させています。
tutorial.hands.nine_tile_straight.settlement=40点の手では、非放銃者は上限の[hl]-25[/]を支払います。放銃者である対家は自身の40点に加えて不足分の15点×2を合わせた[hl]-70[/]を支払い、和了者は[hl]+120[/]点（3 × 40）を得ます！

# Hands and scoring — Seven pairs
tutorial.hands.seven_pairs.title=七対子
tutorial.hands.seven_pairs.offer=対家が捨てた牌（{0}）で、手牌が7組の対子になりました。クリックして和了しましょう！
tutorial.hands.seven_pairs.pattern=これまで見てきた和了形はすべて4面子1雀頭でした。[七対子](pattern-10.2)は[hl]特殊和了形[/]の一つで、**7つの対子**を揃えることで[hl]30[/]点になります！
tutorial.hands.seven_pairs.concealed_only=七対子は[hl]完全な門前[/]でなければなりません。チー、ポン、カンはできず、対子はすべて自分で引く必要があります。ただし最後の7組目となる牌はロン和で獲得できます！
tutorial.hands.seven_pairs.four_of_a_kind=七対子の待ち牌は常に最後の対子を待つ[hl]単騎待ち[/]です。中庸麻雀では、同じ牌4枚（カンしていないもの）を法的に**2つの対子**として数えることが認められています。

# Hands and scoring — Two identical sequences
tutorial.hands.two_identical_sequences.title=一般高
tutorial.hands.two_identical_sequences.offer=対家が捨てた牌（{0}）で、2つ目の同一順子が完成しました。クリックして和了しましょう！
tutorial.hands.two_identical_sequences.pattern=[一般高](pattern-5.1.1)は、同色同数の2組の順子（{234s} と {234s}）を揃えると[hl]10[/]点になります。手牌の中では連番の対子（{223344s}）のように見えます。チーしても有効です！
tutorial.hands.two_identical_sequences.ladder=この系列の上位役は非常に高得点です: [一色三同順](pattern-5.1.3)は[hl]120[/]点、[一色四同順](pattern-5.1.4)は満貫の[hl]480[/]点です！

# Hands and scoring — Two concealed triplets
tutorial.hands.two_concealed_triplets.title=二暗刻
tutorial.hands.two_concealed_triplets.offer=対家が捨てた牌（{0}）で手牌が完成しました。クリックして和了しましょう！
tutorial.hands.two_concealed_triplets.pattern=[二暗刻](pattern-4.2.1)は、手牌の中で誰からも鳴かずに作った暗刻が2組ある場合（{333p} と {666s}）に[hl]5[/]点になります。ポンした明刻は対象外です！
tutorial.hands.two_concealed_triplets.ladder=暗刻系列は急速に点数が上がります: [三暗刻](pattern-4.2.2)は[hl]30[/]点、[四暗刻](pattern-4.2.3)は[hl]125[/]点です！

# Hands and scoring — Three similar triplets
tutorial.hands.three_similar_triplets.title=三色同刻
tutorial.hands.three_similar_triplets.offer=対家が捨てた牌（{0}）で手牌が完成しました。クリックして和了しましょう！
tutorial.hands.three_similar_triplets.pattern=[三色同刻](pattern-6.2.2)は、3つの異なる花色で**同じ数字**の刻子（{555m}、{555p}、{555s}）を揃えると、なんと[hl]120[/]点になります！ポンしても有効です。
tutorial.hands.three_similar_triplets.small_triplets=より達成しやすい下位役の[三色小同刻](pattern-6.2.1)は、3色で同じ数字の**刻子2組と雀頭**（{555m}、{555p}、{55s}）で[hl]30[/]点になります。初心者が見落としがちですが、実戦では三色同刻よりはるかに狙いやすい役です！

# Hands and scoring — One-suit hands
tutorial.hands.one_suit.title=一色類
tutorial.hands.one_suit.offer=対家が捨てた牌（{0}）で、筒子と字牌の手牌が完成しました。クリックして和了しましょう！
tutorial.hands.one_suit.mixed=**1種類の数牌**と**字牌**だけで手牌を構成すると、[混一色](pattern-2.1.1)として[hl]40[/]点になります。チーやポンをしても有効です！
tutorial.hands.one_suit.pure=字牌も一切使わず、1種類の数牌だけで構成すると、[清一色](pattern-2.1.2)となり2倍の[hl]80[/]点になります！すべての面子と雀頭がその単一の花色になります。

# Hands and scoring — More patterns
tutorial.hands.more_patterns.title=さらなる役
tutorial.hands.more_patterns.rarer=主要な役の紹介は以上です。三元系列や四喜風牌系列、満貫役などのさらに希少な役は、すべて[参照](reference)に掲載されています。
tutorial.hands.more_patterns.practice=対局中いつでもメニューから[参照](reference)を開いて、役の定義や点数を確認できます。対局をお楽しみください！

