# Powiadomienia: powiadomienie jest zapisywane jako klucz szablonu wraz
# z argumentami, a klient wypełnia szablon w języku gracza. Poczta renderuje
# te same szablony z angielskiego pliku bazowego, dopóki nie powstanie i18n
# po stronie serwera.
