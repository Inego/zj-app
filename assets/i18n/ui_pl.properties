tutorial.hands.more_patterns.title=Więcej układów
tutorial.hands.more_patterns.rarer=Omówiliśmy podstawowe układy. Wiele rzadszych rąk — takich jak serie smoków, rąk wiatrów czy rąk limitowych — opisano szczegółowo w [Zasadach](reference).
tutorial.hands.more_patterns.practice=Możesz sprawdzić [Zasady](reference) w dowolnym momencie z menu w trakcie gry, by poznać reguły układów i ich punktację. Udanej gry!

