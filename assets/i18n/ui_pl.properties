notice.empty=Brak powiadomień
# {0} nazwa gracza, {1} jego ranking, {2} identyfikator próby, {3} Twój wynik,
# {4} jego wynik, {5} zmiana Twojego rankingu, {6} ranking przed, {7} ranking po.
notice.later_play=**{0}** ({1}) rozegrał [hl]{2}[/]. Uzyskałeś **{3}**, {0} uzyskał **{4}**. Ranking {5} ({6} → {7}).
