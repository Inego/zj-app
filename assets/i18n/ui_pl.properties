tutorial.orient.tiles.title=Kamienie
tutorial.orient.tiles.intro=W Mahjongu są 34 różne wzory kamieni: 27 kamieni liczbowych i 7 honorowych. Oto kilka z nich.
tutorial.orient.tiles.tags=Kamienie mogą być wyświetlane **z etykietami** lub **bez nich**.
tutorial.orient.tiles.tags_try=W tej aplikacji możesz włączać lub wyłączać etykiety w [Ustawieniach](settings). Te trzynaście kamieni reaguje na to ustawienie — kliknij link i przełącz opcję, aby zobaczyć, jak działa.
tutorial.orient.numbers.title=Liczby
tutorial.orient.numbers.intro=Kamienie liczbowe występują w trzech kolorach: Znaki, Kropki i Bambusy (od 1 do 9 w każdym).
tutorial.orient.numbers.bamboo1=Kamień wart uwagi
tutorial.orient.numbers.bamboo1_callout=1 Bambus jest tradycyjnie przedstawiany jako ptak.
tutorial.orient.numbers.sequence=Sekwencja to **dokładnie trzy** kolejne liczby w tym samym kolorze — na przykład {234m}, {567p} lub {123s}.
tutorial.orient.numbers.four=Cztery kolejne kamienie w jednym kolorze **nie** są sekwencją.
tutorial.orient.numbers.four_aside3=Odłóż na bok **3**.
tutorial.orient.numbers.four_aside6=Albo odłóż na bok **6**.
tutorial.orient.numbers.prompt=Znajdź **sekwencję** — wybierz jej trzy kamienie.
tutorial.orient.honors.title=Honory
tutorial.orient.honors.intro=Wiatry i smoki to kamienie [hl]honorowe[/]. **Nie** tworzą sekwencji liczbowych.
tutorial.orient.honors.prompt=Wybierz każdy kamień honorowy (wiatry i smoki).
tutorial.orient.wall.title=Budowanie muru
tutorial.orient.wall.faces=Pełny zestaw wzorów: trzy kolory od 1 do 9, cztery wiatry i trzy smoki — łącznie 34 wzory.
tutorial.orient.wall.copies=Każdy wzór występuje w czterech kopiach — razem 136 kamieni.
tutorial.orient.wall.drawpile=Mur jest jak talia do dobierania w kartach: pochodzą z niego ręce początkowe i kamienie dobierane w trakcie gry.
tutorial.orient.wall.ritual=Podczas gry przy prawdziwym stole budowanie muru jest rytuałem.
tutorial.orient.wall.facedown=Aby zbudować mur, najpierw odwraca się kamienie zakryte do dołu...
tutorial.orient.wall.shuffle=I dokładnie się je miesza.
tutorial.orient.wall.formed=Następnie formuje się mur: cztery ściany po 17 kolumn, o wysokości dwóch kamieni.
tutorial.orient.wall.pushed=Ściany są przysuwane tak, aby ich końce się stykały.
tutorial.orient.wall.seats=W każdym rozdaniu jeden gracz to Wschód, kolejny Południe, potem Zachód i Północ.
tutorial.orient.wall.east=Wschód jest rozdającym i wykonuje pierwszy ruch w rozdaniu.
tutorial.orient.wall.deal=Wschód rozdaje, rzucając dwiema kośćmi k6.
tutorial.orient.wall.dice=Suma oczek na kościach wyznacza miejsce przerwania muru.
tutorial.orient.wall.count={0}+{1}={2}. Od prawego końca muru Wschodu odlicz {2} kolumn.
tutorial.orient.wall.break=Mur zostaje przerwany za odliczonymi kolumnami. Kolumny po lewej przesuwają się w lewo, tworząc przerwę.
tutorial.orient.wall.take7=Odlicz 7 kolumn na prawo od przerwy.
tutorial.orient.wall.dead=Odsuń je na bok, tworząc osobny martwy mur.
tutorial.orient.wall.dead_out=Te 14 kamieni nigdy nie jest dobieranych, co dodaje niepewności pod koniec rozdania.
tutorial.orient.wall.hands=Aby ułożyć ręce, gracze biorą po 2 kolumny za przerwą, rozbierając mur zgodnie z ruchem wskazówek zegara — trzykrotnie.
tutorial.orient.wall.hands_13=Po tym każdy gracz ma 3x4 = 12 kamieni. Następnie biorą po jeszcze jednym kamieniu, uzyskując 13.
tutorial.orient.wall.east_14=Ponieważ Wschód gra jako pierwszy, zaczyna swoją turę od otrzymania 14. kamienia.
tutorial.orient.wall.look_hands=Każdy gracz patrzy na swoją rękę...
tutorial.orient.wall.sort_hands=...i porządkuje ją.
tutorial.orient.wall.east_discard=Teraz gracz Wschodu musi wykonać swój pierwszy ruch, odrzucając kamień.
tutorial.orient.wall.app_table=W tej aplikacji, aby zaoszczędzić miejsce na ekranie, żywy mur jest pokazany w sposób uproszczony, a martwy mur nie jest w ogóle wyświetlany.
tutorial.orient.wall.live_count=Liczba **69** na środku oznacza liczbę kamieni pozostałych w żywym murze.

# Kolejność ruchów
tutorial.moves.east_player.title=Gracz Wschodu
tutorial.moves.east_player.four=W grze bierze udział [hl]czterech[/] graczy. W każdym rozdaniu jeden z nich to [hl]Wschód[/] (rozdający). Następnie, przeciwnie do ruchu wskazówek zegara: [hl]Południe[/], [hl]Zachód[/] i [hl]Północ[/].
tutorial.moves.east_player.pass=Po każdym rozdaniu przydział wiatrów przesuwa się [hl]przeciwnie do ruchu wskazówek zegara[/]. Gracz, który był Południem, staje się nowym Wschodem.
tutorial.moves.discarding.title=Odrzucanie kamieni
tutorial.moves.discarding.east_14=Na początku każdego rozdania gracz będący [hl]Wschodem[/] (rozdający) ma w ręku [hl]14[/] kamieni (w przeciwieństwie do pozostałych 3 graczy, którzy mają po [hl]13[/] kamieni).
tutorial.moves.discarding.east_hu=Jeśli te 14 kamieni tworzy [hl]zwycięską rękę[/], Wschód może od razu ogłosić wygraną („[hl]Hu![/]") — to [Błogosławieństwo Niebios](pattern-9.4.1).
tutorial.moves.discarding.east_hu_odds=Statystycznie szansa na to wynosi [hl]1 do 328 909[/]. Możesz grać w mahjonga całe życie i nigdy tego nie doświadczyć.
tutorial.moves.discarding.must_discard=Jeśli ta ręka nie wygrywa (co jest normą), Wschód musi wybrać jeden ze swoich kamieni do [hl]odrzucenia[/], aby przywrócić liczbę kamieni do 13.
tutorial.moves.discarding.least_useful=Podczas odrzucania staraj się pozbyć najmniej przydatnego kamienia (takiego, który słabo rokuje na przyszłe układy).
tutorial.moves.discarding.others_claim=Inni gracze mogą [hl]przejąć[/] odrzucony kamień, aby ulepszyć swoją rękę lub nawet [hl]wygrać[/].
tutorial.moves.counterclockwise.title=Kolejność tury
tutorial.moves.counterclockwise.this_tile=[hl]Kliknij ten kamień[/], aby go odrzucić.
tutorial.moves.counterclockwise.click_callout=Odrzuć go
tutorial.moves.counterclockwise.if_nobody=Nikt go nie [hl]przejął[/], więc pozostał odrzucony.
tutorial.moves.counterclockwise.the_river=[hl]Rzeka[/] jest jak stos kart odrzuconych: nieprzejęte kamienie leżą odkryte przed graczem, który je odrzucił.
tutorial.moves.counterclockwise.to_the_right=Tura zawsze przechodzi na gracza po [hl]prawej stronie[/] odrzucającego.
tutorial.moves.counterclockwise.right_next=Jesteś [hl]Wschodem[/] (dół stołu). Gracz [hl]po prawej[/] gra następny — dobrał kamień z muru, a potem go odrzuci.
tutorial.moves.counterclockwise.right_discards=Gracz po prawej [hl]odrzuca[/] kamień. Nikt go nie przejął, więc tura przechodzi na gracza [hl]naprzeciwko[/], który dobiera z muru.

# Deklaracje
tutorial.claims.click_callout=Wybierz to
tutorial.claims.pung.title=Pung
tutorial.claims.pung.offer=Gracz naprzeciwko odrzucił kamień, do którego masz już [hl]parę[/] ({0}). [hl]Kliknij Pung[/], aby skompletować trójkę.
tutorial.claims.pung.reveal=Przejęcie kamienia odrzuconego przez innego gracza wymaga [hl]odkrycia[/] utworzonego układu — tutaj [hl]trójki[/].
tutorial.claims.pung.must_discard=Teraz masz [hl]14[/] kamieni, a ponieważ nie jest to zwycięska ręka, musisz [hl]odrzucić[/] kamień.
tutorial.claims.pung.skips_left=Ponieważ przejąłeś kamień, gracz [hl]po lewej[/] traci swoją turę — to on normalnie [hl]dobierałby z muru[/].
tutorial.claims.pung.third_for_two=Możesz przejąć [hl]trzeci[/] kamień do pary. Nie możesz przejąć [hl]drugiego[/] do pojedynczego kamienia.
tutorial.claims.last_discard.title=Ostatnia zrzutka
tutorial.claims.last_discard.only_fresh=Możesz przejąć kamień [hl]natychmiast po[/] jego odrzuceniu. Nie możesz przejąć kamienia, który leży już w [hl]rzece[/].
tutorial.claims.last_discard.callout=Ten kamień został odrzucony jako ostatni
tutorial.claims.chow.title=Chow
tutorial.claims.chow.offer=Gracz po lewej odrzucił kamień ({0}), który tworzy [hl]sekwencję[/] z dwoma kamieniami, które już masz. [hl]Kliknij Chow[/], aby ją ukończyć.
tutorial.claims.chow.reveal=Przejęcie kamienia odrzuconego przez innego gracza wymaga [hl]odkrycia[/] utworzonego układu — tutaj [hl]sekwencji[/].
tutorial.claims.chow.must_discard=Teraz masz [hl]14[/] kamieni, a ponieważ nie jest to ręka wygrywająca, musisz [hl]odrzucić[/] kamień.
tutorial.claims.chow.only_left=Możesz ogłosić Chow [hl]tylko[/] z gracza [hl]po lewej[/] (bezpośrednio przed Tobą). Zrzutek od gracza naprzeciwko lub po prawej nie można wziąć na Chow.
tutorial.claims.hu.title=Hu
tutorial.claims.hu.offer=Tutaj Twoja zwycięska ręka jest prawie gotowa — czekasz na parę. Gracz naprzeciwko właśnie odrzucił potrzebny Ci kamień ({0}). [hl]Kliknij Hu[/], aby go przejąć.
tutorial.claims.hu.not_a_set=Gdy odrzucony kamień kompletuje [hl]zwycięską rękę[/], możesz go przejąć. [hl]Nie[/] musi on tworzyć [hl]układu[/] — tutaj uzupełnił [hl]parę[/].
tutorial.claims.hu.breakdown=Jeśli panel podsumowania punktów zasłania stół, możesz [hl]przeciągnąć[/] go w inne miejsce lub [hl]zwinąć i rozwinąć[/] za pomocą przycisku ze strzałką. Wypróbuj przeciąganie lub zwijanie już teraz!

# Priorytet deklaracji
tutorial.claims.priority.title=Priorytet deklaracji
tutorial.claims.priority.conflict=Gracz po lewej właśnie odrzucił {3s}. Trzymasz {12s} i możesz ogłosić **Chow**, ale gracz po prawej ma parę {3s}. Spróbuj ogłosić [hl]Chow[/], aby zobaczyć, co się stanie!
tutorial.claims.priority.pung_beats_chow=Chociaż ogłosiłeś Chow, [hl]Pung bije Chow[/]! Deklaracja gracza po prawej ma pierwszeństwo — zabiera on kamień, a Twoja tura zostaje pominięta!
tutorial.claims.priority.hierarchy=Powszechna hierarchia deklaracji to: [hl]Wygrana (Hu)[/] bije [hl]Punga i Konga[/], a oba biją [hl]Chow[/].
tutorial.claims.priority.multi_win=Jeśli kilku graczy ogłosi [hl]Hu[/] na tym samym odrzuconym kamieniu, wygrywa gracz najbliższy odrzucającemu w kolejności tury (brak podwójnych wygranych).

# Kongi — Odkryty Kong
tutorial.kongs.melded.title=Odkryty Kong
tutorial.kongs.melded.offer=Gracz naprzeciwko odrzucił kamień ({0}) pasujący do Twojej zakrytej trójki. Kliknij [hl]Kong[/], aby zgłosić czwórkę!
tutorial.kongs.melded.reveal=Przejęcie odrzuconego 4. kamienia ujawnia czwórkę na stole jako [hl]odkryty Kong[/].
tutorial.kongs.melded.one_kong=Utworzenie Konga daje [hl]5[/] punktów za układ [Jeden Kong](pattern-4.3.1) i rośnie przy kolejnych Kongach.
tutorial.kongs.melded.compensation=Ponieważ Kong liczy 4 kamienie, dobierasz [hl]kamień uzupełniający[/] z końca muru, aby utrzymać poprawny rozmiar ręki.
tutorial.kongs.melded.must_discard=Po dobraniu kamienia uzupełniającego musisz [hl]odrzucić[/] kamień, aby zakończyć turę.
tutorial.kongs.melded.already_melded=Nie możesz przejąć odrzuconego 4. kamienia, jeśli Twoja trójka została wcześniej wyłożona na stół jako otwarty [hl]Pung[/].

# Kongi — Zakryty Kong
tutorial.kongs.concealed.title=Zakryty Kong
tutorial.kongs.concealed.offer=Właśnie dobrałeś kamień z muru i masz wszystkie cztery kopie {0}. Kliknij [hl]Zgłoś zakryty Kong[/]!
tutorial.kongs.concealed.arrangement=Zwróć uwagę na układ: dwa **skrajne kamienie są zakryte** (odwrócone), by pokazać, że pozostaje ukryty, a środkowe potwierdzają układ.
tutorial.kongs.concealed.scoring=W Zung Jung liczy się on jako **zakryty** do punktacji — [Ukryta ręka](pattern-1.2) pozostaje ważna!
tutorial.kongs.concealed.compensation=Dobierasz [hl]kamień uzupełniający[/] z końca muru, a następnie normalnie odrzucasz kamień, by zakończyć turę.

# Kongi — Awansowany Kong
tutorial.kongs.promoted.title=Awansowany Kong
tutorial.kongs.promoted.offer=Masz otwartego Punga z {0} i właśnie dobrałeś 4. kamień! Kliknij [hl]Awansuj Kong[/], aby ulepszyć układ.
tutorial.kongs.promoted.upgraded=Czwarty kamień dołącza do otwartego Punga, przekształcając go w otwarty Kong i kwalifikując do układu [Jeden Kong](pattern-4.3.1).
tutorial.kongs.promoted.robbing=Uwaga: To jedyny moment, w którym rywale mogą wykonać [Przechwycenie Konga](pattern-9.3), jeśli ten kamień kompletuje ich wygraną!
tutorial.kongs.promoted.compensation=Jeśli nikt nie zgłosi wygranej, dobierasz [hl]kamień uzupełniający[/] z końca muru i odrzucasz kamień, by zakończyć turę.

# Ręce i punktacja — Wygrana
tutorial.hands.win.title=Wygrana w rozdaniu
tutorial.hands.win.hand_size=Gracze zazwyczaj trzymają [hl]13[/] kamieni. [hl]14[/] masz tylko chwilowo podczas dobierania lub przejęcia. Jeśli nie wygrywasz, musisz odrzucić do 13.
tutorial.hands.win.patterns=Aby wygrać rozdanie, kamienie w Twojej ręce muszą tworzyć określone układy.
tutorial.hands.win.all_in_groups=Zwykle w zwycięskiej ręce każdy kamień musi należeć do jednej z czterech [hl]grup[/] lub pojedynczej [hl]pary[/]. To zazwyczaj [hl]14[/] kamieni.
tutorial.hands.win.set_kinds=Grupą jest [hl]sekwencja[/], [hl]trójka[/] lub [hl]Kong[/].
tutorial.hands.win.kong_size=Tutaj jedną z czterech grup jest [hl]Kong[/]. Z powodu tego Konga ręka liczy [hl]15[/] kamieni zamiast 14.

# Ręce i punktacja — Ręka bez układu
tutorial.hands.chicken.title=Ręka bez układu
tutorial.hands.chicken.one=Jeśli w tej ręce nie ma żadnych specjalnych układów punktowych, nazywa się ją [hl]ręką bez układu[/] i jest warta [hl]1[/] punkt.
tutorial.hands.chicken.tournament=W turniejach ręce bez układu bywają [hl]zabronione[/] — ręka musi być warta co najmniej [hl]5[/] punktów, by można było ogłosić wygraną.
tutorial.hands.chicken.next=W kolejnych lekcjach poznamy podstawowe układy punktowe pozwalające zdobyć [hl]5[/] lub więcej punktów.

# Ręce i punktacja — Ukryta ręka
tutorial.hands.concealed.title=Ukryta ręka
tutorial.hands.concealed.offer=Gracz naprzeciwko odrzucił kamień ({0}), który kończy sekwencję z dwoma Twoimi kamieniami. Nie możesz ogłosić Chow z naprzeciwka — ale ponieważ kończy on całą rękę, możesz ogłosić [hl]Hu 5[/]! Kliknij [hl]Hu[/], aby wygrać.
tutorial.hands.concealed.points=Każdy przeciwnik płaci zwycięzcy wartość ręki. Za rękę o wartości [hl]5[/] punktów wszyscy trzej płacą po 5 — dając Ci [hl]3×[/] wartość ręki ([hl]+15[/] punktów)!
tutorial.hands.concealed.concealed_rule=Ręka jest [hl]ukryta[/], jeśli przed ogłoszeniem wygranej nie wykonałeś żadnych otwartych deklaracji (takich jak **Chow** czy **Pung**).
tutorial.hands.concealed.discard_win=Chociaż przejąłeś zrzutkę gracza naprzeciwko do ostatniej sekwencji, wygrana ze zrzutki jest [hl]dozwolona[/] — tylko otwarte układy powstałe *przed* wygraną naruszają ten układ.
tutorial.hands.concealed.kongs=Zgłoszenie dowolnego [hl]Chow[/], [hl]Punga[/] lub [hl]Konga[/] wcześniej w rozdaniu wykłada układ na stół, otwierając rękę i unieważniając ten wzorzec.

# Ręce i punktacja — Same sekwencje
tutorial.hands.all_sequences.title=Same sekwencje
tutorial.hands.all_sequences.offer=Gracz naprzeciwko odrzucił kamień ({0}), który kończy Twoją czwartą sekwencję. Mimo że Twoja ręka jest otwarta po wcześniejszym Chow, przycisk oferuje [hl]Hu 5[/]! Kliknij [hl]Hu[/], aby wygrać.
tutorial.hands.all_sequences.points=Ręka, w której wszystkie cztery grupy to sekwencje (bez trójek i Kongów), daje [hl]5[/] punktów za [Same sekwencje](pattern-1.1).
tutorial.hands.all_sequences.open_allowed=W przeciwieństwie do Ukrytej ręki, układ [Same sekwencje](pattern-1.1) pozwala na otwarte Chow. Nawet z otwartym układem na stole posiadanie czterech sekwencji daje 5 punktów.
tutorial.hands.all_sequences.unrestricted=Dozwolona jest dowolna para — nawet honory smoków czy wiatrów — i dowolny rodzaj czekania kwalifikuje się do wygranej.

# Ręce i punktacja — Bez krańcowych
tutorial.hands.no_terminals.title=Bez krańcowych
tutorial.hands.no_terminals.offer=Gracz naprzeciwko odrzucił kamień ({0}), który kończy Twoją zwycięską rękę. Każdy kamień w Twojej ręce to zwykła liczba od 2 do 8. Kliknij [hl]Hu[/], aby wygrać.
tutorial.hands.no_terminals.terminals_def=W trzech kolorach liczbowych skrajne kamienie — **1** i **9** ({1m}, {9s}) — nazywane są [hl]krańcowymi[/]. Środkowe kamienie od **2** do **8** to [hl]kamienie zwykłe[/]. Honory nie należą do żadnej z tych grup.
tutorial.hands.no_terminals.points=Układ [Bez krańcowych](pattern-1.3) wart jest [hl]5[/] punktów. Każdy kamień w ręce — wszystkie cztery grupy i para — musi być [hl]kamieniem zwykłym[/], bez krańcowych i bez honorów.
tutorial.hands.no_terminals.flexibility=Zauważ, że ta ręka ma otwartą trójkę ({5p}{5p}{5p}), więc nie jest ani ukryta, ani złożona z samych sekwencji. Ponieważ jednak każdy kamień jest zwykły, kwalifikuje się jako [hl]Bez krańcowych (5 pkt)[/]!
tutorial.hands.no_terminals.stacking=Bez krańcowych może się również [hl]łączyć[/] z innymi układami, takimi jak [Same sekwencje](pattern-1.1) lub [Ukryta ręka](pattern-1.2), dając łącznie 10 lub 15 punktów.

# Ręce i punktacja — Kongi
tutorial.hands.kongs.title=Kongi
tutorial.hands.kongs.offer=Gracz naprzeciwko odrzucił kamień ({0}), który kończy Twoją zwycięską rękę. Masz już dwa otwarte Kongi na stole. Kliknij [hl]Hu[/], aby wygrać.
tutorial.hands.kongs.two_kongs=Jak widzieliśmy wcześniej, [Jeden Kong](pattern-4.3.1) daje [hl]5[/] punktów. Posiadanie **dwóch Kongów** podnosi wynik do [hl]20[/] punktów za [Dwa Kongi](pattern-4.3.2)!
tutorial.hands.kongs.hand_size=Ponieważ każdy Kong wymaga 4 kamieni zamiast 3 i dobiera kamień uzupełniający, ta zwycięska ręka liczy [hl]16[/] kamieni zamiast standardowych 14.
tutorial.hands.kongs.ladder=Wyższe układy Kongów rosną gwałtownie: [Trzy Kongi](pattern-4.3.3) dają [hl]120[/] punktów, a [Cztery Kongi](pattern-4.3.4) osiągają limit [hl]480[/] punktów!

# Ręce i punktacja — Punktowany honor
tutorial.hands.value_honor.title=Punktowany honor
tutorial.hands.value_honor.offer=Gracz naprzeciwko odrzucił kamień ({0}), który kończy Twoją rękę. Twoja otwarta trójka Czerwonych smoków sprawia, że ręka jest warta [hl]Hu 10[/]! Kliknij [hl]Hu[/], aby wygrać.
tutorial.hands.value_honor.dragons=Trójka lub Kong [hl]punktowanego honoru[/] daje [hl]10[/] punktów ([Punktowany honor](pattern-3.1)). Każdy z trzech smoków — **Czerwony** ({C}), **Zielony** ({F}) lub **Biały** ({P}) — jest zawsze punktowanym honorem dla każdego gracza.
tutorial.hands.value_honor.seat_winds=Twój własny **wiatr miejsca** (jak {E} dla Wschodu) jest również punktowanym honorem. Wiatry pozostałych trzech miejsc nie dają punktów. W Zung Jung **nie ma wiatru rundy ani wiatru stołu**.
tutorial.hands.value_honor.stacking=Punktowany honor liczy się [hl]kumulatywnie za każdą grupę[/]: dwie kwalifikujące się trójki dają [hl]20[/] punktów. Otwarte układy są dozwolone, ale **pary** nigdy nie dają punktów — liczą się tylko trójki i Kongi.

# Ręce i punktacja — Same trójki
tutorial.hands.all_triplets.title=Same trójki
tutorial.hands.all_triplets.offer=Gracz naprzeciwko odrzucił kamień ({0}), który uzupełnia Twoją rękę w cztery trójki i parę. Kliknij [hl]Hu[/], aby wygrać!
tutorial.hands.all_triplets.pattern=Układ [Same trójki](pattern-4.1) wymaga czterech trójek (lub Kongów) oraz pary, bez żadnych sekwencji. Otwarte Pungi są dozwolone, a układ daje aż [hl]30[/] punktów!
tutorial.hands.all_triplets.settlement_cap=Przy wygranej ze zrzutki powyżej 25 punktów gracze nieodrzucający mają [hl]limit opłaty do 25 punktów[/] (gracze po lewej/prawej płacą po [hl]-25[/]). Odrzucający pokrywa obie brakujące kwoty: 30 + 5 + 5 = **40** ([hl]-40[/])!
tutorial.hands.all_triplets.self_draw=Wciąż otrzymujesz pełne **90 punktów** (3 \u00d7 30). Przy **samodzielnym dobraniu** nie ma odrzucającego, więc wszyscy trzej przeciwnicy płacą pełne 30 punktów.

# Ręce i punktacja — Prosty ciąg
tutorial.hands.nine_tile_straight.title=Prosty ciąg
tutorial.hands.nine_tile_straight.offer=Gracz naprzeciwko odrzucił kamień ({0}), który kończy w Twojej ręce ciąg od 1 do 9 w znakach. Kliknij [hl]Hu[/], aby wygrać!
tutorial.hands.nine_tile_straight.pattern=Układ [Prosty ciąg](pattern-7.1) jest warty aż [hl]40[/] punktów! Wymaga trzech sekwencji obejmujących **od 1 do 9 w jednym kolorze** ({1m} do {9m}). Otwarte Chow są dozwolone.
tutorial.hands.nine_tile_straight.composition=Pozostałe 5 kamieni może tworzyć dowolną poprawną grupę i parę w dowolnym kolorze. Tutaj trójka {555p} i para {99s} uzupełniają 14-kamienną zwycięską rękę.
tutorial.hands.nine_tile_straight.settlement=Przy ręce za 40 punktów gracze nieodrzucający płacą maksymalnie [hl]-25[/]. Gracz naprzeciwko pokrywa swoje 40 plus oba 15-punktowe niedobory ([hl]-70[/]), co daje Ci [hl]+120[/] punktów (3 \u00d7 40)!

# Ręce i punktacja — Siedem par
tutorial.hands.seven_pairs.title=Siedem par
tutorial.hands.seven_pairs.offer=Gracz naprzeciwko odrzucił kamień ({0}), który uzupełnia Twoją rękę w siedem par. Kliknij [hl]Hu[/], aby wygrać!
tutorial.hands.seven_pairs.pattern=Wszystkie dotychczasowe ręce składały się z 4 grup i 1 pary. [Siedem par](pattern-10.2) to [hl]ręka nieregularna[/] — łamie tę zasadę, gromadząc **siedem par** za [hl]30[/] punktów!
tutorial.hands.seven_pairs.concealed_only=Siedem par musi być [hl]całkowicie ukryte[/]. Nie można ogłaszać Chow, Pung ani Kong — wszystkie pary muszą być dobrane z muru. Możesz jednak przejąć ostatni kamień ze zrzutki rywala, by skompletować 7. parę!
tutorial.hands.seven_pairs.four_of_a_kind=Czekanie przy Siedmiu parach zawsze dotyczy [hl]jednego kamienia[/] do siódmej pary. W Zung Jung posiadanie wszystkich **czterech kopii** tego samego kamienia (bez zgłaszania Konga) liczy się zgodnie z regułami jako **dwie pary**.

# Ręce i punktacja — Dwie identyczne sekwencje
tutorial.hands.two_identical_sequences.title=Dwie identyczne sekwencje
tutorial.hands.two_identical_sequences.offer=Gracz naprzeciwko odrzucił kamień ({0}), który kończy Twoją drugą identyczną sekwencję. Kliknij [hl]Hu[/], aby wygrać!
tutorial.hands.two_identical_sequences.pattern=[Dwie identyczne sekwencje](pattern-5.1.1) dają [hl]10[/] punktów za dwie pasujące sekwencje w jednym kolorze ({234s} i {234s}). W ręku wyglądają jak kolejne pary ({223344s}). Otwarte Chow są dozwolone!
tutorial.hands.two_identical_sequences.ladder=Wyższe szczeble w tej serii dają ogromną liczbę punktów: [Trzy identyczne sekwencje](pattern-5.1.3) dają [hl]120[/] punktów, a [Cztery identyczne sekwencje](pattern-5.1.4) osiągają limit [hl]480[/] punktów!

# Ręce i punktacja — Dwie ukryte trójki
tutorial.hands.two_concealed_triplets.title=Dwie ukryte trójki
tutorial.hands.two_concealed_triplets.offer=Gracz naprzeciwko odrzucił kamień ({0}), który kończy Twoją rękę. Kliknij [hl]Hu[/], aby wygrać!
tutorial.hands.two_concealed_triplets.pattern=[Dwie ukryte trójki](pattern-4.2.1) dają [hl]5[/] punktów za dwie trójki utworzone całkowicie w ukrytej ręce ({333p} i {666s}). Otwarte Pungi się nie kwalifikują!
tutorial.hands.two_concealed_triplets.ladder=Ukryte trójki rosną stromo: [Trzy ukryte trójki](pattern-4.2.2) dają [hl]30[/] punktów, a [Cztery ukryte trójki](pattern-4.2.3) dają [hl]125[/] punktów!

# Ręce i punktacja — Trzy podobne trójki
tutorial.hands.three_similar_triplets.title=Trzy podobne trójki
tutorial.hands.three_similar_triplets.offer=Gracz naprzeciwko odrzucił kamień ({0}), który kończy Twoją rękę. Kliknij [hl]Hu[/], aby wygrać!
tutorial.hands.three_similar_triplets.pattern=[Trzy podobne trójki](pattern-6.2.2) dają imponujące [hl]120[/] punktów za trójki o **tym samym numerze** we wszystkich trzech kolorach ({555m}, {555p}, {555s}). Otwarte Pungi są dozwolone!
tutorial.hands.three_similar_triplets.small_triplets=Mniejsza forma, [Małe trzy podobne trójki](pattern-6.2.1), daje [hl]30[/] punktów za **dwie trójki i parę** o tym samym numerze ({555m}, {555p} i {55s}). Początkujący często ją przeoczają, choć jest znacznie łatwiejsza do ułożenia!

# Ręce i punktacja — Ręce jednokolorowe
tutorial.hands.one_suit.title=Ręce jednokolorowe
tutorial.hands.one_suit.offer=Gracz naprzeciwko odrzucił kamień ({0}), który uzupełnia Twoją rękę w kropkach i honorach. Kliknij [hl]Hu[/], aby wygrać!
tutorial.hands.one_suit.mixed=Posiadanie kamieni z tylko **jednego koloru liczbowego** (na pomarańczowo) wraz z **honorami** (na niebiesko) daje [hl]40[/] punktów za [Mieszany jeden kolor](pattern-2.1.1). Otwarte Chow i Pung są dozwolone!
tutorial.hands.one_suit.pure=Jeśli całkowicie wyeliminujesz honory, [Czysty jeden kolor](pattern-2.1.2) podwaja wynik do [hl]80[/] punktów! Każda grupa i para należą teraz do tego jednego koloru.

