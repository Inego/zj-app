tutorial.orient.tiles.title=Tiles
tutorial.orient.tiles.intro=There are 34 different tile faces in Mahjong: 27 number faces and 7 honor faces. Here are a few of each.
tutorial.orient.tiles.tags=Tiles can be shown **with tags** or **without**.
tutorial.orient.tiles.tags_try=In this app you can turn tags on or off in [Settings](settings). These thirteen tiles follow that setting — click the link and toggle the checkbox to see how it works.
tutorial.orient.numbers.title=Numbers
tutorial.orient.numbers.intro=Number tiles come in three suits: Characters, Dots, and Bamboos (1 through 9 each).
# Callout-led beat: short top line optional; teaching lives in the bubble.
tutorial.orient.numbers.bamboo1=One face to notice
tutorial.orient.numbers.bamboo1_callout=The 1 Bamboo is traditionally drawn as a bird.
# Sequence teaching (end of Numbers): definition, then stepped “not a sequence” peels.
tutorial.orient.numbers.sequence=A sequence is **exactly three** consecutive numbers in the same suit — for example {234m}, {567p}, or {123s}.
tutorial.orient.numbers.four=Four consecutive tiles in one suit are **not** a sequence.
tutorial.orient.numbers.four_aside3=Either set aside the **3**.
tutorial.orient.numbers.four_aside6=Or set aside the **6**.
tutorial.orient.numbers.prompt=Find a **sequence** — select its three tiles.
tutorial.orient.honors.title=Honors
tutorial.orient.honors.intro=Winds and dragons are [hl]honor[/] tiles. They do **not** form number sequences.
tutorial.orient.honors.prompt=Select every honor tile (winds and dragons).
tutorial.orient.wall.title=Building the wall
tutorial.orient.wall.faces=The full set of faces: three suits of 1–9, plus four winds and three dragons — 34 in total.
tutorial.orient.wall.copies=Each face has four tiles — 136 in all.
tutorial.orient.wall.drawpile=The wall is like a draw pile in cards: opening hands and draws during play all come from it.
tutorial.orient.wall.ritual=When playing at a real table, building the wall is a ritual.
tutorial.orient.wall.facedown=To build a wall, first turn the tiles face down...
tutorial.orient.wall.shuffle=And shuffle them thoroughly.
tutorial.orient.wall.formed=Then start forming the wall: four sides of 17 stacks, two tiles high.
tutorial.orient.wall.pushed=The walls are pushed in so the ends meet.
tutorial.orient.wall.seats=In each hand, one player is East, the next is South, then West, then North.
tutorial.orient.wall.east=East is the dealer and the first to make a move in the hand.
tutorial.orient.wall.deal=East deals by throwing two d6.
tutorial.orient.wall.dice=The sum of the dice determines where the wall is broken.
tutorial.orient.wall.count={0}+{1}={2}. From the right end of East's wall, count {2} stacks.
tutorial.orient.wall.break=The wall is broken after the counted stacks. The stacks to their left shift left, opening a gap.
tutorial.orient.wall.take7=Count 7 stacks to the right of the gap.
tutorial.orient.wall.dead=Set them aside to form a separate dead wall.
tutorial.orient.wall.dead_out=Those 14 tiles are never drawn, adding uncertainty toward the end of the hand.
tutorial.orient.wall.hands=To form their hands, the players take 2 stacks each after the gap, dismantling the wall clockwise — three times.
tutorial.orient.wall.hands_13=After that, each player has 3x4 = 12 tiles. They take 1 more tile each to make it 13.
tutorial.orient.wall.east_14=Since East goes first, they start their turn with getting the 14th tile.
tutorial.orient.wall.look_hands=Each player looks at their hand...
tutorial.orient.wall.sort_hands=...and sorts it.
tutorial.orient.wall.east_discard=Now, the East player has to make their first move by discarding a tile.
tutorial.orient.wall.app_table=In this app, to save screen space, the live wall is shown in a simplified way, and the dead wall is not shown at all.
tutorial.orient.wall.live_count=The **69** in the center is the number of tiles left in the live wall.

# Move order
tutorial.moves.east_player.title=East player
tutorial.moves.east_player.four=There are [hl]four[/] players. For each hand, one of them is [hl]East[/] (the dealer). Then, going counter-clockwise: [hl]South[/], [hl]West[/], and [hl]North[/].
tutorial.moves.east_player.pass=After each hand, the wind assignment itself turns [hl]counter-clockwise[/]. The player who was South becomes the new East.
tutorial.moves.discarding.title=Discarding
tutorial.moves.discarding.east_14=At the start of any hand, the player who is [hl]East[/] (the Dealer) has [hl]14[/] tiles in their hand (unlike the other 3 players who have [hl]13[/] tiles each).
tutorial.moves.discarding.east_hu=If these 14 tiles form a [hl]winning hand[/], East can declare the win ("[hl]Hu![/]") immediately — this is [Blessing of Heaven](pattern-9.4.1).
tutorial.moves.discarding.east_hu_odds=Although, statistically, the chance of this happening is [hl]1 to 328,909[/]. You may play mahjong for your whole life and never witness this.
tutorial.moves.discarding.must_discard=If this hand is not winning (which is normally the case), East must pick one of their tiles to [hl]discard[/] to bring the number of tiles back to 13.
tutorial.moves.discarding.least_useful=When discarding, try to get rid of the least useful tile (one that doesn't look promising enough to form future patterns).
tutorial.moves.discarding.others_claim=The other players may [hl]claim[/] the discarded tile to improve their hands or even [hl]win[/].
tutorial.moves.counterclockwise.title=Turn order
tutorial.moves.counterclockwise.this_tile=[hl]Click this tile[/] to discard it.
tutorial.moves.counterclockwise.click_callout=Discard it
tutorial.moves.counterclockwise.if_nobody=No one [hl]claimed[/] it, so it stayed discarded.
tutorial.moves.counterclockwise.the_river=The [hl]river[/] is like a discard pile in cards: unclaimed tiles stay face-up in front of the player who discarded them.
tutorial.moves.counterclockwise.to_the_right=The turn always moves to the player on the discarder's [hl]right[/].
tutorial.moves.counterclockwise.right_next=You are [hl]East[/] (bottom of the table). [hl]Right[/] plays next — they drew from the wall, then they will discard.
tutorial.moves.counterclockwise.right_discards=Right [hl]discards[/] a tile. No one claimed it, so the turn moves to [hl]Opposite[/], who draws from the wall.

# Claiming
tutorial.claims.click_callout=Select this
tutorial.claims.pung.title=Pung
tutorial.claims.pung.offer=Opposite discarded a tile you already have a [hl]pair[/] of ({0}). [hl]Click Pung[/] to complete a triplet.
tutorial.claims.pung.reveal=Claiming a tile discarded by another player requires [hl]revealing[/] the formed set — here, the [hl]triplet[/].
tutorial.claims.pung.must_discard=Now you have [hl]14[/] tiles, and since this is not a winning hand, you must [hl]discard[/] a tile.
tutorial.claims.pung.skips_left=Because you claimed it, [hl]Left[/] skips their turn — they would have [hl]drawn from the wall[/] next.
tutorial.claims.pung.third_for_two=You can claim a [hl]third[/] for two copies. You cannot claim a [hl]second[/] for one.
tutorial.claims.last_discard.title=Last discard
tutorial.claims.last_discard.only_fresh=You can claim a tile [hl]right after[/] it is discarded. You cannot claim a tile that's already in the [hl]river[/].
tutorial.claims.last_discard.callout=This tile was discarded last
# Claiming — Chow
tutorial.claims.chow.title=Chow
tutorial.claims.chow.offer=Left discarded a tile ({0}) that completes a [hl]sequence[/] with two tiles you already have. [hl]Click Chow[/] to complete it.
tutorial.claims.chow.reveal=Claiming a tile discarded by another player requires [hl]revealing[/] the formed set — here, the [hl]sequence[/].
tutorial.claims.chow.must_discard=Now you have [hl]14[/] tiles, and since this is not a winning hand, you must [hl]discard[/] a tile.
tutorial.claims.chow.only_left=You can [hl]only[/] chow from [hl]Left[/] (the player right before you). Discards from Opposite or Right cannot be chowed.
tutorial.claims.hu.title=Hu
tutorial.claims.hu.offer=Here, your winning hand is almost complete, and you are waiting on a pair. Opposite has just discarded the tile you need ({0}). [hl]Click Hu[/] to claim it.
tutorial.claims.hu.not_a_set=When a discarded tile completes a [hl]winning hand[/], you can claim it. It does [hl]not[/] have to complete a [hl]set[/] — here it completed the [hl]pair[/].
tutorial.claims.hu.breakdown=If the score breakdown panel blocks your view of the board, you can [hl]drag[/] it out of the way, or [hl]collapse and uncollapse[/] it using the chevron button. Try dragging or collapsing it now!

# Claiming — Claim priority
tutorial.claims.priority.title=Claim priority
tutorial.claims.priority.conflict=Left just discarded {3s}. You hold {12s} and could **Chow** it, but Right holds a pair of {3s}. Try claiming [hl]Chow[/] to see what happens!
tutorial.claims.priority.pung_beats_chow=Even though you claimed Chow, [hl]Pung beats Chow[/]! Right's claim overrides yours — Right takes the tile, and your turn is skipped!
tutorial.claims.priority.hierarchy=The universal claim hierarchy is: [hl]Win (Hu)[/] beats [hl]Pung & Kong[/], which both beat [hl]Chow[/].
tutorial.claims.priority.multi_win=If multiple players claim [hl]Hu[/] on the same discard, the player closest to the discarder in turn order wins (no double wins).

# Kongs — Big exposed kong. "Melded" = exposed: a concealed triplet completed by
# claiming a discard. It does not mean "combined/fused" (pt "combinado").
# "four-of-a-kind" in these strings means a kong, not a poker term.
tutorial.kongs.melded.title=Melded Kong
tutorial.kongs.melded.offer=Opposite discarded a tile ({0}) matching your concealed triplet. Click [hl]Kong[/] to declare a four-of-a-kind!
tutorial.kongs.melded.reveal=Claiming a discarded 4th tile exposes the four-of-a-kind on the table as an [hl]open kong[/].
tutorial.kongs.melded.one_kong=Forming a kong scores [hl]5[/] points for [One Kong](pattern-4.3.1) and scales up with multiple kongs.
tutorial.kongs.melded.compensation=Because a kong has 4 tiles, you draw a [hl]supplement tile[/] from the wall tail to maintain a valid hand size.
tutorial.kongs.melded.must_discard=After drawing the supplement tile, you must [hl]discard[/] to complete your turn.
tutorial.kongs.melded.already_melded=You cannot claim a discarded 4th tile if your triplet is already exposed on the table as an open [hl]Pung[/].

# Kongs — Concealed kong
tutorial.kongs.concealed.title=Concealed Kong
tutorial.kongs.concealed.offer=You've just taken a tile from the wall and hold all four copies of {0}. Click [hl]Declare Concealed Kong[/]!
tutorial.kongs.concealed.arrangement=Notice the meld: the two **edge tiles are closed** (face-down) to show it remains concealed, while center tiles prove the set.
tutorial.kongs.concealed.scoring=In Zung Jung, it remains **concealed** for scoring — [Concealed Hand](pattern-1.2) stays valid!
tutorial.kongs.concealed.compensation=You draw a [hl]supplement tile[/] from the wall tail, then discard normally to finish your turn.

# Kongs — Promoted kong
tutorial.kongs.promoted.title=Promoted Kong
tutorial.kongs.promoted.offer=You have an open pung of {0} and just drew the 4th tile! Click [hl]Promote to Kong[/] to upgrade your meld.
tutorial.kongs.promoted.upgraded=The fourth tile joins your open pung, upgrading it to an open kong and qualifying for [One Kong](pattern-4.3.1).
tutorial.kongs.promoted.robbing=Warning: This is the only moment opponents can [Rob the Kong](pattern-9.3) if this tile completes their winning hand!
tutorial.kongs.promoted.compensation=If safe, you draw a [hl]supplement tile[/] from the wall tail and discard to complete your turn.

# Hands and scoring — Winning a hand
tutorial.hands.win.title=Winning a hand
tutorial.hands.win.hand_size=Players normally hold [hl]13[/] tiles. You only hold [hl]14[/] temporarily when drawing or claiming. If you don't win, you must discard back to 13.
tutorial.hands.win.patterns=To win a hand, the tiles in your hand must form some specific patterns.
tutorial.hands.win.all_in_groups=Normally, in a winning hand, every tile must be in one of the four [hl]sets[/] or the single [hl]pair[/]. That is usually [hl]14[/] tiles.
tutorial.hands.win.set_kinds=A set is a [hl]sequence[/], a [hl]triplet[/], or a [hl]kong[/].
tutorial.hands.win.kong_size=Here, one of the four sets is a [hl]kong[/]. Because of that kong, the hand has [hl]15[/] tiles, not 14.

# Hands and scoring — Patternless hand
tutorial.hands.chicken.title=Patternless hand
tutorial.hands.chicken.one=If no scoring patterns apply to this hand, it is called a [hl]patternless hand[/] and is worth [hl]1[/] point.
tutorial.hands.chicken.tournament=In tournaments, patternless hands may be [hl]prohibited[/] — the hand has to be worth at least [hl]5[/] points to count as winnable.
tutorial.hands.chicken.next=In the next lessons, we will cover the basic scoring patterns that let a hand score [hl]5[/] or more points.

# Hands and scoring — Concealed hand
tutorial.hands.concealed.title=Concealed hand
tutorial.hands.concealed.offer=Opposite discarded a tile ({0}) that completes a sequence with two tiles you already have. You cannot Chow from Opposite — but because it completes your hand, you can claim [hl]Hu 5[/]! Click [hl]Hu[/] to win.
tutorial.hands.concealed.points=Every opponent pays the hand score to the winner. For a [hl]5[/]-point hand, all three pay 5 each — netting you [hl]3×[/] the hand score ([hl]+15[/] points)!
tutorial.hands.concealed.concealed_rule=A hand is [hl]concealed[/] if you haven't made any open claims (like **Chow** or **Pung**) before declaring the win.
tutorial.hands.concealed.discard_win=Even though you claimed Opposite's discard to complete that final sequence, winning on a discard is [hl]allowed[/] — only open melds made *before* the win break Concealed Hand.
tutorial.hands.concealed.kongs=Claiming any [hl]Chow[/], [hl]Pung[/], or [hl]Kong[/] earlier in the hand exposes that set on the table, turning your hand open and breaking this pattern.

# Hands and scoring — All sequences
tutorial.hands.all_sequences.title=All sequences
tutorial.hands.all_sequences.offer=Opposite discarded a tile ({0}) that completes your fourth sequence. Even though your hand is open from an earlier Chow, the button offers [hl]Hu 5[/]! Click [hl]Hu[/] to win.
tutorial.hands.all_sequences.points=A hand where all four sets are sequences (with no triplets or kongs) scores [hl]5[/] points for [All Sequences](pattern-1.1).
tutorial.hands.all_sequences.open_allowed=Unlike Concealed Hand, [All Sequences](pattern-1.1) allows open Chows. Even with an open meld on the table, having four sequences still awards 5 points.
tutorial.hands.all_sequences.unrestricted=Any pair is permitted — even dragon or wind honors — and any type of wait qualifies.

# Hands and scoring — No terminals
tutorial.hands.no_terminals.title=No terminals
tutorial.hands.no_terminals.offer=Opposite discarded a tile ({0}) that completes your winning hand. Every tile in your hand is a simple number from 2 to 8. Click [hl]Hu[/] to win.
tutorial.hands.no_terminals.terminals_def=In the three numbered suits, the end tiles — **1** and **9** ({1m}, {9s}) — are called [hl]terminals[/]. The inner tiles from **2** through **8** are called [hl]simples[/]. Honors are neither.
tutorial.hands.no_terminals.points=The [No Terminals](pattern-1.3) pattern is worth [hl]5[/] points. Every tile in the hand — all four sets and the pair — must be a [hl]simple[/], with no terminals and no honors.
tutorial.hands.no_terminals.flexibility=Notice that this hand has an open triplet ({5p}{5p}{5p}), so it is neither concealed nor all sequences. But because every tile is a simple, it qualifies for [hl]No Terminals (5 pts)[/]!
tutorial.hands.no_terminals.stacking=No Terminals can also [hl]stack[/] with other patterns like [All Sequences](pattern-1.1) or [Concealed Hand](pattern-1.2) when those apply, combining for 10 or 15 points.

# Hands and scoring — Kongs
tutorial.hands.kongs.title=Kongs
tutorial.hands.kongs.offer=Opposite discarded a tile ({0}) that completes your winning hand. You already hold two open kongs on the table. Click [hl]Hu[/] to win.
tutorial.hands.kongs.two_kongs=As we saw earlier, having [One Kong](pattern-4.3.1) awards [hl]5[/] points. Having **two kongs** steps up the score to [hl]20[/] points for [Two Kongs](pattern-4.3.2)!
tutorial.hands.kongs.hand_size=Because each kong takes 4 tiles instead of 3 and draws a compensation tile, this winning hand has [hl]16[/] tiles instead of the usual 14.
tutorial.hands.kongs.ladder=Higher kong patterns climb steeply: [Three Kongs](pattern-4.3.3) scores [hl]120[/] points, and [Four Kongs](pattern-4.3.4) scores the [hl]480[/]-point limit!

# Hands and scoring — Value honor
tutorial.hands.value_honor.title=Value honor
tutorial.hands.value_honor.offer=Opposite discarded a tile ({0}) that completes your hand. Your open triplet of Red dragons makes this hand worth [hl]Hu 10[/]! Click [hl]Hu[/] to win.
tutorial.hands.value_honor.dragons=A triplet or kong of a [hl]value honor[/] is worth [hl]10[/] points ([Value Honor](pattern-3.1)). Any of the three dragons — **Red** ({C}), **Green** ({F}), or **White** ({P}) — is always a value honor for every player.
tutorial.hands.value_honor.seat_winds=Your own **seat wind** (like {E} for East seat) is also a value honor. Winds of the other three seats ("guest winds") do not score. In Zung Jung, there is **no prevailing or round wind**.
tutorial.hands.value_honor.stacking=Value Honor counts [hl]cumulatively per set[/]: holding two qualifying triplets scores [hl]20[/] points. Open melds are permitted, but **pairs** never score — only triplets and kongs count.

# Hands and scoring — All triplets
tutorial.hands.all_triplets.title=All triplets
tutorial.hands.all_triplets.offer=Opposite discarded a tile ({0}) that completes your hand into four triplets and a pair. Click [hl]Hu[/] to win!
tutorial.hands.all_triplets.pattern=The [All Triplets](pattern-4.1) pattern requires four triplets (or kongs) and a pair, with no sequences. Open pungs are permitted, and the pattern awards a generous [hl]30[/] points!
tutorial.hands.all_triplets.settlement_cap=On a discard win over 25 points, non-discarders are [hl]capped at 25 points[/] (Left/Right pay [hl]-25[/]). The discarder covers both shortfalls: 30 + 5 + 5 = **40** ([hl]-40[/])!
tutorial.hands.all_triplets.self_draw=You still receive the full **90 points** (3 \u00d7 30). On a **self-draw**, there is no discarder, so all three opponents pay the full 30 points.

# Hands and scoring — Nine-tile straight
tutorial.hands.nine_tile_straight.title=Nine-tile straight
tutorial.hands.nine_tile_straight.offer=Opposite discarded a tile ({0}) that completes your hand into a 1 through 9 straight in characters. Click [hl]Hu[/] to win!
tutorial.hands.nine_tile_straight.pattern=The [Nine-Tile Straight](pattern-7.1) pattern is worth a massive [hl]40[/] points! It requires three sequences spanning **1 through 9 in a single suit** ({1m} through {9m}). Open chows are permitted.
tutorial.hands.nine_tile_straight.composition=The remaining 5 tiles can be any valid set and pair in any suit. Here, a triplet of {555p} and a pair of {99s} complete your 14-tile winning hand.
tutorial.hands.nine_tile_straight.settlement=With a 40-point hand, non-discarders are capped at [hl]-25[/]. Opposite covers their 40 plus both 15-point shortfalls ([hl]-70[/]), netting you [hl]+120[/] points (3 \u00d7 40)!

# Hands and scoring — Seven pairs
tutorial.hands.seven_pairs.title=Seven pairs
tutorial.hands.seven_pairs.offer=Opposite discarded a tile ({0}) that completes your hand into seven pairs. Click [hl]Hu[/] to win!
tutorial.hands.seven_pairs.pattern=All winning hands so far were made of 4 sets and 1 pair. [Seven Pairs](pattern-10.2) is an [hl]irregular hand[/] — it breaks that rule by completing **seven pairs** for [hl]30[/] points!
tutorial.hands.seven_pairs.concealed_only=Seven Pairs must be [hl]fully concealed[/]. You cannot call Chow, Pung, or Kong — all pairs must be drawn from the wall. You can, however, claim the final tile on an opponent's discard to complete your 7th pair!
# "legally" here means "under the rules" (not "lawfully").
tutorial.hands.seven_pairs.four_of_a_kind=Waiting on Seven Pairs is always a [hl]single-tile wait[/] on your 7th pair. In Zung Jung, holding all **four copies** of the same tile (without declaring a kong) is legally counted as **two pairs**.

# Hands and scoring — Two identical sequences
tutorial.hands.two_identical_sequences.title=Two identical sequences
tutorial.hands.two_identical_sequences.offer=Opposite discarded a tile ({0}) that completes your second identical sequence. Click [hl]Hu[/] to win!
tutorial.hands.two_identical_sequences.pattern=[Two Identical Sequences](pattern-5.1.1) awards [hl]10[/] points for two matching sequences in one suit ({234s} and {234s}). In hand, they look like consecutive pairs ({223344s}). Open chows are allowed!
tutorial.hands.two_identical_sequences.ladder=Higher tiers in this series award massive points: [Three Identical Sequences](pattern-5.1.3) scores [hl]120[/] points, and [Four Identical Sequences](pattern-5.1.4) scores the [hl]480[/]-point limit!

# Hands and scoring — Two concealed triplets
tutorial.hands.two_concealed_triplets.title=Two concealed triplets
tutorial.hands.two_concealed_triplets.offer=Opposite discarded a tile ({0}) that completes your hand. Click [hl]Hu[/] to win!
tutorial.hands.two_concealed_triplets.pattern=[Two Concealed Triplets](pattern-4.2.1) awards [hl]5[/] points for two triplets formed entirely in your concealed hand ({333p} and {666s}). Open pungs do not qualify!
tutorial.hands.two_concealed_triplets.ladder=Concealed triplets scale steeply: [Three Concealed Triplets](pattern-4.2.2) awards [hl]30[/] points, and [Four Concealed Triplets](pattern-4.2.3) awards [hl]125[/] points!

# Hands and scoring — Three similar triplets
tutorial.hands.three_similar_triplets.title=Three similar triplets
tutorial.hands.three_similar_triplets.offer=Opposite discarded a tile ({0}) that completes your hand. Click [hl]Hu[/] to win!
tutorial.hands.three_similar_triplets.pattern=[Three Similar Triplets](pattern-6.2.2) awards an enormous [hl]120[/] points for holding triplets of the **same number** in all three suits ({555m}, {555p}, {555s}). Open pungs are allowed!
tutorial.hands.three_similar_triplets.small_triplets=The lesser form, [Small Three Similar Triplets](pattern-6.2.1), awards [hl]30[/] points for **two triplets and a pair** of the same number ({555m}, {555p}, and {55s}). Beginners often overlook it, but it is much more realistic to achieve!

# Hands and scoring — One-suit hands
tutorial.hands.one_suit.title=One-suit hands
tutorial.hands.one_suit.offer=Opposite discarded a tile ({0}) that completes your hand in dots and honors. Click [hl]Hu[/] to win!
tutorial.hands.one_suit.mixed=Holding tiles from only **one numbered suit** (in orange) alongside **honors** (in blue) scores [hl]40[/] points for [Mixed One-Suit](pattern-2.1.1). Open chows and pungs are permitted!
tutorial.hands.one_suit.pure=If you eliminate honor tiles entirely, [Pure One-Suit](pattern-2.1.2) doubles the score to [hl]80[/] points! Every set and the pair now belong to that single suit.

# Hands and scoring — More patterns
tutorial.hands.more_patterns.title=More patterns
tutorial.hands.more_patterns.rarer=We have covered the core patterns. Many rarer hands — such as dragon series, wind hands, and limit hands — are detailed in the [Reference](reference).
tutorial.hands.more_patterns.practice=You can consult the [Reference](reference) anytime from the in-game menu during play to check pattern rules and score values. Happy playing!

