[compileJava, compileTestJava]*.options*.encoding = 'UTF-8'
eclipse.project.name = appName + '-core'

def generatedAppVersionDir = layout.buildDirectory.dir("generated/sources/appVersion/kotlin")

tasks.register('generateAppVersion') {
  def major = rootProject.zjVersionMajor
  def minor = rootProject.zjVersionMinor
  def build = rootProject.zjVersionBuild
  def dirty = rootProject.zjVersionDirty
  def name = rootProject.zjVersionName
  inputs.property('major', major)
  inputs.property('minor', minor)
  inputs.property('build', build)
  inputs.property('dirty', dirty)
  inputs.property('name', name)
  def outputFile = generatedAppVersionDir.map { it.file("inego/zungjunggame/AppVersion.kt") }
  outputs.file(outputFile)
  doLast {
    def f = outputFile.get().asFile
    f.parentFile.mkdirs()
    def label = name + (dirty ? '+' : '')
    f.text = """package inego.zungjunggame

/**
 * Application version baked at compile time.
 *
 * `major.minor` come from `gradle.properties`; `BUILD` is `git rev-list --count HEAD`
 * plus `projectBuildOffset` (override the total with `-PbuildNumber`). [LABEL]
 * appends `+` when the tree was dirty.
 * Generated by `:core:generateAppVersion` — do not edit.
 */
object AppVersion {
    const val MAJOR: Int = ${major}
    const val MINOR: Int = ${minor}
    const val BUILD: Int = ${build}
    /** `major.minor.build`, e.g. `"0.1.391"`. */
    const val NAME: String = "${name}"
    /** Monotonic integer for installers (Android versionCode). Same as [BUILD]. */
    const val CODE: Int = ${build}
    const val DIRTY: Boolean = ${dirty}
    /** Corner label: [NAME], or [NAME] plus `+` when [DIRTY]. */
    const val LABEL: String = "${label}"
}
"""
  }
}

sourceSets.main.kotlin.srcDirs += generatedAppVersionDir
compileKotlin.dependsOn 'generateAppVersion'

// Unit tests read assets/ off the filesystem (ReferenceCatalog and i18n fall back to
// FileReferenceAssetSource when no Gdx app is live). Gradle does not see that, so without
// these declarations a test can be skipped as UP-TO-DATE after an asset-only change —
// ReferenceLocaleCoverageTest guards locale coverage over exactly these trees.
tasks.named('test') {
  inputs.dir("${project.rootDir}/assets/reference")
    .withPropertyName('referenceAssets')
    .withPathSensitivity(PathSensitivity.RELATIVE)
  inputs.dir("${project.rootDir}/assets/i18n")
    .withPropertyName('i18nAssets')
    .withPathSensitivity(PathSensitivity.RELATIVE)

  testLogging {
    events "failed", "skipped"
    exceptionFormat = "full"
    showExceptions = true
    showCauses = true
    showStackTraces = true
  }
}

// Packs each AppLocale into build/langpacks/lang/<tag>.zip plus lang/index.txt.
// Reads the authoring files (assets/i18n, assets/reference) and writes only to the
// build directory, so assets/assets.txt and the loose tree are untouched. Stage 4
// consumes the staged directory.
def languagePacksDir = layout.buildDirectory.dir('langpacks')
tasks.register('packLanguagePacks', JavaExec) {
  group = 'build'
  description = 'Packs one language zip per AppLocale plus lang/index.txt.'
  dependsOn classes
  classpath = sourceSets.main.runtimeClasspath
  mainClass = 'inego.zungjunggame.i18n.LanguagePacker'
  inputs.files(sourceSets.main.output)
    .withPropertyName('packerClasses')
    .withPathSensitivity(PathSensitivity.RELATIVE)
  inputs.dir("${project.rootDir}/assets/i18n")
    .withPropertyName('i18nAssets')
    .withPathSensitivity(PathSensitivity.RELATIVE)
  inputs.dir("${project.rootDir}/assets/reference")
    .withPropertyName('referenceAssets')
    .withPathSensitivity(PathSensitivity.RELATIVE)
  outputs.dir(languagePacksDir)
  args "${project.rootDir}/assets", languagePacksDir.get().asFile.absolutePath
}

// Stage 4: the runnable asset trees, owned here because the packer is and every
// launcher has `:core` on its classpath.
//
// `stageAssets` is the startup set the Wasm preload manifest bakes: the authoring
// loose reference markdown and the `ui*.properties` bundles are dropped (they now
// ride inside the zips), and `assets.txt` is not a preload list. `lang/index.txt`
// is the one packed artifact in it, so the game can list packs without opening
// one. `stageRuntimeAssets` adds the zips; desktop and Android read them as plain
// internal files. Sync (not Copy) so a removed authoring file disappears.
def stagedAssetsDir = layout.buildDirectory.dir('staged-assets')
def stagedRuntimeDir = layout.buildDirectory.dir('staged-runtime')
tasks.register('stageAssets', Sync) {
  group = 'build'
  description = 'Stage the startup asset set: no zips, no loose markdown/properties.'
  dependsOn 'packLanguagePacks'
  inputs.dir("${project.rootDir}/assets")
    .withPropertyName('authoringAssets')
    .withPathSensitivity(PathSensitivity.RELATIVE)
  outputs.dir(stagedAssetsDir)
  from(rootProject.file('assets')) {
    exclude 'reference/**/*.md'
    // Provenance note, not a runtime asset.
    exclude 'audio/README.md'
    exclude 'i18n/ui*.properties'
    exclude 'assets.txt'
    exclude 'lang/**'
    // A diagnostic the app wrote *into the asset tree* on the developer's own
    // machine. It is .gitignore'd, so it never showed up in review, but
    // gitignore has no effect on Gradle: `from(rootProject.file('assets'))`
    // copied it into every staged set, the release APK and the web preload
    // manifest. It had reached 11 MB (128k lines of a 1 Hz CPU pixel-scan
    // heartbeat). The writer is gone as of 2026-09-29, so this exclude is now
    // belt-and-braces against it reappearing in someone's working tree.
    exclude 'font-diag.txt'
  }
  from(languagePacksDir) {
    include 'lang/index.txt'
  }
  into stagedAssetsDir
}
tasks.register('stageRuntimeAssets', Sync) {
  group = 'build'
  description = 'Stage the startup set plus lang/<tag>.zip for desktop and Android.'
  dependsOn 'stageAssets'
  inputs.dir(stagedAssetsDir)
    .withPropertyName('stagedAssets')
    .withPathSensitivity(PathSensitivity.RELATIVE)
  outputs.dir(stagedRuntimeDir)
  from(stagedAssetsDir)
  from(languagePacksDir) {
    include 'lang/*.zip'
  }
  into stagedRuntimeDir
}

dependencies {
  api "com.badlogicgames.gdx:gdx:$gdxVersion"
  api "com.badlogicgames.gdx:gdx-freetype:$gdxVersion"
  api "org.jetbrains.kotlin:kotlin-stdlib:$kotlinVersion"

  testImplementation "org.jetbrains.kotlin:kotlin-test-junit:$kotlinVersion"
  testImplementation "junit:junit:4.13.2"
}

jar {
  duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}
